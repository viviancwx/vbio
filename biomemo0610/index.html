{id:"biological_molecule",t:"biological molecule",cn:"生物分子",ed:"Molecules made by living organisms, such as carbohydrates, proteins and lipids.",cd:"生物体制造的分子，如碳水化合物、蛋白质和脂质。",ch:"Ch4 Molecules"},
{id:"carbohydrate",t:"carbohydrate",cn:"碳水化合物",ed:"A group of molecules made of carbon, hydrogen and oxygen, used for energy.",cd:"由碳、氢、氧组成、为机体提供能量的物质。",ch:"Ch4 Molecules"},
{id:"protein",t:"protein",cn:"蛋白质",ed:"A molecule made of amino acids, used for growth, repair and enzymes.",cd:"由氨基酸组成，用于生长、修复和构成酶。",ch:"Ch4 Molecules"},
{id:"lipid",t:"lipid",cn:"脂质",ed:"Fats and oils that store energy and form cell membranes.",cd:"储存能量、构成细胞膜的脂肪和油类。",ch:"Ch4 Molecules"},
{id:"amino_acid",t:"amino acid",cn:"氨基酸",ed:"The small units that join to form proteins.",cd:"组成蛋白质的小分子单位。",ch:"Ch4 Molecules"},
{id:"fatty_acid",t:"fatty acid",cn:"脂肪酸",ed:"A building block of fats, joined with glycerol.",cd:"与甘油结合构成脂肪的组成成分。",ch:"Ch4 Molecules"},
{id:"glycerol",t:"glycerol",cn:"甘油",ed:"A building block of fats, joined with fatty acids.",cd:"与脂肪酸结合构成脂肪的组成成分。",ch:"Ch4 Molecules"},
{id:"monosaccharide",t:"monosaccharide",cn:"单糖",ed:"The simplest sugar, such as glucose, that cannot be broken down further.",cd:"最简单的糖，如葡萄糖，不能再被分解。",ch:"Ch4 Molecules"},
{id:"disaccharide",t:"disaccharide",cn:"双糖",ed:"A sugar made of two monosaccharides, such as sucrose.",cd:"由两个单糖构成的糖，如蔗糖。",ch:"Ch4 Molecules"},
{id:"polysaccharide",t:"polysaccharide",cn:"多糖",ed:"A long chain of many sugar units, such as starch and glycogen.",cd:"由许多糖单元连成的长链，如淀粉和糖原。",ch:"Ch4 Molecules"},
{id:"sucrose",t:"sucrose",cn:"蔗糖",ed:"A disaccharide transported in the phloem.",cd:"在韧皮部中运输的双糖。",ch:"Ch4 Molecules"},
{id:"maltose",t:"maltose",cn:"麦芽糖",ed:"A disaccharide produced from starch by amylase.",cd:"淀粉酶分解淀粉产生的双糖。",ch:"Ch4 Molecules"},
{id:"starch",t:"starch",cn:"淀粉",ed:"A storage polysaccharide made by plants.",cd:"植物体内储存能量的多糖。",ch:"Ch4 Molecules"},
{id:"glycogen",t:"glycogen",cn:"糖原",ed:"A storage polysaccharide stored in animal liver and muscles.",cd:"储存在动物肝脏和肌肉中的多糖。",ch:"Ch4 Molecules"},
{id:"reducing_sugar",t:"reducing sugar",cn:"还原糖",ed:"A sugar that can be detected with Benedict's solution, such as glucose.",cd:"能用本尼迪克特试剂检测的糖，如葡萄糖。",ch:"Ch4 Molecules"},
{id:"nucleic_acid",t:"nucleic acid",cn:"核酸",ed:"A molecule such as DNA or RNA that carries genetic information.",cd:"携带遗传信息的分子，如DNA或RNA。",ch:"Ch4 Molecules"},
{id:"nucleotide",t:"nucleotide",cn:"核苷酸",ed:"The building block of DNA and RNA.",cd:"构成DNA和RNA的基本单位。",ch:"Ch4 Molecules"},
{id:"double_helix",t:"double helix",cn:"双螺旋",ed:"The twisted-ladder shape of the DNA molecule.",cd:"DNA分子双链缠绕的螺旋形状。",ch:"Ch4 Molecules"},
{id:"soluble",t:"soluble",cn:"可溶的",ed:"Able to dissolve in water.",cd:"能够溶解在水中的。",ch:"Ch4 Molecules"},
{id:"iodine",t:"iodine",cn:"碘液",ed:"A reagent used to test for starch, turning blue-black.",cd:"用于检测淀粉的试剂，遇淀粉变蓝黑色。",ch:"Ch4 Molecules"},
{id:"benedict_solution",t:"Benedict's solution",cn:"本尼迪克特试剂",ed:"A reagent used to test for reducing sugars, turning brick-red when heated.",cd:"检测还原糖的试剂，加热后变砖红色。",ch:"Ch4 Molecules"},
{id:"biuret_reagent",t:"Biuret reagent",cn:"双缩脲试剂",ed:"A reagent used to test for protein, turning purple.",cd:"检测蛋白质的试剂，遇蛋白质变紫色。",ch:"Ch4 Molecules"},
/* ===== Ch5 Enzymes ===== */
{id:"enzyme",t:"enzyme",cn:"酶",ed:"A biological catalyst that speeds up chemical reactions in organisms.",cd:"加快生物体内化学反应的生物催化剂。",ch:"Ch5 Enzymes"},
{id:"catalyst",t:"catalyst",cn:"催化剂",ed:"A substance that speeds up a reaction without being used up.",cd:"加快反应速率但不被消耗的物质。",ch:"Ch5 Enzymes"},
{id:"substrate",t:"substrate",cn:"底物",ed:"The substance on which an enzyme acts.",cd:"酶作用的物质。",ch:"Ch5 Enzymes"},
{id:"active_site",t:"active site",cn:"活性位点",ed:"The region of an enzyme where the substrate binds.",cd:"酶上与底物结合的区域。",ch:"Ch5 Enzymes"},
{id:"denature",t:"denature",cn:"变性",ed:"A change in the shape of an enzyme's active site so it can no longer work.",cd:"酶活性位点形状改变、从而丧失功能的现象。",ch:"Ch5 Enzymes"},
{id:"optimum",t:"optimum",cn:"最适条件",ed:"The conditions under which an enzyme works best.",cd:"酶作用效果最佳的温度或酸碱度等条件。",ch:"Ch5 Enzymes"},
{id:"lock_key",t:"lock and key",cn:"锁钥模型",ed:"A model describing how an enzyme and its substrate fit together specifically.",cd:"描述酶与底物特异性结合的模型。",ch:"Ch5 Enzymes"},
{id:"specificity",t:"specificity",cn:"专一性",ed:"The property of an enzyme acting on only one substrate or type of reaction.",cd:"酶只对特定底物或某一类反应起作用的特点。",ch:"Ch5 Enzymes"},
{id:"product",t:"product",cn:"产物",ed:"The substance formed as a result of a reaction.",cd:"化学反应生成的物质。",ch:"Ch5 Enzymes"},
{id:"amylase",t:"amylase",cn:"淀粉酶",ed:"An enzyme that breaks down starch into maltose.",cd:"把淀粉分解为麦芽糖的酶。",ch:"Ch5 Enzymes"},
{id:"protease",t:"protease",cn:"蛋白酶",ed:"An enzyme that breaks down proteins into amino acids.",cd:"把蛋白质分解为氨基酸的酶。",ch:"Ch5 Enzymes"},
{id:"lipase",t:"lipase",cn:"脂肪酶",ed:"An enzyme that breaks down fats into fatty acids and glycerol.",cd:"把脂肪分解为脂肪酸和甘油的酶。",ch:"Ch5 Enzymes"},
{id:"sucrase",t:"sucrase",cn:"蔗糖酶",ed:"An enzyme that breaks down sucrose into glucose and fructose.",cd:"把蔗糖分解为葡萄糖和果糖的酶。",ch:"Ch5 Enzymes"},
{id:"maltase",t:"maltase",cn:"麦芽糖酶",ed:"An enzyme that breaks down maltose into glucose.",cd:"把麦芽糖分解为葡萄糖的酶。",ch:"Ch5 Enzymes"},
{id:"pectinase",t:"pectinase",cn:"果胶酶",ed:"An enzyme that breaks down pectin, used to clarify fruit juice.",cd:"分解果胶的酶，用于澄清果汁。",ch:"Ch5 Enzymes"},
{id:"optimum_temperature",t:"optimum temperature",cn:"最适温度",ed:"The temperature at which an enzyme works fastest.",cd:"酶催化速率最快的温度。",ch:"Ch5 Enzymes"},
{id:"optimum_ph",t:"optimum pH",cn:"最适pH",ed:"The pH at which an enzyme works fastest.",cd:"酶催化速率最快的pH。",ch:"Ch5 Enzymes"},
{id:"complementary",t:"complementary",cn:"互补的",ed:"Fitting together exactly, as a substrate with an active site.",cd:"彼此完全匹配，如底物与活性位点的关系。",ch:"Ch5 Enzymes"},
{id:"catabolic_reaction",t:"catabolic reaction",cn:"分解反应",ed:"A reaction that breaks large molecules into smaller ones.",cd:"把大分子分解成小分子的反应。",ch:"Ch5 Enzymes"},
{id:"anabolic_reaction",t:"anabolic reaction",cn:"合成反应",ed:"A reaction that builds small molecules into larger ones.",cd:"把小分子合成为大分子的反应。",ch:"Ch5 Enzymes"},
/* ===== Ch6 Plant nutrition ===== */
{id:"photosynthesis",t:"photosynthesis",cn:"光合作用",ed:"The process by which plants make glucose from carbon dioxide and water using light energy.",cd:"植物利用光能，把二氧化碳和水合成葡萄糖的过程。",ch:"Ch6 Plant nutrition"},
{id:"chlorophyll",t:"chlorophyll",cn:"叶绿素",ed:"The green pigment in chloroplasts that absorbs light energy for photosynthesis.",cd:"叶绿体中吸收光能进行光合作用的绿色色素。",ch:"Ch6 Plant nutrition"},
{id:"glucose",t:"glucose",cn:"葡萄糖",ed:"A simple sugar produced by photosynthesis, used as an energy source.",cd:"光合作用产生的单糖，用作能量来源。",ch:"Ch6 Plant nutrition"},
{id:"stomata",t:"stomata",cn:"气孔",ed:"Pores in leaf surfaces, mainly on the lower epidermis, allowing gas exchange.",cd:"叶片表面的小孔，主要分布在下表皮，用于气体交换。",ch:"Ch6 Plant nutrition"},
{id:"guard_cell",t:"guard cell",cn:"保卫细胞",ed:"The cells that open and close the stomata.",cd:"控制气孔开闭的细胞。",ch:"Ch6 Plant nutrition"},
{id:"transpiration",t:"transpiration",cn:"蒸腾作用",ed:"The loss of water vapour from a plant, mainly through stomata.",cd:"植物主要通过气孔散失水蒸气的过程。",ch:"Ch6 Plant nutrition"},
{id:"xylem",t:"xylem",cn:"木质部",ed:"Plant tissue that transports water and mineral ions upwards.",cd:"植物中向上运输水分和矿物质的组织。",ch:"Ch6 Plant nutrition"},
{id:"phloem",t:"phloem",cn:"韧皮部",ed:"Plant tissue that transports sucrose and amino acids around the plant.",cd:"植物中运输蔗糖和氨基酸的组织。",ch:"Ch6 Plant nutrition"},
{id:"magnesium",t:"magnesium",cn:"镁",ed:"A mineral needed to make chlorophyll; deficiency causes yellowing leaves.",cd:"合成叶绿素所需的矿物质，缺乏时叶片发黄。",ch:"Ch6 Plant nutrition"},
{id:"nitrate",t:"nitrate",cn:"硝酸盐",ed:"A mineral that supplies nitrogen for making proteins and growth.",cd:"提供氮素、用于合成蛋白质和生长的矿物质。",ch:"Ch6 Plant nutrition"},
{id:"deficiency",t:"deficiency",cn:"缺乏",ed:"A lack of a nutrient that causes specific symptoms.",cd:"缺乏某种营养元素而出现的特定症状。",ch:"Ch6 Plant nutrition"},
{id:"light_intensity",t:"light intensity",cn:"光照强度",ed:"The amount of light energy, a factor affecting the rate of photosynthesis.",cd:"影响光合作用速率的光能大小。",ch:"Ch6 Plant nutrition"},
{id:"cuticle",t:"cuticle",cn:"角质层",ed:"A waxy layer on leaves that reduces water loss.",cd:"叶片表面的蜡质层，可减少水分散失。",ch:"Ch6 Plant nutrition"},
{id:"epidermis",t:"epidermis",cn:"表皮",ed:"The outer protective layer of a leaf or root.",cd:"叶片或根部最外层的保护组织。",ch:"Ch6 Plant nutrition"},
{id:"palisade_mesophyll",t:"palisade mesophyll",cn:"栅栏组织",ed:"The layer of tall cells near the upper leaf surface where most photosynthesis occurs.",cd:"叶片上表面附近的高柱状细胞层，光合作用主要在此进行。",ch:"Ch6 Plant nutrition"},
{id:"spongy_mesophyll",t:"spongy mesophyll",cn:"海绵组织",ed:"The loosely packed cells with air spaces in the lower part of a leaf.",cd:"叶片下部含气腔的疏松细胞层。",ch:"Ch6 Plant nutrition"},
{id:"vascular_bundle",t:"vascular bundle",cn:"维管束",ed:"A strand of xylem and phloem in a plant, carrying transport.",cd:"植物体内由木质部和韧皮部构成的运输束。",ch:"Ch6 Plant nutrition"},
{id:"lamina",t:"lamina",cn:"叶片",ed:"The flat, expanded part of a leaf.",cd:"叶片扁平展开的部分。",ch:"Ch6 Plant nutrition"},
{id:"midrib",t:"midrib",cn:"中脉",ed:"The central vein of a leaf.",cd:"叶片中央的主脉。",ch:"Ch6 Plant nutrition"},
{id:"air_space",t:"air space",cn:"气腔",ed:"A gap between cells that allows gases to move within the leaf.",cd:"细胞间的空隙，便于气体在叶片内流通。",ch:"Ch6 Plant nutrition"},
{id:"pigment",t:"pigment",cn:"色素",ed:"A coloured substance, such as chlorophyll, that absorbs light.",cd:"吸收光能的色素，如叶绿素。",ch:"Ch6 Plant nutrition"},
{id:"solar_energy",t:"solar energy",cn:"太阳能",ed:"Energy from sunlight, used in photosynthesis.",cd:"来自阳光的能量，供光合作用利用。",ch:"Ch6 Plant nutrition"},
{id:"evaporate",t:"evaporate",cn:"蒸发",ed:"To change from a liquid into water vapour.",cd:"由液态变为水蒸气。",ch:"Ch6 Plant nutrition"},
{id:"hydrogen_carbonate_indicator",t:"hydrogen carbonate indicator",cn:"碳酸氢盐指示剂",ed:"A solution that changes colour with carbon dioxide concentration, used to test photosynthesis.",cd:"随二氧化碳浓度变色、用于检测光合作用的指示剂。",ch:"Ch6 Plant nutrition"},
/* ===== Ch7 Human nutrition ===== */
{id:"nutrition",t:"nutrition",cn:"营养",ed:"Obtaining food to provide energy and materials for the body.",cd:"获取食物为身体提供能量和物质的过程。",ch:"Ch7 Human nutrition"},
{id:"ingestion",t:"ingestion",cn:"摄食",ed:"Taking food into the body through the mouth.",cd:"通过口腔把食物摄入体内。",ch:"Ch7 Human nutrition"},
{id:"digestion",t:"digestion",cn:"消化",ed:"The breakdown of large food molecules into smaller, soluble molecules.",cd:"把大分子食物分解成小分子可溶物质的过程。",ch:"Ch7 Human nutrition"},
{id:"absorption",t:"absorption",cn:"吸收",ed:"The movement of digested food molecules into the blood.",cd:"消化后的食物分子进入血液的过程。",ch:"Ch7 Human nutrition"},
{id:"assimilation",t:"assimilation",cn:"同化",ed:"The use of absorbed nutrients by cells for growth and repair.",cd:"细胞利用吸收的营养进行生长和修复的过程。",ch:"Ch7 Human nutrition"},
{id:"egestion",t:"egestion",cn:"排遗",ed:"The removal of undigested waste from the body.",cd:"把不能消化的废物排出体外的过程。",ch:"Ch7 Human nutrition"},
{id:"bile",t:"bile",cn:"胆汁",ed:"A liquid made by the liver that helps to digest fats.",cd:"肝脏分泌、帮助消化脂肪的液体。",ch:"Ch7 Human nutrition"},
{id:"peristalsis",t:"peristalsis",cn:"蠕动",ed:"Wave-like muscular contractions that push food along the gut.",cd:"推动食物沿消化道前进的波浪式肌肉收缩。",ch:"Ch7 Human nutrition"},
{id:"villus",t:"villus",cn:"绒毛",ed:"Small projections in the small intestine that increase surface area for absorption.",cd:"小肠内增加吸收表面积的小指状突起。",ch:"Ch7 Human nutrition"},
{id:"balanced_diet",t:"balanced diet",cn:"均衡膳食",ed:"A diet containing all nutrients in the correct amounts.",cd:"包含所有营养素且比例恰当的食物结构。",ch:"Ch7 Human nutrition"},
{id:"fibre",t:"dietary fibre",cn:"膳食纤维",ed:"Indigestible plant material that helps food move through the gut.",cd:"帮助食物通过肠道的不可消化植物物质。",ch:"Ch7 Human nutrition"},
{id:"vitamin",t:"vitamin",cn:"维生素",ed:"Organic compounds needed in small amounts for good health.",cd:"维持健康所需、需要量很小的有机化合物。",ch:"Ch7 Human nutrition"},
{id:"diet",t:"diet",cn:"饮食",ed:"The food and drink that an organism regularly takes in.",cd:"生物体日常摄入的食物和饮品。",ch:"Ch7 Human nutrition"},
{id:"nutrient",t:"nutrient",cn:"营养素",ed:"A substance in food needed by the body.",cd:"食物中身体所需的物质。",ch:"Ch7 Human nutrition"},
{id:"mineral",t:"mineral",cn:"矿物质",ed:"An inorganic substance needed in small amounts, such as iron and calcium.",cd:"身体需要量很小的无机盐，如铁和钙。",ch:"Ch7 Human nutrition"},
{id:"obesity",t:"obesity",cn:"肥胖",ed:"Being seriously overweight, often from taking in too much energy.",cd:"因摄入能量过多而严重超重。",ch:"Ch7 Human nutrition"},
{id:"coronary_heart_disease",t:"coronary heart disease",cn:"冠心病",ed:"A disease of the heart caused by blockage of the coronary arteries.",cd:"冠状动脉堵塞引起的心脏疾病。",ch:"Ch7 Human nutrition"},
{id:"malnutrition",t:"malnutrition",cn:"营养不良",ed:"Ill health caused by not eating a balanced diet.",cd:"因饮食不均衡而导致的健康问题。",ch:"Ch7 Human nutrition"},
{id:"starvation",t:"starvation",cn:"饥饿",ed:"Ill health caused by not eating enough food.",cd:"因食物摄入不足而导致的健康问题。",ch:"Ch7 Human nutrition"},
{id:"scurvy",t:"scurvy",cn:"坏血病",ed:"A disease caused by a lack of vitamin C.",cd:"缺乏维生素C引起的疾病。",ch:"Ch7 Human nutrition"},
{id:"rickets",t:"rickets",cn:"佝偻病",ed:"A disease caused by a lack of vitamin D, making bones soft.",cd:"缺乏维生素D导致骨骼软化的疾病。",ch:"Ch7 Human nutrition"},
{id:"anemia",t:"anaemia",cn:"贫血",ed:"A condition caused by a lack of iron, reducing oxygen transport.",cd:"缺铁导致的疾病，使氧气运输减少。",ch:"Ch7 Human nutrition"},
{id:"incisor",t:"incisor",cn:"门齿",ed:"A flat front tooth used for cutting food.",cd:"用于切断食物的扁平前牙。",ch:"Ch7 Human nutrition"},
{id:"canine",t:"canine",cn:"犬齿",ed:"A pointed tooth used for tearing food.",cd:"用于撕裂食物的尖牙。",ch:"Ch7 Human nutrition"},
{id:"molar",t:"molar",cn:"臼齿",ed:"A large back tooth used for grinding food.",cd:"用于磨碎食物的大臼牙。",ch:"Ch7 Human nutrition"},
{id:"saliva",t:"saliva",cn:"唾液",ed:"The liquid in the mouth that contains amylase and lubricates food.",cd:"口腔中含淀粉酶、可润滑食物的液体。",ch:"Ch7 Human nutrition"},
{id:"oesophagus",t:"oesophagus",cn:"食道",ed:"The tube that carries food from the mouth to the stomach.",cd:"把食物从口腔送往胃的管道。",ch:"Ch7 Human nutrition"},
{id:"stomach",t:"stomach",cn:"胃",ed:"The organ where food is churned and mixed with acid and pepsin.",cd:"食物在此被搅动并与胃酸和胃蛋白酶混合的器官。",ch:"Ch7 Human nutrition"},
{id:"small_intestine",t:"small intestine",cn:"小肠",ed:"The organ where digestion is completed and most absorption occurs.",cd:"完成消化并进行大部分吸收的器官。",ch:"Ch7 Human nutrition"},
{id:"large_intestine",t:"large intestine",cn:"大肠",ed:"The organ that absorbs water from undigested food.",cd:"从未消化的食物中吸收水分的器官。",ch:"Ch7 Human nutrition"},
{id:"duodenum",t:"duodenum",cn:"十二指肠",ed:"The first part of the small intestine where bile and pancreatic juice act.",cd:"小肠起始段，胆汁和胰液在此发挥作用。",ch:"Ch7 Human nutrition"},
{id:"pancreas",t:"pancreas",cn:"胰腺",ed:"A gland that makes pancreatic juice, digestive enzymes and insulin.",cd:"分泌胰液、消化酶和胰岛素的腺体。",ch:"Ch7 Human nutrition"},
{id:"gall_bladder",t:"gall bladder",cn:"胆囊",ed:"The organ that stores bile before it enters the small intestine.",cd:"储存胆汁、待其进入小肠的器官。",ch:"Ch7 Human nutrition"},
{id:"emulsification",t:"emulsification",cn:"乳化",ed:"The breakdown of fat into small droplets by bile.",cd:"胆汁把脂肪分解成小油滴的过程。",ch:"Ch7 Human nutrition"},
{id:"lacteal",t:"lacteal",cn:"乳糜管",ed:"A lymphatic vessel inside a villus that absorbs fatty acids and glycerol.",cd:"绒毛内的淋巴管，吸收脂肪酸和甘油。",ch:"Ch7 Human nutrition"},
{id:"pepsin",t:"pepsin",cn:"胃蛋白酶",ed:"A protease in the stomach that begins protein digestion.",cd:"胃中开始分解蛋白质的蛋白酶。",ch:"Ch7 Human nutrition"},
{id:"bolus",t:"bolus",cn:"食团",ed:"A ball of chewed food mixed with saliva.",cd:"经咀嚼并与唾液混合成的食物团。",ch:"Ch7 Human nutrition"},
{id:"chyme",t:"chyme",cn:"食糜",ed:"The liquid mixture of food and digestive juices leaving the stomach.",cd:"离开胃后与消化液混合成的液态食糜。",ch:"Ch7 Human nutrition"},
/* ===== Ch8 Transport ===== */
{id:"artery",t:"artery",cn:"动脉",ed:"A thick-walled blood vessel carrying blood away from the heart.",cd:"将血液从心脏送出的厚壁血管。",ch:"Ch8 Transport"},
{id:"vein",t:"vein",cn:"静脉",ed:"A blood vessel carrying blood back to the heart, containing valves.",cd:"把血液送回心脏、内有瓣膜的血管。",ch:"Ch8 Transport"},
{id:"capillary",t:"capillary",cn:"毛细血管",ed:"A tiny blood vessel where exchange of substances with cells occurs.",cd:"与细胞进行物质交换的微小血管。",ch:"Ch8 Transport"},
{id:"plasma",t:"plasma",cn:"血浆",ed:"The liquid part of blood that carries cells and dissolved substances.",cd:"血液中运输细胞和溶解物质的液体部分。",ch:"Ch8 Transport"},
{id:"rbc",t:"red blood cell",cn:"红细胞",ed:"A blood cell containing haemoglobin that carries oxygen.",cd:"含血红蛋白、运输氧气的血细胞。",ch:"Ch8 Transport"},
{id:"haemoglobin",t:"haemoglobin",cn:"血红蛋白",ed:"The red pigment in red blood cells that combines with oxygen.",cd:"红细胞中能与氧结合的红色素。",ch:"Ch8 Transport"},
{id:"wbc",t:"white blood cell",cn:"白细胞",ed:"Blood cells that defend the body against disease.",cd:"抵抗疾病、保护身体的血细胞。",ch:"Ch8 Transport"},
{id:"platelet",t:"platelet",cn:"血小板",ed:"Small fragments in the blood that help it to clot.",cd:"帮助血液凝固的小细胞碎片。",ch:"Ch8 Transport"},
{id:"heart",t:"heart",cn:"心脏",ed:"The muscular organ that pumps blood around the body.",cd:"把血液泵送到全身的肌肉器官。",ch:"Ch8 Transport"},
{id:"atrium",t:"atrium",cn:"心房",ed:"The upper chambers of the heart that receive blood.",cd:"心脏上部接收血液的腔室。",ch:"Ch8 Transport"},
{id:"ventricle",t:"ventricle",cn:"心室",ed:"The lower chambers of the heart that pump blood out.",cd:"心脏下部把血液泵出的腔室。",ch:"Ch8 Transport"},
{id:"valve",t:"valve",cn:"瓣膜",ed:"Structures that prevent blood from flowing backwards.",cd:"防止血液倒流的结构。",ch:"Ch8 Transport"},
{id:"double_circulation",t:"double circulation",cn:"双循环",ed:"The two separate circuits of blood flow: pulmonary and systemic.",cd:"体循环和肺循环两套独立的血液循环。",ch:"Ch8 Transport"},
{id:"companion_cell",t:"companion cell",cn:"伴胞",ed:"A cell beside a sieve tube that keeps it alive.",cd:"位于筛管旁、维持筛管活性的细胞。",ch:"Ch8 Transport"},
{id:"sieve_tube",t:"sieve tube",cn:"筛管",ed:"A tube in the phloem that transports sucrose, made of living cells with perforated end walls.",cd:"韧皮部中运输蔗糖的管道，由端壁多孔的活细胞构成。",ch:"Ch8 Transport"},
{id:"sieve_plate",t:"sieve plate",cn:"筛板",ed:"The perforated end wall between sieve tube cells.",cd:"筛管细胞之间多孔的端壁。",ch:"Ch8 Transport"},
{id:"translocation",t:"translocation",cn:"转运",ed:"The transport of sucrose and amino acids in the phloem.",cd:"韧皮部对蔗糖和氨基酸的运输。",ch:"Ch8 Transport"},
{id:"source",t:"source",cn:"源",ed:"Where substances are made or stored and transported from, such as leaves.",cd:"物质被制造或储存、并向别处运出的部位，如叶片。",ch:"Ch8 Transport"},
{id:"sink",t:"sink",cn:"库",ed:"Where substances are used or stored, such as roots and fruits.",cd:"物质被利用或储存的部位，如根和果实。",ch:"Ch8 Transport"},
{id:"lignin",t:"lignin",cn:"木质素",ed:"A hard substance in xylem walls that gives strength and waterproofing.",cd:"木质部壁中的坚硬物质，提供强度并防水。",ch:"Ch8 Transport"},
{id:"root_hair_cell",t:"root hair cell",cn:"根毛细胞",ed:"A cell with a long extension that increases the surface area for water absorption.",cd:"有细长突起、增大吸水表面积的细胞。",ch:"Ch8 Transport"},
{id:"circulatory_system",t:"circulatory system",cn:"循环系统",ed:"The system of the heart and blood vessels that transports materials around the body.",cd:"由心脏和血管组成、运送物质到全身的系统。",ch:"Ch8 Transport"},
{id:"aorta",t:"aorta",cn:"主动脉",ed:"The largest artery, carrying blood from the left ventricle to the body.",cd:"最大动脉，把血液从左心室送往全身。",ch:"Ch8 Transport"},
{id:"vena_cava",t:"vena cava",cn:"腔静脉",ed:"The large vein that returns blood from the body to the right atrium.",cd:"把全身血液送回右心房的大静脉。",ch:"Ch8 Transport"},
{id:"pulmonary_circulation",t:"pulmonary circulation",cn:"肺循环",ed:"The blood flow between the heart and the lungs.",cd:"心脏与肺之间的血液循环。",ch:"Ch8 Transport"},
{id:"systemic_circulation",t:"systemic circulation",cn:"体循环",ed:"The blood flow between the heart and the rest of the body.",cd:"心脏与全身其他部位之间的血液循环。",ch:"Ch8 Transport"},
{id:"septum",t:"septum",cn:"室间隔",ed:"The wall of muscle dividing the left and right sides of the heart.",cd:"把心脏左右两侧分开的肌肉壁。",ch:"Ch8 Transport"},
{id:"systole",t:"systole",cn:"收缩期",ed:"The contraction phase of the heart when blood is pumped out.",cd:"心脏把血液泵出时的收缩阶段。",ch:"Ch8 Transport"},
{id:"diastole",t:"diastole",cn:"舒张期",ed:"The relaxation phase of the heart when it refills with blood.",cd:"心脏舒张、重新充盈血液的阶段。",ch:"Ch8 Transport"},
{id:"oxygenated_blood",t:"oxygenated blood",cn:"含氧血",ed:"Blood that is carrying a high level of oxygen.",cd:"含有较多氧气的血液。",ch:"Ch8 Transport"},
{id:"deoxygenated_blood",t:"deoxygenated blood",cn:"缺氧血",ed:"Blood that has a low level of oxygen.",cd:"含氧量较低的血液。",ch:"Ch8 Transport"},
{id:"blood_clotting",t:"blood clotting",cn:"凝血",ed:"The process by which platelets and fibrin seal a wound.",cd:"血小板和纤维蛋白封闭伤口的止血过程。",ch:"Ch8 Transport"},
{id:"fibrin",t:"fibrin",cn:"纤维蛋白",ed:"Insoluble fibres formed from fibrinogen that trap cells in a clot.",cd:"由纤维蛋白原形成、在凝块中网住血细胞的不溶性纤维。",ch:"Ch8 Transport"},
{id:"phagocyte",t:"phagocyte",cn:"吞噬细胞",ed:"A white blood cell that engulfs and destroys pathogens.",cd:"能吞入并消灭病原体的白细胞。",ch:"Ch8 Transport"},
{id:"lymphocyte",t:"lymphocyte",cn:"淋巴细胞",ed:"A white blood cell that produces antibodies.",cd:"能产生抗体的白细胞。",ch:"Ch8 Transport"},
{id:"pulse",t:"pulse",cn:"脉搏",ed:"The wave of pressure felt in arteries each time the heart beats.",cd:"每次心跳时在动脉中感受到的压力波动。",ch:"Ch8 Transport"},
/* ===== Ch9 Respiration ===== */
{id:"respiration",t:"respiration",cn:"呼吸作用",ed:"The release of energy from glucose inside living cells.",cd:"活细胞中从葡萄糖释放能量的过程。",ch:"Ch9 Respiration"},
{id:"aerobic",t:"aerobic respiration",cn:"有氧呼吸",ed:"Respiration using oxygen, releasing more energy per glucose molecule.",cd:"利用氧气、每分子葡萄糖释放更多能量的呼吸。",ch:"Ch9 Respiration"},
{id:"anaerobic",t:"anaerobic respiration",cn:"无氧呼吸",ed:"Respiration without oxygen, releasing less energy.",cd:"不利用氧气、释放较少能量的呼吸。",ch:"Ch9 Respiration"},
{id:"lactic_acid",t:"lactic acid",cn:"乳酸",ed:"A waste product of anaerobic respiration in muscles.",cd:"肌肉无氧呼吸产生的废物。",ch:"Ch9 Respiration"},
{id:"oxygen_debt",t:"oxygen debt",cn:"氧债",ed:"The extra oxygen needed after exercise to remove lactic acid.",cd:"运动后清除乳酸所需的额外氧气。",ch:"Ch9 Respiration"},
{id:"breathing",t:"breathing",cn:"呼吸运动",ed:"The movement of air into and out of the lungs.",cd:"空气进出肺部的运动。",ch:"Ch9 Respiration"},
{id:"diaphragm",t:"diaphragm",cn:"膈",ed:"A muscular sheet that flattens to draw air into the lungs.",cd:"收缩变平使空气进入肺部的肌肉结构。",ch:"Ch9 Respiration"},
{id:"ventilation",t:"ventilation",cn:"通气",ed:"The movement of air into and out of the lungs.",cd:"空气进出肺部的运动。",ch:"Ch9 Respiration"},
{id:"intercostal_muscle",t:"intercostal muscle",cn:"肋间肌",ed:"Muscles between the ribs that move the rib cage during breathing.",cd:"肋骨之间的肌肉，呼吸时带动胸廓运动。",ch:"Ch9 Respiration"},
{id:"thorax",t:"thorax",cn:"胸腔",ed:"The chest cavity containing the lungs and heart.",cd:"容纳肺和心脏的胸腔。",ch:"Ch9 Respiration"},
{id:"inspiration",t:"inspiration",cn:"吸气",ed:"Drawing air into the lungs.",cd:"把空气吸入肺部的过程。",ch:"Ch9 Respiration"},
{id:"expiration",t:"expiration",cn:"呼气",ed:"Pushing air out of the lungs.",cd:"把空气排出肺部的过程。",ch:"Ch9 Respiration"},
{id:"pharynx",t:"pharynx",cn:"咽",ed:"The throat, a passage for both air and food.",cd:"咽喉，空气和食物的共同通道。",ch:"Ch9 Respiration"},
{id:"larynx",t:"larynx",cn:"喉",ed:"The voice box at the top of the trachea.",cd:"气管顶端的喉头。",ch:"Ch9 Respiration"},
{id:"rib",t:"rib",cn:"肋骨",ed:"Bones that protect the lungs and help breathing.",cd:"保护肺部并协助呼吸的骨骼。",ch:"Ch9 Respiration"},
/* ===== Ch10 Gas exchange ===== */
{id:"gas_exchange",t:"gas exchange",cn:"气体交换",ed:"The exchange of oxygen and carbon dioxide between an organism and its surroundings.",cd:"生物体与环境之间氧气和二氧化碳的交换。",ch:"Ch10 Gas exchange"},
{id:"alveolus",t:"alveolus",cn:"肺泡",ed:"A tiny air sac in the lungs where gas exchange occurs.",cd:"肺内进行气体交换的微小气囊。",ch:"Ch10 Gas exchange"},
{id:"trachea",t:"trachea",cn:"气管",ed:"The windpipe that carries air towards the lungs.",cd:"将空气送往肺部的管道。",ch:"Ch10 Gas exchange"},

{id:"bronchiole",t:"bronchiole",cn:"细支气管",ed:"Small air passages in the lungs that end in alveoli.",cd:"肺内末端连肺泡的小气管。",ch:"Ch10 Gas exchange"},
{id:"inhalation",t:"inhalation",cn:"吸气",ed:"Drawing air into the lungs.",cd:"把空气吸入肺部的过程。",ch:"Ch10 Gas exchange"},
{id:"exhalation",t:"exhalation",cn:"呼气",ed:"Pushing air out of the lungs.",cd:"把空气排出肺部的过程。",ch:"Ch10 Gas exchange"},
{id:"nasal_cavity",t:"nasal cavity",cn:"鼻腔",ed:"The space inside the nose where air is warmed, moistened and filtered.",cd:"鼻腔内的空间，空气在此被加温、加湿和过滤。",ch:"Ch10 Gas exchange"},

/* ===== Ch11 Disease & Immunity ===== */
{id:"pathogen",t:"pathogen",cn:"病原体",ed:"A microorganism that causes disease, such as bacteria and viruses.",cd:"引起疾病的微生物，如细菌和病毒。",ch:"Ch11 Disease & Immunity"},
{id:"transmission",t:"transmission",cn:"传播",ed:"The passing of a pathogen from one person to another.",cd:"病原体从一个人传给另一个人的过程。",ch:"Ch11 Disease & Immunity"},
{id:"transmissible",t:"transmissible",cn:"可传染的",ed:"Able to be passed from one person to another, said of diseases.",cd:"能够在人与人之间传播的（疾病）。",ch:"Ch11 Disease & Immunity"},
{id:"antigen",t:"antigen",cn:"抗原",ed:"A foreign substance on a pathogen that triggers an immune response.",cd:"病原体表面引起免疫反应的异物。",ch:"Ch11 Disease & Immunity"},
{id:"antibody",t:"antibody",cn:"抗体",ed:"A protein made by lymphocytes that binds to antigens and neutralises pathogens.",cd:"淋巴细胞产生的蛋白质，与抗原结合并消灭病原体。",ch:"Ch11 Disease & Immunity"},
{id:"active_immunity",t:"active immunity",cn:"主动免疫",ed:"Immunity from antibodies the body makes itself after infection or vaccination.",cd:"机体感染或接种后自身产生抗体而获得的免疫力。",ch:"Ch11 Disease & Immunity"},
{id:"passive_immunity",t:"passive immunity",cn:"被动免疫",ed:"Immunity from antibodies received from another source, such as from the mother.",cd:"通过从外界获得抗体（如来自母体）而获得的免疫力。",ch:"Ch11 Disease & Immunity"},
{id:"vaccine",t:"vaccine",cn:"疫苗",ed:"A preparation of dead or weakened pathogens that makes the body immune.",cd:"由死或弱化的病原体制成、使身体产生免疫力的制剂。",ch:"Ch11 Disease & Immunity"},
{id:"vaccination",t:"vaccination",cn:"接种疫苗",ed:"Giving a vaccine to make the body immune to a disease.",cd:"接种疫苗使身体对疾病产生免疫。",ch:"Ch11 Disease & Immunity"},
{id:"toxin",t:"toxin",cn:"毒素",ed:"A poison produced by a pathogen that harms the host.",cd:"病原体产生、对宿主有害的毒物。",ch:"Ch11 Disease & Immunity"},
{id:"hygiene",t:"hygiene",cn:"卫生",ed:"Practices that keep things clean and reduce the spread of disease.",cd:"保持清洁、减少疾病传播的做法。",ch:"Ch11 Disease & Immunity"},
{id:"diarrhoea",t:"diarrhoea",cn:"腹泻",ed:"The frequent passing of watery faeces, often caused by infection.",cd:"频繁排出水样粪便，多由感染引起。",ch:"Ch11 Disease & Immunity"},
{id:"dehydration",t:"dehydration",cn:"脱水",ed:"The loss of too much water from the body.",cd:"身体水分流失过多。",ch:"Ch11 Disease & Immunity"},
{id:"defence",t:"defence",cn:"防御",ed:"The body's methods of protecting itself against pathogens.",cd:"身体防御病原体的机制。",ch:"Ch11 Disease & Immunity"},
/* ===== Ch12 Excretion ===== */
{id:"excretion",t:"excretion",cn:"排泄",ed:"The removal of metabolic waste products from the body.",cd:"把体内代谢废物排出体外的过程。",ch:"Ch12 Excretion"},

{id:"urea",t:"urea",cn:"尿素",ed:"A nitrogenous waste made by the liver from excess amino acids.",cd:"肝脏分解多余氨基酸产生的含氮废物。",ch:"Ch12 Excretion"},
{id:"ureter",t:"ureter",cn:"输尿管",ed:"The tube carrying urine from the kidney to the bladder.",cd:"把尿液从肾脏送往膀胱的管道。",ch:"Ch12 Excretion"},
{id:"bladder",t:"bladder",cn:"膀胱",ed:"The organ that stores urine before it leaves the body.",cd:"储存尿液、待排出体外的器官。",ch:"Ch12 Excretion"},

{id:"renal_artery",t:"renal artery",cn:"肾动脉",ed:"The artery carrying blood to the kidney.",cd:"把血液送入肾脏的动脉。",ch:"Ch12 Excretion"},
{id:"renal_vein",t:"renal vein",cn:"肾静脉",ed:"The vein carrying blood away from the kidney.",cd:"把血液带离肾脏的静脉。",ch:"Ch12 Excretion"},
{id:"renal_tubule",t:"renal tubule",cn:"肾小管",ed:"The tube in the nephron where reabsorption takes place.",cd:"肾单位中发生重吸收的管道。",ch:"Ch12 Excretion"},
{id:"cortex",t:"cortex",cn:"肾皮质",ed:"The outer region of the kidney.",cd:"肾脏的外层区域。",ch:"Ch12 Excretion"},
{id:"medulla",t:"medulla",cn:"肾髓质",ed:"The inner region of the kidney.",cd:"肾脏的内层区域。",ch:"Ch12 Excretion"},
{id:"afferent_arteriole",t:"afferent arteriole",cn:"入球小动脉",ed:"The small artery carrying blood into the glomerulus.",cd:"把血液送入肾小球的微小动脉。",ch:"Ch12 Excretion"},
{id:"efferent_arteriole",t:"efferent arteriole",cn:"出球小动脉",ed:"The small artery carrying blood away from the glomerulus.",cd:"把血液带离肾小球的微小动脉。",ch:"Ch12 Excretion"},
{id:"urethra",t:"urethra",cn:"尿道",ed:"The tube carrying urine from the bladder out of the body.",cd:"把尿液从膀胱排出体外的管道。",ch:"Ch12 Excretion"},
{id:"renal_dialysis",t:"renal dialysis",cn:"肾透析",ed:"Treatment that filters the blood artificially when the kidneys fail.",cd:"肾脏衰竭时人工过滤血液的治疗。",ch:"Ch12 Excretion"},
{id:"renal_transplant",t:"renal transplant",cn:"肾移植",ed:"Replacing a damaged kidney with a healthy one from a donor.",cd:"用捐赠者的健康肾脏替换受损肾脏。",ch:"Ch12 Excretion"},
/* ===== Ch13 Coordination ===== */

{id:"response",t:"response",cn:"反应",ed:"The action or change produced by an organism in answer to a stimulus.",cd:"生物体对刺激作出的动作或变化。",ch:"Ch13 Coordination"},
{id:"receptor",t:"receptor",cn:"感受器",ed:"Cells that detect a stimulus.",cd:"探测刺激的细胞。",ch:"Ch13 Coordination"},
{id:"effector",t:"effector",cn:"效应器",ed:"A muscle or gland that responds to a stimulus.",cd:"对刺激作出反应的肌肉或腺体。",ch:"Ch13 Coordination"},
{id:"neuron",t:"neuron",cn:"神经元",ed:"A nerve cell that carries electrical impulses.",cd:"传导电冲动的神经细胞。",ch:"Ch13 Coordination"},
{id:"synapse",t:"synapse",cn:"突触",ed:"The junction between two neurons across which impulses pass.",cd:"两个神经元之间传递冲动的连接处。",ch:"Ch13 Coordination"},
{id:"reflex",t:"reflex action",cn:"反射",ed:"A rapid, automatic response to a stimulus.",cd:"对刺激作出的快速、自动反应。",ch:"Ch13 Coordination"},
{id:"reflex_arc",t:"reflex arc",cn:"反射弧",ed:"The pathway of a reflex: receptor, sensory neuron, relay neuron, motor neuron and effector.",cd:"反射的传导路径：感受器、感觉神经元、联络神经元、运动神经元和效应器。",ch:"Ch13 Coordination"},
{id:"hormone",t:"hormone",cn:"激素",ed:"A chemical messenger made by glands and transported in the blood.",cd:"由腺体产生、经血液运输的化学信使。",ch:"Ch13 Coordination"},
{id:"insulin",t:"insulin",cn:"胰岛素",ed:"A hormone that lowers the blood glucose level.",cd:"降低血糖水平的激素。",ch:"Ch13 Coordination"},
{id:"glucagon",t:"glucagon",cn:"胰高血糖素",ed:"A hormone that raises the blood glucose level.",cd:"升高血糖水平的激素。",ch:"Ch13 Coordination"},
{id:"adrenaline",t:"adrenaline",cn:"肾上腺素",ed:"A hormone that prepares the body for stress or danger.",cd:"使身体进入应激状态的激素。",ch:"Ch13 Coordination"},
{id:"homeostasis",t:"homeostasis",cn:"稳态",ed:"The maintenance of a constant internal environment.",cd:"维持体内环境相对稳定的过程。",ch:"Ch13 Coordination"},
{id:"nervous_system",t:"nervous system",cn:"神经系统",ed:"The system of nerves and the brain that coordinates responses.",cd:"由脑和神经组成、协调机体反应的系统。",ch:"Ch13 Coordination"},
{id:"coordination",t:"coordination",cn:"协调",ed:"The working together of systems to control responses.",cd:"各系统协同工作以控制反应。",ch:"Ch13 Coordination"},
{id:"cns",t:"central nervous system",cn:"中枢神经系统",ed:"The brain and spinal cord.",cd:"由脑和脊髓组成。",ch:"Ch13 Coordination"},
{id:"pns",t:"peripheral nervous system",cn:"外周神经系统",ed:"All the nerves outside the central nervous system.",cd:"中枢神经系统以外的所有神经。",ch:"Ch13 Coordination"},
{id:"spinal_cord",t:"spinal cord",cn:"脊髓",ed:"The nerve cord running inside the backbone, part of the CNS.",cd:"位于脊柱内的神经索，属中枢神经系统。",ch:"Ch13 Coordination"},
{id:"sensory_neuron",t:"sensory neuron",cn:"感觉神经元",ed:"A neuron that carries impulses from receptors to the CNS.",cd:"把冲动从感受器传入中枢的神经元。",ch:"Ch13 Coordination"},

{id:"relay_neuron",t:"relay neuron",cn:"联络神经元",ed:"A neuron in the CNS that connects sensory and motor neurons.",cd:"中枢内连接感觉与运动神经元的神经元。",ch:"Ch13 Coordination"},

{id:"dendrite",t:"dendrite",cn:"树突",ed:"A branch of a neuron that receives impulses.",cd:"神经元接收冲动的分支。",ch:"Ch13 Coordination"},
{id:"axon",t:"axon",cn:"轴突",ed:"A long fibre of a neuron that carries impulses away from the cell body.",cd:"神经元上传导冲动的长纤维。",ch:"Ch13 Coordination"},
{id:"myelin_sheath",t:"myelin sheath",cn:"髓鞘",ed:"The fatty layer around an axon that speeds up impulses.",cd:"包绕轴突、加快冲动传导的脂肪层。",ch:"Ch13 Coordination"},

{id:"adrenal_gland",t:"adrenal gland",cn:"肾上腺",ed:"A gland that releases adrenaline in response to stress.",cd:"应激时释放肾上腺素的腺体。",ch:"Ch13 Coordination"},
{id:"testosterone",t:"testosterone",cn:"睾酮",ed:"The male sex hormone that controls sperm production.",cd:"控制精子产生的雄性激素。",ch:"Ch13 Coordination"},
{id:"estrogen",t:"oestrogen",cn:"雌性激素",ed:"A female sex hormone that controls the menstrual cycle and secondary sexual characteristics.",cd:"控制月经周期和女性第二性征的激素。",ch:"Ch13 Coordination"},
{id:"negative_feedback",t:"negative feedback",cn:"负反馈",ed:"A mechanism that reverses a change to keep conditions constant.",cd:"通过反向调节使体内条件保持稳定的机制。",ch:"Ch13 Coordination"},
{id:"tropism",t:"tropism",cn:"向性",ed:"A growth movement of a plant in response to a stimulus.",cd:"植物对刺激作出的生长性运动。",ch:"Ch13 Coordination"},
{id:"phototropism",t:"phototropism",cn:"向光性",ed:"Growth towards or away from light.",cd:"植物朝向或背离光源生长。",ch:"Ch13 Coordination"},
{id:"gravitropism",t:"gravitropism",cn:"向地性",ed:"Growth towards or away from gravity.",cd:"植物朝向或背离重力生长。",ch:"Ch13 Coordination"},
{id:"auxin",t:"auxin",cn:"生长素",ed:"A plant hormone that controls cell elongation and tropisms.",cd:"控制细胞伸长和向性运动的植物激素。",ch:"Ch13 Coordination"},
{id:"iris",t:"iris",cn:"虹膜",ed:"The coloured part of the eye that controls the pupil size.",cd:"眼中有色部分，控制瞳孔大小。",ch:"Ch13 Coordination"},
{id:"pupil",t:"pupil",cn:"瞳孔",ed:"The hole in the iris that lets light into the eye.",cd:"虹膜中央让光线进入眼睛的孔。",ch:"Ch13 Coordination"},
{id:"lens",t:"lens",cn:"晶状体",ed:"The structure in the eye that focuses light onto the retina.",cd:"眼睛中把光线聚焦到视网膜上的结构。",ch:"Ch13 Coordination"},
{id:"retina",t:"retina",cn:"视网膜",ed:"The layer at the back of the eye containing light receptors.",cd:"眼后含有感光细胞的膜层。",ch:"Ch13 Coordination"},
{id:"cornea",t:"cornea",cn:"角膜",ed:"The transparent front part of the eye that refracts light.",cd:"眼睛前部透明的部分，折射光线。",ch:"Ch13 Coordination"},
{id:"hypothalamus",t:"hypothalamus",cn:"下丘脑",ed:"The part of the brain that monitors blood conditions and controls body temperature.",cd:"监测血液状况、调节体温的脑部结构。",ch:"Ch13 Coordination"},
{id:"vasodilation",t:"vasodilation",cn:"血管舒张",ed:"The widening of blood vessels near the skin to release heat.",cd:"皮肤附近血管扩张以散发热量。",ch:"Ch13 Coordination"},
{id:"vasoconstriction",t:"vasoconstriction",cn:"血管收缩",ed:"The narrowing of blood vessels near the skin to reduce heat loss.",cd:"皮肤附近血管收缩以减少热量散失。",ch:"Ch13 Coordination"},
/* ===== Ch14 Reproduction ===== */
{id:"reproduction",t:"reproduction",cn:"生殖",ed:"The production of new individuals of the same species.",cd:"产生同种新个体的过程。",ch:"Ch14 Reproduction"},
{id:"gamete",t:"gamete",cn:"配子",ed:"A sex cell, such as a sperm or ovum, with half the chromosome number.",cd:"染色体数减半的性细胞，如精子或卵子。",ch:"Ch14 Reproduction"},
{id:"sperm",t:"sperm",cn:"精子",ed:"The male gamete of animals.",cd:"动物的雄性配子。",ch:"Ch14 Reproduction"},
{id:"ovum",t:"ovum",cn:"卵子",ed:"The female gamete of animals.",cd:"动物的雌性配子。",ch:"Ch14 Reproduction"},
{id:"fertilisation",t:"fertilisation",cn:"受精",ed:"The fusion of a male and a female gamete to form a zygote.",cd:"雌雄配子融合形成受精卵的过程。",ch:"Ch14 Reproduction"},
{id:"zygote",t:"zygote",cn:"受精卵",ed:"The cell formed by the fusion of two gametes.",cd:"两个配子融合形成的细胞。",ch:"Ch14 Reproduction"},
{id:"pollination",t:"pollination",cn:"传粉",ed:"The transfer of pollen from an anther to a stigma.",cd:"花粉从花药传到柱头的过程。",ch:"Ch14 Reproduction"},
{id:"germination",t:"germination",cn:"萌发",ed:"The growth of a seed into a new plant.",cd:"种子发育成新植株的过程。",ch:"Ch14 Reproduction"},
{id:"embryo",t:"embryo",cn:"胚",ed:"The developing young organism before birth or germination.",cd:"出生或萌发前发育中的幼体。",ch:"Ch14 Reproduction"},
{id:"placenta",t:"placenta",cn:"胎盘",ed:"The organ through which a foetus gets nutrients and oxygen from the mother.",cd:"胎儿从母体获得营养和氧气的器官。",ch:"Ch14 Reproduction"},
{id:"menstrual_cycle",t:"menstrual cycle",cn:"月经周期",ed:"The monthly cycle of changes in the female reproductive system.",cd:"女性生殖系统每月的周期性变化。",ch:"Ch14 Reproduction"},
{id:"asexual",t:"asexual reproduction",cn:"无性生殖",ed:"Reproduction involving one parent, producing identical offspring.",cd:"仅由一个亲本产生相同后代的生殖方式。",ch:"Ch14 Reproduction"},
{id:"sexual",t:"sexual reproduction",cn:"有性生殖",ed:"Reproduction involving two parents and the fusion of gametes.",cd:"由两个亲本通过配子融合进行的生殖。",ch:"Ch14 Reproduction"},
{id:"haploid",t:"haploid",cn:"单倍体",ed:"Having one set of chromosomes, as in gametes.",cd:"只有一套染色体的，如配子。",ch:"Ch14 Reproduction"},
{id:"diploid",t:"diploid",cn:"二倍体",ed:"Having two sets of chromosomes, as in body cells.",cd:"有两套染色体的，如体细胞。",ch:"Ch14 Reproduction"},
{id:"mitosis",t:"mitosis",cn:"有丝分裂",ed:"Nuclear division that produces two genetically identical cells.",cd:"产生两个遗传相同细胞的分裂。",ch:"Ch14 Reproduction"},
{id:"meiosis",t:"meiosis",cn:"减数分裂",ed:"A reduction division producing gametes with half the chromosome number.",cd:"产生染色体减半配子的分裂。",ch:"Ch14 Reproduction"},
{id:"menstruation",t:"menstruation",cn:"月经",ed:"The loss of the uterus lining when an egg is not fertilised.",cd:"卵子未受精时子宫内膜脱落排出。",ch:"Ch14 Reproduction"},
{id:"amnion",t:"amnion",cn:"羊膜",ed:"The membrane surrounding the foetus that holds amniotic fluid.",cd:"包裹胎儿并容纳羊水的膜。",ch:"Ch14 Reproduction"},
{id:"amniotic_fluid",t:"amniotic fluid",cn:"羊水",ed:"The liquid around the foetus that cushions it.",cd:"环绕胎儿起缓冲作用的液体。",ch:"Ch14 Reproduction"},
{id:"umbilical_cord",t:"umbilical cord",cn:"脐带",ed:"The cord connecting the foetus to the placenta.",cd:"连接胎儿与胎盘的脐带。",ch:"Ch14 Reproduction"},
{id:"fetus",t:"foetus",cn:"胎儿",ed:"The developing baby from about 8 weeks until birth.",cd:"怀孕约8周后至出生前的发育胎儿。",ch:"Ch14 Reproduction"},
{id:"pollen",t:"pollen",cn:"花粉",ed:"The male gamete of a flowering plant.",cd:"显花植物的雄性配子。",ch:"Ch14 Reproduction"},
{id:"ovule",t:"ovule",cn:"胚珠",ed:"The structure in the ovary that contains the female gamete.",cd:"子房内含雌性配子的结构。",ch:"Ch14 Reproduction"},
{id:"anther",t:"anther",cn:"花药",ed:"The part of the stamen that produces pollen.",cd:"雄蕊中产生花粉的部分。",ch:"Ch14 Reproduction"},
{id:"stigma",t:"stigma",cn:"柱头",ed:"The part of the carpel that receives pollen.",cd:"雌蕊接收花粉的部分。",ch:"Ch14 Reproduction"},
{id:"style",t:"style",cn:"花柱",ed:"The stalk of the carpel that connects the stigma and ovary.",cd:"雌蕊连接柱头和子房的花柱。",ch:"Ch14 Reproduction"},
{id:"petal",t:"petal",cn:"花瓣",ed:"A coloured leaf-like part of a flower that attracts pollinators.",cd:"吸引传粉者的彩色花瓣。",ch:"Ch14 Reproduction"},
{id:"sepal",t:"sepal",cn:"萼片",ed:"A leaf-like part protecting the flower bud.",cd:"保护花蕾的叶状萼片。",ch:"Ch14 Reproduction"},
{id:"cross_pollination",t:"cross-pollination",cn:"异花传粉",ed:"Transfer of pollen between flowers on different plants.",cd:"花粉在不同植株花朵之间的传播。",ch:"Ch14 Reproduction"},
{id:"self_pollination",t:"self-pollination",cn:"自花传粉",ed:"Transfer of pollen within the same flower or plant.",cd:"花粉在同一朵花或同一植株内传播。",ch:"Ch14 Reproduction"},
{id:"pollen_tube",t:"pollen tube",cn:"花粉管",ed:"A tube that grows from a pollen grain to carry the male nucleus to the ovule.",cd:"花粉萌发出的管道，把雄核送至胚珠。",ch:"Ch14 Reproduction"},
{id:"flagellum",t:"flagellum",cn:"鞭毛",ed:"A tail-like structure that moves a sperm cell.",cd:"使精子游动的尾状结构。",ch:"Ch14 Reproduction"},
{id:"acrosome",t:"acrosome",cn:"顶体",ed:"The tip of a sperm that releases enzymes to enter the egg.",cd:"精子头部释放酶进入卵细胞的部分。",ch:"Ch14 Reproduction"},
{id:"progesterone",t:"progesterone",cn:"孕酮",ed:"A hormone that maintains the uterus lining during pregnancy.",cd:"维持妊娠期子宫内膜的激素。",ch:"Ch14 Reproduction"},
{id:"testes",t:"testes",cn:"睾丸",ed:"The male organs that make sperm and testosterone.",cd:"产生精子和睾酮的雄性器官。",ch:"Ch14 Reproduction"},
{id:"uterus",t:"uterus",cn:"子宫",ed:"The organ where the foetus develops.",cd:"胎儿在其中发育的器官。",ch:"Ch14 Reproduction"},
{id:"cervix",t:"cervix",cn:"子宫颈",ed:"The neck of the uterus opening into the vagina.",cd:"子宫通向阴道的颈部。",ch:"Ch14 Reproduction"},
{id:"vagina",t:"vagina",cn:"阴道",ed:"The muscular tube leading from the cervix to the outside.",cd:"从子宫颈通向体外的肌肉管道。",ch:"Ch14 Reproduction"},
{id:"oviduct",t:"oviduct",cn:"输卵管",ed:"The tube carrying eggs from the ovary to the uterus, where fertilisation occurs.",cd:"运送卵子到子宫并在其中受精的管道。",ch:"Ch14 Reproduction"},
/* ===== Ch15 Inheritance & Variation ===== */
{id:"inheritance",t:"inheritance",cn:"遗传",ed:"The passing of characteristics from parents to offspring.",cd:"亲代把性状传给子代的过程。",ch:"Ch15 Inheritance & Variation"},
{id:"gene",t:"gene",cn:"基因",ed:"A section of DNA that codes for a particular characteristic.",cd:"编码特定性状的一段DNA。",ch:"Ch15 Inheritance & Variation"},
{id:"allele",t:"allele",cn:"等位基因",ed:"A different form of the same gene.",cd:"同一基因的不同形式。",ch:"Ch15 Inheritance & Variation"},
{id:"chromosome",t:"chromosome",cn:"染色体",ed:"A thread-like structure made of DNA that carries genes.",cd:"携带基因的线状DNA结构。",ch:"Ch15 Inheritance & Variation"},
{id:"dna",t:"DNA",cn:"脱氧核糖核酸",ed:"The molecule that carries genetic information.",cd:"携带遗传信息的分子。",ch:"Ch15 Inheritance & Variation"},
{id:"dominant",t:"dominant",cn:"显性",ed:"An allele that is expressed even when paired with a different allele.",cd:"与不同等位基因共存时也能表现出的等位基因。",ch:"Ch15 Inheritance & Variation"},
{id:"recessive",t:"recessive",cn:"隐性",ed:"An allele that is expressed only when two copies are present.",cd:"只有两份都存在时才表现出的等位基因。",ch:"Ch15 Inheritance & Variation"},
{id:"homozygous",t:"homozygous",cn:"纯合",ed:"Having two identical alleles of a gene.",cd:"某一基因的两个等位基因相同。",ch:"Ch15 Inheritance & Variation"},
{id:"heterozygous",t:"heterozygous",cn:"杂合",ed:"Having two different alleles of a gene.",cd:"某一基因的两个等位基因不同。",ch:"Ch15 Inheritance & Variation"},
{id:"genotype",t:"genotype",cn:"基因型",ed:"The genetic makeup of an organism.",cd:"生物体的遗传组成。",ch:"Ch15 Inheritance & Variation"},
{id:"phenotype",t:"phenotype",cn:"表现型",ed:"The observable characteristics of an organism.",cd:"生物体可观察到的性状表现。",ch:"Ch15 Inheritance & Variation"},
{id:"mutation",t:"mutation",cn:"突变",ed:"A change in the genetic material that can cause variation.",cd:"遗传物质的变化，可导致变异。",ch:"Ch15 Inheritance & Variation"},
{id:"variation",t:"variation",cn:"变异",ed:"Differences between individuals of the same species.",cd:"同种生物个体之间的差异。",ch:"Ch15 Inheritance & Variation"},
{id:"transcription",t:"transcription",cn:"转录",ed:"The copying of a gene's DNA sequence into messenger RNA.",cd:"把基因的DNA序列复制成信使RNA的过程。",ch:"Ch15 Inheritance & Variation"},
{id:"translation",t:"translation",cn:"翻译",ed:"The building of a protein from amino acids using the messenger RNA code.",cd:"利用信使RNA密码把氨基酸组装成蛋白质的过程。",ch:"Ch15 Inheritance & Variation"},

{id:"punnett_square",t:"Punnett square",cn:"庞纳特方格",ed:"A diagram used to predict the outcomes of genetic crosses.",cd:"用于预测遗传杂交结果的方格图。",ch:"Ch15 Inheritance & Variation"},
{id:"pedigree_diagram",t:"pedigree diagram",cn:"家系图",ed:"A diagram showing how a characteristic is passed through a family.",cd:"显示性状在家族中遗传情况的图。",ch:"Ch15 Inheritance & Variation"},
{id:"test_cross",t:"test cross",cn:"测交",ed:"A cross with a recessive individual to find an unknown genotype.",cd:"与隐性个体杂交以测定未知基因型的方法。",ch:"Ch15 Inheritance & Variation"},
{id:"codominant",t:"codominant",cn:"共显性",ed:"Both alleles expressed together in a heterozygote.",cd:"杂合子中两个等位基因同时表现的遗传方式。",ch:"Ch15 Inheritance & Variation"},
{id:"sex_linkage",t:"sex linkage",cn:"伴性遗传",ed:"Inheritance of genes carried on the sex chromosomes.",cd:"位于性染色体上基因的遗传。",ch:"Ch15 Inheritance & Variation"},
{id:"discontinuous_variation",t:"discontinuous variation",cn:"不连续变异",ed:"Variation with distinct categories, controlled by few genes.",cd:"由少数基因控制、有明显类别的变异。",ch:"Ch15 Inheritance & Variation"},
{id:"continuous_variation",t:"continuous variation",cn:"连续变异",ed:"Variation over a continuous range, controlled by many genes and the environment.",cd:"受多基因和环境控制、呈连续分布的变异。",ch:"Ch15 Inheritance & Variation"},
{id:"gene_mutation",t:"gene mutation",cn:"基因突变",ed:"A random change in the base sequence of DNA.",cd:"DNA碱基序列发生的随机改变。",ch:"Ch15 Inheritance & Variation"},
{id:"adaptation",t:"adaptation",cn:"适应",ed:"A feature or process that helps an organism survive in its environment.",cd:"帮助生物在环境中生存的特征或过程。",ch:"Ch15 Inheritance & Variation"},
{id:"fitness",t:"fitness",cn:"适合度",ed:"The chance of an organism surviving and reproducing in its environment.",cd:"生物在环境中生存并繁殖的概率。",ch:"Ch15 Inheritance & Variation"},
{id:"natural_selection",t:"natural selection",cn:"自然选择",ed:"The survival of organisms best adapted to their environment.",cd:"适应环境的生物更易生存的进化机制。",ch:"Ch15 Inheritance & Variation"},
{id:"selection_pressure",t:"selection pressure",cn:"选择压力",ed:"An environmental factor that favours some individuals over others.",cd:"使部分个体更具优势的环境因素。",ch:"Ch15 Inheritance & Variation"},
{id:"artificial_selection",t:"artificial selection",cn:"人工选择",ed:"Selection of organisms with desirable features by humans.",cd:"人类选择具有优良性状的生物进行繁殖。",ch:"Ch15 Inheritance & Variation"},
{id:"evolution",t:"evolution",cn:"进化",ed:"The gradual change in a species over many generations.",cd:"物种经过许多世代逐渐发生变化。",ch:"Ch15 Inheritance & Variation"},
/* ===== Ch16 Ecology ===== */

{id:"immigration",t:"immigration",cn:"迁入",ed:"The movement of organisms into an area.",cd:"生物迁入某个地区。",ch:"Ch16 Ecology"},
{id:"emigration",t:"emigration",cn:"迁出",ed:"The movement of organisms out of an area.",cd:"生物迁出某个地区。",ch:"Ch16 Ecology"},
{id:"lag_phase",t:"lag phase",cn:"滞后期",ed:"The slow-growth start of a population growth curve.",cd:"种群增长曲线中增长缓慢的起始阶段。",ch:"Ch16 Ecology"},
{id:"log_phase",t:"log phase",cn:"对数期",ed:"The rapid-growth stage of a population growth curve.",cd:"种群增长曲线中快速增长的阶段。",ch:"Ch16 Ecology"},

{id:"monoculture",t:"monoculture",cn:"单一栽培",ed:"Growing a single crop species over a large area.",cd:"大面积种植单一作物品种。",ch:"Ch16 Ecology"},

{id:"overharvesting",t:"overharvesting",cn:"过度捕捞",ed:"Removing too many organisms, causing species to decline.",cd:"过度捕取生物导致种群衰退。",ch:"Ch16 Ecology"},

/* ===== Ch17 Biotechnology ===== */
{id:"fermentation",t:"fermentation",cn:"发酵",ed:"The anaerobic breakdown of glucose by microorganisms.",cd:"微生物对葡萄糖进行的无氧分解。",ch:"Ch17 Biotechnology"},

{id:"genetic_engineering",t:"genetic engineering",cn:"基因工程",ed:"The artificial transfer of genes between organisms.",cd:"人工把基因从一个生物转移到另一个生物的技术。",ch:"Ch17 Biotechnology"},

var K_NAME="BM0610Name",K_GOAL="BM0610Goal",K_P="BM0610Progress",K_PENDING="BM0610Pending";
function tStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function defP(){return {name:"",updated:"",goal:10,day:"",todayIds:[],learnedIds:[],quizToday:0,quizTodayC:0,quizTotal:0,quizTotalC:0,wrong:[],history:[]};}
function gP(){try{var p=JSON.parse(localStorage.getItem(K_P));if(p&&typeof p==="object")return p;}catch(e){}return defP();}
function sP(p){try{localStorage.setItem(K_P,JSON.stringify(p));}catch(e){}}
function newDay(){var p=gP();var t=tStr();if(p.day!==t){if(p.day)p.history.push({d:p.day,g:p.goal,l:p.todayIds.length,q:p.quizToday,qc:p.quizTodayC});if(p.history.length>60)p.history.shift();p.day=t;p.todayIds=[];p.quizToday=0;p.quizTodayC=0;sP(p);}return p;}
function gW(p){return p.wrong;}
function addWrong(p,id){for(var i=0;i<p.wrong.length;i++){if(p.wrong[i].id===id){p.wrong[i].n++;return;}}p.wrong.push({id:id,n:1});}
function decWrong(p,id){for(var i=0;i<p.wrong.length;i++){if(p.wrong[i].id===id){p.wrong[i].n--;if(p.wrong[i].n<=0)p.wrong.splice(i,1);return;}}}
function wById(id){for(var i=0;i<WORDS.length;i++){if(WORDS[i].id===id)return WORDS[i];}return null;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function grpName(w){return String(w.ch||"").replace(/^Ch\d+\s*/,"");} /* "Ch1 Cells" -> "Cells" */

/* ======= 学习（闪卡，按单元先后顺序） ======= */
var bmStudy=null;
function bmStudySetup(){
  var p=newDay();
  var h="";
  h+='<div class="card"><h3>📖 开始学习</h3>';
  h+='<p class="small">单词按单元先后顺序学习：先学完 Ch1 再学 Ch2…，不会打乱。</p>';
  h+='<p class="small" style="margin-top:10px">学习范围：</p><select id="bmSUnit" style="margin-top:6px">';
  h+='<option value="all">全部单元（按先后顺序）</option>';
  for(var i=0;i<GRP.length;i++){
    var nNew=0;
    for(var j=0;j<WORDS.length;j++){if(grpName(WORDS[j])===GRP[i][1]&&p.learnedIds.indexOf(WORDS[j].id)<0)nNew++;}
    h+='<option value="'+i+'">'+GRP[i][2]+' '+GRP[i][1]+'（还剩 '+nNew+' 个新词）</option>';
  }
  h+='</select>';
  h+='<div class="btn-row"><button class="btn" onclick="bmStudyGo()">🚀 开始学习</button><button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  document.getElementById("pc").innerHTML=h;
}
function bmStudyGo(){
  var p=newDay();var goal=Math.max(1,Math.min(30,parseInt(p.goal)||10));
  var sel=document.getElementById("bmSUnit");
  var unit=(sel&&sel.value!=="")?sel.value:"all";
  var ch=null;
  if(unit!=="all")ch=GRP[parseInt(unit)][1];
  /* 新词按单元顺序（WORDS 本身就是按单元排的），不打乱 */
  var newW=[];
  for(var i=0;i<WORDS.length;i++){var w=WORDS[i];if(ch&&grpName(w)!==ch)continue;if(p.learnedIds.indexOf(w.id)<0)newW.push(w);}
  var take=newW.slice(0,goal);
  /* 复习错词（限同一单元/全部），按单元顺序排在最后 */
  var review=[];
  for(var k=0;k<p.wrong.length;k++){var rw=wById(p.wrong[k].id);if(rw&&(!ch||grpName(rw)===ch))review.push(rw);}
  var ids={};for(var m=0;m<take.length;m++)ids[take[m].id]=1;
  review=review.filter(function(w){return !ids[w.id];});
  review.sort(function(a,b){return WORDS.indexOf(a)-WORDS.indexOf(b);});
  var deck=take.concat(review);
  if(!deck.length){
    var msg=(ch?("「"+GRP[parseInt(unit)][2]+" "+ch+"」"):"今天")+"的词都背完啦！";
    document.getElementById("pc").innerHTML='<div class="card empty"><div class="big">🎉 '+msg+'</div><span class="small">明天再来，或去 Quiz 检测 / 错词本复习。</span><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';
    return;
  }
  bmStudy={deck:deck,i:0,known:0,unknown:0,flipped:false};
  bmCard();
}
function bmCard(){
  var s=bmStudy;if(!s)return;
  var w=s.deck[s.i];
  var pc=document.getElementById("pc");
  var h="";
  h+='<div class="card"><h3>📖 学习闪卡</h3>';
  h+='<div class="flash">';
  h+='<span class="meta">'+esc(w.ch)+'</span>';
  h+='<span class="prog">'+(s.i+1)+'/'+s.deck.length+'</span>';
  h+='<div class="term">'+esc(w.t)+'</div>';
  if(s.flipped){
    h+='<div class="reveal"><div class="cn">'+esc(w.cn)+'</div>';
    h+='<div class="def">📘 '+esc(w.ed)+'</div>';
    h+='<div class="def">📖 <b>'+esc(w.cd)+'</b></div></div>';
    h+='<div class="btn-row" style="margin-top:18px">';
    h+='<button class="btn green" onclick="bmGrade(true)">✅ 认识</button>';
    h+='<button class="btn red" onclick="bmGrade(false)">❌ 不认识</button>';
    h+='</div>';
  }else{
    h+='<div class="small" style="margin:6px 0">回忆一下它的中文意思，然后点翻转查看</div>';
    h+='<div class="btn-row" style="margin-top:18px">';
    h+='<button class="btn" onclick="bmFlip()">🔄 翻转查看</button>';
    h+='</div>';
  }
  h+='</div></div>';
  h+='<div class="btn-row"><button class="btn gray" onclick="renderHome()">↩️ 退出学习</button></div>';
  pc.innerHTML=h;
}
function bmFlip(){if(bmStudy)bmStudy.flipped=true;bmCard();}
function bmGrade(know){
  var s=bmStudy;if(!s)return;
  var w=s.deck[s.i];
  var p=newDay();
  if(know){
    if(p.todayIds.indexOf(w.id)<0)p.todayIds.push(w.id);
    if(p.learnedIds.indexOf(w.id)<0)p.learnedIds.push(w.id);
    decWrong(p,w.id);
    s.known++;
  }else{
    addWrong(p,w.id);
    s.unknown++;
  }
  sP(p);
  s.i++;s.flipped=false;
  if(s.i>=s.deck.length){
    var pc=document.getElementById("pc");
    pc.innerHTML='<div class="card"><h3>📖 学习完成</h3><div class="summary">本组 '+s.deck.length+' 张 · 认识 '+s.known+' · 新记错词 '+s.unknown+'</div>';
    pc.innerHTML+='<div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button><button class="btn orange" onclick="bmQuizSetup()">马上 Quiz 检测</button></div></div>';
    bioPushNow();
    return;
  }
  bmCard();
}

var bmQuiz=null;
function bmQuizSetup(){
  var p=newDay();
  var h="";
  h+='<div class="card"><h3>📝 Quiz 检测</h3>';
  h+='<p class="small">选择检测范围：</p><select id="bmQScope" style="margin-top:8px">';
  h+='<option value="today">本次学习词（今日已背 '+p.todayIds.length+'）</option>';
  h+='<option value="learned">全部已学词（'+p.learnedIds.length+'）</option>';
  h+='<option value="wrong">错词本（'+p.wrong.length+'）</option>';
  h+='<option value="all">全部词库（'+WORDS.length+'）</option>';
  h+='</select>';
  h+='<p class="small" style="margin-top:12px">题目数：</p><select id="bmQNum" style="margin-top:8px">';
  h+='<option value="10">10 题</option><option value="20">20 题</option><option value="0">全部</option>';
  h+='</select>';
  h+='<p class="small" style="margin-top:12px">每题的选项方向会随机：英文词→选中文 / 中文→选英文</p>';
  h+='<div class="btn-row"><button class="btn" onclick="bmQuizGo()">🚀 开始测验</button><button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  document.getElementById("pc").innerHTML=h;
}
function bmQuizGo(){
  var p=newDay();
  var scope=document.getElementById("bmQScope").value;
  var qn=parseInt(document.getElementById("bmQNum").value)||10;
  var pool=[];
  if(scope==="today")pool=p.todayIds.map(function(id){return wById(id);}).filter(Boolean);
  else if(scope==="learned")pool=p.learnedIds.map(function(id){return wById(id);}).filter(Boolean);
  else if(scope==="wrong")pool=p.wrong.map(function(e){return wById(e.id);}).filter(Boolean);
  else pool=WORDS.slice();
  shuffle(pool);
  if(qn>0&&pool.length>qn)pool=pool.slice(0,qn);
  if(!pool.length){document.getElementById("pc").innerHTML='<div class="card empty"><div class="big">📭 这个范围还没有词</div><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';return;}
  bmQuiz={pool:pool,i:0,total:pool.length,correct:0};
  bmQuizQ();
}
function bmQuizQ(){
  var q=bmQuiz;if(!q)return;
  var w=q.pool[q.i];
  var dir=Math.random()<0.5?"toCN":"toEN";
  var correct=dir==="toCN"?w.cn:w.t;
  var opts=[correct];
  var others=WORDS.filter(function(x){return x.id!==w.id && (dir==="toCN"?x.cn!==correct:x.t!==correct);});
  shuffle(others);
  for(var i=0;i<others.length&&opts.length<4;i++){var o=dir==="toCN"?others[i].cn:others[i].t;if(opts.indexOf(o)<0)opts.push(o);}
  shuffle(opts);
  var pc=document.getElementById("pc");
  var h="";
  h+='<div class="card"><h3>📝 Quiz 检测</h3>';
  h+='<span class="small">第 '+(q.i+1)+'/'+q.total+' 题 · 当前答对 '+q.correct+'</span>';
  h+='<div class="flash"><span class="meta">'+esc(w.ch)+'</span>';
  h+='<div class="term">'+(dir==="toCN"?esc(w.t):esc(w.cn))+'</div>';
  h+='<div class="small">'+(dir==="toCN"?"请选出它的中文意思":"请选出对应的英文词")+'</div>';
  h+='<div style="width:100%;margin-top:14px">';
  for(var k=0;k<opts.length;k++){
    h+='<button class="opt" data-ok="'+(opts[k]===correct?"1":"0")+'" onclick="bmQuizAnswer(this,'+(opts[k]===correct)+',\''+esc(String(w.id).replace(/'/g,"\\'"))+'\')">'+esc(opts[k])+'</button>';
  }
  h+='</div></div></div>';
  pc.innerHTML=h;
}
function bmQuizAnswer(el,isOk,id){
  var q=bmQuiz;if(!q)return;
  var pc=document.getElementById("pc");
  var p=newDay();
  if(isOk){q.correct++;decWrong(p,id);}
  else{addWrong(p,id);}
  p.quizTotal++;p.quizToday++;
  if(isOk){p.quizTotalC++;p.quizTodayC++;}
  sP(p);
  var opts=pc.querySelectorAll(".opt");
  for(var i=0;i<opts.length;i++){opts[i].disabled=true;if(opts[i].getAttribute("data-ok")==="1")opts[i].className="opt ok";else if(opts[i]!==el)opts[i].className="opt";}
  if(!isOk)el.className="opt no";
  var fb=pc.querySelector(".flash");
  if(fb){fb.insertAdjacentHTML("beforeend",'<div style="margin-top:14px;font-weight:700;color:'+(isOk?'var(--correct)':'var(--wrong)')+'">'+(isOk?"✅ 答对！":"❌ 答错，已记入错词本")+'</div>');}
  setTimeout(function(){
    q.i++;
    if(q.i>=q.total){
      var acc=q.total?Math.round(q.correct/q.total*100):0;
      pc.innerHTML='<div class="card"><h3>📝 Quiz 完成</h3><div class="summary">答对 '+q.correct+'/'+q.total+' · 正确率 '+acc+'%</div>';
      pc.innerHTML+='<div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button><button class="btn orange" onclick="bmQuizSetup()">再测一次</button></div></div>';
      bioPushNow();
    }else{bmQuizQ();}
  },isOk?450:900);
}

/* ======= 错词本 ======= */
function bmWrongBook(){
  var p=newDay();
  var pc=document.getElementById("pc");
  if(!p.wrong.length){pc.innerHTML='<div class="card empty"><div class="big">🎉 错词本是空的</div><span class="small">继续保持！</span><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';return;}
  var h="";
  h+='<div class="card"><h3>❌ 错词本（'+p.wrong.length+'）</h3>';
  h+='<p class="small">做错过的词会记在这里，Quiz 答对会减次数，减到 0 自动移出。</p>';
  for(var i=0;i<p.wrong.length;i++){
    var w=wById(p.wrong[i].id);if(!w)continue;
    h+='<div class="wrong-row"><span class="w">'+esc(w.t)+'</span><span class="small" style="color:var(--correct);font-weight:600">'+esc(w.cn)+'</span><span class="n">错 '+p.wrong[i].n+'</span></div>';
  }
  h+='<div class="btn-row"><button class="btn orange" onclick="bmQuizGo()">✏️ 再测这些错词</button>';
  h+='<button class="btn green" onclick="bmStudyWrong()">📖 重学闪卡</button>';
  h+='<button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  pc.innerHTML=h;
}
function bmStudyWrong(){
  var p=newDay();
  var deck=p.wrong.map(function(e){return wById(e.id);}).filter(Boolean);
  shuffle(deck);
  if(!deck.length){renderHome();return;}
  bmStudy={deck:deck,i:0,known:0,unknown:0,flipped:false};
  bmCard();
}

/* ======= 目标 ======= */
function bmSetGoal(){
  var v=parseInt(document.getElementById("bmGoalInp").value)||10;
  v=Math.max(1,Math.min(30,v));
  var p=newDay();p.goal=v;sP(p);
  var msg=document.getElementById("goalMsg");
  if(msg){msg.textContent="✅ 已保存：每天 "+v+" 个";}
  renderHome();
}

/* ======= 云同步（bioHex token + Contents API，与题库 app 同款） ======= */
function bioSetSync(mode,label){
  var el=document.getElementById("bioSyncB");if(!el)return;
  el.className="bio-sync"+(mode==="off"?" off":"");
  el.textContent="☁️ "+label;
}
function gPending(){try{return localStorage.getItem(K_PENDING)==="1";}catch(e){return false;}}
function bioQueuePending(){try{localStorage.setItem(K_PENDING,"1");}catch(e){}}
function bioClearPending(){try{localStorage.removeItem(K_PENDING);}catch(e){}}
function bioPushNow(){
  if(bioSyncBusy)return;
  if(!BIO_STUDENT)return;
  if(BIO_CFG.token==="__BIO_TOKEN__"){bioSetSync("off","未设置");return;}
  bioSyncBusy=true;
  var p=newDay();
  var slug=encodeURIComponent(BIO_STUDENT);
  var path=BIO_CFG.folder+"/"+slug+".json";
  var url="https://api.github.com/repos/"+BIO_CFG.owner+"/"+BIO_CFG.repo+"/contents/"+path;
  var body={name:BIO_STUDENT,updated:new Date().toISOString(),goal:p.goal,
    learnedToday:p.todayIds.length,quizToday:p.quizToday,quizCorrectToday:p.quizTodayC,
    totalLearned:p.learnedIds.length,totalQuiz:p.quizTotal,totalQuizCorrect:p.quizTotalC,
    wrong:p.wrong,history:p.history};
  var payload={message:"sync "+BIO_STUDENT,content:btoa(unescape(encodeURIComponent(JSON.stringify(body))))};
  fetch(url,{headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"}})
    .then(function(r){return r.json().then(function(j){return{status:r.status,j:j};});})
    .then(function(res){
      if(res.status===200&&res.j.sha)payload.sha=res.j.sha;
      return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"},body:JSON.stringify(payload)});
    })
    .then(function(r){
      bioSyncBusy=false;
      if(r.ok){bioSetSync("on","已同步");bioClearPending();}
      else{bioSetSync("off","同步失败");bioQueuePending();}
    })
    .catch(function(){bioSyncBusy=false;bioSetSync("off","未连接");bioQueuePending();});
}

/* ======= 启动 ======= */
renderHome();
bioAskName();
bioPushNow();/* 打开页面自动补推未同步记录 */
setTimeout(function(){if(gPending())bioPushNow();},4000);/* 首次失败 4 秒后重试 */
setTimeout(function(){if(gPending())bioPushNow();},12000);/* 再失败 12 秒后再试 */
</script>
