/* ===== Ch3 Enzymes ===== */
{id:"enzyme",t:"enzyme",cn:"酶",ed:"A biological catalyst that speeds up reactions without being used up.",cd:"加快反应速率而不被消耗的生物催化剂。",ch:"Ch3 Enzymes"},
{id:"catalyst",t:"catalyst",cn:"催化剂",ed:"A substance that increases the rate of a reaction and is unchanged at the end.",cd:"提高反应速率、反应结束后自身不变的物质。",ch:"Ch3 Enzymes"},
{id:"active_site",t:"active site",cn:"活性位点",ed:"The region of an enzyme where the substrate binds.",cd:"酶上与底物结合的区域。",ch:"Ch3 Enzymes"},
{id:"substrate",t:"substrate",cn:"底物",ed:"The substance an enzyme acts upon.",cd:"酶作用的物质。",ch:"Ch3 Enzymes"},
{id:"product",t:"product",cn:"产物",ed:"The substance formed by an enzyme-catalysed reaction.",cd:"酶催化反应生成的物质。",ch:"Ch3 Enzymes"},
{id:"activation_energy",t:"activation energy",cn:"活化能",ed:"The minimum energy needed to start a reaction.",cd:"启动反应所需的最低能量。",ch:"Ch3 Enzymes"},
{id:"induced_fit",t:"induced fit",cn:"诱导契合模型",ed:"The model where the active site changes shape to fit the substrate.",cd:"描述活性位点改变形状以适应底物的模型。",ch:"Ch3 Enzymes"},
{id:"enzyme_substrate_complex",t:"enzyme–substrate complex",cn:"酶–底物复合物",ed:"The temporary combination of enzyme and substrate at the active site.",cd:"酶与底物在活性位点暂时结合形成的复合物。",ch:"Ch3 Enzymes"},
{id:"enzyme_inhibitor",t:"enzyme inhibitor",cn:"酶抑制剂",ed:"A substance that slows down or stops enzyme activity.",cd:"减慢或阻止酶活性的物质。",ch:"Ch3 Enzymes"},
{id:"competitive_inhibitor",t:"competitive inhibitor",cn:"竞争性抑制剂",ed:"An inhibitor with a similar shape to the substrate, blocking the active site.",cd:"形状与底物相似、占据活性位点的抑制剂。",ch:"Ch3 Enzymes"},
{id:"non_competitive_inhibitor",t:"non-competitive inhibitor",cn:"非竞争性抑制剂",ed:"An inhibitor that binds away from the active site and changes its shape.",cd:"在活性位点以外结合、改变活性位点形状的抑制剂。",ch:"Ch3 Enzymes"},
{id:"cofactor",t:"cofactor",cn:"辅因子",ed:"A non-protein substance needed by some enzymes to work, such as a metal ion.",cd:"某些酶工作所需的非蛋白质物质，如金属离子。",ch:"Ch3 Enzymes"},
{id:"coenzyme",t:"coenzyme",cn:"辅酶",ed:"An organic cofactor, often a vitamin, that helps an enzyme.",cd:"有机辅因子，常为维生素，协助酶发挥作用。",ch:"Ch3 Enzymes"},
{id:"prosthetic_group",t:"prosthetic group",cn:"辅基",ed:"A cofactor permanently attached to an enzyme.",cd:"与酶永久结合的辅因子。",ch:"Ch3 Enzymes"},
{id:"optimum",t:"optimum",cn:"最适条件",ed:"The temperature or pH at which an enzyme works fastest.",cd:"酶催化速率最快的温度或pH条件。",ch:"Ch3 Enzymes"},
{id:"denaturation",t:"denaturation",cn:"变性",ed:"Permanent loss of an enzyme's shape so it can no longer function.",cd:"酶永久失去原有形状而丧失功能。",ch:"Ch3 Enzymes"},
{id:"vmax",t:"Vmax",cn:"最大反应速率",ed:"The maximum rate of an enzyme-catalysed reaction when the active sites are saturated.",cd:"活性位点被饱和时酶促反应的最大速率。",ch:"Ch3 Enzymes"},
{id:"immobilised_enzyme",t:"immobilised enzyme",cn:"固定化酶",ed:"An enzyme attached to a surface or trapped so it can be reused.",cd:"附着在表面或包埋起来、可重复使用的酶。",ch:"Ch3 Enzymes"},
{id:"amylase",t:"amylase",cn:"淀粉酶",ed:"An enzyme that breaks down starch into maltose.",cd:"把淀粉分解为麦芽糖的酶。",ch:"Ch3 Enzymes"},
{id:"catalase",t:"catalase",cn:"过氧化氢酶",ed:"An enzyme that breaks down hydrogen peroxide into water and oxygen.",cd:"把过氧化氢分解为水和氧气的酶。",ch:"Ch3 Enzymes"},
{id:"protease",t:"protease",cn:"蛋白酶",ed:"An enzyme that breaks down proteins into amino acids.",cd:"把蛋白质分解为氨基酸的酶。",ch:"Ch3 Enzymes"},
{id:"lipase",t:"lipase",cn:"脂肪酶",ed:"An enzyme that breaks down triglycerides into glycerol and fatty acids.",cd:"把甘油三酯分解为甘油和脂肪酸的酶。",ch:"Ch3 Enzymes"},
{id:"lactase",t:"lactase",cn:"乳糖酶",ed:"An enzyme that breaks down lactose into glucose and galactose.",cd:"把乳糖分解为葡萄糖和半乳糖的酶。",ch:"Ch3 Enzymes"},
{id:"temperature_coefficient",t:"temperature coefficient (Q10)",cn:"温度系数",ed:"The ratio of a reaction rate at one temperature to that 10 °C lower.",cd:"某一温度下反应速率与低10°C时速率的比值。",ch:"Ch3 Enzymes"},
/* ===== Ch4 Cell membranes & transport ===== */
{id:"phospholipid_bilayer",t:"phospholipid bilayer",cn:"磷脂双分子层",ed:"Two layers of phospholipids forming the basis of cell membranes.",cd:"两层磷脂构成细胞膜的基础。",ch:"Ch4 Cell membranes & transport"},
{id:"fluid_mosaic",t:"fluid mosaic model",cn:"流体镶嵌模型",ed:"The model of membranes with a fluid bilayer and proteins scattered in it.",cd:"描述膜内流体双层和散布蛋白质的膜结构模型。",ch:"Ch4 Cell membranes & transport"},
{id:"intrinsic_protein",t:"intrinsic protein",cn:"内在蛋白",ed:"A protein spanning across the whole membrane.",cd:"贯穿整个膜的蛋白质。",ch:"Ch4 Cell membranes & transport"},
{id:"extrinsic_protein",t:"extrinsic protein",cn:"外在蛋白",ed:"A protein attached to one surface of the membrane.",cd:"附着在膜一侧表面的蛋白质。",ch:"Ch4 Cell membranes & transport"},
{id:"glycoprotein",t:"glycoprotein",cn:"糖蛋白",ed:"A protein with a carbohydrate chain, used for cell recognition.",cd:"带糖链的蛋白质，用于细胞识别。",ch:"Ch4 Cell membranes & transport"},
{id:"glycolipid",t:"glycolipid",cn:"糖脂",ed:"A lipid with a carbohydrate chain, involved in cell recognition.",cd:"带糖链的脂质，参与细胞识别。",ch:"Ch4 Cell membranes & transport"},
{id:"cholesterol",t:"cholesterol",cn:"胆固醇",ed:"A lipid in animal membranes that reduces fluidity.",cd:"动物细胞膜中降低膜流动性的脂质。",ch:"Ch4 Cell membranes & transport"},
{id:"channel_protein",t:"channel protein",cn:"通道蛋白",ed:"A protein forming a pore for water-soluble substances in facilitated diffusion.",cd:"在易化扩散中为水溶性物质形成孔道的蛋白质。",ch:"Ch4 Cell membranes & transport"},

{id:"receptor",t:"receptor",cn:"受体",ed:"A protein on a cell that binds specific signalling molecules.",cd:"细胞上结合特定信号分子的蛋白质。",ch:"Ch4 Cell membranes & transport"},
{id:"diffusion",t:"diffusion",cn:"扩散",ed:"The net movement of particles from high to low concentration.",cd:"粒子从高浓度向低浓度的净移动。",ch:"Ch4 Cell membranes & transport"},
{id:"facilitated_diffusion",t:"facilitated diffusion",cn:"易化扩散",ed:"Diffusion through channel or carrier proteins, down a gradient and without energy.",cd:"借助通道或载体蛋白、顺浓度梯度且不耗能的扩散。",ch:"Ch4 Cell membranes & transport"},
{id:"osmosis",t:"osmosis",cn:"渗透",ed:"The net movement of water across a partially permeable membrane from higher to lower water potential.",cd:"水分子经部分透性膜从高水势向低水势的净移动。",ch:"Ch4 Cell membranes & transport"},
{id:"water_potential",t:"water potential",cn:"水势",ed:"A measure of the tendency of water to move; pure water has a value of zero.",cd:"衡量水移动趋势的量，纯水的水势为零。",ch:"Ch4 Cell membranes & transport"},
{id:"active_transport",t:"active transport",cn:"主动运输",ed:"Movement of substances against a concentration gradient, using ATP.",cd:"逆浓度梯度、消耗ATP运输物质的过程。",ch:"Ch4 Cell membranes & transport"},
{id:"endocytosis",t:"endocytosis",cn:"胞吞",ed:"Taking materials into a cell by forming vesicles from the membrane.",cd:"细胞膜内陷形成囊泡把物质吞入细胞的过程。",ch:"Ch4 Cell membranes & transport"},
{id:"exocytosis",t:"exocytosis",cn:"胞吐",ed:"Releasing materials from a cell by fusing vesicles with the membrane.",cd:"囊泡与细胞膜融合把物质排出细胞的过程。",ch:"Ch4 Cell membranes & transport"},
{id:"phagocytosis",t:"phagocytosis",cn:"吞噬作用",ed:"Endocytosis of solid particles, as by phagocytes.",cd:"细胞吞入固体颗粒的胞吞过程，如吞噬细胞。",ch:"Ch4 Cell membranes & transport"},

{id:"vesicle",t:"vesicle",cn:"囊泡",ed:"A small membrane sac used to transport materials in cells.",cd:"细胞中运输物质的小膜囊。",ch:"Ch4 Cell membranes & transport"},
{id:"surface_volume_ratio",t:"surface area to volume ratio",cn:"表面积与体积比",ed:"The ratio affecting the rate of exchange between a cell and its environment.",cd:"影响细胞与环境交换速率的比例。",ch:"Ch4 Cell membranes & transport"},

{id:"plasmolysis",t:"plasmolysis",cn:"质壁分离",ed:"Shrinkage of the cytoplasm away from the cell wall as a cell loses water.",cd:"细胞失水时细胞质与细胞壁分离的现象。",ch:"Ch4 Cell membranes & transport"},
{id:"saturation",t:"saturation",cn:"饱和",ed:"When all carrier proteins are busy, so the transport rate reaches a maximum.",cd:"所有载体蛋白都在工作、运输速率达到最大值。",ch:"Ch4 Cell membranes & transport"},
/* ===== Ch5 The mitotic cell cycle ===== */
{id:"cell_cycle",t:"cell cycle",cn:"细胞周期",ed:"The sequence of growth, DNA replication and division in a cell's life.",cd:"细胞一生中生长、DNA复制和分裂的序列。",ch:"Ch5 The mitotic cell cycle"},
{id:"interphase",t:"interphase",cn:"分裂间期",ed:"The stage when the cell grows, replicates DNA and prepares for division.",cd:"细胞生长、复制DNA并为分裂作准备的阶段。",ch:"Ch5 The mitotic cell cycle"},
{id:"mitosis",t:"mitosis",cn:"有丝分裂",ed:"Nuclear division producing two genetically identical daughter nuclei.",cd:"产生两个遗传相同子细胞核的分裂。",ch:"Ch5 The mitotic cell cycle"},
{id:"prophase",t:"prophase",cn:"前期",ed:"The first stage of mitosis when chromosomes condense and become visible.",cd:"有丝分裂第一阶段，染色体凝缩清晰可见。",ch:"Ch5 The mitotic cell cycle"},
{id:"metaphase",t:"metaphase",cn:"中期",ed:"The stage when chromosomes line up at the equator of the cell.",cd:"染色体排列在细胞赤道板的阶段。",ch:"Ch5 The mitotic cell cycle"},

{id:"telophase",t:"telophase",cn:"末期",ed:"The final stage when chromosomes arrive at the poles and new nuclear envelopes form.",cd:"染色体到达两极、形成新核膜的最终阶段。",ch:"Ch5 The mitotic cell cycle"},
{id:"cytokinesis",t:"cytokinesis",cn:"胞质分裂",ed:"The division of the cytoplasm to form two daughter cells.",cd:"细胞质分裂形成两个子细胞的过程。",ch:"Ch5 The mitotic cell cycle"},

{id:"chromatid",t:"chromatid",cn:"染色单体",ed:"One of the two identical halves of a replicated chromosome.",cd:"复制后染色体两个相同的一半之一。",ch:"Ch5 The mitotic cell cycle"},

{id:"homologous_pair",t:"homologous pair",cn:"同源染色体",ed:"A pair of chromosomes, one from each parent, carrying the same genes.",cd:"一条来自父方、一条来自母方、携带相同基因的染色体对。",ch:"Ch5 The mitotic cell cycle"},
{id:"sister_chromatid",t:"sister chromatid",cn:"姐妹染色单体",ed:"Two identical chromatids joined at the centromere.",cd:"在着丝粒处相连的两条相同染色单体。",ch:"Ch5 The mitotic cell cycle"},

{id:"s_phase",t:"S phase",cn:"S期",ed:"The part of interphase when DNA is replicated.",cd:"分裂间期中进行DNA复制的阶段。",ch:"Ch5 The mitotic cell cycle"},
{id:"cancer",t:"cancer",cn:"癌症",ed:"A disease of uncontrolled cell division forming tumours.",cd:"细胞分裂失控形成肿瘤的疾病。",ch:"Ch5 The mitotic cell cycle"},
{id:"tumour",t:"tumour",cn:"肿瘤",ed:"A mass of cells growing out of control.",cd:"细胞失控增殖形成的肿块。",ch:"Ch5 The mitotic cell cycle"},
{id:"daughter_cell",t:"daughter cell",cn:"子细胞",ed:"A cell formed by the division of a parent cell.",cd:"亲代细胞分裂产生的细胞。",ch:"Ch5 The mitotic cell cycle"},
{id:"genetically_identical",t:"genetically identical",cn:"遗传相同的",ed:"Having the same genes as the parent cell.",cd:"与亲代细胞具有相同基因的。",ch:"Ch5 The mitotic cell cycle"},
{id:"growth",t:"growth",cn:"生长",ed:"An increase in size brought about by cell division and expansion.",cd:"通过细胞分裂和增大而发生的体积增加。",ch:"Ch5 The mitotic cell cycle"},
{id:"repair",t:"repair",cn:"修复",ed:"The replacement of damaged cells by division of healthy cells.",cd:"健康细胞分裂替代受损细胞的过程。",ch:"Ch5 The mitotic cell cycle"},

{id:"stop_codon",t:"stop codon",cn:"终止密码子",ed:"A codon such as UAA, UAG or UGA that ends translation.",cd:"终止翻译的密码子，如UAA、UAG或UGA。",ch:"Ch6 Nucleic acids & protein synthesis"},
{id:"mutation",t:"mutation",cn:"突变",ed:"A change in the base sequence of DNA.",cd:"DNA碱基序列的改变。",ch:"Ch6 Nucleic acids & protein synthesis"},
{id:"base_substitution",t:"base substitution",cn:"碱基替换",ed:"Replacing one base with another in DNA.",cd:"DNA中一个碱基被另一个碱基替换。",ch:"Ch6 Nucleic acids & protein synthesis"},
{id:"frameshift",t:"frameshift mutation",cn:"移码突变",ed:"A change from deleting or inserting bases, shifting the reading frame.",cd:"碱基缺失或插入使阅读框移动的突变。",ch:"Ch6 Nucleic acids & protein synthesis"},
/* ===== Ch7 Transport in plants ===== */
{id:"xylem",t:"xylem",cn:"木质部",ed:"Plant tissue transporting water and mineral ions upwards, with lignified walls.",cd:"向上运输水和矿质离子、细胞壁木质化的植物组织。",ch:"Ch7 Transport in plants"},

{id:"cuticle",t:"cuticle",cn:"角质层",ed:"The waxy layer on leaves that reduces water loss.",cd:"叶表减少水分散失的蜡质层。",ch:"Ch7 Transport in plants"},
{id:"palisade_mesophyll",t:"palisade mesophyll",cn:"栅栏组织",ed:"The layer of tall cells where most photosynthesis occurs.",cd:"光合作用主要发生的柱状细胞层。",ch:"Ch7 Transport in plants"},
{id:"spongy_mesophyll",t:"spongy mesophyll",cn:"海绵组织",ed:"Loose cells with air spaces that allow gas diffusion in the leaf.",cd:"含气腔、便于气体在叶片内扩散的疏松细胞。",ch:"Ch7 Transport in plants"},
{id:"evaporation",t:"evaporation",cn:"蒸发",ed:"The change of liquid water into water vapour.",cd:"液态水变为水蒸气的过程。",ch:"Ch7 Transport in plants"},
{id:"sieve_tube",t:"sieve tube",cn:"筛管",ed:"Living cells in phloem with perforated end walls that transport sucrose.",cd:"韧皮部中端壁穿孔、运输蔗糖的活细胞。",ch:"Ch7 Transport in plants"},
{id:"companion_cell",t:"companion cell",cn:"伴胞",ed:"A cell providing energy and proteins to a neighbouring sieve tube.",cd:"为相邻筛管提供能量和蛋白质的细胞。",ch:"Ch7 Transport in plants"},
{id:"sieve_plate",t:"sieve plate",cn:"筛板",ed:"The perforated end wall between sieve tube cells.",cd:"筛管细胞之间穿孔的端壁。",ch:"Ch7 Transport in plants"},
{id:"translocation",t:"translocation",cn:"转运作用",ed:"The transport of sucrose and amino acids in the phloem.",cd:"韧皮部中蔗糖和氨基酸的运输。",ch:"Ch7 Transport in plants"},

{id:"sink",t:"sink",cn:"库",ed:"The site using or storing sucrose, such as roots, fruits and seeds.",cd:"利用或储存蔗糖的部位，如根、果实和种子。",ch:"Ch7 Transport in plants"},
{id:"mass_flow",t:"mass flow",cn:"集流",ed:"Bulk movement of solution driven by pressure differences.",cd:"由压力差驱动的溶液整体流动。",ch:"Ch7 Transport in plants"},
{id:"lignified",t:"lignified",cn:"木质化的",ed:"Strengthened and waterproofed by lignin, as in xylem vessels.",cd:"被木质素强化并防水处理的，如木质部导管。",ch:"Ch7 Transport in plants"},
{id:"mineral_ions",t:"mineral ions",cn:"矿质离子",ed:"Dissolved ions such as nitrate and magnesium taken up by roots.",cd:"根吸收的溶解离子，如硝酸根和镁离子。",ch:"Ch7 Transport in plants"},
{id:"active_uptake",t:"active uptake",cn:"主动吸收",ed:"Absorption of mineral ions by active transport into the root.",cd:"通过主动运输把矿质离子吸收进根内。",ch:"Ch7 Transport in plants"},
{id:"water_potential_gradient",t:"water potential gradient",cn:"水势梯度",ed:"The difference in water potential driving water movement.",cd:"驱动水分移动的水势差异。",ch:"Ch7 Transport in plants"},
/* ===== Ch8 Transport in mammals ===== */
{id:"circulatory_system",t:"circulatory system",cn:"循环系统",ed:"The heart and blood vessels that transport materials around the body.",cd:"由心脏和血管组成、运送物质到全身的系统。",ch:"Ch8 Transport in mammals"},
{id:"double_circulation",t:"double circulation",cn:"双循环",ed:"Blood passes through the heart twice per circuit: pulmonary and systemic.",cd:"血液每绕一圈两次经过心脏：肺循环和体循环。",ch:"Ch8 Transport in mammals"},
{id:"atrium",t:"atrium",cn:"心房",ed:"The upper chambers of the heart that receive blood.",cd:"心脏上部接收血液的腔室。",ch:"Ch8 Transport in mammals"},
{id:"ventricle",t:"ventricle",cn:"心室",ed:"The lower chambers of the heart that pump blood out.",cd:"心脏下部泵出血液的腔室。",ch:"Ch8 Transport in mammals"},
{id:"septum",t:"septum",cn:"室间隔",ed:"The muscular wall separating the left and right sides of the heart.",cd:"把心脏左右两侧分开的肌肉壁。",ch:"Ch8 Transport in mammals"},
{id:"atrioventricular_valve",t:"atrioventricular valve",cn:"房室瓣",ed:"A valve between atrium and ventricle preventing backflow.",cd:"心房与心室之间防止血液倒流的瓣膜。",ch:"Ch8 Transport in mammals"},
{id:"semilunar_valve",t:"semilunar valve",cn:"半月瓣",ed:"A valve at the exit of the ventricles into the arteries.",cd:"心室出口处通向动脉的半月形瓣膜。",ch:"Ch8 Transport in mammals"},

{id:"vena_cava",t:"vena cava",cn:"腔静脉",ed:"The large vein returning blood from the body to the right atrium.",cd:"把全身血液送回右心房的大静脉。",ch:"Ch8 Transport in mammals"},
{id:"pulmonary_artery",t:"pulmonary artery",cn:"肺动脉",ed:"The artery carrying deoxygenated blood from the heart to the lungs.",cd:"把缺氧血从心脏送往肺的动脉。",ch:"Ch8 Transport in mammals"},
{id:"pulmonary_vein",t:"pulmonary vein",cn:"肺静脉",ed:"The vein carrying oxygenated blood from the lungs to the heart.",cd:"把含氧血从肺送回心脏的静脉。",ch:"Ch8 Transport in mammals"},
{id:"coronary_artery",t:"coronary artery",cn:"冠状动脉",ed:"An artery supplying the heart muscle with oxygen.",cd:"为心肌供氧的动脉。",ch:"Ch8 Transport in mammals"},
{id:"artery",t:"artery",cn:"动脉",ed:"A thick-walled vessel carrying blood away from the heart, usually oxygenated.",cd:"把血液送出心脏的厚壁血管，通常含氧。",ch:"Ch8 Transport in mammals"},
{id:"vein",t:"vein",cn:"静脉",ed:"A vessel carrying blood towards the heart, with valves.",cd:"把血液送回心脏、带有瓣膜的血管。",ch:"Ch8 Transport in mammals"},

{id:"smooth_muscle",t:"smooth muscle",cn:"平滑肌",ed:"Muscle in vessel walls that controls their diameter.",cd:"血管壁中控制血管直径的肌肉。",ch:"Ch8 Transport in mammals"},
{id:"endothelium",t:"endothelium",cn:"内皮",ed:"The single layer of cells lining blood vessels.",cd:"衬在血管内壁的单层细胞。",ch:"Ch8 Transport in mammals"},
{id:"red_blood_cell",t:"red blood cell",cn:"红细胞",ed:"A biconcave cell containing haemoglobin that carries oxygen.",cd:"含血红蛋白、运输氧气的双凹形细胞。",ch:"Ch8 Transport in mammals"},
{id:"haemoglobin",t:"haemoglobin",cn:"血红蛋白",ed:"The pigment in red blood cells that combines reversibly with oxygen.",cd:"红细胞中可逆地结合氧气的色素。",ch:"Ch8 Transport in mammals"},
{id:"platelet",t:"platelet",cn:"血小板",ed:"Small fragments in blood involved in clotting.",cd:"参与凝血的血液小碎片。",ch:"Ch8 Transport in mammals"},
{id:"plasma",t:"plasma",cn:"血浆",ed:"The liquid part of blood carrying cells, nutrients and waste.",cd:"血液中运输细胞、营养和废物的液体部分。",ch:"Ch8 Transport in mammals"},
{id:"tissue_fluid",t:"tissue fluid",cn:"组织液",ed:"The fluid formed from plasma that bathes cells.",cd:"由血浆形成、浸浴细胞的液体。",ch:"Ch8 Transport in mammals"},

{id:"cardiac_cycle",t:"cardiac cycle",cn:"心动周期",ed:"The sequence of systole and diastole of the heart.",cd:"心脏收缩与舒张的循环过程。",ch:"Ch8 Transport in mammals"},
{id:"systole",t:"systole",cn:"收缩期",ed:"The contraction phase of the cardiac cycle.",cd:"心动周期中的收缩阶段。",ch:"Ch8 Transport in mammals"},
{id:"diastole",t:"diastole",cn:"舒张期",ed:"The relaxation phase when the heart refills with blood.",cd:"心脏舒张、重新充盈血液的阶段。",ch:"Ch8 Transport in mammals"},
/* ===== Ch9 Gas exchange & smoking ===== */
{id:"gas_exchange",t:"gas exchange",cn:"气体交换",ed:"The diffusion of oxygen and carbon dioxide across a respiratory surface.",cd:"氧气和二氧化碳在呼吸表面上的扩散。",ch:"Ch9 Gas exchange & smoking"},
{id:"alveolus",t:"alveolus",cn:"肺泡",ed:"A tiny air sac in the lungs with a large surface for gas exchange.",cd:"肺内具有大气体交换表面积的微小气囊。",ch:"Ch9 Gas exchange & smoking"},
{id:"surfactant",t:"surfactant",cn:"表面活性物质",ed:"A substance lining alveoli that reduces surface tension.",cd:"衬在肺泡内、降低表面张力的物质。",ch:"Ch9 Gas exchange & smoking"},
{id:"ventilation",t:"ventilation",cn:"通气",ed:"The movement of air into and out of the lungs by inspiration and expiration.",cd:"通过吸气和呼气使空气进出肺部的过程。",ch:"Ch9 Gas exchange & smoking"},
{id:"inspiration",t:"inspiration",cn:"吸气",ed:"Drawing air into the lungs as the diaphragm contracts.",cd:"膈肌收缩把空气吸入肺部的过程。",ch:"Ch9 Gas exchange & smoking"},
{id:"expiration",t:"expiration",cn:"呼气",ed:"Pushing air out of the lungs as the diaphragm relaxes.",cd:"膈肌舒张把空气排出肺部的过程。",ch:"Ch9 Gas exchange & smoking"},
{id:"intercostal_muscle",t:"intercostal muscle",cn:"肋间肌",ed:"Muscles between the ribs that move the rib cage during breathing.",cd:"肋骨间在呼吸时移动胸廓的肌肉。",ch:"Ch9 Gas exchange & smoking"},
{id:"diaphragm",t:"diaphragm",cn:"膈",ed:"The dome-shaped muscle separating thorax and abdomen, central to breathing.",cd:"分隔胸腔与腹腔、呼吸中关键的穹顶形肌肉。",ch:"Ch9 Gas exchange & smoking"},
{id:"trachea",t:"trachea",cn:"气管",ed:"The windpipe reinforced by C-shaped cartilage rings.",cd:"由C形软骨环支撑的气道。",ch:"Ch9 Gas exchange & smoking"},

{id:"bronchiole",t:"bronchiole",cn:"细支气管",ed:"Small air passages in the lungs that lead to alveoli.",cd:"肺中通向肺泡的小气道。",ch:"Ch9 Gas exchange & smoking"},
{id:"pleural_membrane",t:"pleural membrane",cn:"胸膜",ed:"The membranes lining the chest wall and lungs, allowing smooth movement.",cd:"衬于胸壁和肺表面、使肺平滑运动的膜。",ch:"Ch9 Gas exchange & smoking"},
{id:"tidal_volume",t:"tidal volume",cn:"潮气量",ed:"The volume of air breathed in and out in one normal breath.",cd:"平静呼吸时每次吸入和呼出的空气量。",ch:"Ch9 Gas exchange & smoking"},
{id:"vital_capacity",t:"vital capacity",cn:"肺活量",ed:"The maximum volume of air that can be breathed out after a maximum breath in.",cd:"尽力吸气后能呼出的最大空气量。",ch:"Ch9 Gas exchange & smoking"},
{id:"spirometer",t:"spirometer",cn:"肺活量计",ed:"An instrument that measures volumes of air breathed in and out.",cd:"测量吸气和呼气量的仪器。",ch:"Ch9 Gas exchange & smoking"},

{id:"emphysema",t:"emphysema",cn:"肺气肿",ed:"Lung damage with reduced surface area for gas exchange, from smoking.",cd:"吸烟导致肺泡表面积减少、气体交换受损的肺病。",ch:"Ch9 Gas exchange & smoking"},
{id:"chronic_bronchitis",t:"chronic bronchitis",cn:"慢性支气管炎",ed:"Long-term inflammation of the bronchi, common in smokers.",cd:"吸烟者常见的支气管长期炎症。",ch:"Ch9 Gas exchange & smoking"},
{id:"ciliated_epithelium",t:"ciliated epithelium",cn:"纤毛上皮",ed:"Cells with cilia that sweep mucus out of the airways.",cd:"用纤毛把黏液扫出气道的细胞层。",ch:"Ch9 Gas exchange & smoking"},
{id:"goblet_cell",t:"goblet cell",cn:"杯状细胞",ed:"A cell that secretes mucus in the airways.",cd:"在气道中分泌黏液的细胞。",ch:"Ch9 Gas exchange & smoking"},
{id:"mucus",t:"mucus",cn:"黏液",ed:"A sticky fluid that traps dust and pathogens in the airways.",cd:"在气道中黏住灰尘和病原体的黏性液体。",ch:"Ch9 Gas exchange & smoking"},
{id:"partial_pressure",t:"partial pressure",cn:"分压",ed:"The pressure exerted by one gas in a mixture, driving diffusion.",cd:"混合气体中某一气体产生的压力，驱动扩散。",ch:"Ch9 Gas exchange & smoking"},
/* ===== Ch10 Infectious disease ===== */
{id:"pathogen",t:"pathogen",cn:"病原体",ed:"A microorganism that causes disease.",cd:"引起疾病的微生物。",ch:"Ch10 Infectious disease"},
{id:"bacteria",t:"bacteria",cn:"细菌",ed:"Single-celled prokaryotes, some of which cause disease.",cd:"单细胞原核生物，部分能引起疾病。",ch:"Ch10 Infectious disease"},
{id:"virus",t:"virus",cn:"病毒",ed:"A non-cellular infectious agent that reproduces inside host cells.",cd:"在宿主细胞内繁殖的非细胞病原体。",ch:"Ch10 Infectious disease"},
{id:"fungus",t:"fungus",cn:"真菌",ed:"A eukaryotic organism with chitin cell walls, some cause disease.",cd:"细胞壁含几丁质的真核生物，部分致病。",ch:"Ch10 Infectious disease"},
{id:"protozoan",t:"protozoan",cn:"原生动物",ed:"A single-celled eukaryotic pathogen, such as the malaria parasite.",cd:"单细胞真核病原体，如疟原虫。",ch:"Ch10 Infectious disease"},
{id:"transmission",t:"transmission",cn:"传播",ed:"The way a pathogen spreads from one host to another.",cd:"病原体从一个宿主传到另一个宿主的途径。",ch:"Ch10 Infectious disease"},
{id:"droplet_infection",t:"droplet infection",cn:"飞沫感染",ed:"Spread by tiny droplets in the air when an infected person coughs or sneezes.",cd:"感染者咳嗽或打喷嚏时经空气飞沫传播。",ch:"Ch10 Infectious disease"},
{id:"vector",t:"vector",cn:"传播媒介",ed:"An organism, such as a mosquito, that carries a pathogen between hosts.",cd:"在宿主之间携带病原体的生物，如蚊子。",ch:"Ch10 Infectious disease"},
{id:"contaminated",t:"contaminated",cn:"受污染的",ed:"Made impure or infected, such as water with faeces.",cd:"被弄脏或感染的，如被粪便污染的水。",ch:"Ch10 Infectious disease"},
{id:"antibiotics",t:"antibiotics",cn:"抗生素",ed:"Substances that kill bacteria or stop them growing.",cd:"能杀死细菌或抑制其生长的物质。",ch:"Ch10 Infectious disease"},
{id:"antibiotic_resistance",t:"antibiotic resistance",cn:"抗生素耐药性",ed:"The ability of bacteria to survive antibiotics, selected for by natural selection.",cd:"细菌在抗生素存在下存活的能力，经自然选择产生。",ch:"Ch10 Infectious disease"},
{id:"mrsa",t:"MRSA",cn:"耐甲氧西林金黄色葡萄球菌",ed:"A strain of Staphylococcus aureus resistant to methicillin.",cd:"对甲氧西林耐药的金黄色葡萄球菌菌株。",ch:"Ch10 Infectious disease"},
{id:"penicillin",t:"penicillin",cn:"青霉素",ed:"An antibiotic made by the fungus Penicillium.",cd:"由青霉菌产生的抗生素。",ch:"Ch10 Infectious disease"},
{id:"epidemic",t:"epidemic",cn:"流行病",ed:"A rapid spread of disease through many people in a region.",cd:"疾病在某一地区迅速蔓延、感染许多人。",ch:"Ch10 Infectious disease"},
{id:"pandemic",t:"pandemic",cn:"大流行",ed:"An epidemic spreading over several countries or the world.",cd:"蔓延到多国或全球的流行病。",ch:"Ch10 Infectious disease"},
{id:"cholera",t:"cholera",cn:"霍乱",ed:"A disease caused by Vibrio cholerae, leading to severe diarrhoea.",cd:"由霍乱弧菌引起、导致严重腹泻的疾病。",ch:"Ch10 Infectious disease"},
{id:"tuberculosis",t:"tuberculosis",cn:"结核病",ed:"A lung disease caused by Mycobacterium tuberculosis.",cd:"由结核分枝杆菌引起的肺部疾病。",ch:"Ch10 Infectious disease"},
{id:"hiv",t:"HIV",cn:"人类免疫缺陷病毒",ed:"A virus that attacks helper T cells and can cause AIDS.",cd:"攻击辅助性T细胞、可导致艾滋病的病毒。",ch:"Ch10 Infectious disease"},
{id:"aids",t:"AIDS",cn:"艾滋病",ed:"Acquired immune deficiency syndrome caused by HIV.",cd:"由HIV引起的获得性免疫缺陷综合征。",ch:"Ch10 Infectious disease"},
{id:"malaria",t:"malaria",cn:"疟疾",ed:"A disease caused by Plasmodium, transmitted by mosquitoes.",cd:"由疟原虫引起、经蚊子传播的疾病。",ch:"Ch10 Infectious disease"},
{id:"vaccination",t:"vaccination",cn:"接种疫苗",ed:"Giving a vaccine to make the body immune to a disease.",cd:"接种疫苗使身体对疾病产生免疫力。",ch:"Ch10 Infectious disease"},
{id:"hygiene",t:"hygiene",cn:"卫生",ed:"Practices that reduce the spread of disease, such as washing hands.",cd:"减少疾病传播的做法，如洗手。",ch:"Ch10 Infectious disease"},
{id:"quarantine",t:"quarantine",cn:"隔离检疫",ed:"Separating infected or exposed people to stop the spread of disease.",cd:"把感染者或接触者隔离开以阻止疾病传播。",ch:"Ch10 Infectious disease"},
{id:"antiviral",t:"antiviral drug",cn:"抗病毒药物",ed:"A drug that inhibits the reproduction of viruses.",cd:"抑制病毒繁殖的药物。",ch:"Ch10 Infectious disease"},
/* ===== Ch11 Immunity ===== */
{id:"immune_system",t:"immune system",cn:"免疫系统",ed:"The body's defences against pathogens, including cells and proteins.",cd:"身体抵御病原体的防御体系，包括细胞和蛋白质。",ch:"Ch11 Immunity"},
{id:"phagocyte",t:"phagocyte",cn:"吞噬细胞",ed:"A white blood cell that engulfs and digests pathogens.",cd:"吞入并消化病原体的白细胞。",ch:"Ch11 Immunity"},
{id:"antigen",t:"antigen",cn:"抗原",ed:"A molecule on a pathogen's surface that triggers an immune response.",cd:"病原体表面引起免疫反应的分子。",ch:"Ch11 Immunity"},
{id:"antibody",t:"antibody",cn:"抗体",ed:"A protein made by lymphocytes that binds specifically to an antigen.",cd:"淋巴细胞产生、特异性结合抗原的蛋白质。",ch:"Ch11 Immunity"},
{id:"lymphocyte",t:"lymphocyte",cn:"淋巴细胞",ed:"A white blood cell that produces antibodies, including B and T cells.",cd:"产生抗体的白细胞，包括B细胞和T细胞。",ch:"Ch11 Immunity"},
{id:"b_cell",t:"B cell",cn:"B细胞",ed:"A lymphocyte that makes antibodies against a specific antigen.",cd:"针对特定抗原产生抗体的淋巴细胞。",ch:"Ch11 Immunity"},
{id:"t_cell",t:"T cell",cn:"T细胞",ed:"A lymphocyte that coordinates the immune response or kills infected cells.",cd:"协调免疫反应或杀伤被感染细胞的淋巴细胞。",ch:"Ch11 Immunity"},
{id:"plasma_cell",t:"plasma cell",cn:"浆细胞",ed:"A B cell that secretes large amounts of antibody.",cd:"大量分泌抗体的B细胞。",ch:"Ch11 Immunity"},
{id:"memory_cell",t:"memory cell",cn:"记忆细胞",ed:"A long-lived cell giving rapid response to a second infection.",cd:"对再次感染能快速反应的长寿命细胞。",ch:"Ch11 Immunity"},
{id:"agglutination",t:"agglutination",cn:"凝集",ed:"Clumping of pathogens by antibodies so they are easier to destroy.",cd:"抗体使病原体凝集成团、更易被清除。",ch:"Ch11 Immunity"},
{id:"antigen_antibody_complex",t:"antigen–antibody complex",cn:"抗原–抗体复合物",ed:"The structure formed when an antibody binds to its antigen.",cd:"抗体与其抗原结合形成的结构。",ch:"Ch11 Immunity"},
{id:"active_immunity",t:"active immunity",cn:"主动免疫",ed:"Immunity from antibodies the body makes itself after infection or vaccination.",cd:"机体感染或接种后自身产生抗体的免疫。",ch:"Ch11 Immunity"},
{id:"passive_immunity",t:"passive immunity",cn:"被动免疫",ed:"Immunity from antibodies received from outside, such as from the mother.",cd:"从体外获得抗体而得到的免疫，如来自母体。",ch:"Ch11 Immunity"},
{id:"natural_immunity",t:"natural immunity",cn:"天然免疫",ed:"Immunity acquired through natural means, such as infection.",cd:"通过自然途径获得的免疫，如感染。",ch:"Ch11 Immunity"},

var K_NAME="BM9700Name",K_GOAL="BM9700Goal",K_P="BM9700Progress",K_PENDING="BM9700Pending";
function tStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function defP(){return {name:"",updated:"",goal:10,day:"",todayIds:[],learnedIds:[],quizToday:0,quizTodayC:0,quizTotal:0,quizTotalC:0,wrong:[],wrongSent:[],history:[]};}
function gP(){try{var p=JSON.parse(localStorage.getItem(K_P));if(p&&typeof p==="object")return p;}catch(e){}return defP();}
function sP(p){try{localStorage.setItem(K_P,JSON.stringify(p));}catch(e){}}
function newDay(){var p=gP();var t=tStr();if(p.day!==t){if(p.day)p.history.push({d:p.day,g:p.goal,l:p.todayIds.length,q:p.quizToday,qc:p.quizTodayC});if(p.history.length>60)p.history.shift();p.day=t;p.todayIds=[];p.quizToday=0;p.quizTodayC=0;sP(p);}return p;}
function gW(p){return p.wrong;}
function addWrong(p,id){for(var i=0;i<p.wrong.length;i++){if(p.wrong[i].id===id){p.wrong[i].n++;return;}}p.wrong.push({id:id,n:1});}
function decWrong(p,id){for(var i=0;i<p.wrong.length;i++){if(p.wrong[i].id===id){p.wrong[i].n--;if(p.wrong[i].n<=0)p.wrong.splice(i,1);return;}}}
function addWrongSent(p,id){for(var i=0;i<p.wrongSent.length;i++){if(p.wrongSent[i].id===id){p.wrongSent[i].n++;return;}}p.wrongSent.push({id:id,n:1});}
function decWrongSent(p,id){for(var i=0;i<p.wrongSent.length;i++){if(p.wrongSent[i].id===id){p.wrongSent[i].n--;if(p.wrongSent[i].n<=0)p.wrongSent.splice(i,1);return;}}}
function sById(id){for(var i=0;i<SENTS.length;i++){if(SENTS[i].id===id)return SENTS[i];}return null;}
function wById(id){for(var i=0;i<WORDS.length;i++){if(WORDS[i].id===id)return WORDS[i];}return null;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function grpName(w){return String(w.ch||"").replace(/^Ch\d+\s*/,"");} /* "Ch1 Cells" -> "Cells" */

/* ======= 登录门 ======= */
function bioLoadName(){BIO_STUDENT=localStorage.getItem(K_NAME)||"";}
function bioAskName(){
  bioLoadName();
  if(BIO_STUDENT){
    var inAllow=false;
    for(var i=0;i<BIO_ALLOW.length;i++){if(BIO_ALLOW[i].toLowerCase()===BIO_STUDENT.toLowerCase()){inAllow=true;break;}}
    if(inAllow){return;}
    BIO_STUDENT="";
    try{localStorage.removeItem(K_NAME);}catch(e){}
  }
  var g=document.getElementById("bioNameGate");
  if(!g){
    g=document.createElement("div");g.id="bioNameGate";
    g.innerHTML='<div class=bx><h2>🧠 BioMemo9700</h2><p>请输入你的名字<br><span style="font-size:0.72rem">每日背词、Quiz 检测，进度同步云端</span></p><input id="bioNameInp" maxlength="20" placeholder="请输入你的名字" autocomplete="off"><div id="bioNameErr" style="display:none;color:var(--wrong);font-size:0.8rem;margin-top:10px;text-align:center;font-weight:600"></div><button class="btn bp bio-btn" onclick="bioSetName()">🚀 开始</button></div>';
    document.body.appendChild(g);
    var inp=document.getElementById("bioNameInp");
    if(inp){inp.focus();inp.addEventListener("keydown",function(e){if(e.key==="Enter")bioSetName();});}
  }
  g.style.display="flex";
}
function bioSetName(){
  var v=(document.getElementById("bioNameInp").value||"").trim();
  if(!v)return;
  var canon=null;
  for(var i=0;i<BIO_ALLOW.length;i++){if(BIO_ALLOW[i].toLowerCase()===v.toLowerCase()){canon=BIO_ALLOW[i];break;}}
  if(!canon){
    var err=document.getElementById("bioNameErr");
    if(err){err.style.display="block";err.textContent="⚠️ 仅限指定同学使用";}
    return;
  }
  BIO_STUDENT=canon;
  try{localStorage.setItem(K_NAME,canon);}catch(e){}
  var g=document.getElementById("bioNameGate");if(g)g.style.display="none";
  var p=gP();p.name=canon;sP(p);
  renderHome();
  bioPushNow();
}
function bioLogout(){BIO_STUDENT="";try{localStorage.removeItem(K_NAME);}catch(e){}renderHome();bioAskName();}

  h+='<div class="card"><h3>📖 开始学习</h3>';
  h+='<p class="small">单词按单元先后顺序学习：先学完 Ch1 再学 Ch2…，不会打乱。</p>';
  h+='<p class="small" style="margin-top:10px">学习范围：</p><select id="bmSUnit" style="margin-top:6px">';
  h+='<option value="all">全部单元（按先后顺序）</option>';
  for(var i=0;i<GRP.length;i++){
    var nNew=0;
    for(var j=0;j<WORDS.length;j++){if(grpName(WORDS[j])===GRP[i][1]&&p.learnedIds.indexOf(WORDS[j].id)<0)nNew++;}
    h+='<option value="'+i+'">'+GRP[i][2]+' '+GRP[i][1]+'（还剩 '+nNew+' 个新词）</option>';
  }
  h+='</select>';
  h+='<div class="btn-row"><button class="btn" onclick="bmStudyGo()">🚀 开始学习</button><button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  document.getElementById("pc").innerHTML=h;
}
function bmStudyGo(){
  var p=newDay();var goal=Math.max(1,Math.min(30,parseInt(p.goal)||10));
  var sel=document.getElementById("bmSUnit");
  var unit=(sel&&sel.value!=="")?sel.value:"all";
  var ch=null;
  if(unit!=="all")ch=GRP[parseInt(unit)][1];
  /* 新词按单元顺序（WORDS 本身就是按单元排的），不打乱 */
  var newW=[];
  for(var i=0;i<WORDS.length;i++){var w=WORDS[i];if(ch&&grpName(w)!==ch)continue;if(p.learnedIds.indexOf(w.id)<0)newW.push(w);}
  var take=newW.slice(0,goal);
  /* 复习错词（限同一单元/全部），按单元顺序排在最后 */
  var review=[];
  for(var k=0;k<p.wrong.length;k++){var rw=wById(p.wrong[k].id);if(rw&&(!ch||grpName(rw)===ch))review.push(rw);}
  var ids={};for(var m=0;m<take.length;m++)ids[take[m].id]=1;
  review=review.filter(function(w){return !ids[w.id];});
  review.sort(function(a,b){return WORDS.indexOf(a)-WORDS.indexOf(b);});
  var deck=take.concat(review);
  if(!deck.length){
    var msg=(ch?("「"+GRP[parseInt(unit)][2]+" "+ch+"」"):"今天")+"的词都背完啦！";
    document.getElementById("pc").innerHTML='<div class="card empty"><div class="big">🎉 '+msg+'</div><span class="small">明天再来，或去 Quiz 检测 / 错词本复习。</span><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';
    return;
  }
  bmStudy={deck:deck,i:0,known:0,unknown:0,flipped:false};
  bmCard();
}
function bmCard(){
  var s=bmStudy;if(!s)return;
  var w=s.deck[s.i];
  var pc=document.getElementById("pc");
  var h="";
  h+='<div class="card"><h3>📖 学习闪卡</h3>';
  h+='<div class="flash">';
  h+='<span class="meta">'+esc(w.ch)+'</span>';
  h+='<span class="prog">'+(s.i+1)+'/'+s.deck.length+'</span>';
  h+='<div class="term">'+esc(w.t)+'</div>';
  if(s.flipped){
    h+='<div class="reveal"><div class="cn">'+esc(w.cn)+'</div>';
    h+='<div class="def">📘 '+esc(w.ed)+'</div>';
    h+='<div class="def">📖 <b>'+esc(w.cd)+'</b></div></div>';
    h+='<div class="btn-row" style="margin-top:18px">';
    h+='<button class="btn green" onclick="bmGrade(true)">✅ 认识</button>';
    h+='<button class="btn red" onclick="bmGrade(false)">❌ 不认识</button>';
    h+='</div>';
  }else{
    h+='<div class="small" style="margin:6px 0">回忆一下它的中文意思，然后点翻转查看</div>';
    h+='<div class="btn-row" style="margin-top:18px">';
    h+='<button class="btn" onclick="bmFlip()">🔄 翻转查看</button>';
    h+='</div>';
  }
  h+='</div></div>';
  h+='<div class="btn-row"><button class="btn gray" onclick="renderHome()">↩️ 退出学习</button></div>';
  pc.innerHTML=h;
}
function bmFlip(){if(bmStudy)bmStudy.flipped=true;bmCard();}
function bmGrade(know){
  var s=bmStudy;if(!s)return;
  var w=s.deck[s.i];
  var p=newDay();
  if(know){
    if(p.todayIds.indexOf(w.id)<0)p.todayIds.push(w.id);
    if(p.learnedIds.indexOf(w.id)<0)p.learnedIds.push(w.id);
    decWrong(p,w.id);
    s.known++;
  }else{
    addWrong(p,w.id);
    s.unknown++;
  }
  sP(p);
  s.i++;s.flipped=false;
  if(s.i>=s.deck.length){
    var pc=document.getElementById("pc");
    pc.innerHTML='<div class="card"><h3>📖 学习完成</h3><div class="summary">本组 '+s.deck.length+' 张 · 认识 '+s.known+' · 新记错词 '+s.unknown+'</div>';
    pc.innerHTML+='<div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button><button class="btn orange" onclick="bmQuizSetup()">马上 Quiz 检测</button></div></div>';
    bioPushNow();
    return;
  }
  bmCard();
}

/* ======= Quiz ======= */
var bmQuiz=null;
function bmQuizSetup(){
  var p=newDay();
  var h="";
  h+='<div class="card"><h3>📝 Quiz 检测</h3>';
  h+='<p class="small">选择检测范围：</p><select id="bmQScope" style="margin-top:8px">';
  h+='<option value="today">本次学习词（今日已背 '+p.todayIds.length+'）</option>';
  h+='<option value="learned">全部已学词（'+p.learnedIds.length+'）</option>';
  h+='<option value="wrong">错词本（'+p.wrong.length+'）</option>';
  h+='<option value="all">全部词库（'+WORDS.length+'）</option>';
  h+='</select>';
  h+='<p class="small" style="margin-top:12px">题目数：</p><select id="bmQNum" style="margin-top:8px">';
  h+='<option value="10">10 题</option><option value="20">20 题</option><option value="0">全部</option>';
  h+='</select>';
  h+='<p class="small" style="margin-top:12px">题型：</p><select id="bmQType" style="margin-top:8px">';
  h+='<option value="mix">混合（单词 + 翻译句）</option><option value="word">仅单词</option><option value="sent">仅翻译句</option>';
  h+='</select>';
  h+='<p class="small" style="margin-top:12px">单词题方向随机；翻译句题给出英文答题句，请选出正确的中文翻译</p>';
  h+='<div class="btn-row"><button class="btn" onclick="bmQuizGo()">🚀 开始测验</button><button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  document.getElementById("pc").innerHTML=h;
}
function bmQuizGo(){
  var p=newDay();
  var scEl=document.getElementById("bmQScope");var scope=scEl?scEl.value:"wrong";
  var qEl=document.getElementById("bmQNum");var qn=qEl?(parseInt(qEl.value)||10):0;
  var tyEl=document.getElementById("bmQType");var qtype=tyEl?tyEl.value:"mix";
  var pool=[];
  if(qtype!=="sent"){
    var wordIds=[];
    if(scope==="today")wordIds=p.todayIds.slice();
    else if(scope==="learned")wordIds=p.learnedIds.slice();
    else if(scope==="wrong")wordIds=p.wrong.map(function(e){return e.id;});
    else wordIds=WORDS.map(function(w){return w.id;});
    for(var a=0;a<wordIds.length;a++){var w=wById(wordIds[a]);if(w)pool.push({t:"w",id:w.id});}
  }
  if(qtype!=="word"){
    var sentIds=[];
    if(scope==="today"||scope==="learned"||scope==="all")sentIds=SENTS.map(function(s){return s.id;});
    else if(scope==="wrong")sentIds=p.wrongSent.map(function(e){return e.id;});
    for(var b=0;b<sentIds.length;b++){var s=sById(sentIds[b]);if(s)pool.push({t:"s",id:s.id});}
  }
  shuffle(pool);
  if(qn>0&&pool.length>qn)pool=pool.slice(0,qn);
  if(!pool.length){document.getElementById("pc").innerHTML='<div class="card empty"><div class="big">📭 这个范围还没有内容</div><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';return;}
  bmQuiz={pool:pool,i:0,total:pool.length,correct:0};
  bmQuizQ();
}

function bmQuizQ(){
  var q=bmQuiz;if(!q)return;
  var it=q.pool[q.i];
  var pc=document.getElementById("pc");
  var h="";
  h+='<div class="card"><h3>📝 Quiz 检测</h3>';
  h+='<span class="small">第 '+(q.i+1)+'/'+q.total+' 题 · 当前答对 '+q.correct+'</span>';
  h+=(it.t==="s")?bmQuizSent(it):bmQuizWord(it);
  pc.innerHTML=h;
}
function bmQuizWord(it){
  var w=wById(it.id);if(!w)return "";
  var dir=Math.random()<0.5?"toCN":"toEN";
  var correct=dir==="toCN"?w.cn:w.t;
  var opts=[correct];
  var others=WORDS.filter(function(x){return x.id!==w.id && (dir==="toCN"?x.cn!==correct:x.t!==correct);});
  shuffle(others);
  for(var i=0;i<others.length&&opts.length<4;i++){var o=dir==="toCN"?others[i].cn:others[i].t;if(opts.indexOf(o)<0)opts.push(o);}
  shuffle(opts);
  var h="";
  h+='<div class="flash"><span class="meta">'+esc(w.ch)+'</span>';
  h+='<div class="term">'+(dir==="toCN"?esc(w.t):esc(w.cn))+'</div>';
  h+='<div class="small">'+(dir==="toCN"?"请选出它的中文意思":"请选出对应的英文词")+'</div>';
  h+='<div style="width:100%;margin-top:14px">';
  for(var k=0;k<opts.length;k++){
    h+='<button class="opt" data-ok="'+(opts[k]===correct?"1":"0")+'" data-id="'+esc(w.id)+'" data-ty="w" onclick="bmQuizAnswer(this,'+(opts[k]===correct)+')">'+esc(opts[k])+'</button>';
  }
  h+='</div></div>';
  return h;
}
function bmQuizSent(it){
  var s=sById(it.id);if(!s)return "";
  var correct=s.cn;
  var opts=[correct];
  var others=SENTS.filter(function(x){return x.id!==s.id&&x.cn!==correct;});
  shuffle(others);
  for(var i=0;i<others.length&&opts.length<4;i++){if(opts.indexOf(others[i].cn)<0)opts.push(others[i].cn);}
  shuffle(opts);
  var h="";
  h+='<div class="flash"><span class="meta">'+esc(s.ch)+' · 翻译句</span>';
  h+='<div class="term" style="font-size:1.1rem;line-height:1.65">'+esc(s.en)+'</div>';
  h+='<div class="small">请选出这句话的中文翻译</div>';
  h+='<div style="width:100%;margin-top:14px">';
  for(var k=0;k<opts.length;k++){
    h+='<button class="opt" data-ok="'+(opts[k]===correct?"1":"0")+'" data-id="'+esc(s.id)+'" data-ty="s" onclick="bmQuizAnswer(this,'+(opts[k]===correct)+')">'+esc(opts[k])+'</button>';
  }
  h+='</div></div>';
  return h;
}

function bmQuizAnswer(el,isOk){
  var q=bmQuiz;if(!q)return;
  var pc=document.getElementById("pc");
  var p=newDay();
  var id=el.getAttribute("data-id")||"";
  var t=el.getAttribute("data-ty")||"w";
  if(isOk){q.correct++;if(t==="s")decWrongSent(p,id);else decWrong(p,id);}
  else{if(t==="s")addWrongSent(p,id);else addWrong(p,id);}
  p.quizTotal++;p.quizToday++;
  if(isOk){p.quizTotalC++;p.quizTodayC++;}
  sP(p);
  var opts=pc.querySelectorAll(".opt");
  for(var i=0;i<opts.length;i++){opts[i].disabled=true;if(opts[i].getAttribute("data-ok")==="1")opts[i].className="opt ok";else if(opts[i]!==el)opts[i].className="opt";}
  if(!isOk)el.className="opt no";
  var fb=pc.querySelector(".flash");
  if(fb){fb.insertAdjacentHTML("beforeend",'<div style="margin-top:14px;font-weight:700;color:'+(isOk?'var(--correct)':'var(--wrong)')+'">'+(isOk?"✅ 答对！":"❌ 答错，已记入"+(t==="s"?"句错题":"错词本"))+'</div>');}
  setTimeout(function(){
    q.i++;
    if(q.i>=q.total){
      var acc=q.total?Math.round(q.correct/q.total*100):0;
      pc.innerHTML='<div class="card"><h3>📝 Quiz 完成</h3><div class="summary">答对 '+q.correct+'/'+q.total+' · 正确率 '+acc+'%</div>';
      pc.innerHTML+='<div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button><button class="btn orange" onclick="bmQuizSetup()">再测一次</button></div></div>';
      bioPushNow();
    }else{bmQuizQ();}
  },isOk?450:900);
}

function bmWrongBook(){
  var p=newDay();
  var pc=document.getElementById("pc");
  var wrongN=p.wrong.length;var sentN=p.wrongSent?p.wrongSent.length:0;
  if(!wrongN&&!sentN){pc.innerHTML='<div class="card empty"><div class="big">🎉 错词本是空的</div><span class="small">继续保持！</span><div class="btn-row"><button class="btn" onclick="renderHome()">返回首页</button></div></div>';return;}
  var h="";
  h+='<div class="card"><h3>❌ 错词本（'+wrongN+' 词 · '+sentN+' 句）</h3>';
  h+='<p class="small">做错的单词和翻译句会记在这里，Quiz 答对会减次数，减到 0 自动移出。</p>';
  if(wrongN){
    h+='<h3 style="margin:12px 0 4px;font-size:0.88rem;color:var(--accent2)">📄 单词错词</h3>';
    for(var i=0;i<p.wrong.length;i++){
      var w=wById(p.wrong[i].id);if(!w)continue;
      h+='<div class="wrong-row"><span class="w">'+esc(w.t)+'</span><span class="small" style="color:var(--correct);font-weight:600">'+esc(w.cn)+'</span><span class="n">错 '+p.wrong[i].n+'</span></div>';
    }
  }
  if(sentN){
    h+='<h3 style="margin:16px 0 4px;font-size:0.88rem;color:var(--accent2)">✍️ 翻译句错题</h3>';
    for(var j=0;j<p.wrongSent.length;j++){
      var s=sById(p.wrongSent[j].id);if(!s)continue;
      h+='<div class="wrong-row"><span class="w" style="font-size:0.78rem;min-width:180px">'+esc(s.en)+'</span><span class="small" style="color:var(--correct);font-weight:600">'+esc(s.cn)+'</span><span class="n">错 '+p.wrongSent[j].n+'</span></div>';
    }
  }
  h+='<div class="btn-row"><button class="btn orange" onclick="bmQuizGo()">✏️ 再测这些错题</button>';
  h+='<button class="btn green" onclick="bmStudyWrong()">📖 重学单词闪卡</button>';
  h+='<button class="btn gray" onclick="renderHome()">返回</button></div>';
  h+='</div>';
  pc.innerHTML=h;
}

function bmStudyWrong(){
  var p=newDay();
  var deck=p.wrong.map(function(e){return wById(e.id);}).filter(Boolean);
  shuffle(deck);
  if(!deck.length){renderHome();return;}
  bmStudy={deck:deck,i:0,known:0,unknown:0,flipped:false};
  bmCard();
}

/* ======= 目标 ======= */
function bmSetGoal(){
  var v=parseInt(document.getElementById("bmGoalInp").value)||10;
  v=Math.max(1,Math.min(30,v));
  var p=newDay();p.goal=v;sP(p);
  var msg=document.getElementById("goalMsg");
  if(msg){msg.textContent="✅ 已保存：每天 "+v+" 个";}
  renderHome();
}

/* ======= 云同步（bioHex token + Contents API，与题库 app 同款） ======= */
function bioSetSync(mode,label){
  var el=document.getElementById("bioSyncB");if(!el)return;
  el.className="bio-sync"+(mode==="off"?" off":"");
  el.textContent="☁️ "+label;
}
function gPending(){try{return localStorage.getItem(K_PENDING)==="1";}catch(e){return false;}}
function bioQueuePending(){try{localStorage.setItem(K_PENDING,"1");}catch(e){}}
function bioClearPending(){try{localStorage.removeItem(K_PENDING);}catch(e){}}
function bioPushNow(){
  if(bioSyncBusy)return;
  if(!BIO_STUDENT)return;
  if(BIO_CFG.token==="__BIO_TOKEN__"){bioSetSync("off","未设置");return;}
  bioSyncBusy=true;
  var p=newDay();
  var slug=encodeURIComponent(BIO_STUDENT);
  var path=BIO_CFG.folder+"/"+slug+".json";
  var url="https://api.github.com/repos/"+BIO_CFG.owner+"/"+BIO_CFG.repo+"/contents/"+path;
  var body={name:BIO_STUDENT,updated:new Date().toISOString(),goal:p.goal,
    learnedToday:p.todayIds.length,quizToday:p.quizToday,quizCorrectToday:p.quizTodayC,
    totalLearned:p.learnedIds.length,totalQuiz:p.quizTotal,totalQuizCorrect:p.quizTotalC,
    wrong:p.wrong,wrongSent:p.wrongSent,history:p.history};
  var payload={message:"sync "+BIO_STUDENT,content:btoa(unescape(encodeURIComponent(JSON.stringify(body))))};
  fetch(url,{headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"}})
    .then(function(r){return r.json().then(function(j){return{status:r.status,j:j};});})
    .then(function(res){
      if(res.status===200&&res.j.sha)payload.sha=res.j.sha;
      return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"},body:JSON.stringify(payload)});
    })
    .then(function(r){
      bioSyncBusy=false;
      if(r.ok){bioSetSync("on","已同步");bioClearPending();}
      else{bioSetSync("off","同步失败");bioQueuePending();}
    })
    .catch(function(){bioSyncBusy=false;bioSetSync("off","未连接");bioQueuePending();});
}

/* ======= 启动 ======= */
renderHome();
bioAskName();
bioPushNow();/* 打开页面自动补推未同步记录 */
setTimeout(function(){if(gPending())bioPushNow();},4000);/* 首次失败 4 秒后重试 */
setTimeout(function(){if(gPending())bioPushNow();},12000);/* 再失败 12 秒后再试 */
</script>
