ce daughter cells that can become specialised for specific functions."},{"id":"ch17b6","tp":"Meiosis","q":"What is the result of meiosis?","o":["Genetically different haploid gametes","Genetically identical diploid cells","Genetically identical haploid cells","Genetically different diploid cells"],"a":0,"e":"Meiosis is a reduction division producing genetically different haploid gametes."},{"id":"ch17b7","tp":"Meiosis","q":"Which statement describes meiosis?","o":["A nuclear division that produces genetically identical cells","A reduction division in which the chromosome number is halved from diploid to haploid","A division that doubles the chromosome number","A division that produces two identical diploid cells"],"a":1,"e":"Meiosis is a reduction division in which the chromosome number is halved from diploid to haploid, producing genetically different cells."},{"id":"ch17b8","tp":"DNA and proteins","q":"DNA controls cell function by...","o":["storing carbohydrates in the cytoplasm","releasing energy in the mitochondria","controlling the production of proteins, including enzymes and membrane carriers","transporting oxygen in the blood"],"a":2,"e":"DNA controls cell function by controlling the production of proteins, including enzymes, membrane carriers and receptors for neurotransmitters."},{"id":"ch17b9","tp":"Monohybrid ratio","q":"In a cross between two heterozygous tall plants (Tt x Tt), what phenotypic ratio is expected among the offspring?","o":["1 : 1","All tall","3 tall : 1 short","1 tall : 3 short"],"a":2,"e":"Tt x Tt gives the genotypes TT, Tt, Tt and tt, so the phenotypic ratio is 3 tall : 1 short."},{"id":"ch17b10","tp":"Protein synthesis","q":"Which sequence shows the correct order of events in protein production?","o":["ribosome to mRNA to DNA to protein","DNA to mRNA to ribosome to protein","mRNA to DNA to protein to ribosome","protein to mRNA to DNA to ribosome"],"a":1,"e":"mRNA is a copy of a gene made in the nucleus, moves to the cytoplasm and passes through ribosomes, which assemble amino acids into a protein."},{"id":"ch17b11","tp":"Punnett square","q":"In a Punnett square for a cross between two heterozygous parents, how many different genotypes can appear in the offspring?","o":["1","2","3","4"],"a":2,"e":"A cross Tt x Tt produces three different genotypes: TT, Tt and tt."}],"review":[{"id":"ch17r0","tp":"Genetic diagrams","q":"Which parental cross would produce offspring that all have the genotype Tt?","o":["Tt x Tt","tt x tt","TT x tt","Tt x tt"],"a":2,"e":"A cross between TT and tt produces offspring that all have the genotype Tt."},{"id":"ch17r1","tp":"ABO blood groups","q":"A mother has the genotype IA Io and a father has the genotype IB Io. What is the probability that their child has blood group O?","o":["0","1/4","1/2","3/4"],"a":1,"e":"The cross IA Io x IB Io can produce IA IB, IA Io, IB Io and Io Io; only Io Io gives blood group O, so the probability is 1 in 4."},{"id":"ch17r2","tp":"Pedigree diagrams","q":"In a pedigree diagram for a single-gene characteristic, a filled-in (shaded) symbol represents...","o":["a person who shows the characteristic being studied","a person who does not show the characteristic","a gamete","a person of unknown sex"],"a":0,"e":"In a pedigree diagram, a shaded symbol is used to show an individual who has the characteristic being studied."},{"id":"ch17r3","tp":"Codominance","q":"Which statement best describes codominance?","o":["One allele masks the effect of the other in a heterozygote","Neither allele is expressed in a heterozygote","Two genes are located on the same chromosome","Both alleles in a heterozygous organism contribute to the phenotype"],"a":3,"e":"In codominance, both alleles in a heterozygous organism contribute to the phenotype."},{"id":"ch17r4","tp":"Codominance","q":"Which is an example of codominance in humans?","o":["Red-green colour blindness","Tongue rolling","ABO blood groups, where both IA and IB are expressed in group AB","Attached ear lobes"],"a":2,"e":"In the ABO blood group system, a person with genotype IA IB has blood group AB, showing both alleles, which is codominance."},{"id":"ch17r5","tp":"Sex linkage","q":"What is a sex-linked characteristic?","o":["A feature in which the gene responsible is located on a sex chromosome, making it more common in one sex than the other","A feature that only appears in males","A feature in which the gene is located on an autosome","A feature that is always inherited from the mother"],"a":0,"e":"A sex-linked characteristic is one in which the gene responsible is located on a sex chromosome, so it is more common in one sex than in the other."},{"id":"ch17r6","tp":"Colour blindness","q":"Red-green colour blindness is more common in males than in females because...","o":["the allele is carried on the Y chromosome","the gene is on the X chromosome and males have only one X chromosome","females do not have sex chromosomes","the allele is dominant in males and recessive in females"],"a":1,"e":"The gene for red-green colour blindness is on the X chromosome; a male has only one X chromosome, so he expresses the allele if it is present."},{"id":"ch17r7","tp":"Sex determination","q":"Which statement about the inheritance of sex in humans is correct?","o":["A mother's egg cell always carries a Y chromosome","A boy inherits his X chromosome from his father","A girl inherits her Y chromosome from her father","The father's sperm determines the sex of the child"],"a":3,"e":"A sperm may carry an X or a Y chromosome, so the father's sperm determines the sex of the child."},{"id":"ch17r8","tp":"Protein synthesis","q":"The gene that codes for a protein stays in the nucleus. Which molecule carries a copy of the gene to the ribosome?","o":["A ribosome","Messenger RNA (mRNA)","A membrane carrier","A neurotransmitter receptor"],"a":1,"e":"Messenger RNA (mRNA) is a copy of a gene; it is made in the nucleus and moves to the cytoplasm where it passes through ribosomes."},{"id":"ch17r9","tp":"Gene expression","q":"Most body cells of an organism contain the same genes. Why do different cells carry out different functions?","o":["Because each cell has a different set of genes","Because some cells lose their chromosomes","Because many genes in a particular cell are not expressed and the cell only makes the specific proteins it needs","Because different cells have different numbers of chromosomes"],"a":2,"e":"Most body cells contain the same genes, but many genes in a particular cell are not expressed because the cell only makes the specific proteins it needs."},{"id":"ch17r10","tp":"Haploid","q":"A human sperm cell is haploid. How many chromosomes does it contain?","o":["23","46","92","22"],"a":0,"e":"A human sperm cell is haploid and contains 23 chromosomes, a single set."},{"id":"ch17r11","tp":"Monohybrid ratio","q":"In a cross between a heterozygous tall plant (Tt) and a short plant (tt), what phenotypic ratio is expected among the offspring?","o":["3 : 1","1 : 1","2 : 1","All tall"],"a":1,"e":"Tt x tt produces Tt and tt in equal numbers, giving a phenotypic ratio of 1 tall : 1 short."}],"adv":[{"id":"ch17a0","tp":"Test cross","q":"What is a test cross used for?","o":["Identifying the genotype of an organism that shows the dominant phenotype","Determining the sex of an offspring","Producing genetically identical copies of an organism","Halving the chromosome number in gametes"],"a":0,"e":"A test cross is used to identify an unknown genotype, for example whether an organism showing the dominant trait is homozygous or heterozygous."},{"id":"ch17a1","tp":"Test cross","q":"A gardener has a tall pea plant of unknown genotype. To find out whether it is TT or Tt, the plant should be crossed with...","o":["a tall heterozygous plant (Tt)","a tall homozygous plant (TT)","a short plant (tt)","another plant of unknown genotype"],"a":2,"e":"The unknown plant is crossed with a homozygous recessive plant (tt); the offspring ratio reveals whether the unknown plant is TT or Tt."},{"id":"ch17a2","tp":"ABO blood groups","q":"In a cross between two parents both of genotype IA Io (blood group A), which blood groups can appear in the children?","o":["Only A","A and AB","AB and B","A and O"],"a":3,"e":"IA Io x IA Io produces IA IA, IA Io and Io Io, giving blood groups A and O."},{"id":"ch17a3","tp":"Sex linkage","q":"A colour-blind man (XbY) has children with a woman who is a carrier (XBXb). What is the probability that a son will be colour blind?","o":["0","1/4","1/2","1"],"a":2,"e":"Sons receive the Y chromosome from their father and either XB or Xb from their mother, so each son has a 1 in 2 chance of being XbY (colour blind)."},{"id":"ch17a4","tp":"Mitosis vs meiosis","q":"Which statement correctly compares mitosis and meiosis?","o":["Mitosis halves the chromosome number, while meiosis maintains it","Both produce genetically identical haploid cells","Both are involved only in the production of gametes","Mitosis produces genetically identical cells, while meiosis produces genetically different cells"],"a":3,"e":"Mitosis gives rise to genetically identical cells, whereas meiosis produces genetically different haploid cells."},{"id":"ch17a5","tp":"Protein synthesis","q":"The sequence of bases in a gene determines...","o":["the number of chromosomes in a cell","the sequence of amino acids used to make a specific protein","the type of sex chromosomes an individual has","the blood group of an individual"],"a":1,"e":"The sequence of bases in a gene determines the sequence of amino acids used to make a specific protein."},{"id":"ch17a6","tp":"Protein shape","q":"Different sequences of amino acids give...","o":["the same shape to all proteins","different numbers of chromosomes to cells","different shapes to protein molecules","different colours to chromosomes"],"a":2,"e":"Different sequences of amino acids give different shapes to protein molecules, which is why proteins have different functions."},{"id":"ch17a7","tp":"Chromosome number","q":"A human sperm cell contains 23 chromosomes. After fertilisation with an egg cell, how many chromosomes are in the zygote?","o":["23","46","92","22"],"a":1,"e":"The zygote is diploid and receives 23 chromosomes from each gamete, giving 46 chromosomes in total."},{"id":"ch17a8","tp":"Gene expression","q":"Which statement about gene expression in body cells is correct?","o":["Every gene in every body cell is always expressed","Many genes in a particular cell are not expressed because the cell only makes the specific proteins it needs","Genes can only be expressed in gametes","Expressed genes are removed from the nucleus"],"a":1,"e":"Although most body cells contain the same genes, a cell only makes the specific proteins it needs, so many genes in that cell are not expressed."},{"id":"ch17a9","tp":"ABO blood groups","q":"A woman of blood group AB (IA IB) has a child with a man of blood group O (Io Io). Which blood groups can the child have?","o":["A or B","A only","O only","AB only"],"a":0,"e":"The woman produces gametes IA and IB while the man produces only Io, so the children can be IA Io (blood group A) or IB Io (blood group B)."},{"id":"ch17a10","tp":"Codominance","q":"In a cross between two parents both of genotype IA IB, what is the phenotypic ratio of the offspring?","o":["3 : 1","1 : 1","1 : 2 : 1","All blood group AB"],"a":2,"e":"IA IB x IA IB produces IA IA, IA IB and IB IB in a 1 : 2 : 1 ratio, giving the phenotypes A, AB and B."},{"id":"ch17a11","tp":"Colour blindness","q":"Which statement explains why red-green colour blindness is more common in males than in females?","o":["Males have two X chromosomes, so they always express the allele","Males have only one X chromosome, so a single recessive allele for colour blindness is expressed","The allele for colour blindness is on the Y chromosome","Females cannot carry the allele for colour blindness"],"a":1,"e":"A male has only one X chromosome, so a single recessive allele for colour blindness on that X chromosome is expressed, making the condition more common in males."}],"basic_saq":[{"id":"ch17bs0","q":"State the meaning of the terms gene and allele.","mm":2,"ms":[{"p":"A gene is a length of DNA that codes for a protein","pts":1},{"p":"An allele is an alternative form of a gene","pts":1}],"e":"Both are Core definitions from the inheritance chapter."},{"id":"ch17bs1","q":"State what is meant by a haploid nucleus and a diploid nucleus, and state how many pairs of chromosomes are in a human diploid cell.","mm":3,"ms":[{"p":"A haploid nucleus contains a single set of chromosomes","pts":1},{"p":"A diploid nucleus contains two sets of chromosomes","pts":1},{"p":"A human diploid cell has 23 pairs of chromosomes","pts":1}],"e":"Tests the haploid/diploid definitions and the human chromosome number."}],"review_saq":[{"id":"ch17rs0","q":"A red-flowered plant with genotype RR is crossed with a white-flowered plant with genotype rr. The allele R for red flowers is dominant. Using a genetic diagram or Punnett square, show the genotype and phenotype of the F1 offspring. Then state the expected phenotypic ratio in the F2 generation when two F1 plants are crossed.","mm":4,"ms":[{"p":"F1 offspring all have the genotype Rr","pts":1},{"p":"F1 offspring are all red-flowered","pts":1},{"p":"F2 cross Rr x Rr shown correctly with gametes R, r and R, r","pts":1},{"p":"F2 phenotypic ratio of 3 red : 1 white","pts":1}],"e":"Tests monohybrid inheritance using genetic diagrams and the 3 : 1 ratio."},{"id":"ch17rs1","q":"Red-green colour blindness is a sex-linked characteristic in humans. State which type of chromosome carries the allele for colour blindness, and explain why males are more likely to be colour blind than females.","mm":3,"ms":[{"p":"The allele is carried on the X chromosome","pts":1},{"p":"Males have only one X chromosome (genotype XY)","pts":1},{"p":"A male will express the allele on his single X chromosome, whereas a female needs the allele on both X chromosomes (so males are more likely to be affected)","pts":1}],"e":"Tests understanding of sex linkage as applied to colour blindness."}],"adv_saq":[{"id":"ch17as0","q":"A woman of blood group AB has a child with a man of blood group O. Using the alleles IA, IB and Io, draw a genetic diagram to show all the possible genotypes and phenotypes of their children.","mm":4,"ms":[{"p":"Parents' genotypes are IA IB and Io Io","pts":1},{"p":"Gametes shown correctly: IA and IB from the mother; Io and Io from the father","pts":1},{"p":"Offspring genotypes are IA Io and IB Io","pts":1},{"p":"Offspring phenotypes are blood groups A and B","pts":1}],"e":"Tests use of genetic diagrams for codominance in the ABO blood group system."},{"id":"ch17as1","q":"A gardener has a red-flowered pea plant but does not know whether its genotype is RR or Rr (R is dominant and gives red flowers). Describe how a test cross could be used to find out the plant's genotype, and explain the expected results.","mm":4,"ms":[{"p":"Cross the unknown plant with a homozygous recessive (rr, white-flowered) plant","pts":1},{"p":"If all offspring are red-flowered, the unknown plant is RR","pts":1},{"p":"If about half of the offspring are white-flowered, the unknown plant is Rr","pts":1},{"p":"The cross Rr x rr gives a phenotypic ratio of 1 red : 1 white","pts":1}],"e":"Tests the use of a test cross to identify an unknown genotype."}]},"ch18":{"pre":[{"id":"ch18p0","tp":"Variation","q":"What is meant by the term variation?","o":["Differences between individuals of the same species","Differences between different species","Changes that occur in an individual during its lifetime","The number of individuals in a population"],"a":0,"e":"Variation is defined as the differences between individuals of the same species."},{"id":"ch18p1","tp":"Continuous variation","q":"Which statement describes continuous variation?","o":["It results in a limited number of phenotypes with no intermediates","It results in a range of phenotypes between two extremes","It produces only two distinct phenotypes","It is caused by genes only"],"a":1,"e":"Continuous variation produces a range of phenotypes between two extremes, for example body length. The other options describe discontinuous variation."},{"id":"ch18p2","tp":"Discontinuous variation","q":"Which statement describes discontinuous variation?","o":["It produces a range of phenotypes between two extremes","It is always caused by both genes and the environment","It results in a limited number of phenotypes with no intermediates","It can only be seen in plants"],"a":2,"e":"Discontinuous variation results in a limited number of phenotypes with no intermediates, for example ABO blood groups."},{"id":"ch18p3","tp":"Discontinuous variation","q":"Which characteristic is an example of discontinuous variation?","o":["Body length in humans","Body mass in mice","Height in plants","Seed colour in peas"],"a":3,"e":"Seed colour in peas is an example of discontinuous variation. Body length, body mass and height show continuous variation."},{"id":"ch18p4","tp":"Continuous variation","q":"Which characteristic shows continuous variation?","o":["Body mass","ABO blood group","Seed shape in peas","Sex of an animal"],"a":0,"e":"Body mass shows continuous variation because it produces a range of phenotypes between two extremes. The other examples give a limited number of distinct phenotypes."},{"id":"ch18p5","tp":"Mutation","q":"What is a mutation?","o":["A change in an organism's behaviour","A genetic change","A change caused only by the environment","The production of gametes"],"a":1,"e":"A mutation is a genetic change. It is not a behavioural or purely environmental change."},{"id":"ch18p6","tp":"Mutation","q":"How are new alleles formed?","o":["By natural selection","By selective breeding","By mutation","By meiosis"],"a":2,"e":"Mutation is the way in which new alleles are formed. Natural selection and selective breeding select existing alleles, and meiosis produces new combinations but not new alleles."},{"id":"ch18p7","tp":"Mutation","q":"Which factors increase the rate of mutation?","o":["A healthy diet and exercise","Ionising radiation and some chemicals","Low temperature and high humidity","Cross-pollination and wind"],"a":3,"e":"Ionising radiation and some chemicals increase the rate of mutation."},{"id":"ch18p8","tp":"Adaptive features","q":"What is an adaptive feature?","o":["An inherited feature that helps an organism to survive and reproduce in its environment","A feature an organism develops during its lifetime","A feature that is always harmful to an organism","A feature only found in plants"],"a":0,"e":"An adaptive feature is an inherited feature that helps an organism to survive and reproduce in its environment."},{"id":"ch18p9","tp":"Natural selection","q":"Which statement is part of the description of natural selection?","o":["Individuals of a species produce very few offspring","Individuals of a species produce many offspring","All individuals in a population are identical","Offspring never compete for resources"],"a":1,"e":"In natural selection, individuals produce many offspring, which leads to a struggle for survival because resources are limited."},{"id":"ch18p10","tp":"Selective breeding","q":"What is the first step in selective breeding?","o":["Allowing only natural mating","Selecting offspring showing the desirable features","Selecting individuals with desirable features","Crossing selected individuals to produce the next generation"],"a":2,"e":"Selective breeding begins when humans select individuals with desirable features as parents of the next generation."},{"id":"ch18p11","tp":"Variation","q":"Which statement about the causes of variation is correct?","o":["Continuous variation is caused by genes only","Both types of variation are caused by the environment only","Discontinuous variation is caused by both genes and the environment","Discontinuous variation is usually caused by genes only"],"a":3,"e":"Discontinuous variation is usually caused by genes only, while continuous variation is caused by both genes and the environment."},{"id":"ch18p12","tp":"Natural selection","q":"In natural selection, why is there a struggle for survival?","o":["Because individuals compete for limited resources","Because individuals produce few offspring","Because all individuals are equally adapted","Because mutations never occur"],"a":0,"e":"The struggle for survival arises because individuals compete for limited resources such as food, water and space."},{"id":"ch18p13","tp":"Natural selection","q":"In natural selection, what happens to individuals that are better adapted to their environment?","o":["They are less likely to pass on their alleles","They are more likely to survive and reproduce","They produce fewer offspring","They change their alleles during their lifetime"],"a":1,"e":"Individuals that are better adapted to the environment have a greater chance of reproduction and pass on their alleles to the next generation."}],"basic":[{"id":"ch18b0","tp":"Continuous variation","q":"The body masses of a population of mice show a continuous range from very light to very heavy. Which type of variation does this show?","o":["Discontinuous variation","Continuous variation","Mutation","Selective breeding"],"a":1,"e":"A continuous range of phenotypes between two extremes is continuous variation, as shown by body mass."},{"id":"ch18b1","tp":"Discontinuous variation","q":"Which pair of characteristics are both examples of discontinuous variation?","o":["Body length and body mass","Height and seed colour in peas","ABO blood group and seed shape in peas","Body mass and seed colour in peas"],"a":2,"e":"ABO blood group and seed shape in peas are both examples of discontinuous variation. Body length, body mass and height show continuous variation."},{"id":"ch18b2","tp":"Discontinuous variation","q":"ABO blood groups in humans show discontinuous variation. What is this type of variation usually caused by?","o":["The environment only","Both genes and the environment","Diet and lifestyle","Genes only"],"a":3,"e":"Discontinuous variation, such as ABO blood group, is usually caused by genes only."},{"id":"ch18b3","tp":"Adaptive features","q":"A water lily has large air spaces in its leaves and stems. What do these air spaces represent?","o":["An adaptive feature that helps the plant to survive in water","A mutation caused by ionising radiation","A feature that reduces the rate of photosynthesis","A disease caused by a chemical"],"a":0,"e":"Air spaces are an adaptive feature of hydrophytes, helping them to float and to exchange gases in water."},{"id":"ch18b4","tp":"Mutation","q":"Plant seeds are exposed to X-rays before being planted. What is the most likely effect of this treatment?","o":["The seeds will grow faster","The rate of mutation in the seeds will increase","The seeds will produce fewer offspring","The seeds will become resistant to all diseases"],"a":1,"e":"X-rays are a form of ionising radiation, which increases the rate of mutation."},{"id":"ch18b5","tp":"Natural selection","q":"Which condition is necessary for natural selection to occur?","o":["All individuals in the population are identical","There is no competition for resources","There is genetic variation within the population","All offspring are produced by identical parents"],"a":2,"e":"Natural selection requires genetic variation within populations, so some individuals differ in their chance of survival."},{"id":"ch18b6","tp":"Selective breeding","q":"In selective breeding, after chosen parents with desirable features have been crossed, what happens next?","o":["The parents are released into the wild","The offspring are all killed","The offspring are allowed to breed randomly","The offspring showing the desirable features are selected"],"a":3,"e":"After crossing selected parents, the offspring that show the desirable features are selected to be the parents of the next generation."},{"id":"ch18b7","tp":"Natural selection","q":"In natural selection, what do the individuals that survive and reproduce pass on to the next generation?","o":["Only their physical features acquired during life","Their alleles","Their learned behaviour","Nothing"],"a":0,"e":"Individuals that survive and reproduce pass on their alleles to the next generation, so advantageous alleles become more common."},{"id":"ch18b8","tp":"Natural selection","q":"During the struggle for survival, what do individuals of a species compete for?","o":["Only sunlight","Resources such as food, water and space","Only mates","Nothing, because resources are unlimited"],"a":1,"e":"The struggle for survival includes competition for resources such as food, water and space."},{"id":"ch18b9","tp":"Variation","q":"Body mass in animals shows continuous variation. Which statement explains the cause of this variation?","o":["It is caused by genes only","It is caused by the environment only","It is caused by both genes and the environment","It is caused by mutation only"],"a":2,"e":"Continuous variation is caused by both genes and the environment."},{"id":"ch18b10","tp":"Selective breeding","q":"How can selective breeding be used to improve crop plants?","o":["By growing all plants without any selection","By allowing only natural selection to act","By crossing every plant with every other plant","By selecting plants with desirable features and crossing them over many generations"],"a":3,"e":"Selective breeding improves crops by selecting individuals with desirable features and crossing them over many generations, choosing the offspring that show the features."},{"id":"ch18b11","tp":"Variation","q":"Which statement correctly compares continuous and discontinuous variation?","o":["Continuous variation produces a range of phenotypes, while discontinuous variation produces a limited number of phenotypes with no intermediates","Both types produce a limited number of phenotypes","Continuous variation has no phenotypes, while discontinuous variation has many","Both types are caused by genes only"],"a":0,"e":"Continuous variation produces a range of phenotypes between two extremes; discontinuous variation produces a limited number of phenotypes with no intermediates."}],"review":[{"id":"ch18r0","tp":"Variation","q":"A survey of seed shape in peas shows only two distinct phenotypes, round and wrinkled, with no intermediates. Which type of variation does this show?","o":["Discontinuous variation","Continuous variation","Environmental variation","Mutation"],"a":0,"e":"A limited number of distinct phenotypes with no intermediates is discontinuous variation, as shown by seed shape in peas."},{"id":"ch18r1","tp":"Variation","q":"A histogram of body length in a fish population shows a bell-shaped curve, with most fish near the middle and a few at the extremes. Which type of variation is shown?","o":["Discontinuous variation","Continuous variation","No variation","Selective breeding"],"a":1,"e":"A bell-shaped distribution with phenotypes ranging between two extremes indicates continuous variation, such as body length."},{"id":"ch18r2","tp":"Xerophytes","q":"A cactus has a thick, waxy cuticle on its stem. How does this adaptive feature help the plant survive in a hot, dry environment?","o":["It increases the rate of photosynthesis","It attracts pollinators","It reduces water loss","It increases the surface area for gas exchange"],"a":2,"e":"A thick, waxy cuticle is an adaptive feature of xerophytes that reduces water loss, helping the plant survive in a dry environment."},{"id":"ch18r3","tp":"Hydrophytes","q":"Water lilies have air spaces in their leaves and stems. How do these air spaces help the plant survive in water?","o":["They reduce water loss","They absorb sunlight","They store glucose","They make the leaves buoyant and allow gas exchange"],"a":3,"e":"Air spaces in the leaves and stems of hydrophytes make them buoyant and allow gas exchange, helping them survive in water."},{"id":"ch18r4","tp":"Natural selection","q":"Which sequence correctly describes the development of antibiotic-resistant bacteria?","o":["Mutation makes some bacteria resistant; resistant bacteria survive and reproduce; resistance alleles pass to offspring","The antibiotic causes mutation, then all bacteria die and no resistance remains","All bacteria are affected equally, so none survive and resistance never develops","Bacteria become resistant by learning during their lifetime"],"a":0,"e":"A random mutation may make some bacteria resistant; the antibiotic kills non-resistant bacteria, and the resistant ones survive, reproduce and pass on the resistance allele."},{"id":"ch18r5","tp":"Adaptation","q":"Which statement best describes adaptation?","o":["A change in an individual during its own lifetime","The process by which populations become more suited to their environment over many generations as a result of natural selection","The process by which an individual learns to survive","A sudden change caused by a chemical"],"a":1,"e":"Adaptation is the process, resulting from natural selection, by which populations become more suited to their environment over many generations."},{"id":"ch18r6","tp":"Gene mutation","q":"What is a gene mutation?","o":["A change in the number of chromosomes in a cell","A change in the phenotype caused by diet","A random change in the base sequence of DNA","A change caused by selective breeding"],"a":2,"e":"A gene mutation is a random change in the base sequence of DNA."},{"id":"ch18r7","tp":"Selection","q":"What is the main difference between natural selection and artificial selection (selective breeding)?","o":["Natural selection is faster than artificial selection","Artificial selection involves only plants","Natural selection produces no variation","In artificial selection, humans select the features; in natural selection, the environment selects them"],"a":3,"e":"In artificial selection (selective breeding), humans select individuals with desirable features, whereas in natural selection the environment determines which individuals survive and reproduce."},{"id":"ch18r8","tp":"Selective breeding","q":"A farmer breeds cows for high milk yield. What should happen to the average milk yield of the herd over many generations of selective breeding?","o":["The average milk yield decreases","The average milk yield increases","The average milk yield stays the same","The herd becomes weaker and smaller"],"a":1,"e":"Over many generations, selecting the best-yielding cows and bulls as parents increases the average milk yield of the herd."},{"id":"ch18r9","tp":"Genetic variation","q":"Which process is NOT a source of genetic variation in populations?","o":["Selective breeding","Mutation","Meiosis","Random fertilisation"],"a":0,"e":"The sources of genetic variation in populations are mutation, meiosis, random mating and random fertilisation. Selective breeding is artificial selection, not a natural source of genetic variation."},{"id":"ch18r10","tp":"Natural selection","q":"Over many generations of natural selection, what happens to an allele that increases the chance of survival?","o":["It becomes less common in the population","It disappears completely","It becomes more common in the population","It changes into a different allele in each individual"],"a":2,"e":"Individuals with the advantageous allele survive and reproduce, passing it on, so it becomes more common in the population over generations."},{"id":"ch18r11","tp":"Xerophytes","q":"In some xerophytes, the stomata are sunk in pits on the leaf surface. How does this reduce water loss?","o":["It increases the rate of transpiration","It traps moist air around the stomata, reducing the water vapour gradient","It opens the stomata permanently","It increases the leaf surface area"],"a":3,"e":"Sunk stomata trap moist air around them, reducing the water vapour gradient and so reducing water loss by transpiration."}],"adv":[{"id":"ch18a0","tp":"Mutation","q":"Which statement correctly links mutation and variation?","o":["Mutation is a source of genetic variation because it creates new alleles","Mutation removes genetic variation from populations","Mutation has no effect on genetic variation","Mutation only affects the environment, not genes"],"a":0,"e":"Mutation is a source of genetic variation in populations because it is the way in which new alleles are formed."},{"id":"ch18a1","tp":"Genetic variation","q":"Which list contains all the sources of genetic variation in populations?","o":["Natural selection, selective breeding, environment, diet","Mutation, meiosis, random mating, random fertilisation","Meiosis, natural selection, competition, mutation","Random fertilisation, selective breeding, mutation, environment"],"a":1,"e":"The sources of genetic variation in populations are mutation, meiosis, random mating and random fertilisation."},{"id":"ch18a2","tp":"Hydrophytes","q":"Many hydrophytes have wide, flat leaves that float on the water surface. How does this adaptive feature help the plant?","o":["It reduces water loss by transpiration","It stores water in the leaf tissues","It provides a large surface area for photosynthesis and gas exchange","It protects the plant from herbivores"],"a":2,"e":"Wide, flat floating leaves give a hydrophyte a large surface area for photosynthesis and gas exchange."},{"id":"ch18a3","tp":"Xerophytes","q":"Some xerophytes have leaves reduced to spines. How does this help the plant survive in a dry environment?","o":["It increases the rate of photosynthesis","It reduces the surface area for transpiration, reducing water loss","It increases the absorption of water by the leaves","It helps the plant to compete for light"],"a":3,"e":"Reduced leaves reduce the surface area from which water is lost by transpiration, helping the xerophyte survive in a dry environment."},{"id":"ch18a4","tp":"Natural selection","q":"A student grows bacteria on an agar plate containing an antibiotic. Most bacteria die, but a few colonies survive. Which statement best explains this?","o":["A mutation made some bacteria resistant to the antibiotic; these survived and reproduced","The antibiotic caused all the bacteria to become resistant","The surviving bacteria learned to avoid the antibiotic","Only bacteria that had never been exposed to antibiotics survived"],"a":0,"e":"A random mutation gave some bacteria resistance to the antibiotic; the antibiotic killed the non-resistant bacteria, and the resistant bacteria survived and reproduced."},{"id":"ch18a5","tp":"Selection","q":"Which statement correctly compares natural selection and artificial selection?","o":["In both, the environment selects which individuals survive","In artificial selection, humans select the breeding individuals; in natural selection, the environment does","In natural selection, humans select the desirable features","Both produce individuals that are always better adapted to the wild environment"],"a":1,"e":"Artificial selection (selective breeding) is carried out by humans selecting individuals with desirable features, whereas natural selection is driven by the environment."},{"id":"ch18a6","tp":"Selective breeding","q":"Why must selective breeding be repeated over many generations?","o":["Because offspring are always identical to their parents","Because desirable features never appear in offspring","Because offspring vary and only some show the desirable features, so these must be selected each generation","Because mutations stop after one generation"],"a":2,"e":"Offspring vary, so in each generation only the individuals showing the desirable features are selected and crossed, gradually improving the stock over many generations."},{"id":"ch18a7","tp":"Adaptive features","q":"A plant lives in an area with very little rainfall. Which inherited feature would most help it survive?","o":["Large, thin leaves that lose water quickly","Stomata that remain wide open all day","A large number of stomata on the upper surface of leaves","A deep root system that reaches water deep underground"],"a":3,"e":"A deep root system reaches water deep underground, an adaptive feature of plants in dry environments. The other features all increase water loss."},{"id":"ch18a8","tp":"Discontinuous variation","q":"Why does ABO blood group show discontinuous variation?","o":["The phenotype falls into distinct categories that are usually controlled by genes with little environmental influence","The phenotype is controlled entirely by the environment","It is caused by continuous changes in gene expression","It produces a range of intermediate phenotypes"],"a":0,"e":"Discontinuous variation, such as ABO blood group, shows a limited number of distinct phenotypes because it is usually caused by genes only, with little environmental influence."},{"id":"ch18a9","tp":"Mutation","q":"A mutation in a gamete (sex cell) is more likely to affect the next generation than a mutation in a body cell. Why?","o":["Because gametes divide more quickly than body cells","Because a gamete may fuse at fertilisation, passing the mutation to the offspring","Because gametes contain more chromosomes than body cells","Because mutations in gametes are always harmful"],"a":1,"e":"A mutation in a gamete can be inherited because gametes fuse at fertilisation to form a zygote, so the mutation passes to the offspring. Mutations in body cells are not passed on."},{"id":"ch18a10","tp":"Mutation","q":"Which combination of factors would increase the rate of mutation in an organism?","o":["A diet rich in vitamins and regular exercise","Selective breeding and natural selection","Ionising radiation and some chemicals","Random mating and random fertilisation"],"a":2,"e":"Ionising radiation and some chemicals increase the rate of mutation."},{"id":"ch18a11","tp":"Natural selection","q":"A farmer sprays insecticide on insects. The first spray kills most insects, but after several years the insecticide becomes less effective. Which explanation is correct?","o":["The insecticide caused the insects to develop resistance during their lifetime","All insects were resistant from the start","The insecticide made the insects immune immediately","A mutation made some insects resistant; they survived, reproduced and passed on the resistance allele, so resistant insects became more common"],"a":3,"e":"This is natural selection: a random mutation gave some insects resistance; the insecticide killed non-resistant insects, while resistant insects survived, reproduced and passed on the resistance allele, so resistance became more common over generations."}],"basic_saq":[{"id":"ch18bs0","tp":"Variation","q":"Give one example of a characteristic that shows continuous variation and one example of a characteristic that shows discontinuous variation in humans.","mm":2,"ms":[{"p":"Continuous variation: body length / body mass / height","pts":1},{"p":"Discontinuous variation: ABO blood group","pts":1}],"e":"Body length, body mass and height show continuous variation (a range of phenotypes); ABO blood group shows discontinuous variation (a limited number of phenotypes with no intermediates)."},{"id":"ch18bs1","tp":"Mutation","q":"State what is meant by the term mutation.","mm":2,"ms":[{"p":"A genetic change","pts":1},{"p":"A random change in the base sequence of DNA / the way in which new alleles are formed","pts":1}],"e":"A mutation is a genetic change; a gene mutation is a random change in the base sequence of DNA, and mutation is the way in which new alleles are formed."}],"review_saq":[{"id":"ch18rs0","tp":"Natural selection","q":"Describe the process of natural selection.","mm":4,"ms":[{"p":"There is genetic variation within populations","pts":1},{"p":"Individuals produce many offspring, leading to a struggle for survival due to competition for resources","pts":1},{"p":"Individuals better adapted to the environment are more likely to survive and reproduce","pts":1},{"p":"These individuals pass on their alleles to the next generation","pts":1}],"e":"These are the four main points in the syllabus description of natural selection."},{"id":"ch18rs1","tp":"Selective breeding","q":"A gardener wants to produce a variety of tomato plant with larger fruits. Describe how selective breeding could be used over many generations.","mm":3,"ms":[{"p":"Select plants with the largest fruits (the desirable feature) as parents","pts":1},{"p":"Cross-pollinate the selected plants to produce the next generation","pts":1},{"p":"Select the offspring that show the desirable feature and repeat the process over many generations","pts":1}],"e":"Selective breeding is repeated over many generations, always selecting individuals with the desirable feature as parents."}],"adv_saq":[{"id":"ch18as0","tp":"Natural selection","q":"Explain how a population of bacteria can become resistant to an antibiotic.","mm":4,"ms":[{"p":"A random mutation produces a gene/allele for resistance in some bacteria","pts":1},{"p":"The antibiotic kills the non-resistant bacteria, but the resistant bacteria survive (natural selection)","pts":1},{"p":"The resistant bacteria reproduce and pass on the resistance allele to their offspring","pts":1},{"p":"Over many generations, the proportion of resistant bacteria in the population increases","pts":1}],"e":"This is an example of natural selection acting on genetic variation produced by mutation."},{"id":"ch18as1","tp":"Hydrophytes and Xerophytes","q":"(a) State one adaptive feature of a hydrophyte and explain how it helps the plant survive in water. (b) State one adaptive feature of a xerophyte and explain how it helps the plant survive in a dry environment.","mm":4,"ms":[{"p":"Hydrophyte feature, e.g. air spaces in leaves/stems or wide flat leaves","pts":1},{"p":"Explanation: air spaces make the leaves buoyant and allow gas exchange / wide flat leaves give a large surface area for photosynthesis","pts":1},{"p":"Xerophyte feature, e.g. thick waxy cuticle, stomata sunk in pits, or reduced leaves","pts":1},{"p":"Explanation: reduces water loss (by transpiration)","pts":1}],"e":"Hydrophytes are adapted for life in water (buoyancy, gas exchange, light capture); xerophytes are adapted to reduce water loss in dry environments."}]},"ch19":{"pre":[{"id":"ch19p0","tp":"Energy flow","q":"Which statement about the Sun in biological systems is correct?","o":["The Sun is the principal source of energy input to biological systems","The Sun is the only source of energy for decomposers","The Sun provides the chemical energy stored in organisms","The Sun's energy is mainly released by respiration in plants"],"a":0,"e":"The Sun is the principal source of energy input to biological systems; producers capture light energy from the Sun through photosynthesis."},{"id":"ch19p1","tp":"Producers, consumers and decomposers","q":"What is a producer?","o":["An organism that gets its energy by feeding on other organisms","An organism that makes its own organic nutrients, usually using energy from sunlight, through photosynthesis","An organism that gets its energy from dead or waste organic material","An organism that only eats plants"],"a":1,"e":"A producer makes its own organic nutrients, usually using energy from sunlight through photosynthesis."},{"id":"ch19p2","tp":"Producers, consumers and decomposers","q":"What is a consumer?","o":["An organism that makes its own food by photosynthesis","An organism that gets its energy from dead or waste organic material","An organism that gets its energy by feeding on other organisms","An animal that only eats plants"],"a":2,"e":"A consumer gets its energy by feeding on other organisms."},{"id":"ch19p3","tp":"Producers, consumers and decomposers","q":"What is a herbivore?","o":["An animal that gets its energy by eating plants","An animal that gets its energy by eating other animals","An animal that gets its energy from dead or waste organic material","An organism that makes its own food"],"a":0,"e":"A herbivore is an animal that gets its energy by eating plants."},{"id":"ch19p4","tp":"Producers, consumers and decomposers","q":"What is a carnivore?","o":["An animal that gets its energy by eating plants","An animal that gets its energy by eating other animals","An organism that makes its own food by photosynthesis","An organism that gets its energy from dead or waste organic material"],"a":1,"e":"A carnivore is an animal that gets its energy by eating other animals."},{"id":"ch19p5","tp":"Producers, consumers and decomposers","q":"What is a decomposer?","o":["An organism that makes its own food by photosynthesis","An animal that gets its energy by eating other animals","An animal that gets its energy by eating plants","An organism that gets its energy from dead or waste organic material"],"a":3,"e":"A decomposer gets its energy from dead or waste organic material."},{"id":"ch19p6","tp":"Food chains and webs","q":"What does a food chain show?","o":["The transfer of energy from one organism to the next, beginning with a producer","The competition between organisms in a habitat","The number of species in a community","The rate of photosynthesis in producers"],"a":0,"e":"A food chain shows the transfer of energy from one organism to the next, beginning with a producer."},{"id":"ch19p7","tp":"Food chains and webs","q":"What is a food web?","o":["A single pathway of energy transfer between organisms","A list of all the producers in an ecosystem","A network of interconnected food chains","A group of organisms of one species living in the same area"],"a":2,"e":"A food web is a network of interconnected food chains."},{"id":"ch19p8","tp":"Food chains and webs","q":"What is a trophic level?","o":["The rate at which a population grows","The position of an organism in a food chain, food web or ecological pyramid","The total number of organisms in a habitat","The amount of energy lost as heat between trophic levels"],"a":1,"e":"A trophic level is the position of an organism in a food chain, food web or ecological pyramid."},{"id":"ch19p9","tp":"Population growth","q":"What is a population?","o":["All of the populations of different species in an ecosystem","A unit containing the community of organisms and their environment, interacting together","A network of interconnected food chains","A group of organisms of one species, living in the same area, at the same time"],"a":3,"e":"A population is a group of organisms of one species, living in the same area, at the same time."},{"id":"ch19p10","tp":"Population growth","q":"What is a community?","o":["A group of organisms of one species, living in the same area, at the same time","A single food chain in a habitat","All of the populations of different species in an ecosystem","The non-living surroundings of an ecosystem"],"a":2,"e":"A community is all of the populations of different species in an ecosystem."},{"id":"ch19p11","tp":"Population growth","q":"What is an ecosystem?","o":["A group of organisms of one species, living in the same area, at the same time","All of the populations of different species in an ecosystem","A network of interconnected food chains","A unit containing the community of organisms and their environment, interacting together"],"a":3,"e":"An ecosystem is a unit containing the community of organisms and their environment, interacting together."},{"id":"ch19p12","tp":"Food chains and webs","q":"In a food chain, which organism is a primary consumer?","o":["The organism that feeds directly on the producer","The producer","The organism that feeds on the primary consumer","The decomposer"],"a":0,"e":"The primary consumer is the organism that feeds directly on the producer."},{"id":"ch19p13","tp":"Carbon cycle","q":"Which process removes carbon dioxide from the atmosphere in the carbon cycle?","o":["Respiration","Photosynthesis","Combustion","Decomposition"],"a":1,"e":"Photosynthesis removes carbon dioxide from the atmosphere; respiration, combustion and decomposition release it."}],"basic":[{"id":"ch19b0","tp":"Energy flow","q":"Which sequence shows the correct direction of energy flow in a food chain?","o":["Sun → producer → primary consumer → secondary consumer","Primary consumer → producer → Sun → secondary consumer","Secondary consumer → primary consumer → producer → Sun","Producer → Sun → primary consumer → secondary consumer"],"a":0,"e":"Light energy from the Sun flows to producers, then to primary consumers and then to secondary consumers."},{"id":"ch19b1","tp":"Food chains and webs","q":"Which of these is a correct food chain?","o":["fox → rabbit → grass","grass → fox → rabbit","grass → rabbit → fox","rabbit → grass → fox"],"a":2,"e":"A food chain begins with a producer (grass) and the arrows point in the direction of energy transfer, from the grass to the rabbit and then to the fox."},{"id":"ch19b2","tp":"Food chains and webs","q":"In the food chain grass → grasshopper → frog → hawk, which organism is the tertiary consumer?","o":["grass","grasshopper","frog","hawk"],"a":3,"e":"The grass is the producer, the grasshopper is the primary consumer, the frog is the secondary consumer and the hawk is the tertiary consumer."},{"id":"ch19b3","tp":"Food chains and webs","q":"In the food chain oak tree → aphid → ladybird → spider → bird, which organism is the quaternary consumer?","o":["spider","aphid","bird","ladybird"],"a":2,"e":"The oak tree is the producer, then the primary, secondary and tertiary consumers are the aphid, ladybird and spider; the bird is the quaternary consumer."},{"id":"ch19b4","tp":"Ecological pyramids","q":"In a pyramid of numbers for the food chain grass → rabbits → foxes, which level contains the largest number of organisms?","o":["the grass (producers)","the rabbits","the foxes","all levels have the same number"],"a":0,"e":"A pyramid of numbers shows the number of organisms at each trophic level, and producers are usually the most numerous."},{"id":"ch19b5","tp":"Ecological pyramids","q":"What does a pyramid of biomass show?","o":["The number of organisms at each trophic level","The total mass of living material at each trophic level","The amount of energy available at each trophic level","The number of food chains in a food web"],"a":1,"e":"A pyramid of biomass shows the total mass of living material at each trophic level."},{"id":"ch19b6","tp":"Population growth","q":"In a sigmoid population growth curve, what happens during the lag phase?","o":["The population grows rapidly at its maximum rate","The population stays at a constant maximum size","Population growth is slow because the population is small and reproducing slowly","The population size decreases steadily"],"a":2,"e":"In the lag phase the population is small, so growth is slow even though individuals are beginning to reproduce."},{"id":"ch19b7","tp":"Population growth","q":"During which phase of the sigmoid population growth curve does the population grow most rapidly?","o":["lag phase","exponential (log) phase","stationary phase","death phase"],"a":1,"e":"The exponential (log) phase is the period of most rapid growth, when resources are still plentiful."},{"id":"ch19b8","tp":"Population growth","q":"What happens in the stationary phase of a sigmoid population growth curve?","o":["The birth rate becomes zero","Limiting factors such as food supply and competition slow growth until the birth rate equals the death rate","The population grows at its maximum rate","The population dies out completely"],"a":1,"e":"In the stationary phase, limiting factors slow growth until the birth rate equals the death rate, so the population size stays roughly constant."},{"id":"ch19b9","tp":"Population growth","q":"Which of these is NOT a factor affecting the rate of population growth?","o":["food supply","competition","predation","fur colour"],"a":3,"e":"Food supply, competition, predation and disease affect the rate of population growth; fur colour does not."},{"id":"ch19b10","tp":"Carbon cycle","q":"Which process returns carbon dioxide to the atmosphere during the carbon cycle?","o":["photosynthesis","respiration","feeding","nitrogen fixation"],"a":1,"e":"Respiration releases carbon dioxide into the atmosphere; photosynthesis removes it."},{"id":"ch19b11","tp":"Carbon cycle","q":"How do decomposers return carbon to the environment?","o":["By releasing carbon dioxide during respiration as they break down dead organic material","By absorbing carbon dioxide during photosynthesis","By forming fossil fuels","By fixing nitrogen from the air"],"a":0,"e":"Decomposers break down dead and waste organic material and release carbon dioxide through their respiration."}],"review":[{"id":"ch19r0","tp":"Ecological pyramids","q":"What is an advantage of using a pyramid of biomass rather than a pyramid of numbers?","o":["It is easier to draw","It shows the mass of living material, so it is not misleading when organisms differ greatly in size","It shows the amount of energy available at each level","It always has a regular shape"],"a":1,"e":"A pyramid of biomass shows the mass of living material, avoiding the misleading effect of large differences in organism size seen in pyramids of numbers."},{"id":"ch19r1","tp":"Ecological pyramids","q":"What is an advantage of using a pyramid of energy rather than pyramids of numbers or biomass?","o":["It shows the energy transfer between trophic levels and always has a regular shape","It is the only pyramid that includes decomposers","It shows the number of individuals at each level","It is the same as a pyramid of numbers with a different name"],"a":0,"e":"A pyramid of energy shows the energy available at each trophic level and always has a regular shape, so it is not misleading."},{"id":"ch19r2","tp":"Energy flow","q":"Which is a reason why the transfer of energy from one trophic level to the next is often not efficient?","o":["All the energy in food is absorbed and used for growth","Energy is gained by each trophic level through photosynthesis","Energy cannot be transferred between organisms","Energy is lost as heat during respiration and in waste materials"],"a":3,"e":"Energy is lost as heat from respiration and in waste materials, so only a small proportion is passed on to the next trophic level."},{"id":"ch19r3","tp":"Energy flow","q":"Why do food chains usually have fewer than five trophic levels?","o":["Because so much energy is lost at each transfer that too little remains to support further trophic levels","Because producers cannot photosynthesise fast enough","Because consumers are always larger than producers","Because decomposers compete with all the consumers"],"a":0,"e":"Energy is lost at each trophic level, so after about four or five levels too little energy remains to support another trophic level."},{"id":"ch19r4","tp":"Energy flow","q":"Why is it more energy efficient for humans to eat crop plants than to eat livestock that have been fed on crop plants?","o":["Crop plants contain more energy per gram than livestock","Eating plants directly reduces the number of energy transfers, so less energy is lost","Livestock convert all the plant energy into meat","Crop plants carry out photosynthesis continuously"],"a":1,"e":"Eating plants means fewer trophic levels and fewer energy transfers, so more of the original energy reaches the humans."},{"id":"ch19r5","tp":"Food chains and webs","q":"How could overharvesting of one food species affect a food web?","o":["It can reduce the food supply of consumers and cause their numbers to fall","It has no effect on other species","It only affects the harvested species","It increases the number of decomposers"],"a":0,"e":"Overharvesting reduces the food supply of organisms that feed on the harvested species, which can reduce their numbers and disturb the food web."},{"id":"ch19r6","tp":"Food chains and webs","q":"What is a likely impact of introducing a foreign species into a habitat?","o":["It always increases biodiversity","It may compete with native species or prey on them, altering the food web","It has no effect on existing food chains","It only benefits the producers"],"a":1,"e":"A foreign species may compete with native species or prey on them, changing the balance of the food web."},{"id":"ch19r7","tp":"Population growth","q":"What causes the death phase in a sigmoid population growth curve?","o":["Food supply becomes more abundant","Predation decreases","Competition decreases","Resources are used up faster than they are replaced, so the death rate exceeds the birth rate"],"a":3,"e":"In the death phase, resources are used up faster than they are replaced, so the death rate exceeds the birth rate and the population falls."},{"id":"ch19r8","tp":"Population growth","q":"A population grows slowly at first, then rapidly, then levels off. Which sequence of phases does this describe?","o":["stationary, exponential, lag","exponential, stationary, lag","lag, exponential, stationary","lag, stationary, exponential"],"a":2,"e":"The sigmoid curve begins with a lag phase of slow growth, followed by the exponential (log) phase and then the stationary phase."},{"id":"ch19r9","tp":"Nitrogen cycle","q":"What is nitrification in the nitrogen cycle?","o":["The conversion of nitrate ions into nitrogen gas","The absorption of nitrogen gas by plant roots","The conversion of ammonium ions into nitrates by microorganisms","The production of protein from amino acids"],"a":2,"e":"Nitrification is the conversion of ammonium ions into nitrates, carried out by microorganisms."},{"id":"ch19r10","tp":"Nitrogen cycle","q":"How is nitrogen fixed in the nitrogen cycle?","o":["By lightning and by bacteria","Only by plant roots","By photosynthesis","By combustion of fossil fuels"],"a":0,"e":"Nitrogen fixation is carried out by lightning and by bacteria."},{"id":"ch19r11","tp":"Food chains and webs","q":"A food web contains these food chains: grass → rabbit → fox; grass → mouse → owl; grass → mouse → fox. How many food chains are shown in the web?","o":["1","2","3","4"],"a":2,"e":"The food web contains three separate food chains."}],"adv":[{"id":"ch19a0","tp":"Energy flow","q":"Which statement best explains why only a small proportion of energy passes from one trophic level to the next?","o":["Most of the food eaten is digested and used for growth","Energy is used in respiration and lost as heat, and parts of organisms may not be eaten","All organisms store the same amount of energy","Energy is destroyed when organisms die"],"a":1,"e":"Energy is used in respiration (and lost as heat) and is lost in uneaten parts and waste, so little is passed on."},{"id":"ch19a1","tp":"Energy flow","q":"A wheat crop contains 10 000 kJ of energy. Each trophic level passes on only 10% of the energy it receives. How much energy reaches a human who eats the wheat directly?","o":["100 kJ","9000 kJ","1000 kJ","10 000 kJ"],"a":2,"e":"10% of 10 000 kJ is 1000 kJ; the human is the primary consumer in this food chain."},{"id":"ch19a2","tp":"Energy flow","q":"Chickens are fed on grain. Compared with humans who eat the grain directly, humans who eat the chickens obtain...","o":["more energy because the chickens concentrate the energy","the same amount of energy","less energy because energy is lost at the extra trophic level","more energy because the chickens carry out photosynthesis"],"a":2,"e":"The chickens add an extra trophic level, and energy is lost at each transfer, so less energy reaches the humans."},{"id":"ch19a3","tp":"Nitrogen cycle","q":"What is the role of decomposers in the nitrogen cycle?","o":["They convert dead plant and animal protein into ammonium ions","They convert nitrate ions into nitrogen gas","They convert ammonium ions into nitrate ions","They absorb nitrate ions from the soil"],"a":0,"e":"Decomposers break down dead plant and animal protein to ammonium ions."},{"id":"ch19a4","tp":"Nitrogen cycle","q":"What is deamination in the nitrogen cycle?","o":["The removal of the amino group from excess amino acids in animals","The conversion of nitrates into proteins in plants","The conversion of nitrogen gas into ammonia","The absorption of amino acids by plant roots"],"a":0,"e":"Deamination is the removal of the amino group from excess amino acids in animals."},{"id":"ch19a5","tp":"Nitrogen cycle","q":"What is denitrification?","o":["The conversion of ammonium ions into nitrate ions","The conversion of nitrogen gas into ammonium ions","The production of amino acids from nitrates","The conversion of nitrate ions into nitrogen gas, returning nitrogen to the atmosphere"],"a":3,"e":"Denitrification is the conversion of nitrate ions into nitrogen gas by microorganisms, returning nitrogen to the atmosphere."},{"id":"ch19a6","tp":"Nitrogen cycle","q":"How do plants use nitrate ions absorbed from the soil?","o":["They produce amino acids and then proteins","They release them as nitrogen gas","They convert them into carbon dioxide","They store them as starch"],"a":0,"e":"Plants absorb nitrate ions and use them to make amino acids and then proteins."},{"id":"ch19a7","tp":"Food chains and webs","q":"In a food web containing grass, rabbits, foxes and owls, hunters remove most of the foxes. What is the most likely short-term effect?","o":["The grass population increases immediately","The owl population dies out immediately","The grass population decreases immediately","The rabbit population increases, and the grass population may then decrease"],"a":3,"e":"Fewer foxes means less predation on rabbits, so the rabbit population rises and the grass population may then fall as more grass is eaten."},{"id":"ch19a8","tp":"Population growth","q":"Which factor helps to explain why population growth slows in the stationary phase of a sigmoid curve?","o":["Unlimited food supply","Limited resources acting as limiting factors, such as food supply and disease","Decreasing competition","Increasing birth rate"],"a":1,"e":"Limited resources act as limiting factors, so growth slows until the birth rate equals the death rate."},{"id":"ch19a9","tp":"Population growth","q":"A bacterial population is grown in a closed container with limited nutrients. After a period of rapid growth, the population stops growing. Which statement best explains this?","o":["The birth rate continues to exceed the death rate","The bacteria have all died","The temperature of the container falls below zero","Nutrients are used up and waste products accumulate, so the birth rate equals the death rate"],"a":3,"e":"With limited nutrients, growth is checked until the birth rate equals the death rate and the population enters the stationary phase."},{"id":"ch19a10","tp":"Ecological pyramids","q":"Which food chain is most likely to produce an inverted (upside-down) pyramid of numbers?","o":["grass → rabbit → fox","oak tree → caterpillars → birds","phytoplankton → zooplankton → small fish","wheat → mouse → snake"],"a":1,"e":"A single large producer (oak tree) supports many caterpillars, so the producer level contains the fewest individuals and the pyramid of numbers is inverted."},{"id":"ch19a11","tp":"Carbon cycle","q":"How can carbon be stored for long periods in the carbon cycle?","o":["As carbon dioxide in the atmosphere","As oxygen released by photosynthesis","In fossil fuels formed from the remains of organisms over millions of years","As nitrogen gas in the soil"],"a":2,"e":"The formation of fossil fuels stores carbon for long periods; combustion later returns it as carbon dioxide."}],"basic_saq":[{"id":"ch19bs0","q":"The organisms grass, rabbit and hawk form a simple food chain. (a) Write out the food chain. (b) State the trophic level of each organism in this food chain.","mm":3,"ms":[{"p":"grass → rabbit → hawk (correct order, producer first)","pts":1},{"p":"grass is the producer / first trophic level","pts":1},{"p":"rabbit is the primary consumer (second trophic level) and the hawk is the secondary consumer (third trophic level)","pts":1}],"e":"A food chain begins with a producer and the arrows show the transfer of energy to each consumer in turn."},{"id":"ch19bs1","q":"Describe how decomposers return carbon to the atmosphere in the carbon cycle.","mm":3,"ms":[{"p":"decomposers feed on / break down dead organisms and waste material","pts":1},{"p":"carbon in the dead organic material is released as carbon dioxide","pts":1},{"p":"the carbon dioxide is released through respiration of the decomposers","pts":1}],"e":"Decomposers break down dead organic matter and release carbon dioxide by respiration."}],"review_saq":[{"id":"ch19rs0","q":"Explain why food chains usually have fewer than five trophic levels.","mm":4,"ms":[{"p":"energy is lost at each trophic level / at each energy transfer","pts":1},{"p":"energy is lost as heat from respiration","pts":1},{"p":"energy is lost in uneaten parts and in waste materials (egestion and excretion)","pts":1},{"p":"too little energy remains to support another trophic level","pts":1}],"e":"Energy losses at each transfer leave too little energy to support more than about four trophic levels."},{"id":"ch19rs1","q":"The sigmoid curve of population growth shows lag, exponential (log), stationary and death phases. Describe what happens during each phase.","mm":4,"ms":[{"p":"lag phase: growth is slow because the population is small and reproducing slowly","pts":1},{"p":"exponential (log) phase: rapid growth at the maximum rate while resources are plentiful","pts":1},{"p":"stationary phase: growth levels off / birth rate equals death rate because resources are limited","pts":1},{"p":"death phase: the population falls because the death rate exceeds the birth rate as resources run out","pts":1}],"e":"Each phase of the sigmoid curve reflects the balance between birth rate, death rate and available resources."}],"adv_saq":[{"id":"ch19as0","q":"Explain why it is more energy efficient for humans to eat crop plants than to eat livestock that have been fed on crop plants.","mm":4,"ms":[{"p":"eating plants directly involves fewer trophic levels / energy transfers","pts":1},{"p":"energy is lost at each transfer between trophic levels","pts":1},{"p":"the livestock use energy for respiration / movement and lose energy in their waste, so not all the plant energy becomes meat","pts":1},{"p":"therefore more of the original energy from the crop plants reaches the humans","pts":1}],"e":"Fewer trophic levels mean fewer energy losses, so eating plants directly is more efficient."},{"id":"ch19as1","q":"Describe the nitrogen cycle, including the roles of microorganisms in the cycling of nitrogen.","mm":4,"ms":[{"p":"decomposers convert dead plant and animal protein into ammonium ions","pts":1},{"p":"microorganisms carry out nitrification, converting ammonium ions into nitrate ions","pts":1},{"p":"nitrogen fixation converts nitrogen gas into nitrogen compounds, carried out by lightning and bacteria","pts":1},{"p":"microorganisms carry out denitrification, converting nitrate ions into nitrogen gas","pts":1}],"e":"The nitrogen cycle involves decomposition, nitrification, nitrogen fixation and denitrification carried out by microorganisms and lightning."}]},"ch20":{"pre":[{"id":"ch20p0","tp":"Biodiversity","q":"What is meant by biodiversity?","o":["The number of different species that live in an area","The number of individual organisms in a population","The variety of habitats in a country","The total mass of living organisms in an ecosystem"],"a":0,"e":"Biodiversity is the number of different species that live in an area. The other options describe population size, habitat variety and biomass."},{"id":"ch20p1","tp":"Fertilisers","q":"Why do farmers add chemical fertilisers to the soil?","o":["To kill insect pests","To improve the yield of crop plants","To reduce competition with weeds","To make the soil warmer"],"a":1,"e":"Chemical fertilisers supply mineral ions such as nitrate, which improve the yield of crop plants. Insecticides kill pests and herbicides reduce weed competition."},{"id":"ch20p2","tp":"Insecticides","q":"What is the purpose of using insecticides in farming?","o":["To improve soil structure","To reduce competition between crop plants","To kill insects that damage the crops","To provide mineral ions to the plants"],"a":2,"e":"Insecticides kill insect pests that damage crops, improving the quality and yield of the crop. Fertilisers supply mineral ions and herbicides reduce weed competition."},{"id":"ch20p3","tp":"Herbicides","q":"Why are herbicides used in crop production?","o":["To kill insect pests","To improve the yield of livestock","To provide plants with nitrate ions","To reduce competition between crop plants and weeds"],"a":3,"e":"Herbicides kill weeds, reducing competition with crop plants for light, water and mineral ions. Insecticides target insects and fertilisers supply mineral ions."},{"id":"ch20p4","tp":"Sustainable resources","q":"What is a sustainable resource?","o":["A resource that is never used by humans","A resource that is produced as rapidly as it is removed from the environment so that it does not run out","A resource that can only be obtained from living organisms","A resource that is found in unlimited quantities"],"a":1,"e":"A sustainable resource is produced as rapidly as it is removed from the environment so that it does not run out. The other options do not match the syllabus definition."},{"id":"ch20p5","tp":"Pollution","q":"What effect can untreated sewage have on an aquatic ecosystem?","o":["Bacteria decomposing the sewage use up oxygen, so the oxygen concentration falls","It always increases the number of fish","It removes all mineral ions from the water","It has no effect on organisms in the water"],"a":0,"e":"Untreated sewage is decomposed by bacteria that use up oxygen, reducing dissolved oxygen and harming aquatic organisms. It does not increase fish numbers."},{"id":"ch20p6","tp":"Fertiliser pollution","q":"What happens when excess fertiliser runs off farmland into a river?","o":["The water becomes cleaner","Fish populations always increase","The growth of producers such as algae increases","The oxygen content of the water increases"],"a":2,"e":"Excess fertiliser adds extra nitrates and other ions, which increase the growth of producers such as algae. This is the start of the process of eutrophication."},{"id":"ch20p7","tp":"Plastics","q":"Why are non-biodegradable plastics a pollution problem?","o":["They are broken down quickly by decomposers","They provide useful nutrients to plants","They are only found in marine ecosystems","They do not decay and can persist in ecosystems for a long time"],"a":3,"e":"Non-biodegradable plastics are not broken down by decomposers, so they persist in both aquatic and terrestrial ecosystems and can harm organisms."},{"id":"ch20p8","tp":"Greenhouse effect","q":"When the levels of methane and carbon dioxide in the atmosphere increase, which effect can this cause?","o":["The ozone layer becomes thinner","The enhanced greenhouse effect and climate change","Acid rain","Reduced plant growth"],"a":1,"e":"Increased levels of methane and carbon dioxide strengthen the enhanced greenhouse effect, leading to climate change. The other effects are not caused by these gases at this level."},{"id":"ch20p9","tp":"Deforestation","q":"How does deforestation increase the amount of carbon dioxide in the atmosphere?","o":["Trees that would have absorbed carbon dioxide are removed","Trees release carbon dioxide during photosynthesis","Deforestation increases the oxygen content of the atmosphere","Deforestation reduces soil erosion"],"a":0,"e":"Trees absorb carbon dioxide during photosynthesis; when they are removed, less carbon dioxide is removed from the atmosphere, and burning or decay releases more."},{"id":"ch20p10","tp":"Selective breeding","q":"What is selective breeding used for in food production?","o":["To kill pests without using chemicals","To reduce the growth of weeds","To improve the production of crop plants and livestock","To replace the need for fertilisers"],"a":2,"e":"Selective breeding involves choosing organisms with desirable characteristics to breed, improving production by crop plants and livestock. The other options describe pesticides or fertilisers."},{"id":"ch20p11","tp":"Food supply","q":"How has the use of agricultural machinery helped to increase food production?","o":["It removes mineral ions from the soil","It increases the number of insect pests","It reduces the area of land that can be farmed","It allows larger areas of land to be used and improves efficiency"],"a":3,"e":"Agricultural machinery allows farmers to use larger areas of land and to work more efficiently, increasing food production."},{"id":"ch20p12","tp":"Habitat destruction","q":"Which of these can cause organisms to become endangered or extinct?","o":["An increase in genetic variation","Habitat destruction","A reduction in competition","An increase in food availability"],"a":1,"e":"Habitat destruction is a cause of endangerment and extinction, along with climate change, hunting, overharvesting, pollution and introduced species."},{"id":"ch20p13","tp":"Conservation","q":"What is the aim of a captive breeding programme?","o":["To breed endangered species in controlled conditions to increase their numbers","To keep wild animals in their natural habitats","To increase the growth of crop plants","To breed livestock for meat"],"a":0,"e":"Captive breeding programmes breed endangered species in controlled conditions so that their numbers can increase before animals are released back into the wild."}],"basic":[{"id":"ch20b0","tp":"Monoculture","q":"What is an advantage of a large-scale monoculture of a crop plant?","o":["It increases the biodiversity of the area","It makes the crop less vulnerable to disease","It is efficient to manage and harvest using machinery","It always improves soil fertility"],"a":2,"e":"Monocultures are efficient to manage and harvest with machinery and can give high yields, but they reduce biodiversity and can be vulnerable to disease."},{"id":"ch20b1","tp":"Monoculture","q":"What is a disadvantage of a large-scale monoculture of crop plants?","o":["It reduces the need for fertilisers","The crop is very vulnerable to pests and disease","It increases the variety of species in the area","It makes harvesting more difficult"],"a":1,"e":"All plants in a monoculture are genetically similar, so a pest or disease that attacks one plant can spread through the whole crop, making it very vulnerable."},{"id":"ch20b2","tp":"Intensive livestock","q":"What is an advantage of intensive livestock production?","o":["More food can be produced more quickly","Animals are kept in more natural conditions","It requires very little energy","It reduces the spread of disease among animals"],"a":0,"e":"Intensive livestock production allows more food such as meat, milk and eggs to be produced quickly, although animals may be kept in poor conditions."},{"id":"ch20b3","tp":"Intensive livestock","q":"What is a disadvantage of intensive livestock production?","o":["It produces very little food","It reduces the need to feed the animals","It always improves animal welfare","Disease can spread quickly among animals kept close together"],"a":3,"e":"In intensive systems many animals are kept close together, so diseases can spread rapidly between them."},{"id":"ch20b4","tp":"Habitat destruction","q":"Which of these is a reason for habitat destruction?","o":["An increase in the area of wildlife reserves","A decrease in the human population","The need for more land for housing, crops and livestock","The use of controlled mesh sizes in fishing nets"],"a":2,"e":"Habitats are destroyed when land is cleared for housing, crop production and livestock production, when natural resources are extracted, and when pollution occurs."},{"id":"ch20b5","tp":"Deforestation","q":"Why does deforestation cause loss of soil?","o":["Tree roots that help to hold the soil in place are removed","Deforestation increases the amount of leaf litter","Deforestation increases the rate of photosynthesis","Deforestation reduces the amount of rainfall"],"a":0,"e":"Tree roots bind the soil; without them the soil is easily washed or blown away, leading to loss of soil."},{"id":"ch20b6","tp":"Deforestation","q":"Why can deforestation increase the risk of flooding?","o":["Trees absorb carbon dioxide","Fewer trees take up less water from the soil, so more water reaches rivers","Tree roots hold carbon in the soil","Deforestation increases the rate of transpiration"],"a":1,"e":"Trees take up water from the soil and their roots slow the flow of water, so with fewer trees more rainwater reaches rivers quickly, increasing the risk of flooding."},{"id":"ch20b7","tp":"Food chains","q":"How can humans have a negative impact on a habitat by altering a food chain?","o":["By increasing the number of producer species","By adding more mineral ions to the soil","By removing a predator so that prey numbers increase out of control","By planting a wider variety of species"],"a":2,"e":"Removing a predator can cause prey populations to increase out of control, which damages the habitat, so altering food chains can have a negative impact."},{"id":"ch20b8","tp":"Conservation","q":"How do seed banks help to conserve endangered plant species?","o":["They provide a habitat for animals","They store seeds so the plants can be grown again in the future","They remove the need for natural habitats","They increase the growth of weeds"],"a":1,"e":"Seed banks store seeds of endangered plant species in suitable conditions so that the plants can be grown again in the future."},{"id":"ch20b9","tp":"Fish conservation","q":"How can education help to conserve fish stocks?","o":["It makes people aware of the need to fish sustainably","It increases the growth rate of fish","It removes pollutants from the sea","It provides extra food for the fish"],"a":0,"e":"Education makes people aware of the need to fish sustainably, helping them understand why quotas and other measures are needed so fish stocks do not run out."},{"id":"ch20b10","tp":"Fish conservation","q":"What is the purpose of fishing quotas?","o":["To increase the size of fishing nets","To allow fishing all year round","To limit the number of fish that can be caught","To remove all the fish from an area"],"a":2,"e":"Quotas limit the number of fish that may be caught, so that fish populations are not overharvested and can be maintained sustainably."},{"id":"ch20b11","tp":"Conservation","q":"Which of these is a reason for carrying out conservation programmes?","o":["To increase the rate of extinction","To reduce biodiversity","To encourage habitat destruction","To maintain ecosystem functions such as nutrient cycling"],"a":3,"e":"Conservation programmes maintain ecosystem functions such as nutrient cycling and resource provision, and also maintain biodiversity and reduce extinction."}],"review":[{"id":"ch20r0","tp":"Eutrophication","q":"Which is the first step in the process of eutrophication after fertiliser enters a river?","o":["Death of organisms that require dissolved oxygen","Increased availability of nitrate and other ions","Reduction in dissolved oxygen","Increased decomposition after the death of producers"],"a":1,"e":"Eutrophication begins with increased availability of nitrate and other ions, which then leads to increased growth of producers."},{"id":"ch20r1","tp":"Eutrophication","q":"Why do fish die during eutrophication of a lake?","o":["The concentration of dissolved oxygen in the water falls","The water becomes too warm","The water becomes too rich in dissolved oxygen","The producers in the water stop growing"],"a":0,"e":"Decomposers carry out increased aerobic respiration, using up oxygen, so the dissolved oxygen concentration falls and fish die from lack of oxygen."},{"id":"ch20r2","tp":"Greenhouse effect","q":"How do increasing levels of methane and carbon dioxide in the atmosphere affect the environment?","o":["They react with water to form acid rain","They absorb oxygen from the atmosphere","They trap more heat in the atm
