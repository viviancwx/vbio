Stomach","q":"What is the function of the stomach in physical digestion?","o":["It churns and mixes the food into smaller pieces","It adds bile to the food","It absorbs the products of digestion","It stores undigested food as faeces"],"a":0,"e":"The muscular walls of the stomach churn and mix food, helping to break it into smaller pieces during physical digestion."},{"id":"ch7b9","tp":"Chemical digestion","q":"What is chemical digestion?","o":["The breakdown of food into smaller pieces without chemical change","The breakdown of large insoluble molecules into small soluble molecules","The taking of food and drink into the body","The removal of undigested food from the body"],"a":1,"e":"Chemical digestion is the breakdown of large insoluble molecules, such as starch and protein, into small soluble molecules that can be absorbed."},{"id":"ch7b10","tp":"Protease","q":"What are the products when proteases break down proteins?","o":["Fatty acids and glycerol","Simple sugars","Amino acids","Glucose"],"a":2,"e":"Proteases break down proteins into amino acids. Fatty acids and glycerol are produced by lipase from fats, and sugars come from starch."},{"id":"ch7b11","tp":"Hydrochloric acid","q":"What are the functions of hydrochloric acid in gastric juice?","o":["To digest protein and fat","To emulsify fats and oils","To store bile","To kill harmful microorganisms in food and provide an acidic pH for enzyme activity"],"a":3,"e":"Hydrochloric acid in gastric juice kills harmful microorganisms in food and provides the acidic pH needed for optimum enzyme (for example pepsin) activity in the stomach."}],"review":[{"id":"ch7r0","tp":"Nutrients","q":"Which nutrient is correctly matched with its principal dietary function?","o":["Carbohydrates - growth and repair of cells","Vitamin D - helping calcium to be absorbed for healthy bones","Iron - preventing scurvy","Fibre - providing the main source of energy"],"a":1,"e":"Vitamin D helps the body absorb calcium so bones and teeth stay healthy. Carbohydrates are the main energy source, iron is needed for haemoglobin, and fibre prevents constipation."},{"id":"ch7r1","tp":"Egestion","q":"What is meant by egestion?","o":["The removal of undigested food from the body as faeces","The uptake and use of nutrients by cells","The movement of nutrients from the intestines into the blood","The taking of food and drink into the body"],"a":0,"e":"Egestion is the removal of undigested food from the body as faeces. Absorption is movement into the blood, assimilation is uptake by cells, and ingestion is taking food in."},{"id":"ch7r2","tp":"Assimilation","q":"What is meant by assimilation?","o":["The breakdown of food into smaller pieces","The movement of nutrients from the intestines into the blood","The uptake and use of nutrients by cells","The removal of undigested food from the body"],"a":2,"e":"Assimilation is the uptake and use of nutrients by the body's cells, for example using amino acids to build new proteins."},{"id":"ch7r3","tp":"Bile","q":"What is the role of bile in the digestion of fats?","o":["It chemically breaks down fats into fatty acids and glycerol","It digests the proteins around the fat globules","It absorbs the products of fat digestion","It emulsifies fats and oils into small droplets, increasing their surface area"],"a":3,"e":"Bile emulsifies fats and oils into tiny droplets, increasing their surface area so that lipase can digest them more quickly. Bile does not itself digest fats chemically."},{"id":"ch7r4","tp":"Amylase","q":"Where is amylase secreted and where does it begin digesting starch?","o":["In the stomach and acts in the colon","In the salivary glands and acts in the mouth","In the gall bladder and acts in the stomach","In the liver and acts in the small intestine"],"a":1,"e":"The salivary glands secrete amylase into the mouth, where it begins breaking down starch into maltose. The pancreas also secretes amylase into the small intestine."},{"id":"ch7r5","tp":"Lipase","q":"Where does lipase act in the digestive system?","o":["In the small intestine","In the stomach","In the mouth","In the oesophagus"],"a":0,"e":"Lipase is secreted by the pancreas into the small intestine, where it breaks down fats and oils into fatty acids and glycerol."},{"id":"ch7r6","tp":"Water absorption","q":"Which statement about the absorption of water is correct?","o":["Most water is absorbed from the colon","Water is absorbed only in the stomach","Most water is absorbed from the small intestine, but some is also absorbed from the colon","Water cannot be absorbed from the digestive system"],"a":2,"e":"Most water is absorbed from the small intestine, but some water is also absorbed from the colon."},{"id":"ch7r7","tp":"Villi","q":"What is the function of the villi in the small intestine?","o":["They produce digestive enzymes","They store bile","They secrete hydrochloric acid","They increase the internal surface area for the absorption of nutrients"],"a":3,"e":"Villi (together with the microvilli on their surfaces) increase the internal surface area of the small intestine, allowing nutrients to be absorbed more quickly."},{"id":"ch7r8","tp":"Lacteal","q":"Which substances are absorbed into the lacteals in the villi?","o":["Fatty acids and glycerol","Glucose","Amino acids","Mineral ions"],"a":0,"e":"Fatty acids and glycerol, the products of fat digestion, are absorbed into the lacteals. Glucose, amino acids and mineral ions are absorbed into the blood capillaries."},{"id":"ch7r9","tp":"Capillary","q":"Which substances are absorbed into the blood capillaries in the villi?","o":["Fatty acids only","Glucose, amino acids and mineral ions","Bile and lipase","Undigested starch"],"a":1,"e":"The blood capillaries in the villi absorb glucose, amino acids and mineral ions. The products of fat digestion enter the lacteals instead."},{"id":"ch7r10","tp":"Teeth","q":"Which type of tooth is adapted for tearing food?","o":["Incisors","Premolars","Canines","Molars"],"a":2,"e":"Canines are the pointed teeth used for tearing food. Incisors cut food, while premolars and molars grind and crush food."},{"id":"ch7r11","tp":"Scurvy","q":"A patient has bleeding gums and wounds that heal slowly. A deficiency of which nutrient is the most likely cause?","o":["Iron","Calcium","Vitamin D","Vitamin C"],"a":3,"e":"Bleeding gums and slow wound healing are symptoms of scurvy, which is caused by a deficiency of vitamin C."}],"adv":[{"id":"ch7a0","tp":"Maltase","q":"Maltase breaks down maltose to glucose. Where does maltase act?","o":["In the lumen of the stomach","In the saliva of the mouth","On the membranes of the epithelium lining the small intestine","In the bile from the gall bladder"],"a":2,"e":"Maltase is found on the membranes of the epithelium lining the small intestine, where it breaks down maltose to glucose so it can be absorbed."},{"id":"ch7a1","tp":"Pepsin","q":"In which conditions does pepsin break down protein in the stomach?","o":["Alkaline conditions","Neutral conditions","In the presence of bile","Acidic conditions"],"a":3,"e":"Pepsin breaks down protein in the acidic conditions of the stomach, where hydrochloric acid provides the low pH needed for its activity."},{"id":"ch7a2","tp":"Trypsin","q":"In which conditions does trypsin break down protein in the small intestine?","o":["Alkaline conditions","Acidic conditions","In the presence of hydrochloric acid","At very low pH"],"a":0,"e":"Trypsin breaks down protein in the alkaline conditions of the small intestine. Bile helps neutralise the acidic mixture from the stomach to give this suitable pH."},{"id":"ch7a3","tp":"Bile","q":"Why is bile described as an alkaline mixture, and what effect does this have?","o":["It makes the contents of the mouth alkaline","It neutralises the acidic mixture of food and gastric juices entering the duodenum, providing a suitable pH for enzyme action","It increases the acidity of the stomach","It digests fat directly into fatty acids"],"a":1,"e":"Bile is alkaline and neutralises the acidic mixture of food and gastric juices entering the duodenum from the stomach, providing a suitable pH for enzymes such as lipase and trypsin."},{"id":"ch7a4","tp":"Starch digestion","q":"Which sequence correctly shows the digestion of starch in the digestive system?","o":["Starch -> amino acids -> glucose","Starch -> fatty acids -> glycerol","Starch -> maltose -> glucose","Starch -> glucose -> maltose"],"a":2,"e":"Amylase breaks down starch to maltose, and maltase then breaks down maltose to glucose."},{"id":"ch7a5","tp":"Tooth structure","q":"What is found in the pulp of a tooth?","o":["Enamel and dentine","Cement only","Hard bone tissue","Nerves and blood vessels"],"a":3,"e":"The pulp of a tooth contains nerves and blood vessels. Enamel covers the crown, dentine forms the bulk of the tooth, and cement anchors the root in the jaw."},{"id":"ch7a6","tp":"Tooth structure","q":"What is the role of the cement in a tooth?","o":["It anchors the tooth in the bone of the jaw","It is the hardest substance in the body","It contains the blood vessels","It produces enamel"],"a":0,"e":"Cement covers the root of the tooth and helps anchor it in the jawbone. Teeth are embedded in the bone and gums."},{"id":"ch7a7","tp":"Fat digestion","q":"A person eats a meal that is very rich in fat. Which combination of substances is needed to digest this fat most efficiently in the small intestine?","o":["Amylase and hydrochloric acid","Bile and lipase","Maltase and pepsin","Trypsin and bile"],"a":1,"e":"Bile emulsifies the fat into small droplets, increasing its surface area, and lipase then breaks the fat down into fatty acids and glycerol."},{"id":"ch7a8","tp":"Chemical digestion","q":"A food contains starch and protein. After complete digestion, which products will be absorbed?","o":["Glucose and fatty acids","Maltose and amino acids","Glucose and amino acids","Maltose and glycerol"],"a":2,"e":"Starch is digested to glucose (via maltose) and protein is digested to amino acids, so glucose and amino acids are the products absorbed."},{"id":"ch7a9","tp":"Villus absorption","q":"Which row correctly identifies how the products of digestion are absorbed in a villus?","o":["Glucose into the lacteal; amino acids into the capillary","Fatty acids into the capillary; glucose into the lacteal","Glucose into the capillary; amino acids into the lacteal","Glucose into the capillary; amino acids into the capillary; fatty acids and glycerol into the lacteal"],"a":3,"e":"Glucose, amino acids and mineral ions are absorbed into the blood capillaries, while fatty acids and glycerol are absorbed into the lacteals."},{"id":"ch7a10","tp":"Duodenum","q":"Which statement about the duodenum is correct?","o":["The duodenum receives bile and pancreatic juice","The duodenum is where most water is absorbed","The duodenum is the final part of the large intestine","The duodenum stores faeces before egestion"],"a":0,"e":"Bile from the gall bladder and pancreatic juice from the pancreas are released into the duodenum, the first part of the small intestine. The rectum stores faeces before egestion."},{"id":"ch7a11","tp":"Villi","q":"Which feature of a villus most directly helps the rapid absorption of digested nutrients?","o":["A thick outer wall made of enamel","The presence of microvilli and a good blood supply","A very small surface area","The secretion of bile into the villus"],"a":1,"e":"Microvilli increase the surface area of the villus even further, and the dense network of capillaries carries absorbed nutrients away quickly, both speeding up absorption."}],"basic_saq":[{"id":"ch7bs0","q":"State a principal dietary source of proteins and state one use of proteins in the body. State a principal dietary source of carbohydrates and state one use of carbohydrates in the body.","mm":4,"ms":[{"p":"Proteins: meat, fish, eggs or beans (any one correct source)","pts":1},{"p":"Proteins: growth and repair of body cells","pts":1},{"p":"Carbohydrates: bread, potatoes, rice or pasta (any one correct source)","pts":1},{"p":"Carbohydrates: provide energy","pts":1}],"e":"Core SAQ testing the principal dietary sources and importance of proteins and carbohydrates."},{"id":"ch7bs1","q":"State which nutrient deficiency causes scurvy and state which nutrient deficiency causes rickets. State one symptom of each disease.","mm":4,"ms":[{"p":"Scurvy is caused by a lack of vitamin C","pts":1},{"p":"Symptom of scurvy, e.g. bleeding gums or slow wound healing","pts":1},{"p":"Rickets is caused by a lack of vitamin D","pts":1},{"p":"Symptom of rickets, e.g. weak or bent bones / poor bone development","pts":1}],"e":"Core recall of the two deficiency diseases (scurvy and rickets) named in the syllabus."}],"review_saq":[{"id":"ch7rs0","q":"Describe the roles of the stomach and the small intestine in the digestive system.","mm":4,"ms":[{"p":"Stomach: churns and mixes food, breaking it into smaller pieces (physical digestion)","pts":1},{"p":"Stomach: secretes gastric juice containing hydrochloric acid, which kills harmful microorganisms and provides an acidic pH for enzyme activity","pts":1},{"p":"Small intestine: chemical digestion of food by enzymes such as amylase, proteases and lipase","pts":1},{"p":"Small intestine: absorption of digested nutrients into the blood","pts":1}],"e":"Exam-style question linking the digestive functions of the stomach and the small intestine."},{"id":"ch7rs1","q":"Describe the structure of a human tooth, limited to enamel, dentine, pulp and cement.","mm":4,"ms":[{"p":"Enamel covers the crown of the tooth and is the hardest substance in the body","pts":1},{"p":"Dentine lies below the enamel and forms the main bulk of the tooth","pts":1},{"p":"The pulp contains nerves and blood vessels","pts":1},{"p":"Cement anchors the tooth in the jawbone / teeth are embedded in bone and gums","pts":1}],"e":"Core/review question on the structure of a human tooth."}],"adv_saq":[{"id":"ch7as0","q":"Explain how bile helps the digestion of fats, and describe the route by which the products of fat digestion are absorbed.","mm":4,"ms":[{"p":"Bile is alkaline and neutralises the acidic mixture of food and gastric juices entering the duodenum","pts":1},{"p":"Bile emulsifies fats and oils into small droplets, increasing their surface area","pts":1},{"p":"This allows lipase to break down the fats into fatty acids and glycerol more quickly","pts":1},{"p":"Fatty acids and glycerol are absorbed into the lacteals in the villi of the small intestine","pts":1}],"e":"Extended-level question combining the roles of bile, lipase and lacteals in fat digestion."},{"id":"ch7as1","q":"Describe how the structure of a villus helps the absorption of digested nutrients, and state the roles of the capillaries and lacteals in a villus.","mm":4,"ms":[{"p":"Villi and microvilli increase the internal surface area of the small intestine for absorption","pts":1},{"p":"Villi have thin walls, giving a short diffusion distance for nutrients to pass through","pts":1},{"p":"Capillaries absorb glucose, amino acids and mineral ions and carry them away","pts":1},{"p":"Lacteals absorb fatty acids and glycerol, the products of fat digestion","pts":1}],"e":"Extended-level question on villus structure and the roles of capillaries and lacteals."}]},"ch8":{"pre":[{"id":"ch8p0","tp":"Xylem function","q":"What is the function of xylem tissue?","o":["Transport of sucrose and amino acids","Transport of water and mineral ions","Transport of oxygen and carbon dioxide","Transport of glucose and proteins"],"a":1,"e":"Xylem transports water and mineral ions from the roots to the rest of the plant and also provides support. Sucrose and amino acids are transported in the phloem."},{"id":"ch8p1","tp":"Phloem function","q":"Which substances are transported in phloem tissue?","o":["Water only","Mineral ions only","Water and mineral ions","Sucrose and amino acids"],"a":3,"e":"Phloem transports sucrose and amino acids from sources to sinks. Water and mineral ions are transported in the xylem."},{"id":"ch8p2","tp":"Root hairs","q":"What is the function of root hair cells?","o":["To absorb water and mineral ions from the soil","To carry out photosynthesis","To transport sucrose to the leaves","To provide support to the stem"],"a":0,"e":"Root hair cells absorb water and mineral ions from the soil. They do not photosynthesise or transport sucrose."},{"id":"ch8p3","tp":"Transpiration","q":"What is transpiration?","o":["The uptake of water by root hairs","The transport of sugar in the phloem","The loss of water vapour from leaves","The movement of mineral ions into the root"],"a":2,"e":"Transpiration is the loss of water vapour from the leaves of a plant."},{"id":"ch8p4","tp":"Stomata","q":"Through which structure does water vapour diffuse out of a leaf?","o":["Root hairs","Stomata","Xylem vessels","Phloem tubes"],"a":1,"e":"Water vapour diffuses out of leaves through the stomata. Root hairs take up water, while xylem and phloem are transport tissues."},{"id":"ch8p5","tp":"Translocation","q":"What is translocation?","o":["The loss of water vapour from leaves","The uptake of water by root hairs","The movement of water up the stem","The movement of sucrose and amino acids in the phloem from sources to sinks"],"a":3,"e":"Translocation is the movement of sucrose and amino acids in the phloem from sources to sinks."},{"id":"ch8p6","tp":"Root hairs","q":"The large surface area of root hairs increases the uptake of which substances?","o":["Water and mineral ions","Sucrose and amino acids","Oxygen and carbon dioxide","Chlorophyll and starch"],"a":0,"e":"The large surface area of root hairs increases the uptake of water and mineral ions from the soil."},{"id":"ch8p7","tp":"Water pathway","q":"Which sequence shows the correct pathway of water through a plant?","o":["Mesophyll cells → xylem → root cortex cells → root hair cells","Root cortex cells → root hair cells → xylem → mesophyll cells","Root hair cells → root cortex cells → xylem → mesophyll cells","Xylem → root hair cells → mesophyll cells → root cortex cells"],"a":2,"e":"Water passes from root hair cells through root cortex cells, into the xylem, and then to the mesophyll cells of the leaf."},{"id":"ch8p8","tp":"Transpiration","q":"From which cells does water evaporate into the air spaces inside a leaf?","o":["Root cortex cells","Mesophyll cells","Phloem cells","Root hair cells"],"a":1,"e":"Water evaporates from the surfaces of mesophyll cells into the air spaces, then diffuses out through the stomata as water vapour."},{"id":"ch8p9","tp":"Xylem function","q":"Which tissue provides support to a plant as well as transporting water?","o":["Xylem","Phloem","Epidermis","Meristem"],"a":0,"e":"Xylem transports water and mineral ions and also provides support, helped by its thick walls strengthened with lignin."},{"id":"ch8p10","tp":"Source and sink","q":"In translocation, what is a source?","o":["A part of the plant that uses sucrose","A part of the plant that stores amino acids","A part of the plant that releases sucrose or amino acids","A part of the plant that absorbs water"],"a":2,"e":"A source is a part of the plant that releases sucrose or amino acids, such as a photosynthesising leaf."},{"id":"ch8p11","tp":"Source and sink","q":"In translocation, what is a sink?","o":["A part of the plant that releases sucrose","A part of the plant that carries out photosynthesis","A part of the plant that absorbs mineral ions","A part of the plant that uses or stores sucrose or amino acids"],"a":3,"e":"A sink is a part of the plant that uses or stores sucrose or amino acids, such as a root or a developing fruit."},{"id":"ch8p12","tp":"Root hairs","q":"Where are root hair cells found?","o":["On the surface of roots","Inside xylem vessels","In the leaves","In the phloem"],"a":0,"e":"Root hair cells are found on the surface of roots, where they absorb water and mineral ions from the soil."},{"id":"ch8p13","tp":"Xylem structure","q":"Xylem vessels have walls thickened with which substance?","o":["Cellulose","Lignin","Starch","Sucrose"],"a":1,"e":"Xylem vessels have thick walls strengthened with lignin, which helps to support the plant."}],"basic":[{"id":"ch8b0","tp":"Xylem structure","q":"Which statement about xylem vessels is correct?","o":["They have cytoplasm and cross walls between the cells","They transport sucrose from the leaves to the roots","They are long continuous tubes with no cell contents","They are found only in the roots"],"a":2,"e":"Xylem vessel cells have no cell contents and are joined end to end with no cross walls, forming long continuous tubes. They are found in roots, stems and leaves."},{"id":"ch8b1","tp":"Xylem position","q":"In a cross-section of a stem, where is xylem usually found?","o":["Towards the inside of each vascular bundle, closer to the centre","On the outside of the phloem only","Only in the centre of the pith","Randomly scattered with no fixed position"],"a":0,"e":"In a stem, xylem is found towards the inside of each vascular bundle, closer to the centre, while phloem lies towards the outside."},{"id":"ch8b2","tp":"Transpiration factors","q":"What happens to the rate of transpiration when the temperature increases?","o":["It decreases","It increases","It stays the same","It stops completely"],"a":1,"e":"Higher temperature increases the rate of evaporation of water from the mesophyll cell surfaces, so the rate of transpiration increases."},{"id":"ch8b3","tp":"Transpiration factors","q":"What happens to the rate of transpiration when wind speed increases?","o":["It decreases","It stays the same","It stops completely","It increases"],"a":3,"e":"Wind removes water vapour from around the leaf, increasing the concentration gradient, so the rate of transpiration increases."},{"id":"ch8b4","tp":"Tissue position","q":"In a leaf, where are the xylem and phloem found?","o":["In the epidermis","In the air spaces","In the veins (vascular bundles)","In the stomata"],"a":2,"e":"Xylem and phloem are found together in the veins (vascular bundles) of a leaf."},{"id":"ch8b5","tp":"Phloem function","q":"Which substance is transported in the phloem from a source to a sink?","o":["Sucrose","Water","Lignin","Chlorophyll"],"a":0,"e":"Phloem transports sucrose (and amino acids) from sources to sinks. Water is transported in the xylem."},{"id":"ch8b6","tp":"Phloem position","q":"In a cross-section of a stem, phloem is usually found...","o":["At the centre of the stem","Towards the outside of each vascular bundle","Inside the xylem","Only in the leaves"],"a":1,"e":"In a stem, phloem is usually positioned towards the outside of each vascular bundle, while xylem is towards the inside."},{"id":"ch8b7","tp":"Transpiration","q":"Which sequence correctly describes how water is lost from a leaf?","o":["Stomata → air spaces → mesophyll cell surfaces","Mesophyll cell surfaces → stomata → air spaces","Air spaces → stomata → mesophyll cell surfaces","Mesophyll cell surfaces → air spaces → stomata"],"a":3,"e":"Water evaporates from the surfaces of mesophyll cells into the air spaces, then diffuses out of the leaf through the stomata as water vapour."},{"id":"ch8b8","tp":"Stomata","q":"What diffuses out of leaves through the stomata during transpiration?","o":["Liquid water","Water vapour","Sucrose solution","Carbon dioxide only"],"a":2,"e":"During transpiration, water vapour diffuses out of the leaves through the stomata. Sucrose and liquid water are not lost in this way."},{"id":"ch8b9","tp":"Xylem structure","q":"Xylem vessel cells have no cell contents. What is the advantage of this?","o":["It leaves a hollow tube through which water can flow easily","It makes the cells able to photosynthesise","It stops water from evaporating from the leaves","It allows sucrose to be stored in the vessel"],"a":0,"e":"Having no cell contents leaves a hollow tube through which water can pass freely, helping xylem to transport water."},{"id":"ch8b10","tp":"Source and sink","q":"Which part of a plant is most likely to act as a sink?","o":["A leaf in bright sunlight","A developing fruit","A green stem","A root hair cell"],"a":1,"e":"A sink uses or stores sucrose or amino acids. A developing fruit stores sugar, so it acts as a sink, while a photosynthesising leaf acts as a source."},{"id":"ch8b11","tp":"Source and sink","q":"Which part of a plant is most likely to act as a source?","o":["A developing fruit","A storage root in winter","A flower","A leaf carrying out photosynthesis"],"a":3,"e":"A source releases sucrose or amino acids. A leaf carrying out photosynthesis produces sucrose, so it acts as a source."}],"review":[{"id":"ch8r0","tp":"Transpiration pull","q":"Which force moves water upwards in the xylem?","o":["Active transport by xylem cells","Capillary action in root hairs","Transpiration pull drawing up a column of water molecules","Pressure from phloem translocation"],"a":2,"e":"Water moves up the xylem because transpiration pull draws up a column of water molecules held together by forces of attraction between the molecules."},{"id":"ch8r1","tp":"Transpiration factors","q":"On a humid day, the rate of transpiration is lower than on a dry day. What is the reason for this?","o":["The concentration gradient of water vapour between the leaf and the air is smaller","The stomata close completely","The air spaces in the leaf fill with water","The mesophyll cells stop evaporating water"],"a":0,"e":"High humidity means the air already contains much water vapour, so the concentration gradient for water vapour diffusing out of the leaf is smaller, reducing the transpiration rate."},{"id":"ch8r2","tp":"Xylem structure","q":"Why is the fact that xylem vessel cells have no cross walls important for water transport?","o":["It allows sucrose to pass easily between cells","It prevents water from evaporating","It makes the vessel walls thicker","It allows a continuous, unbroken column of water to be drawn up the plant"],"a":3,"e":"With no cross walls, the vessel cells form a long continuous tube, allowing an unbroken column of water to be drawn up by transpiration pull."},{"id":"ch8r3","tp":"Xylem structure","q":"Which feature of xylem vessels is mainly responsible for providing support to a plant?","o":["The absence of cross walls","Thick walls strengthened with lignin","The large number of stomata","The presence of cytoplasm in the cells"],"a":1,"e":"Xylem vessels have thick walls strengthened with lignin, which gives strength and supports the plant."},{"id":"ch8r4","tp":"Stomata","q":"A leaf has a large number of stomata on its lower surface. Compared with a leaf with fewer stomata, this leaf will...","o":["Lose more water vapour through transpiration","Absorb more water through its stomata","Transport more sucrose in its phloem","Produce less oxygen by photosynthesis"],"a":0,"e":"The size and number of stomata affect the rate of water loss; more stomata provide more openings, so more water vapour can diffuse out."},{"id":"ch8r5","tp":"Source and sink","q":"A potato tuber stores starch in summer but produces new shoots in spring. How is its role described?","o":["It is a source in summer and a sink in spring","It is always a sink","It is a sink in summer and a source in spring","It is always a source"],"a":2,"e":"In summer the tuber stores sucrose (converted to starch), so it is a sink. In spring it releases sucrose to support new shoots, so it is a source."},{"id":"ch8r6","tp":"Transpiration","q":"The interconnecting air spaces between mesophyll cells increase transpiration because they...","o":["Provide a pathway for water to enter the leaf","Keep the stomata permanently open","Cool the leaf by reflecting light","Provide a large internal surface area for evaporation of water"],"a":3,"e":"The interconnecting air spaces give a large internal surface area from which water evaporates from the mesophyll cell surfaces, increasing water vapour loss."},{"id":"ch8r7","tp":"Wilting","q":"What causes a plant to wilt?","o":["Too much water in the soil","Loss of water causing cells to become less turgid","Excess sucrose in the phloem","The stomata being fully closed for a long time"],"a":1,"e":"Wilting occurs when a plant loses water faster than it is absorbed, so cells lose turgidity and the leaves and stem droop."},{"id":"ch8r8","tp":"Water pathway","q":"A suitable stain such as eosin can be used to investigate the pathway of water through which parts of a plant?","o":["The above-ground parts, such as the stem and leaves","Only the root hair cells","Only the phloem","The flowers and fruits only"],"a":0,"e":"A stain such as eosin is carried up in the xylem and shows the pathway of water through the above-ground parts of the plant."},{"id":"ch8r9","tp":"Transpiration factors","q":"Which set of conditions will produce the highest rate of transpiration?","o":["Cold, still and humid","Cold, windy and dry","Warm, windy and dry","Warm, still and humid"],"a":2,"e":"Transpiration is fastest when it is warm (more evaporation), windy (removes water vapour) and dry (steep concentration gradient)."},{"id":"ch8r10","tp":"Xylem position","q":"In a cross-section of a root, where is the xylem located?","o":["Around the outside, just below the epidermis","Mixed evenly between the phloem strands","Only at the very edge of the cortex","In the centre, often forming an X shape"],"a":3,"e":"In the root, xylem is found in the centre of the vascular cylinder, often arranged in an X shape, with phloem between the arms."},{"id":"ch8r11","tp":"Wilting","q":"How does wilting help reduce further water loss from a plant?","o":["It increases the surface area of the leaves","It causes leaves to droop, exposing a smaller surface to the air","It opens the stomata wider","It moves water into the xylem more quickly"],"a":1,"e":"When a plant wilts, the leaves droop, reducing the surface area exposed to the air and helping to reduce further water loss."}],"adv":[{"id":"ch8a0","tp":"Transpiration pull","q":"Water molecules in the xylem are held together by forces of attraction. What name is given to this effect?","o":["Translocation","Cohesion","Osmosis","Evaporation"],"a":1,"e":"Cohesion is the force of attraction between water molecules. It holds the column of water together so that transpiration pull can draw it upwards."},{"id":"ch8a1","tp":"Transpiration factors","q":"A student uses a potometer to compare water uptake by a leafy shoot under four conditions. In 5 minutes the bubble moved 12 mm in warm, dry, still air (W); 20 mm in warm, dry, windy air (X); 4 mm in cool, humid, still air (Y); and 9 mm in warm, humid, windy air (Z). In which condition was the rate of transpiration lowest?","o":["W","X","Z","Y"],"a":3,"e":"Condition Y (cool, humid, still air) gave the smallest bubble movement (4 mm), so the transpiration rate was lowest. Cool and humid conditions reduce evaporation and the concentration gradient."},{"id":"ch8a2","tp":"Transpiration factors","q":"Wind increases the rate of transpiration. What is the biological reason for this?","o":["It removes water vapour from around the leaf, keeping the concentration gradient steep","It cools the leaf, reducing evaporation","It closes the stomata, reducing water loss","It increases the humidity around the leaf"],"a":0,"e":"Wind blows water vapour away from the leaf surface, maintaining a steep concentration gradient, which increases the rate of diffusion of water vapour out of the stomata."},{"id":"ch8a3","tp":"Transpiration pull","q":"A scientist suggests that air bubbles entering the xylem would stop water rising in that vessel. Which idea supports this suggestion?","o":["Water is actively pumped up the xylem","Phloem pushes water into the xylem","The column of water depends on the water molecules being held together by forces of attraction","Water rises by capillary action alone"],"a":2,"e":"Water rises because a continuous column of water is drawn up by transpiration pull; air bubbles would break the column so the water molecules are no longer held together, stopping the pull in that vessel."},{"id":"ch8a4","tp":"Source and sink","q":"A germinating seed uses stored starch to supply the growing embryo. How does this relate to sources and sinks?","o":["The seed is a sink because it stores starch","The seed is a source because it releases sucrose to the growing embryo","The embryo is a source and the seed is a sink","The seed is neither a source nor a sink"],"a":1,"e":"When a seed germinates, stored starch is converted to sucrose and released to the growing embryo, so the seed acts as a source and the embryo as a sink."},{"id":"ch8a5","tp":"Phloem function","q":"Why must the phloem transport amino acids from leaves to other parts of the plant?","o":["To provide water to growing tissues","To provide energy for xylem transport","To replace lignified cell walls","To supply material for making proteins in growing regions"],"a":3,"e":"Amino acids are transported in the phloem to growing regions such as roots and fruits, where they are used to make proteins."},{"id":"ch8a6","tp":"Wilting","q":"On a hot, dry, windy day, water loss from a plant may exceed water uptake. What is the most likely result?","o":["The plant wilts as cells lose water and become less turgid","The plant grows faster because transpiration increases","The xylem vessels collapse permanently","The phloem stops transporting sucrose"],"a":0,"e":"When water loss exceeds uptake, cells lose turgidity and the plant wilts. Wilting reduces the exposed leaf surface, helping to reduce further water loss."},{"id":"ch8a7","tp":"Transpiration","q":"Which combination of features would make a leaf lose the most water vapour?","o":["Small internal air spaces and few stomata","Small internal air spaces and many stomata","Large internal air spaces and many stomata","Large internal air spaces and no stomata"],"a":2,"e":"Water vapour loss is increased by a large internal surface area (large interconnecting air spaces) and by many stomata, which provide more openings for diffusion."},{"id":"ch8a8","tp":"Water uptake","q":"A plant is watered with salt water, so the solute concentration in the soil water rises. What effect does this have on water uptake by the root hairs?","o":["Water uptake increases because the solute concentration outside is higher","Water uptake decreases because the concentration gradient for water is reduced or reversed","Water uptake is unaffected because root hairs always absorb water","The xylem fills with salt instead of water"],"a":1,"e":"Root hairs absorb water by osmosis; a higher solute concentration in the soil water reduces or reverses the concentration gradient, so water uptake decreases and the plant may wilt."},{"id":"ch8a9","tp":"Source and sink","q":"Some leaves are removed from a plant. What is the most likely effect on phloem transport in that plant?","o":["More sucrose is produced and transported","The xylem stops transporting water","There are fewer sources, so less sucrose is available for transport","The roots become sources"],"a":3,"e":"Leaves are the main sources of sucrose. Removing leaves reduces the number of sources, so less sucrose is released into the phloem for translocation to sinks."},{"id":"ch8a10","tp":"Experimental design","q":"In an investigation of the effect of temperature on transpiration rate using a potometer, which variables should be kept constant?","o":["Wind speed, humidity and light intensity","Only the temperature","Only the number of leaves","The time of day and nothing else"],"a":0,"e":"To test only the effect of temperature, the other factors that affect transpiration (wind, humidity, light) must be kept constant as control variables."},{"id":"ch8a11","tp":"Water pathway","q":"In an investigation using a suitable stain such as eosin, which tissue would be coloured after a cut shoot is placed in the stain for an hour?","o":["Phloem","Epidermis","Xylem","Cortex"],"a":2,"e":"The stain is carried up in the xylem, so the xylem tissue becomes coloured, showing the pathway of water through the stem."}],"basic_saq":[{"id":"ch8bs0","q":"State the functions of xylem and phloem.","mm":4,"ms":[{"p":"xylem transports water and mineral ions","pts":1},{"p":"xylem provides support","pts":1},{"p":"phloem transports sucrose","pts":1},{"p":"phloem transports amino acids","pts":1}],"e":"These are the functions of the two transport tissues listed in section 8.1."},{"id":"ch8bs1","q":"State the pathway taken by water through the root, stem and leaf of a plant.","mm":4,"ms":[{"p":"root hair cells","pts":1},{"p":"root cortex cells","pts":1},{"p":"xylem","pts":1},{"p":"mesophyll cells","pts":1}],"e":"This is the water pathway given in section 8.2."}],"review_saq":[{"id":"ch8rs0","q":"Describe how water is lost from a leaf and explain how this loss moves water up the xylem.","mm":4,"ms":[{"p":"water evaporates from the surfaces of the mesophyll cells into the air spaces","pts":1},{"p":"water vapour diffuses out of the leaf through the stomata","pts":1},{"p":"the loss of water creates a transpiration pull","pts":1},{"p":"the pull draws up a column of water molecules held together by forces of attraction (cohesion)","pts":1}],"e":"Combines the Core description of water loss with the Supplement explanation of transpiration pull."},{"id":"ch8rs1","q":"Explain the effects of temperature and humidity on the rate of transpiration.","mm":4,"ms":[{"p":"an increase in temperature increases the rate of transpiration","pts":1},{"p":"because it increases the rate of evaporation of water from the mesophyll cells","pts":1},{"p":"an increase in humidity decreases the rate of transpiration","pts":1},{"p":"because the concentration gradient of water vapour between the leaf and the air is reduced","pts":1}],"e":"Both effects are explained in section 8.3 Supplement."}],"adv_saq":[{"id":"ch8as0","q":"Explain how and why wilting occurs.","mm":4,"ms":[{"p":"wilting occurs when a plant loses water faster than it absorbs water","pts":1},{"p":"cells lose water and become less turgid (lose turgidity)","pts":1},{"p":"the leaves and stem droop","pts":1},{"p":"this reduces the surface area exposed to the air, helping to reduce further water loss","pts":1}],"e":"Section 8.3 Supplement asks students to explain how and why wilting occurs."},{"id":"ch8as1","q":"Explain why some parts of a plant may act as a source at one time and as a sink at another time.","mm":4,"ms":[{"p":"a source releases sucrose or amino acids, while a sink uses or stores them","pts":1},{"p":"the role of a part can change with the season or stage of growth","pts":1},{"p":"for example, a storage organ such as a potato tuber stores sucrose in summer, acting as a sink","pts":1},{"p":"in spring it releases sucrose to support new growth, acting as a source","pts":1}],"e":"Section 8.4 Supplement covers parts that act as sources and sinks at different times."}]},"ch9":{"pre":[{"id":"ch9p0","tp":"Circulatory system","q":"Which feature of the circulatory system ensures the one-way flow of blood?","o":["the muscular wall of the heart","valves","the septum","the coronary arteries"],"a":1,"e":"Valves prevent the backflow of blood, ensuring it flows in one direction. The muscular wall pumps blood but does not control direction."},{"id":"ch9p1","tp":"Blood components","q":"Which component of blood is a liquid that transports dissolved substances around the body?","o":["red blood cells","white blood cells","plasma","platelets"],"a":2,"e":"Plasma is the liquid part of blood and transports blood cells, ions, nutrients, urea, hormones and carbon dioxide."},{"id":"ch9p2","tp":"Blood components","q":"Which component of blood transports oxygen?","o":["platelets","white blood cells","plasma","red blood cells"],"a":3,"e":"Red blood cells transport oxygen using haemoglobin. Platelets, white blood cells and plasma do not carry oxygen."},{"id":"ch9p3","tp":"Circulatory system","q":"In the single circulation of a fish, how many times does blood pass through the heart in one complete circuit of the body?","o":["once","twice","three times","four times"],"a":0,"e":"A fish has a single circulation, so blood passes through the heart only once in each complete circuit."},{"id":"ch9p4","tp":"Circulatory system","q":"How many times does blood pass through the heart in one complete circuit of the body in a mammal?","o":["once","twice","three times","four times"],"a":1,"e":"Mammals have a double circulation, so blood passes through the heart twice in each complete circuit of the body."},{"id":"ch9p5","tp":"Blood vessels","q":"Which type of blood vessel carries blood back to the heart?","o":["arteries","capillaries","arterioles","veins"],"a":3,"e":"Blood returns to the heart in veins. Arteries carry blood away from the heart, and capillaries connect arteries to veins."},{"id":"ch9p6","tp":"Heart structure","q":"Which blood vessel carries blood from the heart to the lungs?","o":["pulmonary vein","aorta","pulmonary artery","vena cava"],"a":2,"e":"The pulmonary artery carries deoxygenated blood from the right ventricle to the lungs for gas exchange."},{"id":"ch9p7","tp":"Heart structure","q":"Which blood vessel carries oxygenated blood from the lungs to the heart?","o":["pulmonary artery","aorta","vena cava","pulmonary vein"],"a":3,"e":"The pulmonary vein carries oxygenated blood from the lungs to the left atrium of the heart."},{"id":"ch9p8","tp":"Heart structure","q":"Which blood vessels supply the muscle of the heart itself with blood?","o":["coronary arteries","pulmonary arteries","renal arteries","hepatic arteries"],"a":0,"e":"Coronary arteries supply the heart muscle with blood. Their blockage causes coronary heart disease."},{"id":"ch9p9","tp":"Blood vessels","q":"Which type of blood vessel contains valves that prevent the backflow of blood?","o":["arteries","veins","capillaries","arterioles"],"a":1,"e":"Veins contain valves because blood in them is at low pressure and could flow backwards. Arteries and capillaries do not have valves."},{"id":"ch9p10","tp":"Blood vessels","q":"What is the main function of capillaries?","o":["carrying blood away from the heart","carrying blood back to the heart","pumping blood around the body","allowing exchange of substances between blood and cells"],"a":3,"e":"Capillaries allow the exchange of substances, such as oxygen and glucose, between the blood and body cells."},{"id":"ch9p11","tp":"Blood components","q":"Which component of blood is involved in blood clotting?","o":["red blood cells","white blood cells","platelets","plasma"],"a":2,"e":"Platelets are involved in blood clotting, which prevents blood loss and the entry of pathogens."},{"id":"ch9p12","tp":"Heart monitoring","q":"Which method can be used to monitor the activity of the heart?","o":["taking a pulse","measuring blood glucose","checking urine","measuring body temperature"],"a":0,"e":"Heart activity can be monitored by ECG, pulse rate or listening to the sounds of valves closing; taking a pulse is one such method."},{"id":"ch9p13","tp":"Coronary heart disease","q":"Which factor increases the risk of coronary heart disease?","o":["regular exercise","a balanced diet","smoking","eating fruit and vegetables"],"a":2,"e":"Smoking is a risk factor for coronary heart disease, while regular exercise and a balanced diet reduce the risk."}],"basic":[{"id":"ch9b0","tp":"Heart structure","q":"What is the function of the septum in the mammalian heart?","o":["to separate oxygenated and deoxygenated blood","to pump blood into the arteries","to supply blood to the heart muscle","to prevent backflow of blood into the veins"],"a":0,"e":"The septum is a muscular wall that separates the left and right sides of the heart, preventing oxygenated and deoxygenated blood from mixing."},{"id":"ch9b1","tp":"Heart structure","q":"Blood returning to the heart from the body enters which chamber through the vena cava?","o":["left atrium","left ventricle","right atrium","right ventricle"],"a":2,"e":"The vena cava brings deoxygenated blood from the body into the right atrium of the heart."},{"id":"ch9b2","tp":"Blood vessels","q":"Which artery carries blood to the kidney?","o":["hepatic artery","renal artery","pulmonary artery","coronary artery"],"a":1,"e":"The renal artery carries blood to the kidney; the renal vein carries blood away from the kidney."},{"id":"ch9b3","tp":"Blood vessels","q":"Which feature is found in arteries but not in capillaries?","o":["a wall one cell thick","valves","a very narrow lumen","a thick muscular wall"],"a":3,"e":"Arteries have thick, muscular, elastic walls to withstand the high pressure of blood from the heart. Capillaries have walls one cell thick and no valves."},{"id":"ch9b4","tp":"Blood components","q":"Which component of blood produces antibodies?","o":["red blood cells","platelets","phagocytes","lymphocytes"],"a":3,"e":"Lymphocytes (a type of white blood cell) produce antibodies. Phagocytes engulf pathogens by phagocytosis."},{"id":"ch9b5","tp":"Blood components","q":"Which substance is transported dissolved in plasma?","o":["oxygen","carbon dioxide","haemoglobin","fibrin"],"a":1,"e":"Plasma transports carbon dioxide, along with blood cells, ions, nutrients, urea and hormones. Oxygen is carried by haemoglobin in red blood cells."},{"id":"ch9b6","tp":"Blood clotting","q":"What are the roles of blood clotting?","o":["to prevent blood loss and the entry of pathogens","to transport oxygen and remove carbon dioxide","to produce antibodies and engulf pathogens","to pump blood around the body"],"a":0,"e":"Clotting prevents blood loss from a damaged vessel and prevents pathogens from entering the body through a wound."},{"id":"ch9b7","tp":"Heart monitoring","q":"What happens to the heart rate during physical activity?","o":["it increases","it decreases","it stays the same","it stops"],"a":0,"e":"Heart rate increases during physical activity so that more blood, carrying oxygen and glucose, is delivered to respiring muscles."},{"id":"ch9b8","tp":"Blood vessels","q":"Which blood vessel carries oxygenated blood from the heart to the rest of the body?","o":["pulmonary artery","vena cava","aorta","pulmonary vein"],"a":2,"e":"The aorta carries oxygenated blood from the left ventricle to the rest of the body."},{"id":"ch9b9","tp":"Heart structure","q":"Which chamber of the heart receives oxygenated blood from the lungs?","o":["right atrium","right ventricle","left atrium","left ventricle"],"a":2,"e":"The pulmonary vein carries oxygenated blood from the lungs to the left atrium of the heart."},{"id":"ch9b10","tp":"Blood vessels","q":"Which blood vessel normally carries deoxygenated blood?","o":["aorta","pulmonary vein","pulmonary artery","renal artery"],"a":2,"e":"The pulmonary artery is the only artery that carries deoxygenated blood; it takes blood from the right ventricle to the lungs."},{"id":"ch9b11","tp":"Blood vessels","q":"Which blood vessel carries blood from the small intestine to the liver?","o":["hepatic vein","hepatic portal vein","hepatic artery","renal vein"],"a":1,"e":"The hepatic portal vein carries blood rich in digested nutrients from the small intestine to the liver."}],"review":[{"id":"ch9r0","tp":"Circulatory system","q":"Which statement about the single circulation of a fish is correct?","o":["blood passes through the heart twice in each circuit","blood passes through the heart once in each circuit","blood is pumped to the body before it reaches the gills","oxygenated and deoxygenated blood are kept fully separate"],"a":1,"e":"In a fish's single circulation blood passes through the heart once per circuit: heart, then gills, then the body, then back to the heart."},{"id":"ch9r1","tp":"Circulatory system","q":"What is an advantage of the double circulation of a mammal compared with the single circulation of a fish?","o":["blood flows more slowly through the lungs","the heart beats fewer times per minute","no valves are needed in the heart","blood is pumped to the body at a higher pressure"],"a":3,"e":"In a double circulation blood is re-pumped by the heart after passing through the lungs, so it reaches the body at higher pressure than in a fish."},{"id":"ch9r2","tp":"Heart function","q":"During a heartbeat, which sequence of events is correct?","o":["ventricles contract, then atria contract","atria contract, then ventricles contract","atria and ventricles contract at the same time","the heart relaxes before the atria contract"],"a":1,"e":"The atria contract first, pushing blood into the ventricles; the ventricles then contract, pushing blood out of the heart."},{"id":"ch9r3","tp":"Heart structure","q":"Why is the wall of the left ventricle thicker than the wall of the right ventricle?","o":["it pumps blood to the lungs, which are far away","it receives blood at high pressure from the lungs","it pumps blood all the way around the body at high pressure","it contains oxygenated blood, which is heavier"],"a":2,"e":"The left ventricle pumps blood all the way around the body, so it needs a thicker muscular wall to generate higher pressure than the right ventricle, which pumps blood only to the nearby lungs."},{"id":"ch9r4","tp":"Blood vessels","q":"Compared with arteries, how are the walls and lumens of veins different?","o":["thinner walls and larger lumens","thinner walls and smaller lumens","thicker walls and larger lumens","thicker walls and smaller lumens"],"a":0,"e":"Veins have thinner walls and larger lumens than arteries because blood in veins is at lower pressure."},{"id":"ch9r5","tp":"Blood vessels","q":"Which blood vessel carries blood away from the liver?","o":["hepatic portal vein","hepatic artery","hepatic vein","renal vein"],"a":2,"e":"The hepatic vein carries blood away from the liver towards the heart. The hepatic artery brings blood to the liver and the hepatic portal vein brings blood from the small intestine."},{"id":"ch9r6","tp":"Heart structure","q":"Which structure prevents blood flowing back from the left ventricle into the left atrium?","o":["atrioventricular (bicuspid) valve","semilunar valve","septum","coronary artery"],"a":0,"e":"The atrioventricular (bicuspid) valve between the left atrium and left ventricle prevents backflow into the atrium when the ventricle contracts."},{"id":"ch9r7","tp":"Coronary heart disease","q":"Which combination of lifestyle choices most reduces the risk of coronary heart disease?","o":["a diet high in fat and little exercise","smoking and a diet high in salt","a balanced diet and regular exercise","avoiding exercise and ignoring stress"],"a":2,"e":"A balanced diet and regular exercise reduce the risk of coronary heart disease, while smoking, a fatty diet and lack of exercise increase the risk."},{"id":"ch9r8","tp":"Blood components","q":"Which cells engulf and digest pathogens?","o":["lymphocytes","red blood cells","platelets","phagocytes"],"a":3,"e":"Phagocytes engulf and digest pathogens by phagocytosis. Lymphocytes produce antibodies."},{"id":"ch9r9","tp":"Heart structure","q":"Which is the correct pathway of blood from the lungs to the aorta?","o":["pulmonary vein, left atrium, left ventricle, aorta","pulmonary vein, right atrium, right ventricle, aorta","pulmonary artery, left atrium, left ventricle, aorta","pulmonary vein, left atrium, right ventricle, aorta"],"a":0,"e":"Oxygenated blood from the lungs flows along the pulmonary vein into the left atrium, then the left ventricle, and is pumped into the aorta."},{"id":"ch9r10","tp":"Heart monitoring","q":"What does an ECG (electrocardiogram) record?","o":["the volume of blood pumped per beat","the blood pressure in the arteries","the oxygen content of the blood","the electrical activity of the heart"],"a":3,"e":"An ECG records the electrical activity of the heart. Pulse rate and listening to valve sounds are other ways of monitoring the heart."},{"id":"ch9r11","tp":"Blood components","q":"Which two substances are transported mainly in the plasma?","o":["urea and carbon dioxide","oxygen and urea","haemoglobin and oxygen","oxygen and carbon dioxide"],"a":0,"e":"Plasma transports urea and carbon dioxide. Oxygen is mainly carried by haemoglobin inside red blood cells."}],"adv":[{"id":"ch9a0","tp":"Circulatory system","q":"In a fish, blood is pumped to the gills before it reaches the rest of the body. What is a consequence of this?","o":["blood reaches the body at low pressure, so oxygen is delivered to body cells relatively slowly","blood is pumped through the heart again before reaching the body","the gills receive deoxygenated blood and cannot absorb oxygen","the heart of a fish has two separate pumps"],"a":0,"e":"In a single circulation blood loses pressure passing through the gills, so it reaches the body at low pressure; in a double circulation the blood is re-pumped and reaches the body at higher pressure."},{"id":"ch9a1","tp":"Circulatory system","q":"Which is an advantage of the double circulation of a mammal compared with a single circulation?","o":["the heart has only two chambers","blood passes through the gills for gas exchange","oxygenated and deoxygenated blood are kept separate","blood flows slowly to the body"],"a":2,"e":"A double circulation keeps oxygenated and deoxygenated blood separate and delivers blood to the body at higher pressure because it is re-pumped after passing through the lungs."},{"id":"ch9a2","tp":"Heart structure","q":"Why is the wall of the atria thinner than the wall of the ventricles?","o":["the atria only pump blood into the ventricles, a short distance away","the atria receive blood at lower pressure","the atria do not need to pump blood at all","the atria contain oxygenated blood"],"a":0,"e":"Atria only pump blood a short distance into the ventricles, so they need less muscle than the ventricles, which pump blood out of the heart."},{"id":"ch9a3","tp":"Heart function","q":"What is the function of the semilunar valves?","o":["to prevent backflow of blood from the ventricles into the atria","to prevent backflow of blood from the arteries into the ventricles","to separate the right and left sides of the heart","to supply blood to the heart muscle"],"a":1,"e":"Semilunar valves at the base of the aorta and pulmonary artery prevent backflow of blood from these arteries into the ventricles."},{"id":"ch9a4","tp":"Blood vessels","q":"Blood pressure in the aorta rises sharply when the ventricles contract. Which feature of arteries helps them withstand this pressure?","o":["their one-cell-thick walls","their thin walls","their elastic, muscular walls","their valves"],"a":2,"e":"Arteries have thick, elastic, muscular walls that withstand the high pressure of blood pumped from the heart."},{"id":"ch9a5","tp":"Blood vessels","q":"Which statement explains why veins have valves but arteries do not?","o":["veins carry deoxygenated blood","veins carry blood towards the heart","blood in veins is at low pressure and may flow backwards","veins have thinner walls"],"a":2,"e":"Blood in veins is at low pressure after passing through capillaries, so valves prevent it from flowing backwards; blood in arteries is at high pressure and flows away from the heart."},{"id":"ch9a6","tp":"Blood vessels","q":"Which features of capillaries make them well suited to the exchange of substances?","o":["thick walls and a wide lumen","muscular walls and valves","elastic walls and a wide lumen","walls one cell thick and a narrow lumen"],"a":3,"e":"Capillaries have walls one cell thick (short diffusion distance) and a narrow lumen so blood cells pass close to the wall, making exchange efficient."},{"id":"ch9a7","tp":"Blood clotting","q":"During blood clotting, what does the fibrin form?","o":["a plug of white blood cells","a mesh that traps red blood cells and platelets","a layer of plasma","a clot made only of platelets"],"a":1,"e":"Fibrin forms a mesh that traps red blood cells and platelets, forming a clot that seals the wound, preventing blood loss and entry of pathogens."},{"id":"ch9a8","tp":"Cardiac output","q":"Cardiac output is the volume of blood pumped by the heart in one minute, calculated as heart rate multiplied by the volume pumped per beat. A person has a heart rate of 72 beats per minute and pumps 80 cm³ of blood per beat. What is the cardiac output?","o":["72 cm³ per minute","152 cm³ per minute","90 cm³ per minute","5760 cm³ per minute"],"a":3,"e":"Cardiac output = heart rate × volume per beat = 72 × 80 = 5760 cm³ per minute."},{"id":"ch9a9","tp":"Heart function","q":"Why does the heart rate increase during strenuous exercise?","o":["muscles need more oxygen and glucose, and more carbon dioxide must be removed","the heart needs more time to rest between beats","blood pressure decreases during exercise","the valves close more slowly during exercise"],"a":0,"e":"During exercise, respiring muscles need more oxygen and glucose and produce more carbon dioxide; a higher heart rate delivers more blood and removes carbon dioxide faster."},{"id":"ch9a10","tp":"Heart structure","q":"The right ventricle pumps blood to the lungs and the left ventricle pumps blood to the body. Which statement about the pressure generated is correct?","o":["the right ventricle generates higher pressure than the left ventricle","both ventricles generate the same pressure","neither ventricle generates any pressure","the left ventricle generates higher pressure than the right ventricle"],"a":3,"e":"The left ventricle has a thicker wall and generates higher pressure because it pumps blood to the whole body, whereas the right ventricle pumps blood only to the nearby lungs."},{"id":"ch9a11","tp":"Blood components","q":"A blood sample contains cells with large nuclei, some of which engulf bacteria. How are these cells classified?","o":["both are red blood cells","one is a red blood cell and one is a platelet","both are white blood cells","both are platelets"],"a":2,"e":"White blood cells (phagocytes and lymphocytes) have large nuclei, and phagocytes engulf bacteria. Red blood cells have no nucleus and platelets are small fragments."}],"basic_saq":[{"id":"ch9bs0","tp":"Blood components","q":"State the function of any three named components of blood.","mm":3,"ms":[{"p":"red blood cells transport oxygen (using haemoglobin)","pts":1},{"p":"white blood cells defend the body (phagocytosis / antibody production)","pts":1},{"p":"platelets help blood to clot / plasma transports substances","pts":1}],"e":"Each of the four components has a distinct function; naming three with their functions earns three marks."},{"id":"ch9bs1","tp":"Blood vessels","q":"State the main function of capillaries and give two structural features that help them carry out this function.","mm":3,"ms":[{"p":"allow exchange of substances between the blood and body cells","pts":1},{"p":"wall is one cell thick, giving a short diffusion distance","pts":1},{"p":"narrow lumen / form a large network close to cells","pts":1}],"e":"Capillaries are adapted for exchange by having very thin walls and being close to the cells they serve."}],"review_saq":[{"id":"ch9rs0","tp":"Heart structure","q":"Explain why the muscular wall of the left ventricle is thicker than the wall of the right ventricle.","mm":3,"ms":[{"p":"the left ventricle pumps blood all the way around the body","pts":1},{"p":"so it must generate a higher pressure","pts":1},{"p":"the right ventricle only pumps blood to the lungs (a shorter distance at lower pressure)","pts":1}],"e":"The left ventricle needs a thicker wall to generate the higher pressure needed to pump blood around the whole body."},{"id":"ch9rs1","tp":"Heart function","q":"Describe the sequence of events when the heart beats, including the action of the valves.","mm":4,"ms":[{"p":"the atria contract, forcing blood into the ventricles","pts":1},{"p":"the ventricles then contract, forcing blood out of the heart","pts":1},{"p":"atrioventricular valves prevent backflow of blood from the ventricles into the atria","pts":1},{"p":"semilunar valves prevent backflow of blood from the arteries into the ventricles","pts":1}],"e":"The atria contract first, then the ventricles; valves ensure that blood flows in one direction."}],"adv_saq":[{"id":"ch9as0","tp":"Circulatory system","q":"Compare the single circulation of a fish with the double circulation of a mammal, and explain one advantage of the double circulation.","mm":4,"ms":[{"p":"in a fish, blood passes through the heart once in each circuit of the body","pts":1},{"p":"in a mammal, blood passes through the heart twice in each circuit of the body","pts":1},{"p":"the double circulation keeps oxygenated and deoxygenated blood separate","pts":1},{"p":"blood is re-pumped after the lungs, so it reaches the body at higher pressure","pts":1}],"e":"Fish have a single circulation; mammals have a double circulation, which separates oxygenated and deoxygenated blood and delivers blood to the body at higher pressure."},{"id":"ch9as1","tp":"Blood clotting","q":"Describe the process of blood clotting at the site of a damaged blood vessel.","mm":3,"ms":[{"p":"fibrinogen is converted to fibrin","pts":1},{"p":"fibrin forms a mesh","pts":1},{"p":"the mesh traps red blood cells / platelets, forming a clot that prevents blood loss and entry of pathogens","pts":1}],"e":"Clotting involves the conversion of fibrinogen to fibrin, which forms a mesh that traps blood cells and seals the wound."}]},"ch10":{"pre":[{"id":"ch10p0","tp":"Pathogen","q":"What is a pathogen?","o":["an organism that breaks down dead matter","a cell that carries oxygen in the blood","an organism that causes disease","a protein that kills bacteria"],"a":2,"e":"A pathogen is defined as a disease-causing organism, such as certain bacteria, viruses, fungi and protoctists."},{"id":"ch10p1","tp":"Transmission","q":"Which statement best describes a transmissible disease?","o":["a disease in which the pathogen can be passed from one host to another","a disease caused by a lack of vitamins in the diet","a disease that is always inherited from the parents","a disease that affects only plants"],"a":0,"e":"A transmissible disease is one in which the pathogen can be passed from one host to another, for example by direct contact or indirectly."},{"id":"ch10p2","tp":"Transmission","q":"Which is an example of direct transmission of a pathogen?","o":["breathing in air containing pathogens","drinking water contaminated with pathogens","eating food contaminated with pathogens","shaking hands with an infected person"],"a":3,"e":"Direct contact, including through blood and other body fluids, passes pathogens straight between hosts; shaking hands is direct contact."},{"id":"ch10p3","tp":"Transmission","q":"Which is an example of indirect transmission of a pathogen?","o":["receiving a blood transfusion from an infected person","touching a contaminated surface","being bitten by an infected person","a mother passing a pathogen to her baby through the placenta"],"a":1,"e":"Indirect transmission includes pathogens passed from contaminated surfaces, food, animals and air; touching a contaminated surface is indirect."},{"id":"ch10p4","tp":"Body defences","q":"Which of the following is a body defence against pathogens?","o":["skin","red blood cells","ribosomes","plasma"],"a":0,"e":"The skin is a body defence because it acts as a barrier that prevents pathogens entering the body."},{"id":"ch10p5","tp":"Body defences","q":"What is the function of the hairs inside the nose?","o":["to produce mucus","to warm the incoming air","to trap pathogens and dust","to detect smells only"],"a":2,"e":"Hairs in the nose trap pathogens and dust, preventing them from being carried further into the respiratory tract."},{"id":"ch10p6","tp":"Body defences","q":"Where in the body does mucus help to trap pathogens?","o":["in the stomach","in the respiratory passages","in the bloodstream","in the kidney tubules"],"a":1,"e":"Mucus in the respiratory passages traps pathogens, which can then be removed from the body."},{"id":"ch10p7","tp":"Body defences","q":"How does stomach acid help to defend the body against disease?","o":["it produces antibodies","it digests proteins for energy","it traps pathogens in sticky fluid","it kills pathogens in food and drink"],"a":3,"e":"Stomach acid kills many pathogens that are taken into the body with food and drink."},{"id":"ch10p8","tp":"Body defences","q":"Which cells defend the body by destroying pathogens?","o":["white blood cells","red blood cells","nerve cells","fat cells"],"a":0,"e":"White blood cells are a body defence that destroys pathogens; red blood cells carry oxygen."},{"id":"ch10p9","tp":"Disease control","q":"Why is a clean water supply important in controlling the spread of disease?","o":["it dilutes the stomach acid","it provides nutrients for white blood cells","it prevents pathogens being taken into the body in contaminated water","it kills pathogens in the air"],"a":2,"e":"A clean water supply prevents pathogens in contaminated water from entering the body, reducing water-borne disease."},{"id":"ch10p10","tp":"Disease control","q":"How does hygienic food preparation help to control the spread of disease?","o":["it makes the food taste better","it prevents pathogens in contaminated food entering the body","it adds vitamins to the food","it removes all useful bacteria from the intestine"],"a":1,"e":"Hygienic food preparation stops pathogens in contaminated food from entering the body and causing disease."},{"id":"ch10p11","tp":"Disease control","q":"Which personal hygiene practice helps to control the spread of disease?","o":["drinking more water","eating more fruit","taking regular exercise","washing hands after using the toilet"],"a":3,"e":"Good personal hygiene, such as washing hands after using the toilet, reduces the spread of pathogens."},{"id":"ch10p12","tp":"Antigens and antibodies","q":"What is an antigen?","o":["a molecule on the surface of a pathogen that has a specific shape","a type of white blood cell","an enzyme that digests bacteria","a toxin released by a pathogen"],"a":0,"e":"Each pathogen has its own antigens, which are molecules with specific shapes that the immune system can recognise."},{"id":"ch10p13","tp":"Cholera","q":"How is cholera transmitted?","o":["through the air","in contaminated water","by direct skin contact","by animal bites"],"a":1,"e":"Cholera is a disease caused by a bacterium that is transmitted in contaminated water."}],"basic":[{"id":"ch10b0","tp":"Active immunity","q":"What is active immunity?","o":["antibodies are injected directly into the body","the body produces its own antibodies against a pathogen","immunity is inherited from the parents","antibodies are absorbed from food"],"a":1,"e":"Active immunity is defence against a pathogen by antibody production in the body itself."},{"id":"ch10b1","tp":"Antigens and antibodies","q":"Each pathogen has its own antigens. What is special about these antigens?","o":["they are all the same shape in every pathogen","they can change into antibodies","they have specific shapes","they are made only of lipids"],"a":2,"e":"Each pathogen has its own antigens, which have specific shapes that the immune system recognises."},{"id":"ch10b2","tp":"Antigens and antibodies","q":"Antibodies are what type of molecule?","o":["proteins","carbohydrates","lipids","minerals"],"a":0,"e":"Antibodies are proteins that bind to antigens."},{"id":"ch10b3","tp":"Antigens and antibodies","q":"How do antibodies lead to the destruction of pathogens?","o":["they engulf pathogens directly","they produce more antigens","they digest pathogens with stomach acid","they bind to antigens and mark pathogens for destruction by phagocytes"],"a":3,"e":"Antibodies bind to antigens, leading to direct destruction of pathogens or marking of pathogens for destruction by phagocytes."},{"id":"ch10b4","tp":"Antigens and antibodies","q":"Why does a specific antibody fit a specific antigen?","o":["because both are made of the same protein","because they have complementary shapes","because the antibody is much larger","because antigens move towards antibodies"],"a":1,"e":"Specific antibodies have complementary shapes that fit specific antigens, like a lock and its key."},{"id":"ch10b5","tp":"Active immunity","q":"Active immunity can be gained in which two ways?","o":["after an infection by a pathogen or by vaccination","by antibodies from the mother or by injection","by vaccination or by antibodies in breast milk","by breastfeeding or by placental transfer"],"a":0,"e":"Active immunity is gained after an infection by a pathogen or by vaccination."},{"id":"ch10b6","tp":"Vaccination","q":"What is put into the body during vaccination?","o":["live, fully active pathogens","ready-made antibodies","weakened pathogens or their antigens","memory cells from another person"],"a":2,"e":"Vaccination puts weakened pathogens or their antigens into the body to stimulate immunity."},{"id":"ch10b7","tp":"Vaccination","q":"After vaccination, which cells produce antibodies?","o":["red blood cells","phagocytes","platelets","lymphocytes"],"a":3,"e":"The antigens in the vaccine stimulate an immune response by lymphocytes, which produce antibodies."},{"id":"ch10b8","tp":"Vaccination","q":"What do the memory cells produced during vaccination provide?","o":["short-term immunity","long-term immunity","immediate destruction of all pathogens","production of antigens"],"a":1,"e":"Memory cells produced during vaccination give long-term immunity."},{"id":"ch10b9","tp":"Passive immunity","q":"How is passive immunity acquired?","o":["antibodies are acquired from another individual","the body makes its own antibodies","by vaccination","by catching the disease"],"a":0,"e":"Passive immunity is a defence by antibodies acquired from another individual, such as across the placenta or in breast milk."},{"id":"ch10b10","tp":"Passive immunity","q":"Which term best describes passive immunity?","o":["permanent","lifelong","short-term","inherited"],"a":2,"e":"Passive immunity is a short-term defence against a pathogen because the antibodies are not replaced."},{"id":"ch10b11","tp":"Passive immunity","q":"Why is breast-feeding important for an infant's immunity?","o":["breast milk contains weakened pathogens","breast milk contains antibodies from the mother","breast milk is completely sterile","breast milk contains memory cells"],"a":1,"e":"Breast-feeding gives the infant antibodies from the mother, providing passive immunity."}],"review":[{"id":"ch10r0","tp":"Disease control","q":"Why does proper waste disposal help to control the spread of disease?","o":["it provides food for decomposers","it prevents pathogens breeding in rotting waste","it kills pathogens already inside the body","it reduces the number of white blood cells needed"],"a":1,"e":"Proper waste disposal prevents pathogens breeding in rotting waste, reducing the spread of disease."},{"id":"ch10r1","tp":"Disease control","q":"What is the importance of sewage treatment in controlling disease?","o":["it adds minerals to rivers","it produces clean drinking water directly","it removes the need for vaccination","it removes pathogens from sewage before they reach water supplies"],"a":3,"e":"Sewage treatment removes pathogens from sewage before they can contaminate water supplies, helping to control water-borne disease."},{"id":"ch10r2","tp":"Transmission","q":"A person becomes infected after receiving a blood transfusion from someone with a transmissible disease. How was the pathogen transmitted?","o":["by direct contact through blood","through the air","by contaminated food","by an animal vector"],"a":0,"e":"Pathogens can be transmitted by direct contact, including through blood and other body fluids."},{"id":"ch10r3","tp":"Transmission","q":"Which is an example of indirect transmission of a pathogen by animals?","o":["a person is bitten on the arm","a person breathes in droplets from a sneeze","a rat contaminates stored food with pathogens","a mother passes antibodies to her baby"],"a":2,"e":"Indirect transmission includes pathogens from contaminated animals, for example a rat contaminating stored food."},{"id":"ch10r4","tp":"Body defences","q":"A person eats food contaminated with pathogens. Which body defences will act against the pathogens?","o":["stomach acid and white blood cells","hairs in the nose and mucus","skin and mucus","only the skin"],"a":0,"e":"Stomach acid kills pathogens taken in with food and drink, and white blood cells destroy any pathogens that enter the body."},{"id":"ch10r5","tp":"Passive immunity","q":"How does a fetus gain passive immunity before birth?","o":["by vaccination of the mother","by antibodies crossing the placenta from the mother","by producing its own antibodies","by swallowing amniotic fluid"],"a":1,"e":"Before birth, a fetus gains passive immunity from antibodies that cross the placenta from the mother."},{"id":"ch10r6","tp":"Passive immunity","q":"Which statement about passive immunity is correct?","o":["memory cells are not produced","memory cells are produced for life","memory cells are produced in the bone marrow","the person produces their own antibodies"],"a":0,"e":"Memory cells are not produced in passive immunity, which is why it is only short-term."},{"id":"ch10r7","tp":"Cholera","q":"What causes the diarrhoea in cholera?","o":["the bacterium blocks the small intestine","the bacterium kills red blood cells","the bacterial toxin causes chloride ions to be secreted into the gut, so water moves in by osmosis","the bacterium digests the lining of the gut"],"a":2,"e":"The cholera bacterium produces a toxin that causes secretion of chloride ions into the small intestine, causing osmotic movement of water into the gut and so diarrhoea."},{"id":"ch10r8","tp":"Transmission","q":"A person with a transmissible disease covers their nose and mouth when sneezing. How does this help to control the spread of the disease?","o":["it kills the pathogen in the respiratory tract","it reduces the spread of the pathogen through the air","it gives the person active immunity","it increases the production of antibodies"],"a":1,"e":"Covering the nose and mouth when sneezing reduces the spread of pathogens through the air in droplets, helping to control transmission."},{"id":"ch10r9","tp":"Cholera","q":"Which ions does the cholera toxin cause to be secreted into the small intestine?","o":["calcium ions","iron ions","potassium ions","chloride ions"],"a":3,"e":"The cholera toxin causes secretion of chloride ions into the small intestine."},{"id":"ch10r10","tp":"Disease control","q":"Washing hands before preparing food reduces the risk of transmitting a pathogen by which route?","o":["by direct contact and by contaminated food","by air only","by animal bites","by contaminated water only"],"a":0,"e":"Washing hands removes pathogens that could be passed on by direct contact and prevents contamination of food."},{"id":"ch10r11","tp":"Antigens and antibodies","q":"Why does a vaccine against one disease not protect against a different disease?","o":["vaccines contain antibodies, not antigens","memory cells for one pathogen attack all pathogens","lymphocytes are not involved in the response","the antibodies produced have complementary shapes to the antigens of that pathogen only"],"a":3,"e":"Antibodies are specific: they have complementary shapes that fit only the antigens of the pathogen used in the vaccine, so a vaccine protects against only that disease."}],"adv":[{"id":"ch10a0","tp":"Active immunity","q":"Which statement correctly compares active and passive immunity?","o":["active immunity involves antibodies from another individual, while passive immunity involves the body making its own antibodies","both active and passive immunity produce memory cells","active immunity involves the body producing its own antibodies, while passive immunity involves antibodies acquired from another individual","passive immunity lasts longer than active immunity"],"a":2,"e":"Active immunity is defence by antibody production in the body; passive immunity is a short-term defence by antibodies acquired from another individual."},{"id":"ch10a1","tp":"Vaccination","q":"A vaccinated person is later infected with the same pathogen. What is the role of the memory cells produced by the vaccine?","o":["they become antibodies","they divide quickly and produce large numbers of the correct antibodies","they engulf the pathogen directly","they prevent the pathogen entering the body"],"a":1,"e":"Memory cells produced during vaccination enable a rapid response: they divide and produce large numbers of antibodies specific to the pathogen."},{"id":"ch10a2","tp":"Cholera","q":"The cholera toxin causes chloride ions to be secreted into the small intestine. What happens next?","o":["water moves by active transport into the blood","chloride ions move by diffusion into the blood","the intestine stops absorbing glucose","water moves by osmosis into the gut"],"a":3,"e":"Secretion of chloride ions into the small intestine causes osmotic movement of water into the gut."},{"id":"ch10a3","tp":"Antigens and antibodies","q":"A lymphocyte produces antibodies against one type of pathogen but not against others. What explains this?","o":["the antibody has a complementary shape that fits the specific antigen of that pathogen","lymphocytes can only work in one part of the body","all antibodies are identical","antigens of other pathogens are too large to bind"],"a":0,"e":"Specific antibodies have complementary shapes that fit specific antigens, so each antibody binds only to its matching antigen."},{"id":"ch10a4","tp":"Active immunity","q":"Which statement about active immunity gained by infection and active immunity gained by vaccination is correct?","o":["infection produces antibodies but vaccination does not","vaccination gives passive immunity while infection gives active immunity","in both cases the body produces antibodies and memory cells","vaccination produces memory cells but infection does not"],"a":2,"e":"Both infection and vaccination are forms of active immunity: the body produces antibodies, and memory cells give long-term immunity."},{"id":"ch10a5","tp":"Active immunity","q":"Person 1 has just recovered from a bacterial infection. Person 2 has been given ready-made antibodies by injection. Which statement is correct?","o":["Person 1 has passive immunity and Person 2 has active immunity","Person 1 has active immunity and Person 2 has memory cells","Person 1 has no immunity and Person 2 has active immunity","Person 1 has active immunity and Person 2 has no memory cells"],"a":3,"e":"Person 1 recovered from an infection, so the body made its own antibodies (active immunity) and memory cells. Person 2 received ready-made antibodies (passive immunity), so no memory cells are produced."},{"id":"ch10a6","tp":"Vaccination","q":"Some vaccines contain only the antigens of a pathogen, with no whole pathogen present. Why can such a vaccine still provide immunity?","o":["the antigens stimulate lymphocytes to produce antibodies and memory cells","antigens directly destroy the pathogen","antigens change into antibodies inside the body","antigens are converted into white blood cells"],"a":0,"e":"The antigens in the vaccine stimulate an immune response by lymphocytes, which produce antibodies and memory cells, giving long-term immunity."},{"id":"ch10a7","tp":"Cholera","q":"During a cholera outbreak, a town treats its water supply to remove pathogens. Why does the number of new cases fall?","o":["because people develop active immunity more quickly","because the bacterium can no longer be transmitted in contaminated water","because the bacterium is killed inside people's intestines","because people produce more stomach acid"],"a":1,"e":"Cholera is transmitted in contaminated water; removing pathogens from the water supply breaks the transmission route, so new cases fall."},{"id":"ch10a8","tp":"Vaccination","q":"In a school, most students are vaccinated against a transmissible disease but a few are not. Why do the unvaccinated students also gain some prot
