ection?","o":["fewer people can catch and transmit the pathogen, so it spreads less","the vaccine kills pathogens in the air","unvaccinated students produce antibodies spontaneously","vaccinated students pass antibodies to unvaccinated students"],"a":0,"e":"Vaccinating most people reduces the number who can transmit the pathogen, so there is less chance of the unvaccinated few being exposed."},{"id":"ch10a9","tp":"Body defences","q":"Which combination of body defences is most important for preventing pathogens entering through the respiratory tract?","o":["skin and stomach acid","stomach acid and white blood cells","white blood cells and skin","hairs in the nose and mucus"],"a":3,"e":"Hairs in the nose trap pathogens and mucus traps pathogens in the respiratory passages, preventing them reaching the lungs."},{"id":"ch10a10","tp":"Cholera","q":"During cholera, why does the water content of the patient's blood decrease?","o":["the bacterium adds solutes to the blood","water moves from the blood into the gut and is lost in diarrhoea","the kidneys produce extra urine","the liver releases water into the intestine"],"a":1,"e":"The osmotic movement of water into the gut, followed by diarrhoea, removes water from the blood and causes dehydration."},{"id":"ch10a11","tp":"Vaccination","q":"Why are weakened (inactive) pathogens, rather than fully active ones, used in vaccines?","o":["weakened pathogens are easier to inject","weakened pathogens produce more antibodies","they stimulate an immune response without causing the disease","they destroy other pathogens in the body"],"a":2,"e":"Weakened pathogens or their antigens stimulate the immune response to produce antibodies and memory cells, but they do not cause the disease."}],"basic_saq":[{"id":"ch10bs0","q":"State three body defences that prevent pathogens from entering the body.","mm":3,"ms":[{"p":"skin","pts":1},{"p":"hairs in the nose / mucus","pts":1},{"p":"stomach acid / white blood cells","pts":1}],"e":"Any three of the body defences from the syllabus are accepted: skin, hairs in the nose, mucus, stomach acid and white blood cells."},{"id":"ch10bs1","q":"State two ways in which a transmissible disease can be transmitted from one host to another.","mm":2,"ms":[{"p":"by direct contact, including through blood and other body fluids","pts":1},{"p":"indirectly, including from contaminated surfaces, food, animals and air","pts":1}],"e":"A transmissible disease spreads by direct contact or indirectly through contaminated surfaces, food, animals and air."}],"review_saq":[{"id":"ch10rs0","q":"Describe how vaccination produces long-term immunity.","mm":4,"ms":[{"p":"weakened pathogens or their antigens are put into the body","pts":1},{"p":"the antigens stimulate an immune response by lymphocytes","pts":1},{"p":"lymphocytes produce antibodies","pts":1},{"p":"memory cells are produced, giving long-term immunity","pts":1}],"e":"This is the full sequence of events in vaccination described in the syllabus."},{"id":"ch10rs1","q":"Explain how a clean water supply and hygienic food preparation help to control the spread of transmissible diseases.","mm":4,"ms":[{"p":"a clean water supply prevents pathogens in contaminated water entering the body","pts":1},{"p":"hygienic food preparation prevents pathogens in contaminated food entering the body","pts":1},{"p":"this reduces the number of people who become infected","pts":1},{"p":"so the pathogen cannot spread easily through the population","pts":1}],"e":"Both measures break the chain of transmission by preventing pathogens in water and food from entering the body."}],"adv_saq":[{"id":"ch10as0","q":"Explain how the cholera bacterium causes diarrhoea and dehydration.","mm":4,"ms":[{"p":"the cholera bacterium produces a toxin","pts":1},{"p":"the toxin causes secretion of chloride ions into the small intestine","pts":1},{"p":"water moves by osmosis into the gut","pts":1},{"p":"this causes diarrhoea and dehydration (and loss of ions from the blood)","pts":1}],"e":"This is the mechanism from the syllabus by which cholera causes diarrhoea and dehydration."},{"id":"ch10as1","q":"Compare active immunity and passive immunity in terms of how each is gained and whether memory cells are produced.","mm":4,"ms":[{"p":"active immunity: the body produces its own antibodies","pts":1},{"p":"passive immunity: antibodies are acquired from another individual","pts":1},{"p":"active immunity is gained after an infection or by vaccination","pts":1},{"p":"memory cells are produced in active immunity but not in passive immunity, so passive immunity is short-term","pts":1}],"e":"The comparison covers the origin of the antibodies, how each immunity is gained and the role of memory cells."}]},"ch11":{"pre":[{"id":"ch11p0","tp":"Gas exchange surfaces","q":"Which of the following is a feature of gas exchange surfaces in humans?","o":["A thick surface","A large surface area","A poor blood supply","A poor supply of air"],"a":1,"e":"Gas exchange surfaces have a large surface area, a thin surface, a good blood supply and good ventilation with air, all of which make diffusion of gases efficient."},{"id":"ch11p1","tp":"Breathing system structure","q":"In the human breathing system, where does gas exchange with the blood occur?","o":["trachea","bronchi","bronchioles","alveoli"],"a":3,"e":"The alveoli are tiny air sacs at the ends of the bronchioles where oxygen and carbon dioxide are exchanged between the air and the blood."},{"id":"ch11p2","tp":"Breathing system structure","q":"Which structure carries air from the larynx down towards the bronchi?","o":["oesophagus","alveolus","trachea","diaphragm"],"a":2,"e":"The trachea (windpipe) is the tube that carries air from the larynx to the bronchi; the oesophagus carries food to the stomach."},{"id":"ch11p3","tp":"Inspired vs expired air","q":"Which gas is present in a higher proportion in expired air than in inspired air?","o":["carbon dioxide","oxygen","nitrogen","argon"],"a":0,"e":"Expired air contains more carbon dioxide than inspired air because carbon dioxide is produced by respiration and diffuses into the lungs to be breathed out."},{"id":"ch11p4","tp":"Inspired vs expired air","q":"What does limewater test for?","o":["oxygen","carbon dioxide","water vapour","nitrogen"],"a":1,"e":"Limewater turns milky (cloudy) when carbon dioxide is passed through it; it is used to compare the carbon dioxide content of inspired and expired air."},{"id":"ch11p5","tp":"Ventilation","q":"Which muscle is located at the base of the thorax and separates the thorax from the abdomen?","o":["diaphragm","biceps","external intercostal muscle","internal intercostal muscle"],"a":0,"e":"The diaphragm is a sheet of muscle at the base of the thorax; it flattens during inspiration and relaxes into a dome shape during expiration."},{"id":"ch11p6","tp":"Gas exchange surfaces","q":"Why are gas exchange surfaces thin?","o":["to create a large surface area","to allow blood to flow through them","to shorten the diffusion distance for gases","to improve ventilation with air"],"a":2,"e":"A thin surface reduces the distance over which oxygen and carbon dioxide must diffuse, making gas exchange fast and efficient."},{"id":"ch11p7","tp":"Breathing system structure","q":"Which tubes are the smallest and lead into the alveoli?","o":["bronchioles","bronchi","trachea","capillaries"],"a":0,"e":"The trachea branches into the bronchi, which divide into smaller bronchioles; the bronchioles end in clusters of alveoli."},{"id":"ch11p8","tp":"Exercise and breathing","q":"What happens to the rate of breathing during physical activity?","o":["It stays the same","It decreases","It increases","It stops"],"a":2,"e":"Physical activity increases the rate and depth of breathing so that more oxygen is taken in and more carbon dioxide is removed."},{"id":"ch11p9","tp":"Inspired vs expired air","q":"A student breathes onto a cold mirror and it becomes misty. Which gas in the expired air causes this?","o":["carbon dioxide","water vapour","oxygen","nitrogen"],"a":1,"e":"Expired air contains more water vapour than inspired air; the water vapour condenses on the cold mirror, making it misty."},{"id":"ch11p10","tp":"Protection of airways","q":"Which cells in the lining of the airways produce mucus?","o":["ciliated cells","red blood cells","alveolar cells","goblet cells"],"a":3,"e":"Goblet cells secrete mucus, which traps pathogens and particles; ciliated cells then move the mucus up and out of the airways."},{"id":"ch11p11","tp":"Cartilage","q":"What is the function of the rings of cartilage in the trachea?","o":["To produce mucus","To keep the airway open","To exchange gases","To move air into the lungs"],"a":1,"e":"Rings of cartilage support the trachea and keep it open so that air can pass freely to and from the lungs."},{"id":"ch11p12","tp":"Gas exchange surfaces","q":"Why is a good blood supply important for a gas exchange surface?","o":["It warms the incoming air","It removes oxygen from the blood","It produces mucus","It helps to maintain a steep concentration gradient for diffusion"],"a":3,"e":"A good blood supply continually carries oxygen away and brings carbon dioxide to the surface, helping to maintain a steep concentration gradient for diffusion."},{"id":"ch11p13","tp":"Breathing system structure","q":"Into which two tubes does the trachea divide, one going to each lung?","o":["bronchioles","alveoli","bronchi","capillaries"],"a":2,"e":"The trachea splits into two bronchi (singular: bronchus), one entering each lung; each bronchus then divides into smaller bronchioles."}],"basic":[{"id":"ch11b0","tp":"Gas exchange surfaces","q":"Why do the alveoli provide a very large surface area for gas exchange?","o":["because there are very many of them","because their walls are one cell thick","because they are surrounded by capillaries","because they contain air"],"a":0,"e":"There are millions of alveoli in each lung, giving a very large total surface area for the diffusion of oxygen and carbon dioxide."},{"id":"ch11b1","tp":"Breathing system structure","q":"Where are the intercostal muscles located?","o":["inside the alveoli","at the base of the thorax","between the ribs","in the larynx"],"a":2,"e":"The internal and external intercostal muscles lie between the ribs and change the volume of the thorax during breathing."},{"id":"ch11b2","tp":"Inspired vs expired air","q":"Inspired air contains about 21% oxygen, but expired air contains about 16% oxygen. Why is the oxygen concentration lower in expired air?","o":["Oxygen is converted into nitrogen in the lungs","Oxygen is used by cells during respiration","Nitrogen is used by body cells","Carbon dioxide is changed into oxygen in the lungs"],"a":1,"e":"Body cells take up oxygen from the blood for aerobic respiration, so the air leaving the lungs contains less oxygen."},{"id":"ch11b3","tp":"Ventilation","q":"What happens to the diaphragm during inspiration?","o":["It relaxes and becomes dome-shaped","It moves upwards","It stays completely still","It contracts and flattens"],"a":3,"e":"During inspiration the diaphragm contracts and flattens, which increases the volume of the thorax and decreases the pressure inside it."},{"id":"ch11b4","tp":"Ventilation","q":"Which sequence of changes occurs during inspiration?","o":["Thorax volume increases, pressure in the thorax decreases, air flows in","Thorax volume increases, pressure in the thorax increases, air flows in","Thorax volume decreases, pressure in the thorax decreases, air flows in","Thorax volume decreases, pressure in the thorax increases, air flows out"],"a":0,"e":"Increasing the volume of the thorax lowers the air pressure inside it below atmospheric pressure, so air flows into the lungs."},{"id":"ch11b5","tp":"Protection of airways","q":"What is the function of the cilia on the ciliated cells lining the airways?","o":["They produce mucus that traps pathogens","They move mucus, with trapped particles, up and out of the airways","They exchange gases with the blood","They keep the trachea open"],"a":1,"e":"Ciliated cells have hair-like cilia that beat to sweep mucus and trapped particles away from the lungs towards the mouth."},{"id":"ch11b6","tp":"Breathing system structure","q":"Which part of the breathing system is commonly called the voice box?","o":["trachea","pharynx","larynx","bronchus"],"a":2,"e":"The larynx is the structure at the top of the trachea and is commonly known as the voice box."},{"id":"ch11b7","tp":"Exercise and breathing","q":"What happens to the depth of breathing during physical activity?","o":["It increases","It decreases","It stays the same","It becomes shallow and slow"],"a":0,"e":"Physical activity increases both the rate and the depth of breathing, so each breath takes in more oxygen and removes more carbon dioxide."},{"id":"ch11b8","tp":"Inspired vs expired air","q":"A student breathes out through a tube into limewater. Which result shows that expired air contains carbon dioxide?","o":["The limewater turns blue-black","The limewater turns orange","The limewater stays colourless","The limewater turns milky/cloudy"],"a":3,"e":"Carbon dioxide turns limewater milky/cloudy; expired air contains more carbon dioxide than inspired air, so it clouds limewater quickly."},{"id":"ch11b9","tp":"Ventilation","q":"What happens to the diaphragm during expiration?","o":["It contracts and flattens","It relaxes and returns to a dome shape","It moves downwards","It increases the volume of the thorax"],"a":1,"e":"During expiration the diaphragm relaxes and curves upwards into a dome shape, decreasing the volume of the thorax and increasing the pressure, which pushes air out."},{"id":"ch11b10","tp":"Protection of airways","q":"Why is mucus produced in the airways important?","o":["It traps pathogens and particles so that they can be removed","It helps oxygen to diffuse into the blood","It keeps the trachea open","It contracts to ventilate the lungs"],"a":0,"e":"Mucus produced by goblet cells traps pathogens and particles, which are then moved up and out of the airways by cilia."},{"id":"ch11b11","tp":"Inspired vs expired air","q":"Which statement about the composition of inspired and expired air is correct?","o":["Expired air contains more oxygen and less carbon dioxide than inspired air","Inspired air and expired air contain the same amounts of oxygen and carbon dioxide","Expired air contains less oxygen and more carbon dioxide than inspired air","Expired air contains less oxygen and less carbon dioxide than inspired air"],"a":2,"e":"During respiration, oxygen is used up and carbon dioxide is produced, so expired air has less oxygen and more carbon dioxide than inspired air."}],"review":[{"id":"ch11r0","tp":"Ventilation","q":"Which list shows the correct order of events during inspiration?","o":["External intercostal muscles contract, ribs move up and out, thorax volume increases, air pressure in thorax falls, air flows in","External intercostal muscles relax, ribs move down and in, thorax volume increases, air pressure falls, air flows in","Internal intercostal muscles contract, ribs move down and in, thorax volume increases, air pressure falls, air flows in","External intercostal muscles contract, ribs move up and out, thorax volume decreases, air pressure rises, air flows in"],"a":0,"e":"Inspiration: the external intercostal muscles contract, raising the ribs up and out; the diaphragm flattens; thorax volume increases, pressure falls below atmospheric, and air flows in."},{"id":"ch11r1","tp":"Inspired vs expired air","q":"A student bubbles expired air through limewater, which turns milky, and then bubbles inspired air through fresh limewater, which stays clear. What does this show?","o":["Limewater tests for oxygen","Inspired air contains more carbon dioxide than expired air","Expired air contains more carbon dioxide than inspired air","Expired air contains more oxygen than inspired air"],"a":2,"e":"Limewater turns milky in carbon dioxide. Only the expired air clouds the limewater, showing expired air contains more carbon dioxide than inspired air."},{"id":"ch11r2","tp":"Exercise and breathing","q":"During exercise, the rate and depth of breathing increase. What change is detected that causes this response?","o":["A fall in carbon dioxide concentration in the blood, detected by the heart","A rise in oxygen concentration in the blood, detected by the brain","A fall in nitrogen concentration in the blood, detected by the lungs","A rise in carbon dioxide concentration in the blood, detected by the brain"],"a":3,"e":"Exercise produces more carbon dioxide, which increases the carbon dioxide concentration in the blood; the brain detects this and increases the rate and depth of breathing."},{"id":"ch11r3","tp":"Ventilation","q":"What happens to the air pressure inside the thorax during inspiration?","o":["It increases above atmospheric pressure","It decreases below atmospheric pressure","It stays equal to atmospheric pressure","It increases, then stays constant"],"a":1,"e":"Increasing the thorax volume during inspiration lowers the pressure inside to below atmospheric pressure, causing air to move into the lungs."},{"id":"ch11r4","tp":"Protection of airways","q":"How do mucus and cilia work together to protect the breathing system?","o":["Mucus traps pathogens and particles, and cilia move the mucus up and away from the lungs","Cilia trap pathogens, and mucus moves them into the blood","Mucus exchanges gases, and cilia ventilate the lungs","Mucus keeps the trachea open, and cilia produce air"],"a":0,"e":"Goblet cells secrete mucus that traps pathogens and dust particles; beating cilia move the mucus up the airways towards the mouth so it can be swallowed or coughed out."},{"id":"ch11r5","tp":"Ventilation","q":"During which type of breathing are the internal intercostal muscles mainly used?","o":["quiet inspiration","forced expiration","production of mucus","gas exchange"],"a":1,"e":"The internal intercostal muscles contract during forced expiration, pulling the ribs down and in to reduce the volume of the thorax."},{"id":"ch11r6","tp":"Gas exchange surfaces","q":"Why are the alveoli very efficient at gas exchange?","o":["They have thick walls and a small surface area","They have a poor blood supply and thick walls","They have thin walls and a large surface area","They are not ventilated with air"],"a":2,"e":"Alveoli have very thin walls and a very large total surface area, together with a good blood supply and good ventilation, making gas exchange efficient."},{"id":"ch11r7","tp":"Inspired vs expired air","q":"The composition of inspired air is about 21% oxygen and 0.04% carbon dioxide, while expired air is about 16% oxygen and 4% carbon dioxide. Why does expired air contain less oxygen than inspired air?","o":["Oxygen is used by respiring cells in the body","Oxygen is converted into nitrogen in the lungs","Oxygen diffuses from the air into the lungs","Oxygen is produced during respiration"],"a":0,"e":"Body cells use oxygen from the blood for aerobic respiration, so the blood returning to the lungs carries less oxygen and the expired air has less oxygen."},{"id":"ch11r8","tp":"Ventilation","q":"What happens when the external intercostal muscles contract?","o":["The ribs move down and in, decreasing the volume of the thorax","The diaphragm moves up into a dome shape","Air is pushed out of the lungs","The ribs move up and out, increasing the volume of the thorax"],"a":3,"e":"Contraction of the external intercostal muscles raises the ribs upwards and outwards, increasing thorax volume and helping inspiration."},{"id":"ch11r9","tp":"Gas exchange surfaces","q":"How does oxygen move from the alveoli into the blood?","o":["by active transport against a concentration gradient","by diffusion down a concentration gradient","by osmosis","by ventilation"],"a":1,"e":"Oxygen diffuses from its higher concentration in the alveoli into the blood, where the concentration is lower; the thin alveoli walls and good blood supply maintain this gradient."},{"id":"ch11r10","tp":"Breathing system structure","q":"Air passes through the structures of the breathing system in a particular order during inspiration. Which order is correct?","o":["trachea, bronchioles, bronchi, alveoli","alveoli, bronchioles, bronchi, trachea","trachea, bronchi, bronchioles, alveoli","bronchi, trachea, bronchioles, alveoli"],"a":2,"e":"Air travels from the trachea into the two bronchi, then into smaller bronchioles and finally into the alveoli where gas exchange occurs."},{"id":"ch11r11","tp":"Exercise and breathing","q":"Immediately after stopping vigorous exercise, a student's breathing remains deeper and faster than at rest for a short time. What explains this?","o":["The lungs are still full of air","The heart stops beating for a short time","Oxygen is produced by the muscles","Extra carbon dioxide produced during exercise is still being removed from the blood"],"a":3,"e":"During exercise, respiring cells produce extra carbon dioxide; after stopping, breathing stays rapid and deep until the raised blood carbon dioxide level has fallen back to normal."}],"adv":[{"id":"ch11a0","tp":"Ventilation","q":"Which combination of muscle actions produces inspiration?","o":["External intercostal muscles contract and the diaphragm contracts","External intercostal muscles contract and the diaphragm relaxes","Internal intercostal muscles contract and the diaphragm relaxes","Internal intercostal muscles contract and the diaphragm contracts"],"a":0,"e":"Inspiration requires the external intercostal muscles to contract (raising the ribs up and out) and the diaphragm to contract and flatten, together increasing the volume of the thorax."},{"id":"ch11a1","tp":"Ventilation","q":"During forced expiration, the internal intercostal muscles contract. What is the effect of this?","o":["The ribs are pulled up and out, increasing the volume of the thorax","The diaphragm flattens, increasing the volume of the thorax","Air is drawn into the lungs","The ribs are pulled down and in, decreasing the volume of the thorax"],"a":3,"e":"Contraction of the internal intercostal muscles pulls the ribs downwards and inwards, reducing thorax volume, increasing pressure and forcing air out of the lungs."},{"id":"ch11a2","tp":"Inspired vs expired air","q":"The carbon dioxide concentration of expired air is about 4%, while inspired air contains about 0.04%. What explains this large difference?","o":["Carbon dioxide is absorbed from the air into the blood during respiration","Carbon dioxide produced by respiration diffuses from the blood into the alveoli and is breathed out","Oxygen is converted into carbon dioxide in the alveoli","Carbon dioxide is produced from nitrogen in the lungs"],"a":1,"e":"Respiring cells produce carbon dioxide, which diffuses into the blood and then from the blood into the alveoli, so expired air has a much higher carbon dioxide concentration."},{"id":"ch11a3","tp":"Exercise and breathing","q":"Why does taking deeper breaths during exercise improve gas exchange in the lungs?","o":["Each breath decreases the surface area available for gas exchange","Deep breathing prevents a concentration gradient from forming","Each breath brings more oxygen into the alveoli and removes more carbon dioxide","Deep breathing increases the carbon dioxide concentration in the blood"],"a":2,"e":"Deeper breaths move a larger volume of air in and out of the lungs, delivering more oxygen to the alveoli and removing more carbon dioxide per breath."},{"id":"ch11a4","tp":"Cartilage","q":"Which statement explains the importance of the rings of cartilage in the trachea?","o":["The cartilage produces mucus that traps pathogens","The cartilage keeps the trachea open so air can pass to and from the lungs despite pressure changes in the thorax","The cartilage contracts to pump air into the lungs","The cartilage is the site of gas exchange"],"a":1,"e":"Rings of cartilage prevent the trachea from collapsing when the pressure inside the thorax changes during breathing, keeping the airway open."},{"id":"ch11a5","tp":"Protection of airways","q":"Cigarette smoke can damage the ciliated cells lining the airways. What is the most likely consequence of this damage?","o":["Mucus containing trapped particles and pathogens is not moved away from the lungs and may build up","The ciliated cells produce more mucus than normal","Oxygen diffuses more rapidly into the blood","The trachea collapses and blocks the airway"],"a":0,"e":"If cilia are damaged, mucus cannot be swept up and out of the airways, so trapped pathogens and particles accumulate, increasing the risk of lung infection."},{"id":"ch11a6","tp":"Exercise and breathing","q":"A student measures their breathing rate at rest and immediately after running for one minute. Which set of results is most likely?","o":["Rest: 14 breaths per minute; after running: 12 breaths per minute","Rest: 30 breaths per minute; after running: 15 breaths per minute","Rest: 14 breaths per minute; after running: 32 breaths per minute","Rest: 20 breaths per minute; after running: 20 breaths per minute"],"a":2,"e":"Exercise increases the rate of breathing, so the rate after running is higher than at rest because extra carbon dioxide in the blood is detected by the brain."},{"id":"ch11a7","tp":"Gas exchange surfaces","q":"How does good ventilation of the alveoli help to maintain the concentration gradient for gas exchange?","o":["Fresh air continually brings in oxygen and removes carbon dioxide, keeping a steep gradient between the alveoli and the blood","Ventilation thickens the walls of the alveoli","Ventilation reduces the blood supply to the alveoli","Ventilation allows nitrogen to diffuse into the blood"],"a":0,"e":"Breathing continuously renews the air in the alveoli, keeping the oxygen concentration high and the carbon dioxide concentration low, so the diffusion gradient with the blood is maintained."},{"id":"ch11a8","tp":"Inspired vs expired air","q":"Which gas is present in the highest proportion in both inspired and expired air?","o":["oxygen","carbon dioxide","water vapour","nitrogen"],"a":3,"e":"Nitrogen makes up about 78% of inspired and expired air and is not used or produced by the body, so it is the most abundant gas in both."},{"id":"ch11a9","tp":"Ventilation","q":"Which statement about pressure changes in the thorax during breathing is correct?","o":["During inspiration, pressure rises above atmospheric pressure so air moves in; during expiration, pressure falls below atmospheric pressure so air moves out","During inspiration, pressure falls below atmospheric pressure so air moves in; during expiration, pressure rises above atmospheric pressure so air moves out","The pressure inside the thorax always stays above atmospheric pressure","Pressure changes occur only in the lungs, not in the thorax"],"a":1,"e":"Air moves from higher to lower pressure. Inspiration lowers thorax pressure below atmospheric (air flows in); expiration raises it above atmospheric (air flows out)."},{"id":"ch11a10","tp":"Exercise and breathing","q":"Which statement describes the relationship between the level of physical activity and the rate of breathing?","o":["Breathing rate decreases steadily as the level of activity increases","Breathing rate is constant whatever the level of activity","Breathing rate increases then decreases as the level of activity increases","Breathing rate increases steadily as the level of activity increases"],"a":3,"e":"As physical activity increases, respiring muscles produce more carbon dioxide, so the brain increases the rate of breathing."},{"id":"ch11a11","tp":"Protection of airways","q":"A build-up of mucus in the airways makes breathing difficult. Which two structures work together to move mucus out of the airways?","o":["alveoli and capillaries","ribs and diaphragm","goblet cells and ciliated cells","larynx and bronchi"],"a":2,"e":"Goblet cells produce the mucus and ciliated cells sweep it upwards and out of the airways, keeping the tubes clear."}],"basic_saq":[{"id":"ch11bs0","q":"State three features of a gas exchange surface in humans that make it efficient at gas exchange.","mm":3,"ms":[{"p":"Large surface area","pts":1},{"p":"Thin surface / thin walls","pts":1},{"p":"Good blood supply","pts":1}],"e":"Any three of the four features (large surface area, thin surface, good blood supply, good ventilation with air) score full marks."},{"id":"ch11bs1","q":"State the function of each of the following parts of the breathing system: (a) the trachea, (b) the alveoli, (c) the diaphragm.","mm":3,"ms":[{"p":"(a) Trachea: carries air between the larynx and the bronchi, keeping an open passage for air to the lungs","pts":1},{"p":"(b) Alveoli: site of gas exchange (oxygen and carbon dioxide) with the blood","pts":1},{"p":"(c) Diaphragm: changes the volume and pressure of the thorax during breathing (ventilation)","pts":1}],"e":"Each part has a distinct role in moving air into and out of the lungs or in gas exchange."}],"review_saq":[{"id":"ch11rs0","q":"Describe the changes that occur during inspiration (breathing in), including the roles of the ribs, the intercostal muscles and the diaphragm, and the effect on the pressure inside the thorax.","mm":4,"ms":[{"p":"External intercostal muscles contract, moving the ribs up and out","pts":1},{"p":"Diaphragm contracts and flattens","pts":1},{"p":"Volume of the thorax increases, so the pressure inside the thorax decreases","pts":1},{"p":"Air moves into the lungs (from higher pressure outside to lower pressure inside)","pts":1}],"e":"Inspiration is an active process: muscle contraction enlarges the thorax, lowering pressure below atmospheric so air flows in."},{"id":"ch11rs1","q":"A student's breathing rate increases from 12 breaths per minute at rest to 28 breaths per minute during exercise. Explain why the rate of breathing increases during physical activity.","mm":3,"ms":[{"p":"Exercising muscles respire more and produce more carbon dioxide","pts":1},{"p":"The carbon dioxide concentration in the blood increases","pts":1},{"p":"The brain detects the higher carbon dioxide concentration and increases the rate (and depth) of breathing","pts":1}],"e":"The rise in blood carbon dioxide during exercise is detected by the brain, which increases breathing to remove the extra carbon dioxide."}],"adv_saq":[{"id":"ch11as0","q":"Explain how the external and internal intercostal muscles and the diaphragm produce the volume and pressure changes in the thorax that ventilate the lungs. Refer to both inspiration and forced expiration.","mm":4,"ms":[{"p":"During inspiration, external intercostal muscles contract, moving the ribs up and out, and the diaphragm contracts and flattens, increasing the volume of the thorax","pts":1},{"p":"This increase in volume lowers the pressure in the thorax below atmospheric pressure, so air flows into the lungs","pts":1},{"p":"During forced expiration, internal intercostal muscles contract, pulling the ribs down and in","pts":1},{"p":"The diaphragm relaxes and returns to a dome shape, decreasing thorax volume and raising pressure above atmospheric, forcing air out","pts":1}],"e":"Opposing muscle actions change thorax volume; air flows in when pressure falls below atmospheric and out when pressure rises above it."},{"id":"ch11as1","q":"Explain how goblet cells, mucus and ciliated cells protect the breathing system from pathogens and particles, such as those in cigarette smoke. Suggest why a person whose ciliated cells are damaged is more likely to develop lung infections.","mm":4,"ms":[{"p":"Goblet cells produce mucus, which traps pathogens and particles in the airways","pts":1},{"p":"Ciliated cells move the mucus, with trapped pathogens and particles, up and out of the airways","pts":1},{"p":"This prevents pathogens and particles from reaching the alveoli","pts":1},{"p":"If ciliated cells are damaged, mucus is not removed, so pathogens and particles accumulate and are more likely to reach the lungs and cause infection","pts":1}],"e":"The mucus-cilia system removes trapped pathogens; damage to cilia reduces this protection, increasing the risk of infection."}]},"ch12":{"pre":[{"id":"ch12p0","tp":"Uses of energy","q":"Which of these is a use of energy in living organisms?","o":["Protein synthesis","Osmosis","Transpiration","Diffusion"],"a":0,"e":"Protein synthesis is a listed use of energy from respiration. Osmosis, transpiration and diffusion are passive processes that do not require energy."},{"id":"ch12p1","tp":"Aerobic respiration","q":"What is aerobic respiration?","o":["The breakdown of nutrient molecules without using oxygen","Chemical reactions in cells that use oxygen to break down nutrient molecules to release energy","The use of sunlight to make glucose","The movement of water across a partially permeable membrane"],"a":1,"e":"Aerobic respiration uses oxygen to break down nutrient molecules such as glucose, releasing energy. The other options describe anaerobic respiration, photosynthesis and osmosis."},{"id":"ch12p2","tp":"Aerobic respiration","q":"Which word equation represents aerobic respiration?","o":["glucose → lactic acid","glucose → alcohol + carbon dioxide","glucose + oxygen → carbon dioxide + water","carbon dioxide + water → glucose + oxygen"],"a":2,"e":"Aerobic respiration is glucose + oxygen → carbon dioxide + water. The first two equations are anaerobic and the last is photosynthesis."},{"id":"ch12p3","tp":"Anaerobic respiration","q":"Which statement describes anaerobic respiration?","o":["It uses oxygen to break down glucose","It releases more energy than aerobic respiration","It produces oxygen as a waste product","It breaks down nutrient molecules to release energy without using oxygen"],"a":3,"e":"Anaerobic respiration releases energy by breaking down nutrients without using oxygen. It releases much less energy than aerobic respiration."},{"id":"ch12p4","tp":"Anaerobic respiration in yeast","q":"What are the products of anaerobic respiration in yeast?","o":["alcohol and carbon dioxide","lactic acid only","carbon dioxide and water","oxygen and glucose"],"a":0,"e":"Anaerobic respiration in yeast converts glucose to alcohol and carbon dioxide. Lactic acid is produced in muscles, not yeast."},{"id":"ch12p5","tp":"Anaerobic respiration in muscles","q":"What is produced by anaerobic respiration in muscle cells during vigorous exercise?","o":["alcohol and carbon dioxide","lactic acid","carbon dioxide and water","glucose"],"a":1,"e":"Muscles respire anaerobically to form lactic acid (glucose → lactic acid). Alcohol and carbon dioxide are produced by yeast."},{"id":"ch12p6","tp":"Energy comparison","q":"Compared with aerobic respiration, how much energy does anaerobic respiration release per glucose molecule?","o":["much more energy","the same amount of energy","much less energy","no energy"],"a":2,"e":"Anaerobic respiration releases much less energy per glucose molecule than aerobic respiration, because glucose is not completely broken down."},{"id":"ch12p7","tp":"Uses of energy","q":"Which process in a cell requires energy?","o":["Osmosis of water","Active transport of ions","Diffusion of oxygen","Evaporation of water"],"a":1,"e":"Active transport moves substances against the concentration gradient and requires energy from respiration. Osmosis and diffusion are passive."},{"id":"ch12p8","tp":"Uses of energy","q":"Energy from respiration is used to maintain a constant body temperature in which organisms?","o":["all plants","all bacteria","mammals and birds","aquatic animals only"],"a":2,"e":"Mammals and birds maintain a constant body temperature, and this uses energy released by respiration."},{"id":"ch12p9","tp":"Respiration in yeast","q":"A student places yeast in water baths at different temperatures and measures the volume of carbon dioxide produced. Which process is being investigated?","o":["photosynthesis in yeast","respiration in yeast","transpiration in yeast","growth of yeast cells"],"a":3,"e":"Carbon dioxide is a product of respiration, so measuring its production shows how temperature affects the rate of respiration in yeast."},{"id":"ch12p10","tp":"Aerobic respiration","q":"Which is the balanced chemical equation for aerobic respiration?","o":["C6H12O6 + 6O2 → 6CO2 + 6H2O","C6H12O6 → 2C2H5OH + 2CO2","6CO2 + 6H2O → C6H12O6 + 6O2","C6H12O6 + 6O2 → 2CO2 + 6H2O"],"a":0,"e":"Aerobic respiration is C6H12O6 + 6O2 → 6CO2 + 6H2O. The second equation is anaerobic respiration in yeast and the third is photosynthesis."},{"id":"ch12p11","tp":"Oxygen debt","q":"Lactic acid builds up in the muscles and blood during vigorous exercise. What does this cause?","o":["a decrease in heart rate","an increase in photosynthesis","a fall in body temperature","an oxygen debt"],"a":3,"e":"The build-up of lactic acid during vigorous exercise causes an oxygen debt, which must be repaid after exercise."},{"id":"ch12p12","tp":"Uses of energy","q":"Which process in a plant root hair cell requires energy released by respiration?","o":["Diffusion of mineral ions into the cell","Osmosis of water into the cell","Active transport of mineral ions into the cell","Transpiration of water from the leaves"],"a":2,"e":"Active transport moves mineral ions against a concentration gradient and needs energy from respiration. Diffusion and osmosis are passive processes that need no metabolic energy."},{"id":"ch12p13","tp":"Anaerobic respiration in yeast","q":"Which is the balanced chemical equation for anaerobic respiration in yeast?","o":["C6H12O6 + 6O2 → 6CO2 + 6H2O","C6H12O6 → C2H5OH + CO2","C6H12O6 → 2C2H5OH + 2CO2","2C2H5OH + 2CO2 → C6H12O6"],"a":2,"e":"Anaerobic respiration in yeast is C6H12O6 → 2C2H5OH + 2CO2 (glucose → alcohol + carbon dioxide). It is balanced with two ethanol and two carbon dioxide molecules."}],"basic":[{"id":"ch12b0","tp":"Uses of energy","q":"What is required for cell division in living organisms?","o":["energy from respiration","energy from osmosis","energy from sunlight","no energy at all"],"a":0,"e":"Cell division is a listed use of energy released by respiration. Osmosis releases no energy and sunlight is not used directly by animal cells."},{"id":"ch12b1","tp":"Uses of energy","q":"Which of the following is a use of energy in living organisms?","o":["Transpiration","Osmosis","Filtration","Passage of nerve impulses"],"a":3,"e":"The passage of nerve impulses is a listed use of energy. Transpiration, osmosis and filtration are passive processes."},{"id":"ch12b2","tp":"Uses of energy","q":"Which of these uses energy released by respiration?","o":["Movement of water up a stem","Osmosis in root hairs","Growth of an organism","Diffusion of carbon dioxide"],"a":2,"e":"Growth is a listed use of energy. Water movement in stems, osmosis and diffusion are passive processes."},{"id":"ch12b3","tp":"Aerobic respiration","q":"Which statement about aerobic respiration is correct?","o":["It uses oxygen to break down glucose","It occurs without using oxygen","It produces lactic acid","It occurs only in animals"],"a":0,"e":"Aerobic respiration uses oxygen to break down nutrient molecules such as glucose, releasing energy. It occurs in both plants and animals."},{"id":"ch12b4","tp":"Respiration","q":"Which organisms carry out respiration?","o":["animals only","plants only","animals and plants only","all living organisms"],"a":3,"e":"Respiration releases energy in all living organisms, including plants, animals and microorganisms."},{"id":"ch12b5","tp":"Anaerobic respiration in yeast","q":"In bread making, the dough rises because yeast produces carbon dioxide. This gas is produced by which process?","o":["aerobic respiration","anaerobic respiration","photosynthesis","transpiration"],"a":1,"e":"When oxygen is in short supply, yeast respires anaerobically, producing alcohol and carbon dioxide; the carbon dioxide makes the dough rise."},{"id":"ch12b6","tp":"Oxygen debt","q":"After vigorous exercise, the oxygen debt is the amount of oxygen required for what purpose?","o":["converting glucose to lactic acid","converting alcohol to glucose","oxidising lactic acid to carbon dioxide and water","converting oxygen to carbon dioxide"],"a":2,"e":"The oxygen debt is repaid when oxygen is used to break down lactic acid, mainly by aerobic respiration of lactic acid in the liver."},{"id":"ch12b7","tp":"Anaerobic respiration in muscles","q":"In anaerobic respiration in muscles, glucose is converted to lactic acid rather than carbon dioxide and water. What does this show?","o":["the glucose is completely broken down","the glucose is only partially broken down","the glucose is converted into oxygen","the glucose is used to make alcohol"],"a":1,"e":"In anaerobic respiration, glucose is only partially broken down to lactic acid, so much less energy is released than in aerobic respiration."},{"id":"ch12b8","tp":"Aerobic respiration","q":"Which gas is used up during aerobic respiration?","o":["carbon dioxide","nitrogen","oxygen","hydrogen"],"a":2,"e":"Aerobic respiration uses oxygen to break down glucose, and produces carbon dioxide and water."},{"id":"ch12b9","tp":"Energy comparison","q":"Which process releases the most energy from one molecule of glucose?","o":["anaerobic respiration in muscles","anaerobic respiration in yeast","photosynthesis","aerobic respiration"],"a":3,"e":"Aerobic respiration releases much more energy per glucose molecule than anaerobic respiration; photosynthesis stores energy rather than releasing it."},{"id":"ch12b10","tp":"Anaerobic respiration in yeast","q":"When does anaerobic respiration occur in yeast?","o":["when oxygen is in short supply","when oxygen is plentiful","when carbon dioxide is absent","when light is bright"],"a":0,"e":"When oxygen is in short supply, yeast switches to anaerobic respiration, producing alcohol and carbon dioxide."},{"id":"ch12b11","tp":"Anaerobic respiration in muscles","q":"What can the build-up of lactic acid in muscles during vigorous exercise cause?","o":["increased photosynthesis","muscle fatigue and pain","more efficient digestion","a fall in heart rate"],"a":1,"e":"The build-up of lactic acid in muscles causes muscle fatigue and pain and leads to an oxygen debt."}],"review":[{"id":"ch12r0","tp":"Respiration","q":"Which statement is true for both aerobic respiration and anaerobic respiration?","o":["They both release energy from glucose","They both require oxygen","They both produce lactic acid","They both produce carbon dioxide"],"a":0,"e":"Both forms of respiration release energy from glucose. Only aerobic respiration requires oxygen, and their products differ."},{"id":"ch12r1","tp":"Anaerobic respiration","q":"Which substance is produced by anaerobic respiration in yeast but not by anaerobic respiration in human muscles?","o":["carbon dioxide","lactic acid","alcohol","water"],"a":2,"e":"Yeast produces alcohol and carbon dioxide, whereas human muscles produce only lactic acid. Alcohol is not produced in muscles."},{"id":"ch12r2","tp":"Aerobic respiration","q":"The balanced chemical equation for aerobic respiration is C6H12O6 + 6O2 → 6CO2 + 6H2O. How many molecules of oxygen react with one molecule of glucose?","o":["1","2","12","6"],"a":3,"e":"The balanced equation shows that six molecules of oxygen react with one molecule of glucose."},{"id":"ch12r3","tp":"Respiration in yeast","q":"In an investigation of the effect of temperature on respiration in yeast, the rate of carbon dioxide production increases as the temperature rises from 20 °C to 35 °C. What is the reason for this?","o":["The enzymes in yeast are denatured","The rate of enzyme-controlled reactions increases with temperature","The yeast cells divide too quickly","Carbon dioxide is more soluble at higher temperatures"],"a":1,"e":"Higher temperature increases the rate of enzyme-controlled reactions up to the optimum, so respiration and carbon dioxide production speed up."},{"id":"ch12r4","tp":"Oxygen debt","q":"After vigorous exercise, a runner continues to breathe deeply and quickly. What is this extra oxygen used for?","o":["formation of more lactic acid","aerobic respiration of lactic acid in the liver","conversion of glucose to alcohol","release of carbon dioxide from the muscles only"],"a":1,"e":"The extra oxygen is used for the aerobic respiration of lactic acid, mainly in the liver, helping to repay the oxygen debt."},{"id":"ch12r5","tp":"Aerobic respiration","q":"Which process is the reverse of the overall equation for photosynthesis?","o":["anaerobic respiration in yeast","anaerobic respiration in muscles","aerobic respiration","transpiration"],"a":2,"e":"Photosynthesis is 6CO2 + 6H2O → C6H12O6 + 6O2, which is the reverse of aerobic respiration."},{"id":"ch12r6","tp":"Energy comparison","q":"In anaerobic respiration, glucose is converted to lactic acid or alcohol instead of being fully broken down to carbon dioxide and water. What does this mean?","o":["more energy is released than in aerobic respiration","some energy remains stored in the products","no energy is released at all","the same amount of energy is released"],"a":1,"e":"Because glucose is not completely broken down, some energy remains in lactic acid or alcohol, so less energy is released than in aerobic respiration."},{"id":"ch12r7","tp":"Anaerobic respiration in yeast","q":"In brewing, what does yeast convert glucose into?","o":["lactic acid and oxygen","water and carbon dioxide","ethanol and oxygen","alcohol and carbon dioxide"],"a":3,"e":"In anaerobic conditions, yeast converts glucose to alcohol (ethanol) and carbon dioxide."},{"id":"ch12r8","tp":"Anaerobic respiration in muscles","q":"During vigorous exercise, why do muscle cells start to respire anaerobically?","o":["The oxygen supply to the muscles is insufficient","Muscles do not need energy","Too much carbon dioxide is present","There is too much glucose"],"a":0,"e":"Vigorous exercise uses up oxygen faster than it can be supplied to the muscles, so muscle cells respire anaerobically to release extra energy."},{"id":"ch12r9","tp":"Oxygen debt","q":"Which statement about the removal of the oxygen debt is correct?","o":["Lactic acid is transported from the liver to the muscles in the blood","The breathing rate slows down to allow lactic acid to accumulate","Lactic acid is converted to glucose in the lungs","A fast heart rate transports lactic acid in the blood from the muscles to the liver"],"a":3,"e":"The fast heart rate continues after exercise, transporting lactic acid in the blood from the muscles to the liver, where it is respired aerobically."},{"id":"ch12r10","tp":"Oxygen debt","q":"What happens to lactic acid after it is transported to the liver?","o":["It is respired aerobically","It is stored as starch","It is converted to oxygen","It is removed by the kidneys"],"a":0,"e":"In the liver, lactic acid is respired aerobically using the oxygen supplied by deeper and faster breathing."},{"id":"ch12r11","tp":"Respiration in yeast","q":"In an investigation of the effect of temperature on respiration in yeast, the rate of respiration is very low at 60 °C. What is the reason for this?","o":["The yeast runs out of glucose","The yeast produces too much carbon dioxide","The enzymes in the yeast are denatured","The yeast respires too quickly"],"a":2,"e":"At very high temperatures the enzymes controlling respiration are denatured, so the rate falls sharply."}],"adv":[{"id":"ch12a0","tp":"Aerobic respiration","q":"Which statement about the balanced chemical equation for aerobic respiration is correct?","o":["One molecule of glucose reacts with six molecules of oxygen to produce six molecules of carbon dioxide and six molecules of water","One molecule of glucose reacts with one molecule of oxygen to produce carbon dioxide and water","Two molecules of glucose react with six molecules of oxygen","One molecule of glucose reacts with six molecules of oxygen to produce three molecules of carbon dioxide"],"a":0,"e":"The balanced equation is C6H12O6 + 6O2 → 6CO2 + 6H2O, so the only correct statement is the first one."},{"id":"ch12a1","tp":"Anaerobic respiration in yeast","q":"In anaerobic respiration in yeast, what does one molecule of glucose produce?","o":["one molecule of ethanol and one molecule of carbon dioxide","two molecules of lactic acid","two molecules of ethanol and two molecules of carbon dioxide","six molecules of carbon dioxide and six molecules of water"],"a":2,"e":"The balanced equation C6H12O6 → 2C2H5OH + 2CO2 shows that one glucose molecule forms two ethanol and two carbon dioxide molecules."},{"id":"ch12a2","tp":"Respiration in yeast","q":"A student measures the rate of carbon dioxide production by yeast at different temperatures. The results are: 20 °C → 2 cm3 per minute; 30 °C → 4 cm3 per minute; 40 °C → 5 cm3 per minute; 55 °C → 1 cm3 per minute. Which conclusion is supported by the results?","o":["Yeast respires fastest at 20 °C","The optimum temperature for yeast respiration is about 40 °C","Yeast stops respiring above 50 °C","Yeast respires anaerobically at 30 °C"],"a":1,"e":"The rate is highest at 40 °C, so the optimum temperature is about 40 °C; at 55 °C the rate is much lower because enzymes are denatured."},{"id":"ch12a3","tp":"Oxygen debt","q":"After vigorous exercise, the heart rate stays high for a while. What is the main reason for this?","o":["to supply more glucose to the muscles","to cool the body down","to remove alcohol from the blood","to transport lactic acid in the blood from the muscles to the liver"],"a":3,"e":"The continued fast heart rate transports lactic acid in the blood from the muscles to the liver, where it is respired aerobically."},{"id":"ch12a4","tp":"Oxygen debt","q":"Why is the oxygen debt greater after a longer period of vigorous exercise?","o":["The muscles store more oxygen","More lactic acid accumulates in the muscles and blood","The liver stops working","More alcohol is produced"],"a":1,"e":"The longer the period of vigorous exercise, the more lactic acid accumulates, so more oxygen is needed to remove it."},{"id":"ch12a5","tp":"Energy comparison","q":"During fermentation, yeast converts glucose to ethanol. Which statement about the ethanol produced is correct?","o":["It contains little or no energy","It is used immediately in photosynthesis","It still contains chemical energy","It is converted to lactic acid"],"a":2,"e":"In anaerobic respiration, glucose is only partially broken down, so the ethanol still contains some of the chemical energy of glucose."},{"id":"ch12a6","tp":"Uses of energy","q":"Which of the following is NOT a use of energy in living organisms?","o":["protein synthesis","active transport","passage of nerve impulses","diffusion of oxygen"],"a":3,"e":"Diffusion is a passive process that does not require energy. Protein synthesis, active transport and nerve impulses all use energy."},{"id":"ch12a7","tp":"Anaerobic respiration in yeast","q":"Yeast is kept in a glucose solution in anaerobic conditions. Which products would be detected in the surrounding liquid?","o":["oxygen and water","ethanol and carbon dioxide","lactic acid and carbon dioxide","glucose and ethanol"],"a":1,"e":"In anaerobic conditions, yeast respires anaerobically, producing ethanol and carbon dioxide; the ethanol dissolves in the liquid."},{"id":"ch12a8","tp":"Energy comparison","q":"Which statement correctly compares the products of aerobic and anaerobic respiration of glucose?","o":["Anaerobic respiration produces lactic acid or ethanol, which still contain energy","Aerobic respiration produces ethanol","Anaerobic respiration produces more water than aerobic respiration","Aerobic respiration produces lactic acid"],"a":0,"e":"Aerobic respiration completely breaks down glucose to carbon dioxide and water, releasing more energy; anaerobic products still contain energy."},{"id":"ch12a9","tp":"Energy comparison","q":"Why can anaerobic respiration alone not supply enough energy for an endurance athlete such as a marathon runner?","o":["It produces too much carbon dioxide","It requires oxygen","It converts glucose to water","It releases much less energy per glucose molecule and lactic acid builds up"],"a":3,"e":"Anaerobic respiration releases much less energy per glucose molecule, and the lactic acid that builds up causes an oxygen debt."},{"id":"ch12a10","tp":"Anaerobic respiration in muscles","q":"Why does lactic acid build up in the muscles and blood during vigorous exercise?","o":["It is produced faster than it can be removed by respiration","The liver stops working during exercise","Too much oxygen is available","It is only produced after the exercise has stopped"],"a":0,"e":"During vigorous exercise the oxygen supply is insufficient, so lactic acid is produced faster than it can be removed."},{"id":"ch12a11","tp":"Anaerobic respiration in yeast","q":"Yeast is incubated in glucose solution under anaerobic conditions. Which test would confirm that the gas produced is carbon dioxide?","o":["The gas relights a glowing splint","The gas burns with a squeaky pop","The gas turns limewater milky","The gas bleaches damp litmus paper"],"a":2,"e":"Carbon dioxide turns limewater milky. A glowing splint relights in oxygen and a squeaky pop indicates hydrogen."}],"basic_saq":[{"id":"ch12bs0","q":"State four uses of energy in living organisms.","mm":4,"ms":[{"p":"Muscle contraction","pts":1},{"p":"Protein synthesis","pts":1},{"p":"Cell division","pts":1},{"p":"Active transport, or growth, or passage of nerve impulses, or maintenance of a constant body temperature","pts":1}],"e":"Any four uses from the syllabus list (muscle contraction, protein synthesis, cell division, active transport, growth, passage of nerve impulses, maintenance of a constant body temperature) gain one mark each."},{"id":"ch12bs1","q":"State the word equation for aerobic respiration.","mm":2,"ms":[{"p":"glucose + oxygen","pts":1},{"p":"→ carbon dioxide + water","pts":1}],"e":"Aerobic respiration: glucose + oxygen → carbon dioxide + water."}],"review_saq":[{"id":"ch12rs0","q":"Describe how you would investigate the effect of temperature on respiration in yeast, and state the expected result.","mm":4,"ms":[{"p":"Place yeast in a glucose (sugar) solution","pts":1},{"p":"Keep the mixture at different temperatures, for example in water baths","pts":1},{"p":"Measure the rate of carbon dioxide production, for example the volume of gas produced per minute","pts":1},{"p":"The rate increases with temperature up to an optimum, then decreases at high temperature because the enzymes are denatured","pts":1}],"e":"This is the Core investigation on the effect of temperature on respiration in yeast; the rate is judged from carbon dioxide output."},{"id":"ch12rs1","q":"State the word equation for anaerobic respiration in muscles during vigorous exercise, and explain why anaerobic respiration releases less energy per glucose molecule than aerobic respiration.","mm":3,"ms":[{"p":"glucose → lactic acid","pts":1},{"p":"Glucose is not completely broken down / lactic acid still contains some energy","pts":1},{"p":"So much less energy is released","pts":1}],"e":"Anaerobic respiration only partially breaks down glucose, leaving energy stored in lactic acid."}],"adv_saq":[{"id":"ch12as0","q":"Explain how the oxygen debt is removed after vigorous exercise.","mm":4,"ms":[{"p":"The fast heart rate continues, transporting lactic acid in the blood from the muscles to the liver","pts":1},{"p":"Deeper and faster breathing continues, supplying oxygen","pts":1},{"p":"The oxygen is used for aerobic respiration of lactic acid in the liver","pts":1},{"p":"Lactic acid is broken down to carbon dioxide and water / the oxygen debt is repaid","pts":1}],"e":"Removal involves the continued fast heart rate, continued deep breathing and aerobic respiration of lactic acid in the liver."},{"id":"ch12as1","q":"State the balanced chemical equations for aerobic respiration and for anaerobic respiration in yeast.","mm":4,"ms":[{"p":"C6H12O6 + 6O2 → 6CO2 + 6H2O","pts":2},{"p":"C6H12O6 → 2C2H5OH + 2CO2","pts":2}],"e":"Both equations must be balanced; award two marks for each correct balanced equation."}]},"ch13":{"pre":[{"id":"ch13p0","tp":"Excretion","q":"Which gas is excreted through the lungs?","o":["carbon dioxide","oxygen","nitrogen","hydrogen"],"a":0,"e":"Carbon dioxide is a waste product of respiration and is excreted through the lungs."},{"id":"ch13p1","tp":"Urinary system","q":"Which organ excretes urea, excess water and excess ions?","o":["lungs","kidneys","liver","pancreas"],"a":1,"e":"The kidneys excrete urea and excess water and ions from the blood."},{"id":"ch13p2","tp":"Urinary system","q":"Which tube carries urine from each kidney to the bladder?","o":["ureter","urethra","nephron","bronchus"],"a":0,"e":"The ureter carries urine from a kidney to the bladder."},{"id":"ch13p3","tp":"Urinary system","q":"Which structure stores urine before it is removed from the body?","o":["kidney","ureter","bladder","urethra"],"a":2,"e":"The bladder stores urine until it is released from the body."},{"id":"ch13p4","tp":"Urinary system","q":"Through which tube does urine pass out of the body from the bladder?","o":["ureter","nephron","bronchiole","urethra"],"a":3,"e":"The urethra carries urine from the bladder to the outside of the body."},{"id":"ch13p5","tp":"Urea","q":"Where is urea formed in the body?","o":["kidneys","liver","bladder","lungs"],"a":1,"e":"Urea is formed in the liver from excess amino acids."},{"id":"ch13p6","tp":"Excretion","q":"Which of these is NOT an excretory product of humans?","o":["carbon dioxide","urea","excess water","glucose"],"a":3,"e":"Glucose is a useful energy source and is not an excretory product; carbon dioxide, urea and excess water are excreted."},{"id":"ch13p7","tp":"Deamination","q":"What is the name of the process in which the nitrogen-containing part of amino acids is removed to form urea?","o":["assimilation","filtration","deamination","respiration"],"a":2,"e":"Deamination is the removal of the nitrogen-containing part of amino acids to form urea."},{"id":"ch13p8","tp":"Kidney structure","q":"Which region of the kidney is the outer layer?","o":["medulla","ureter","bladder","cortex"],"a":3,"e":"The cortex is the outer region of the kidney; the medulla is the inner region."},{"id":"ch13p9","tp":"Urinary system","q":"Which substance is NOT normally present in the urine of a healthy person?","o":["urea","excess water","glucose","excess ions"],"a":2,"e":"Glucose is fully reabsorbed into the blood by the nephron, so it is not normally present in urine."},{"id":"ch13p10","tp":"Urea","q":"Which of these is a waste product excreted by the kidneys?","o":["urea","glucose","oxygen","amino acids"],"a":0,"e":"Urea is a nitrogenous waste product that is excreted by the kidneys in urine."},{"id":"ch13p11","tp":"Liver","q":"In the liver, amino acids can be converted into which substance by assimilation?","o":["proteins","urea","starch","glucose"],"a":1,"e":"The liver assimilates amino acids by converting them into proteins."},{"id":"ch13p12","tp":"Importance of excretion","q":"Why is it important that urea is excreted from the body?","o":["because urea stores energy","because urea is needed for respiration","because urea is toxic","because urea makes urine yellow"],"a":2,"e":"Urea is toxic, so it must be removed from the body by excretion."},{"id":"ch13p13","tp":"Nephron","q":"What is the name of the functional unit of the kidney where filtration and reabsorption take place?","o":["nephron","ureter","cortex","bladder"],"a":0,"e":"The nephron is the functional unit of the kidney where filtration and reabsorption occur."}],"basic":[{"id":"ch13b0","tp":"Excretion","q":"Which statement best describes excretion?","o":["the removal of waste products made by the body's cells","the removal of undigested food from the gut","the taking in of oxygen into the blood","the breakdown of glucose to release energy"],"a":0,"e":"Excretion is the removal of toxic or waste products made by the cells, such as carbon dioxide and urea."},{"id":"ch13b1","tp":"Excretion","q":"Which statement about the removal of carbon dioxide is correct?","o":["Carbon dioxide is removed through the lungs when we breathe out","Carbon dioxide is removed by the kidneys in urine","Carbon dioxide is removed through the skin as sweat","Carbon dioxide is stored in the bladder"],"a":0,"e":"Carbon dioxide is a waste product of respiration and is excreted through the lungs during expiration."},{"id":"ch13b2","tp":"Urinary system","q":"In which order does urine pass through the structures of the urinary system?","o":["bladder, ureter, urethra, kidney","kidney, ureter, bladder, urethra","ureter, kidney, bladder, urethra","kidney, bladder, ureter, urethra"],"a":1,"e":"Urine is formed in the kidney, passes down the ureter to the bladder, and leaves the body through the urethra."},{"id":"ch13b3","tp":"Urinary system","q":"Which substances are found in the urine produced by the kidneys?","o":["urea, glucose and proteins","glucose, amino acids and vitamins","urea, excess water and excess ions","carbon dioxide, oxygen and urea"],"a":2,"e":"Urine is formed from urea, excess water and excess ions, because the useful substances are reabsorbed first."},{"id":"ch13b4","tp":"Nephron","q":"Where in the kidney does filtration of the blood take place?","o":["medulla","ureter","bladder","glomerulus"],"a":3,"e":"The glomerulus is a knot of capillaries in the nephron where filtration of the blood occurs."},{"id":"ch13b5","tp":"Nephron","q":"Which set of substances is filtered out of the blood at the glomerulus?","o":["water, glucose, urea and ions","blood cells, water and glucose","urea, proteins and starch","oxygen, carbon dioxide and urea"],"a":0,"e":"The glomerulus filters water, glucose, urea and ions from the blood."},{"id":"ch13b6","tp":"Nephron","q":"Which substance is completely reabsorbed back into the blood along the nephron?","o":["urea","water","glucose","ions"],"a":2,"e":"All of the glucose in the filtrate is reabsorbed; some ions and most of the water are also reabsorbed, but not all of them."},{"id":"ch13b7","tp":"Kidney structure","q":"Which statement correctly describes a region of the kidney?","o":["the cortex is the inner region","the ureter is the inner region","the medulla is the inner region","the nephron is the inner region"],"a":2,"e":"The medulla is the inner region of the kidney, and the cortex is the outer region."},{"id":"ch13b8","tp":"Excretion","q":"Excess water in the body is excreted by the kidneys in which form?","o":["sweat","urine","carbon dioxide","bile"],"a":1,"e":"Excess water is removed from the blood by the kidneys and is excreted as part of urine."},{"id":"ch13b9","tp":"Nephron","q":"Which of these describes the role of the nephron?","o":["to filter the blood and reabsorb useful substances","to store urine","to form urea from amino acids","to carry urine out of the body"],"a":0,"e":"The nephron filters the blood at the glomerulus and reabsorbs glucose, some ions and most of the water."},{"id":"ch13b10","tp":"Nephron","q":"How much of the water in the filtrate is reabsorbed back into the blood along the nephron?","o":["all of it","most of it","none of it","only the excess"],"a":1,"e":"Most of the water in the filtrate is reabsorbed back into the blood; the rest is excreted in urine."},{"id":"ch13b11","tp":"Urea","q":"A person eats more protein than the body needs. What happens to the excess amino acids?","o":["They are stored in the muscles","They are converted into carbon dioxide","They are excreted unchanged by the lungs","They are converted to urea in the liver and excreted by the kidneys"],"a":3,"e":"Excess amino acids are deaminated in the liver to form urea, which is excreted by the kidneys in urine."}],"review":[{"id":"ch13r0","tp":"Urea","q":"Why does a marathon runner produce more urea than usual during a long race?","o":["The kidneys reabsorb more glucose","The bladder stores more urine","More amino acids are used as an energy source, so more urea is formed in the liver","The lungs excrete less carbon dioxide"],"a":2,"e":"During prolonged exercise, amino acids may be used as an energy source, so more urea is formed in the liver from the excess amino acids."},{"id":"ch13r1","tp":"Nephron","q":"A person's kidneys are not filtering the blood properly. Which substances would build up in the blood?","o":["urea and excess ions","proteins and starch","carbon dioxide and glucose","glucose and oxygen"],"a":0,"e":"The kidneys filter urea and excess ions out of the blood, so if filtration fails these substances accumulate in the blood."},{"id":"ch13r2","tp":"Nephron","q":"Which statement correctly describes what happens in a nephron?","o":["The glomerulus reabsorbs glucose and the tubule filters urea","The glomerulus filters only urea and the tubule reabsorbs all the water","The glomerulus reabsorbs all the ions and the tubule filters glucose","The glomerulus filters water, glucose, urea and ions; the tubule reabsorbs all the glucose, some ions and most of the water"],"a":3,"e":"The glomerulus filters water, glucose, urea and ions from the blood, and along the nephron all glucose, some ions and most of the water are reabsorbed."},{"id":"ch13r3","tp":"Nephron","q":"What would be the effect on the urine if glucose filtered at the glomerulus was not reabsorbed?","o":["The urine would contain no urea","The urine would contain more water","The urine would contain more ions","The urine would contain glucose"],"a":3,"e":"Glucose is normally completely reabsorbed, so if it were not reabsorbed it would appear in the urine."},{"id":"ch13r4","tp":"Urea","q":"Which statement about urea is correct?","o":["Urea is filtered from the blood by the glomerulus and excreted in urine","Urea is produced in the kidneys","Urea is reabsorbed by the nephron into the blood","Urea is formed in the bladder"],"a":0,"e":"Urea is formed in the liver, filtered from the blood at the glomerulus, and excreted in urine."},{"id":"ch13r5","tp":"Urinary system","q":"What would be the direct result of a blocked ureter?","o":["Urine could not leave the bladder","Urine could not pass out of the body","Urine could not pass from the kidney to the bladder","The kidneys would produce more urea"],"a":2,"e":"The ureter carries urine from the kidney to the bladder, so a blockage would stop urine passing between these organs."},{"id":"ch13r6","tp":"Deamination","q":"Why is the nitrogen-containing part removed from amino acids before they are used for energy?","o":["Because it is needed for respiration","Because it is stored in the muscles","Because it is converted into glucose","Because it is not needed for energy and forms toxic urea"],"a":3,"e":"The nitrogen-containing part cannot be used for energy and would form toxic urea, so it is removed and excreted."},{"id":"ch13r7","tp":"Nephron","q":"A person drinks very little water for a day. What would you expect about their urine?","o":["It would be more concentrated, with less water","It would contain more glucose","It would contain more urea but no ions","It would be more dilute"],"a":0,"e":"Most of the water in the filtrate is reabsorbed, so when little water is taken in the urine is more concentrated."},{"id":"ch13r8","tp":"Nephron","q":"Where in the kidney is most of the water in the filtrate reabsorbed into the blood?","o":["in the glomerulus","in the nephron tubule","in the ureter","in the bladder"],"a":1,"e":"Most of the water is reabsorbed back into the blood along the nephron tubule."},{"id":"ch13r9","tp":"Kidney structure","q":"A cut through a kidney shows a pale inner region and a darker outer region. What are these regions called?","o":["medulla and cortex","cortex and ureter","nephron and bladder","glomerulus and medulla"],"a":0,"e":"The medulla is the inner region and the cortex is the outer region of the kidney."},{"id":"ch13r10","tp":"Excretion","q":"Which row correctly matches an organ with its function?","o":["liver – forms urea from excess amino acids; kidney – excretes urea and excess water and ions","liver – stores urine; kidney – filters blood","bladder – forms urea; ureter – stores urine","ureter – forms urine; bladder – filters blood"],"a":0,"e":"The liver forms urea from excess amino acids, and the kidneys excrete urea and excess water and ions."},{"id":"ch13r11","tp":"Importance of excretion","q":"What is the main reason the body must excrete excess water and ions?","o":["to provide energy for cells","to keep the concentrations of water and ions in the body constant","to produce more urea","to increase the volume of blood"],"a":1,"e":"Excreting excess water and ions helps to keep their concentrations in the body constant."}],"adv":[{"id":"ch13a0","tp":"Nephron","q":"Compared with the blood entering a kidney, what would you expect in the blood leaving the kidney?","o":["a higher concentration of urea, because urea is produced in the kidney","a lower concentration of urea, because urea is filtered out of the blood and not reabsorbed","the same concentration of urea, because urea is not filtered","a higher concentration of urea, because urea is reabsorbed into the blood"],"a":1,"e":"Urea is filtered out of the blood at the glomerulus and is not reabsorbed, so blood leaving the kidney has less urea."},{"id":"ch13a1","tp":"Nephron","q":"The glomerulus is damaged and blood cells can pass into the filtrate. What would the urine contain as a result?","o":["urine would contain no urea","all the glucose would be reabsorbed","more water would be reabsorbed","urine would contain blood cells"],"a":3,"e":"Normally blood cells do not pass through the glomerulus, so if it is damaged, blood cells enter the filtrate and appear in the urine."},{"id":"ch13a2","tp":"Nephron","q":"A person produces a much larger volume of very dilute urine than normal. What is a likely cause?","o":["The nephrons are not reabsorbing enough water","The nephrons are reabsorbing too much water","The liver is producing too little urea","The glomeruli are not filtering the blood"],"a":0,"e":"Most of the water is normally reabsorbed along the nephron, so if less water is reabsorbed a large volume of dilute urine is produced."},{"id":"ch13a3","tp":"Nephron","q":"Which statement about the formation of urine is correct?","o":["Urine is formed before the blood is filtered","Urine consists of urea, excess water and excess ions that are not reabsorbed","All the water in the filtrate becomes urine","Glucose is added to urine by the bladder"],"a":1,"e":"Urine is the fluid left after reabsorption; it contains urea, excess water and excess ions."},{"id":"ch13a4","tp":"Nephron","q":"A patient has glucose in the urine but a normal blood glucose concentration. Which part of the kidney is most likely not working correctly?","o":["the nephron, which is not reabsorbing glucose","the glomerulus, which is producing too much glucose","the bladder, which is adding glucose to the urine","the ureter, which is reabsorbing urea"],"a":0,"e":"Glucose is normally fully reabsorbed by the nephron, so glucose in the urine suggests the nephron is not reabsorbing it."},{"id":"ch13a5","tp":"Urea","q":"Which sequence correctly describes what happens to urea in the body?","o":["urea is formed in the kidney, stored in the bladder, then reabsorbed","urea is formed in the liver, filtered from the blood at the glomerulus, and excreted in urine","urea is formed in the liver, reabsorbed by the nephron, and stored in the cortex","urea is formed in the bladder and transported by the ureter to the kidney"],"a":1,"e":"Urea is formed in the liver, filtered from the blood at the glomerulus, and excreted in the urine."},{"id":"ch13a6","tp":"Deamination","q":"During deamination, which part of an amino acid is removed, and which substance is formed?","o":["the carbon-containing part; glucose","the oxygen-containing part; carbon dioxide","the nitrogen-containing part; urea","the hydrogen-containing part; water"],"a":2,"e":"Deamination removes the nitrogen-containing part of an amino acid to form urea."},{"id":"ch13a7","tp":"Nephron","q":"A person's nephrons stop reabsorbing ions. Which substance would appear in abnormally large amounts in the urine?","o":["glucose","urea","oxygen","ions"],"a":3,"e":"Some ions are normally reabsorbed back into the blood, so if reabsorption stops more ions pass into the urine."},{"id":"ch13a8","tp":"Importance of excretion","q":"Why is it important to excrete excess ions even though ions are useful to the body?","o":["Because excess ions cannot be stored in the body","Because ions are needed for respiration","Because excess ions may be toxic and upset the balance of water in the body","Because ions stop urea being formed"],"a":2,"e":"Excess ions can be toxic and upset the water balance, so they are excreted by the kidneys."},{"id":"ch13a9","tp":"Nephron","q":"After drinking a large volume of water, what would a urine sample most likely show?","o":["more concentrated urine with more urea","a smaller volume of urine with less urea","urine containing no urea","the same amount of urea in a larger volume of more dilute urine"],"a":3,"e":"The amount of urea produced is unchanged, but a larger volume of water is excreted, giving dilute urine with the same urea."},{"id":"ch13a10","tp":"Liver","q":"Which two processes in the liver involve amino acids?","o":["assimilation and deamination","filtration and reabsorption","respiration and photosynthesis","excretion and digestion"],"a":0,"e":"The liver assimilates amino acids into proteins and deaminates excess amino acids to form urea."},{"id":"ch13a11","tp":"Importance of excretion","q":"What does it mean to say that urea is toxic?","o":["It is an essential nutrient for cells","It is required for the formation of urine","It is harmful to the body if it is not removed","It provides energy when respired"],"a":2,"e":"A toxic substance is harmful to the body, so urea must be removed by excretion."}],"basic_saq":[{"id":"ch13bs0","q":"State which substances are excreted by the lungs and which are excreted by the kidneys.","mm":3,"ms":[{"p":"carbon dioxide is excreted by the lungs","pts":1},{"p":"urea is excreted by the kidneys","pts":1},{"p":"excess water and excess ions are excreted by the kidneys","pts":1}],"e":"Recall of the excretory products of the lungs and kidneys."},{"id":"ch13bs1","q":"State what urea is made from and the organ in which it is made. Describe what happens to the urea after it is made.","mm":3,"ms":[{"p":"urea is made from excess amino acids","pts":1},{"p":"urea is made in the liver","pts":1},{"p":"urea is carried in the blood to the kidneys and excreted in urine / filtered from the blood at the glomerulus","pts":1}],"e":"Recall of urea formation and its route to excretion."}],"review_saq":[{"id":"ch13rs0","q":"Describe the structure of a nephron and name the substances filtered from the blood at the glomerulus.","mm":3,"ms":[{"p":"a nephron is a tubule / the functional unit of the kidney, with a knot of capillaries (the glomerulus) at one end","pts":1},{"p":"water is filtered from the blood at the glomerulus","pts":1},{"p":"glucose, urea and ions are also filtered from the blood at the glomerulus","pts":1}],"e":"Covers nephron structure and the substances filtered at the glomerulus."},{"id":"ch13rs1","q":"A person eats a meal that is very rich in protein. Explain what happens in the liver to the excess amino acids and why this must happen.","mm":3,"ms":[{"p":"the liver removes the nitrogen-containing part of the excess amino acids (deamination)","pts":1},{"p":"urea is formed from the nitrogen-containing part / from the excess amino acids","pts":1},{"p":"this must happen because urea is toxic and would harm the body if it built up","pts":1}],"e":"Tests deamination and the importance of removing toxic urea."}],"adv_saq":[{"id":"ch13as0","q":"Explain how the nephron produces urine, referring to filtration and reabsorption.","mm":4,"ms":[{"p":"blood is filtered at the glomerulus; water, glucose, urea and ions pass into the filtrate","pts":1},{"p":"all of the glucose is reabsorbed back into the blood","pts":1},{"p":"some of the ions and most of the water are reabsorbed back into the blood","pts":1},{"p":"the remaining fluid (urine) contains urea, excess water and excess ions","pts":1}],"e":"Extended understanding of urine formation in the nephron."},{"id":"ch13as1","q":"A patient has kidney failure and urea is no longer filtered from the blood. Explain why this is dangerous and describe the normal route by which urea is removed from the body.","mm":4,"ms":[{"p":"urea is toxic","pts":1},{"p":"without filtration urea would build up in the blood and poison / harm the body","pts":1},{"p":"normally urea is formed in the liver and carried in the blood to the kidneys","pts":1},{"p":"it is filtered from the blood at the glomerulus and excreted in urine through the ureter, bladder and urethra","pts":1}],"e":"Extended reasoning about the toxicity of urea and the normal excretion route."}]},"ch14":{"pre":[{"id":"ch14p0","tp":"Nervous system","q":"The central nervous system (CNS) in a mammal consists of which two parts?","o":["Nerves and ganglia","Spinal cord and nerves","Brain and spinal cord","Brain and sense organs"],"a":2,"e":"The CNS consists of the brain and the spinal cord; the nerves outside these form the peripheral nervous system."},{"id":"ch14p1","tp":"Reflex arc","q":"Which sequence shows the correct order of components in a reflex arc?","o":["effector → motor neurone → relay neurone → sensory neurone → receptor","receptor → sensory neurone → relay neurone → motor neurone → effector","receptor → motor neurone → relay neurone → sensory neurone → effector","sensory neurone → receptor → relay neurone → effector → motor neurone"],"a":1,"e":"In a reflex arc the impulse passes from receptor to sensory neurone, then relay neurone, then motor neurone, and finally to the effector."},{"id":"ch14p2","tp":"Synapse","q":"A synapse is best described as a...","o":["junction between a neurone and a muscle","gap between a receptor and a neurone","chemical that carries impulses across a gap","junction between two neurones"],"a":3,"e":"A synapse is a junction between two neurones."},{"id":"ch14p3","tp":"Sense organs","q":"Sense organs are groups of receptor cells that respond to...","o":["all stimuli in the same way","only chemical stimuli","specific stimuli such as light, sound and temperature","impulses from the brain"],"a":2,"e":"Sense organs contain groups of receptor cells that respond to specific stimuli, including light, sound, touch, temperature and chemicals."},{"id":"ch14p4","tp":"Eye structure","q":"Which part of the eye controls how much light enters the pupil?","o":["Lens","Cornea","Retina","Iris"],"a":3,"e":"The iris controls how much light enters the pupil by changing the size of the pupil."},{"id":"ch14p5","tp":"Pupil reflex","q":"When the light intensity increases, the pupil...","o":["constricts (becomes narrower)","dilates (becomes wider)","changes colour","moves closer to the lens"],"a":0,"e":"In bright light the pupil constricts, reducing the amount of light entering the eye."},{"id":"ch14p6","tp":"Eye structure","q":"What is the main function of the retina?","o":["It refracts light","It contains light receptors","It focuses light on the lens","It carries impulses to the brain"],"a":1,"e":"The retina contains light receptors, some of which are sensitive to light of different colours."},{"id":"ch14p7","tp":"Hormones","q":"Which statement best describes a hormone?","o":["produced by the blood and carried by glands","carried by nerves and acts only on muscles","produced by the liver and stored in glands","produced by a gland, carried by the blood and alters the activity of target organs"],"a":3,"e":"A hormone is a chemical substance produced by a gland and carried by the blood, which alters the activity of one or more specific target organs."},{"id":"ch14p8","tp":"Blood
