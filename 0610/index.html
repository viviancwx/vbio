osphere, causing the enhanced greenhouse effect and climate change","They block out all sunlight"],"a":2,"e":"Methane and carbon dioxide are greenhouse gases that trap heat in the atmosphere; higher levels enhance this effect, leading to climate change."},{"id":"ch20r3","tp":"Deforestation","q":"Which statement correctly explains why deforestation increases the amount of carbon dioxide in the atmosphere?","o":["Trees release carbon dioxide during photosynthesis","Trees absorb carbon dioxide during respiration","Deforestation increases the uptake of carbon dioxide by the soil","Fewer trees absorb less carbon dioxide, and burning or decay of the trees releases it"],"a":3,"e":"Fewer trees means less carbon dioxide is absorbed during photosynthesis, and when cleared trees are burned or decay, stored carbon is released as carbon dioxide."},{"id":"ch20r4","tp":"Endangered species","q":"How can an introduced species cause a native species to become endangered?","o":["It provides more food for the native species","It competes with native species for food and shelter","It increases the biodiversity of the area","It removes pollution from the habitat"],"a":1,"e":"Introduced species may compete with native species for resources or prey on them, reducing their numbers and causing them to become endangered."},{"id":"ch20r5","tp":"Endangered species","q":"Why can overharvesting cause a species to become extinct?","o":["More individuals are removed than can be replaced by reproduction","It increases the genetic variation of the species","It provides more habitats for the species","It reduces the number of predators of the species"],"a":0,"e":"If more individuals are removed by hunting or harvesting than can be replaced by reproduction, the population declines and may become extinct."},{"id":"ch20r6","tp":"Fish conservation","q":"What is the purpose of a closed season in fishing?","o":["To allow fishing during the breeding season","To increase the number of fishing boats","To protect fish while they are breeding so they can reproduce","To remove all large fish from the population"],"a":2,"e":"Closed seasons ban fishing during breeding times so that fish can reproduce and maintain their populations."},{"id":"ch20r7","tp":"Fish conservation","q":"Why do sustainable fisheries use nets with a mesh size large enough to let young fish escape?","o":["To catch fish of all sizes, including young fish","To make the nets cheaper to produce","To catch the maximum number of fish","To allow young fish to escape so they can grow and reproduce"],"a":3,"e":"Nets with a controlled mesh size allow small, young fish to escape so they can grow, mature and breed, keeping the fish stock sustainable."},{"id":"ch20r8","tp":"Conservation","q":"Why is it important to protect vulnerable ecosystems?","o":["To increase the rate of extinction","To maintain biodiversity and ecosystem functions","To provide more land for housing","To remove all predators from the habitat"],"a":1,"e":"Protecting vulnerable ecosystems helps maintain biodiversity and the ecosystem functions on which organisms depend."},{"id":"ch20r9","tp":"Genetic variation","q":"Why is a decrease in population size a risk to a species?","o":["It reduces the genetic variation within the species","It increases the number of alleles in the population","It makes the species better able to adapt to change","It increases the number of different species in the area"],"a":0,"e":"A smaller population has reduced genetic variation, making the species less able to adapt to changes and more vulnerable to disease."},{"id":"ch20r10","tp":"Artificial insemination","q":"What happens during artificial insemination (AI) in a captive breeding programme?","o":["Eggs are removed and fertilised in a dish outside the body","The female animal is cloned to produce more offspring","Sperm is collected from a male and placed into a female without mating","Genes are transferred from one animal to another"],"a":2,"e":"In artificial insemination, sperm collected from a male is placed into a female so that fertilisation occurs without mating. Fertilising eggs in a dish describes IVF."},{"id":"ch20r11","tp":"Deforestation","q":"Which combination lists the undesirable effects of deforestation?","o":["Increased biodiversity and reduced flooding","Increased soil fertility and more carbon dioxide absorbed","More habitats for wildlife and higher rainfall","Reduced biodiversity, loss of soil, flooding and increased carbon dioxide in the atmosphere"],"a":3,"e":"Deforestation reduces biodiversity, can cause extinction, leads to loss of soil and flooding, and increases carbon dioxide in the atmosphere."}],"adv":[{"id":"ch20a0","tp":"Eutrophication","q":"Which sequence shows the correct order of events in the eutrophication of a river after excess fertiliser enters it?","o":["Death of producers then increased decomposition then increased growth of algae then reduction in dissolved oxygen","Increased growth of producers then increased decomposition then increased aerobic respiration by decomposers then reduction in dissolved oxygen then death of organisms","Reduction in dissolved oxygen then increased growth of producers then increased decomposition then death of organisms","Increased growth of producers then reduction in dissolved oxygen then increased decomposition then death of organisms"],"a":1,"e":"The correct order is: increased nitrate and other ions, increased growth of producers, increased decomposition after death of producers, increased aerobic respiration by decomposers, reduction in dissolved oxygen, death of organisms."},{"id":"ch20a1","tp":"Eutrophication","q":"A farmer adds fertiliser to a field beside a lake. Soon afterwards, many fish in the lake die. Which sequence best explains the deaths?","o":["Algae grow rapidly and then die; decomposers break them down, using up oxygen; the fish die from lack of oxygen","The fish are poisoned directly by the fertiliser","The fertiliser reduces the growth of algae, so the fish starve","The fertiliser cools the water, so the fish cannot survive"],"a":0,"e":"The fertiliser supplies nitrates that make algae grow rapidly; when the algae die, decomposers break them down using up oxygen, so fish die from lack of dissolved oxygen."},{"id":"ch20a2","tp":"Genetic variation","q":"A disease spreads through a small population of an endangered species that has very little genetic variation. Why might almost all the individuals die?","o":["The disease makes the individuals grow faster","The species has too many different alleles","The population is too large to adapt","Few, if any, individuals have alleles that give resistance to the disease"],"a":3,"e":"With very little genetic variation, few or no individuals carry alleles that give resistance to the new disease, so the disease can kill almost the whole population."},{"id":"ch20a3","tp":"IVF","q":"What happens during in vitro fertilisation (IVF) in a captive breeding programme?","o":["Sperm is placed into a female without mating","The largest individuals are selected for breeding","Eggs are fertilised by sperm outside the body before being placed into a female","Females are prevented from producing eggs"],"a":2,"e":"In IVF, eggs are removed and fertilised by sperm in a dish outside the body, and the embryo is then placed into a female. Placing sperm into a female describes AI."},{"id":"ch20a4","tp":"Conservation","q":"Why is conserving biodiversity important for maintaining the provision of resources?","o":["To increase the rate at which natural resources are extracted","Wild species are a source of genes, food, drugs and fuel for humans","To reduce the number of plant species","To replace natural resources with synthetic ones"],"a":1,"e":"Wild species provide genes, food, drugs and fuel, so conserving biodiversity protects these resources for the future."},{"id":"ch20a5","tp":"Plastics","q":"How can non-biodegradable plastics harm organisms in terrestrial ecosystems?","o":["Animals can become trapped in plastic or swallow it and be harmed","Plastics provide nutrients to plants","Plastics are quickly broken down by decomposers","Plastics increase the oxygen content of the soil"],"a":0,"e":"In terrestrial and aquatic ecosystems animals may become entangled in plastic waste or swallow it, causing injury or death; plastics are not broken down by decomposers."},{"id":"ch20a6","tp":"Forest conservation","q":"How does replanting trees help to conserve forests sustainably?","o":["It removes carbon dioxide from the atmosphere immediately","It reduces the number of trees available to the forest","It replaces trees that have been cut down so the forest continues to provide resources","It increases soil erosion"],"a":2,"e":"Replanting replaces trees that have been removed, so the forest resource is produced as rapidly as it is removed and can continue to provide resources sustainably."},{"id":"ch20a7","tp":"Fish conservation","q":"Which combination of measures is most likely to conserve fish stocks sustainably?","o":["Catching as many fish as possible each year","Using nets with a very small mesh size","Fishing every day of the year, including the breeding season","Using quotas, monitoring populations and setting protected areas"],"a":3,"e":"Quotas, monitoring, protected areas, closed seasons and controlled net types all limit the number of fish removed so that the stock is not overharvested."},{"id":"ch20a8","tp":"Biodiversity","q":"Why does high biodiversity help to protect an ecosystem?","o":["It reduces the number of species competing for resources","It removes all predators from the ecosystem","If one species is lost, other species can continue to carry out ecosystem functions such as nutrient cycling","It prevents any species from becoming too numerous"],"a":2,"e":"With high biodiversity, other species can take over the role of a lost species, so ecosystem functions such as nutrient cycling continue and the ecosystem is protected."},{"id":"ch20a9","tp":"Greenhouse effect","q":"Intensive livestock production can release large amounts of methane. Why is this a concern for the environment?","o":["Methane provides nutrients to plants","Methane is a greenhouse gas that contributes to the enhanced greenhouse effect and climate change","Methane increases the oxygen content of the atmosphere","Methane directly kills fish in rivers"],"a":1,"e":"Methane released by livestock is a greenhouse gas; increased methane in the atmosphere enhances the greenhouse effect, contributing to climate change."},{"id":"ch20a10","tp":"Forest conservation","q":"In a sustainably managed forest, quotas are set on the number of trees that may be cut down. Why does this help to conserve the forest?","o":["It increases the rate of deforestation","It removes only the largest trees","It stops the forest from being used by humans at all","It ensures that trees are not removed faster than they can grow back"],"a":3,"e":"Quotas limit how many trees can be cut so that the rate of removal does not exceed the rate at which trees grow back, making the forest sustainable."},{"id":"ch20a11","tp":"Monoculture","q":"A diverse forest is cleared and replaced by a monoculture of a single crop. Which is the most likely result?","o":["Biodiversity falls and the crop is very vulnerable to disease","The biodiversity of the area increases","The soil becomes more fertile","The amount of carbon dioxide absorbed by plants increases"],"a":0,"e":"Replacing a diverse forest with a monoculture reduces biodiversity, and the single genetically similar crop is very vulnerable to pests and disease."}],"basic_saq":[{"id":"ch20bs0","tp":"Food supply","q":"State two ways in which humans have increased food production.","mm":2,"ms":[{"p":"Use of agricultural machinery to use larger areas of land and improve efficiency","pts":1},{"p":"Use of chemical fertilisers to improve yields","pts":1}],"e":"Accept any two from: agricultural machinery, chemical fertilisers, insecticides, herbicides, selective breeding."},{"id":"ch20bs1","tp":"Deforestation","q":"State two undesirable effects of deforestation.","mm":2,"ms":[{"p":"Reduction in biodiversity / extinction of species","pts":1},{"p":"Loss of soil / flooding / increase in carbon dioxide in the atmosphere","pts":1}],"e":"Deforestation reduces biodiversity, may cause extinction, and leads to loss of soil, flooding and increased atmospheric carbon dioxide."}],"review_saq":[{"id":"ch20rs0","tp":"Eutrophication","q":"Explain how excess fertiliser entering a river can lead to the death of fish.","mm":4,"ms":[{"p":"Excess fertiliser increases the availability of nitrate and other ions in the water, causing increased growth of producers such as algae","pts":1},{"p":"When the producers die, they are decomposed by decomposers such as bacteria","pts":1},{"p":"Decomposers carry out increased aerobic respiration, reducing the dissolved oxygen in the water","pts":1},{"p":"Fish and other organisms that require dissolved oxygen die from lack of oxygen","pts":1}],"e":"This is the process of eutrophication: nitrate increase, algal growth, decomposition, oxygen fall, death of organisms."},{"id":"ch20rs1","tp":"Forest conservation","q":"Describe how forests can be conserved and managed sustainably.","mm":4,"ms":[{"p":"Education to inform people about the importance of forests and sustainable use","pts":1},{"p":"Setting up protected areas where logging is restricted","pts":1},{"p":"Using quotas to limit the number of trees cut down","pts":1},{"p":"Replanting trees to replace those that have been removed","pts":1}],"e":"Forests can be conserved using education, protected areas, quotas and replanting."}],"adv_saq":[{"id":"ch20as0","tp":"Genetic variation","q":"Explain why a species with a very small population is at risk of becoming extinct.","mm":3,"ms":[{"p":"A small population has reduced genetic variation (fewer alleles)","pts":1},{"p":"It is less able to adapt to changes in the environment","pts":1},{"p":"It is more vulnerable to disease because few individuals have alleles that give resistance","pts":1}],"e":"Small populations have reduced genetic variation, so the species is less able to adapt and more vulnerable to disease."},{"id":"ch20as1","tp":"Conservation","q":"Explain why it is important to carry out conservation programmes.","mm":4,"ms":[{"p":"To maintain or increase biodiversity","pts":1},{"p":"To reduce extinction","pts":1},{"p":"To protect vulnerable ecosystems","pts":1},{"p":"To maintain ecosystem functions such as nutrient cycling and resource provision, including food, drugs, fuel and genes","pts":1}],"e":"Conservation maintains biodiversity, reduces extinction, protects vulnerable ecosystems and maintains ecosystem functions."}]},"ch21":{"pre":[{"id":"ch21p0","tp":"Bacteria in biotechnology","q":"Why are bacteria useful in biotechnology and genetic modification?","o":["They reproduce very rapidly.","They are large, multicellular organisms.","They can photosynthesise.","They need complex conditions to grow."],"a":0,"e":"Bacteria are useful because they reproduce very rapidly and can make complex molecules."},{"id":"ch21p1","tp":"Bread-making","q":"During bread-making, which gas is produced by anaerobic respiration in yeast and makes the dough rise?","o":["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],"a":1,"e":"Anaerobic respiration in yeast produces carbon dioxide, which forms bubbles that make the dough rise."},{"id":"ch21p2","tp":"Biofuels","q":"What can the ethanol produced by anaerobic respiration in yeast be used as?","o":["A medicine","A fertiliser","A biofuel","A pesticide"],"a":2,"e":"Yeast produces ethanol by anaerobic respiration, and this ethanol can be used as a biofuel."},{"id":"ch21p3","tp":"Pectinase","q":"Which enzyme is used in the production of fruit juice?","o":["Lactase","Catalase","Pectinase","Amylase"],"a":3,"e":"Pectinase is used in fruit juice production to break down pectin and release more juice."},{"id":"ch21p4","tp":"Biological washing powders","q":"What do biological washing powders contain?","o":["Enzymes","Antibiotics","Hormones","Vitamins"],"a":0,"e":"Biological washing powders contain enzymes, which break down stains."},{"id":"ch21p5","tp":"Lactase","q":"Which enzyme is used to produce lactose-free milk?","o":["Lipase","Lactase","Pectinase","Protease"],"a":1,"e":"Lactase breaks down lactose and is used to make lactose-free milk."},{"id":"ch21p6","tp":"Genetic modification","q":"What is genetic modification?","o":["Breeding two different species together.","Growing cells in a fermenter.","Removing, changing or inserting individual genes.","Selecting offspring with desired traits over many generations."],"a":2,"e":"Genetic modification changes an organism's genetic material by removing, changing or inserting individual genes."},{"id":"ch21p7","tp":"Restriction enzymes","q":"What are the cut ends of DNA produced by restriction enzymes called?","o":["Marker sections","Transfer regions","Linking sites","Sticky ends"],"a":3,"e":"Restriction enzymes cut DNA at specific points, forming sticky ends."},{"id":"ch21p8","tp":"Plasmids","q":"What is the small circle of DNA found in bacteria that is used to carry a new gene called?","o":["A plasmid","A nucleus","A chromosome","A ribosome"],"a":0,"e":"A plasmid is a small circle of DNA in bacteria, used as a vector to carry new genes."},{"id":"ch21p9","tp":"DNA ligase","q":"Which enzyme joins a human gene to a bacterial plasmid to form a recombinant plasmid?","o":["Restriction enzyme","DNA ligase","Pectinase","Lactase"],"a":1,"e":"DNA ligase joins the human gene and the plasmid DNA together to form a recombinant plasmid."},{"id":"ch21p10","tp":"Fermenters","q":"Which useful product is made by genetically modified bacteria in a fermenter to treat diabetes?","o":["Penicillin","Insulin","Mycoprotein","Ethanol"],"a":2,"e":"Genetically modified bacteria in a fermenter produce human insulin, which is used to treat diabetes."},{"id":"ch21p11","tp":"Fermenters","q":"Which of these is a medicine made by fungi growing in a fermenter?","o":["Insulin","Mycoprotein","Penicillin","Ethanol"],"a":3,"e":"Penicillin is an antibiotic made by the fungus Penicillium growing in a fermenter."},{"id":"ch21p12","tp":"GM crops","q":"What can inserting genes into crop plants to make them resistant to insect pests help to reduce?","o":["The need for pesticides","The need for fertilisers","The need for water","The need for sunlight"],"a":0,"e":"Insect-resistant GM crops suffer less insect damage, so farmers need to use fewer pesticides."},{"id":"ch21p13","tp":"Fermenters","q":"Which type of organism is grown in a fermenter to produce mycoprotein?","o":["A bacterium","A fungus","A virus","A plant"],"a":1,"e":"Mycoprotein is made by growing a fungus in a fermenter."}],"basic":[{"id":"ch21b0","tp":"Bacteria in biotechnology","q":"Which two features make bacteria especially useful in biotechnology and genetic modification?","o":["Rapid reproduction rate and ability to make complex molecules.","Large size and slow reproduction.","Ability to photosynthesise and produce oxygen.","Complex cell structure and many chromosomes."],"a":0,"e":"Bacteria are useful because they reproduce rapidly and can make complex molecules."},{"id":"ch21b1","tp":"Bread-making","q":"During bread-making, yeast respires anaerobically. Which substances are produced?","o":["Oxygen and water","Ethanol and carbon dioxide","Lactic acid and oxygen","Glucose and carbon dioxide"],"a":1,"e":"Anaerobic respiration in yeast produces ethanol and carbon dioxide."},{"id":"ch21b2","tp":"Pectinase","q":"Pectinase is added to fruit pulp during fruit juice production. What is the effect?","o":["It kills microorganisms in the juice.","It breaks down pectin, releasing more juice.","It adds sweetness to the juice.","It removes the colour from the juice."],"a":2,"e":"Pectinase breaks down pectin, which releases more juice from the fruit pulp."},{"id":"ch21b3","tp":"Biological washing powders","q":"At which temperature are biological washing powders most effective?","o":["Very high temperatures (above 70°C)","Warm temperatures (about 40°C)","Freezing temperatures","Any temperature"],"a":1,"e":"Biological washing powders work best at warm temperatures of about 40°C, because the enzymes work at their optimum."},{"id":"ch21b4","tp":"Lactase","q":"Lactase is used to produce lactose-free milk. What is lactose broken down into?","o":["Glucose and galactose","Glucose and fructose","Sucrose and glucose","Amino acids"],"a":0,"e":"Lactase breaks down lactose into glucose and galactose."},{"id":"ch21b5","tp":"Fermenters","q":"Which of these does NOT need to be controlled in a fermenter?","o":["Temperature","pH","Oxygen supply","Light intensity"],"a":3,"e":"Temperature, pH, oxygen, nutrient supply and waste products are controlled in a fermenter; light intensity is not."},{"id":"ch21b6","tp":"GM crops","q":"Genes can be inserted into crop plants. Which is a possible purpose of this genetic modification?","o":["To confer resistance to insect pests.","To make the plants flower earlier in spring.","To increase the rate of photosynthesis.","To make the plants need more water."],"a":0,"e":"Genes can be inserted into crop plants to give resistance to insect pests, resistance to herbicides, or improved nutrition."},{"id":"ch21b7","tp":"Restriction enzymes","q":"The human gene is removed from human DNA during genetic modification. Which enzyme is used to do this?","o":["DNA ligase","Lactase","Restriction enzyme","Pectinase"],"a":2,"e":"Restriction enzymes cut DNA at specific places, isolating the human gene and forming sticky ends."},{"id":"ch21b8","tp":"Recombinant plasmids","q":"After a human gene has been inserted into a plasmid, what is the plasmid described as?","o":["A recombinant plasmid","A modified chromosome","A recombinant gene","A bacterial nucleus"],"a":1,"e":"A plasmid that contains a new gene is called a recombinant plasmid."},{"id":"ch21b9","tp":"Restriction enzymes","q":"The sticky ends of the human gene and the cut plasmid DNA are complementary. What does this allow?","o":["The human gene to be expressed as a protein.","The bacteria to multiply.","The restriction enzyme to cut again.","The human gene and the plasmid to join together."],"a":3,"e":"Complementary sticky ends allow the human gene and the cut plasmid to join together."},{"id":"ch21b10","tp":"GM crops","q":"GM rice has been developed with improved nutritional qualities. What does this mean?","o":["It is resistant to insect pests.","It is resistant to herbicides.","It contains a higher level of a nutrient such as vitamin A.","It grows faster in cold climates."],"a":2,"e":"GM rice with improved nutritional qualities contains higher levels of nutrients, such as vitamin A."},{"id":"ch21b11","tp":"Recombinant plasmids","q":"After the recombinant plasmid has been inserted into bacteria, why are the bacteria multiplied?","o":["To make the bacteria resistant to antibiotics.","To cut the plasmid open again.","To remove the human gene from the plasmid.","To make many copies of the human gene."],"a":3,"e":"The bacteria are multiplied so that many copies of the human gene are made and the human protein is produced in large amounts."}],"review":[{"id":"ch21r0","tp":"Biofuels","q":"For the production of ethanol as a biofuel, yeast is grown in large containers without oxygen. Why is oxygen excluded?","o":["So that the yeast respires anaerobically and produces ethanol.","So that the yeast cannot reproduce.","To keep the temperature low.","To allow carbon dioxide to escape."],"a":0,"e":"Without oxygen, yeast respires anaerobically and produces ethanol, which is used as a biofuel."},{"id":"ch21r1","tp":"Biological washing powders","q":"Biological washing powders contain enzymes. Why is it important not to use them at very high temperatures?","o":["The enzymes would not be released.","The enzymes would dissolve.","The enzymes would be denatured.","The enzymes would produce more foam."],"a":2,"e":"At very high temperatures the enzymes in biological washing powders would be denatured and would not work."},{"id":"ch21r2","tp":"Pectinase","q":"Which is an advantage of using pectinase in fruit juice production?","o":["It makes the juice cloudy.","It increases the yield of juice.","It preserves the juice for longer.","It adds vitamins to the juice."],"a":1,"e":"Pectinase breaks down pectin in the fruit, releasing more juice and so increasing the yield."},{"id":"ch21r3","tp":"Fermenters","q":"In a fermenter used to produce mycoprotein, why is it important to supply oxygen?","o":["Oxygen is needed to remove waste products.","Oxygen prevents the fungus from reproducing.","The fungus needs oxygen for aerobic respiration to release energy for growth.","Oxygen lowers the temperature in the fermenter."],"a":2,"e":"The fungus that makes mycoprotein needs oxygen for aerobic respiration to release energy for growth and reproduction."},{"id":"ch21r4","tp":"Fermenters","q":"In a fermenter, why is the nutrient supply important?","o":["Microorganisms need nutrients for growth and reproduction.","Nutrients keep the temperature constant.","Nutrients remove waste products.","Nutrients increase the oxygen supply."],"a":0,"e":"Microorganisms need nutrients such as glucose to grow, reproduce and make the useful product."},{"id":"ch21r5","tp":"Fermenters","q":"Why might waste products need to be removed from a fermenter?","o":["They increase the oxygen supply.","They speed up enzyme action.","They change the colour of the product.","They may be toxic and stop the microorganisms growing."],"a":3,"e":"Waste products may be toxic and could stop the microorganisms growing, so they are removed."},{"id":"ch21r6","tp":"Genetic modification","q":"Which is the correct order of steps in genetic modification to produce a human protein in bacteria?","o":["Cut plasmid with restriction enzyme, then isolate the human gene, then join with DNA ligase, then insert into bacteria.","Isolate the human gene with a restriction enzyme, cut the plasmid with the same enzyme, join using DNA ligase, then insert into bacteria.","Insert the gene into bacteria, then isolate the gene, then cut the plasmid, then join the pieces.","Join the gene to the plasmid, then isolate the gene, then multiply the bacteria."],"a":1,"e":"The gene is isolated and the plasmid cut with the same restriction enzyme, joined with DNA ligase, then the recombinant plasmid is inserted into bacteria."},{"id":"ch21r7","tp":"Restriction enzymes","q":"In genetic modification, why is the same restriction enzyme used to cut both the human DNA and the plasmid DNA?","o":["So that the sticky ends are complementary and can join together.","So that both pieces of DNA are cut at many places.","So that DNA ligase can also cut the DNA.","So that the bacteria are not harmed."],"a":0,"e":"Using the same restriction enzyme produces complementary sticky ends, so the human gene and plasmid can join together."},{"id":"ch21r8","tp":"GM crops","q":"A farmer grows GM maize that is resistant to insect pests. What is a likely advantage?","o":["The maize plants need less water.","The maize plants can grow without light.","The maize produces its own fertiliser.","Less of the crop is damaged by insects, so the yield is higher."],"a":3,"e":"Insect-resistant GM crops suffer less damage from insects, so the yield is higher and fewer pesticides are needed."},{"id":"ch21r9","tp":"GM crops","q":"Some people are concerned about eating genetically modified food. Which is a reason for this concern?","o":["GM food always contains poisons.","The long-term health effects of eating GM food are not fully known.","GM food has no nutritional value.","GM food cannot be stored for long."],"a":1,"e":"A common concern is that the long-term health effects of eating GM food are not yet fully known."},{"id":"ch21r10","tp":"GM crops","q":"A farmer grows GM soya that is resistant to a herbicide. What is the advantage for the farmer?","o":["The soya plants grow faster in cold weather.","The soya plants produce their own fertiliser.","The farmer can spray the field to kill weeds without damaging the soya crop.","The soya plants are resistant to insect pests."],"a":2,"e":"Herbicide-resistant crops can be sprayed with herbicide to kill weeds without damaging the crop."},{"id":"ch21r11","tp":"Genetic modification","q":"In genetic modification, the human gene is expressed in bacteria. What does 'expressed' mean?","o":["The gene is removed from the bacteria.","The bacteria divide rapidly.","The plasmid joins the bacterial chromosome.","The bacteria make the human protein."],"a":3,"e":"When a gene is expressed, the protein it codes for is made; here the bacteria make the human protein."}],"adv":[{"id":"ch21a0","tp":"Bacteria in biotechnology","q":"Some people have few ethical concerns about manipulating and growing bacteria for genetic modification. Which is a reason for this?","o":["Bacteria can cause disease.","Bacteria are simple organisms that are not considered to have the same welfare or ethical concerns as animals.","Bacteria cannot be genetically modified.","Bacteria are plants."],"a":1,"e":"Bacteria are simple organisms, so there are few ethical concerns about their manipulation and growth, unlike with animals."},{"id":"ch21a1","tp":"Lactase","q":"Why is lactase added to milk during the production of lactose-free milk?","o":["To break down lactose into glucose and galactose, which lactose-intolerant people can digest.","To kill bacteria in the milk.","To increase the fat content of the milk.","To make the milk last longer."],"a":0,"e":"Lactase breaks down lactose into glucose and galactose, which people who are lactose-intolerant can digest."},{"id":"ch21a2","tp":"Fermenters","q":"In a fermenter, why must the pH be monitored and controlled?","o":["To keep the product coloured.","To increase the amount of oxygen.","To prevent the formation of waste products.","To keep the enzymes of the microorganisms working at their optimum pH."],"a":3,"e":"Enzymes work best at an optimum pH, so the pH in a fermenter is controlled to keep enzyme activity high."},{"id":"ch21a3","tp":"Biofuels","q":"Yeast cells in a fermenter switch from aerobic to anaerobic respiration. What is the effect on ethanol production?","o":["Ethanol is produced only when oxygen is limited.","Ethanol is produced only in the presence of oxygen.","Ethanol production is unaffected by oxygen.","Ethanol is converted back into glucose."],"a":0,"e":"Ethanol is a product of anaerobic respiration, so it is produced only when oxygen is limited."},{"id":"ch21a4","tp":"Fermenters","q":"A fermenter producing penicillin uses the fungus Penicillium. Why must the temperature be kept constant?","o":["To prevent the fungus from reproducing.","To keep the enzymes controlling the fungus's reactions working at their optimum rate.","To make the penicillin more concentrated.","To reduce the oxygen supply."],"a":1,"e":"Temperature is kept at the optimum so the enzymes work at their fastest rate; too high a temperature would denature them."},{"id":"ch21a5","tp":"Recombinant plasmids","q":"After the recombinant plasmid has been inserted into bacteria, what happens next?","o":["The plasmid is cut open again.","The bacteria are heated to kill them.","The bacteria multiply and the human gene is expressed to produce the human protein.","The human gene is removed from the plasmid."],"a":2,"e":"The bacteria are multiplied, and the human gene is expressed to make the human protein."},{"id":"ch21a6","tp":"Plasmids","q":"A student says that in genetic modification the plasmid acts as a vector. What does this mean?","o":["It cuts the human gene out of the DNA.","It provides energy for the bacteria.","It makes the bacteria reproduce faster.","It carries the human gene into the bacteria."],"a":3,"e":"A vector carries the new gene; here the plasmid carries the human gene into the bacteria."},{"id":"ch21a7","tp":"GM crops","q":"A farmer sprays herbicide on a field of GM herbicide-resistant soya. A weed plant in the field receives the herbicide-resistance gene from the soya. What could be the result?","o":["The weed dies immediately.","The soya plants lose their resistance.","The weed becomes resistant to the herbicide and is harder to control.","The weed grows more slowly."],"a":2,"e":"If the herbicide-resistance gene spreads to a weed, the weed also becomes resistant to the herbicide and is harder to control."},{"id":"ch21a8","tp":"Fermenters","q":"In a fermenter, the pH was allowed to fall from 7 to 4. The rate of production of a useful product decreased. What is the most likely explanation?","o":["The microorganisms reproduced faster.","The enzymes in the microorganisms no longer worked at their optimum because the pH was outside their optimum.","The oxygen supply increased.","The nutrient supply doubled."],"a":1,"e":"Enzymes work at an optimum pH; when the pH moved away from the optimum, enzyme activity and product formation decreased."},{"id":"ch21a9","tp":"GM crops","q":"Some farmers grow only one variety of GM crop over a very large area. What is a possible disadvantage of this?","o":["It reduces biodiversity.","It increases biodiversity.","It makes the soil more fertile.","It increases the number of insect pests."],"a":0,"e":"Growing one GM variety over a large area reduces biodiversity, which is a possible disadvantage of GM crops."},{"id":"ch21a10","tp":"GM crops","q":"Which is an advantage of producing human insulin using genetically modified bacteria rather than extracting it from animals?","o":["Bacteria make insulin that is different from human insulin.","Bacteria produce insulin without needing a fermenter.","Large quantities of human insulin can be produced quickly by bacteria.","Bacterial insulin is made from animal pancreas."],"a":2,"e":"Genetically modified bacteria reproduce rapidly, so large quantities of human insulin can be produced quickly."},{"id":"ch21a11","tp":"GM crops","q":"Golden rice is a GM crop with improved nutritional qualities. Which problem could it help to reduce?","o":["Insect pest damage.","Weed competition.","Drought damage.","Vitamin A deficiency."],"a":3,"e":"Golden rice contains increased vitamin A, so it can help reduce vitamin A deficiency in people who eat it."}],"basic_saq":[{"id":"ch21bs0","tp":"Bread-making","q":"Describe the role of anaerobic respiration in yeast during bread-making.","mm":3,"ms":[{"p":"Yeast carries out anaerobic respiration in the dough.","pts":1},{"p":"Carbon dioxide is produced.","pts":1},{"p":"The carbon dioxide makes the dough rise by forming bubbles.","pts":1}],"e":"Anaerobic respiration in yeast produces carbon dioxide, which makes the dough rise."},{"id":"ch21bs1","tp":"Biological washing powders","q":"Describe the use of biological washing powders that contain enzymes.","mm":3,"ms":[{"p":"They contain enzymes that break down stains, such as protein and fat stains.","pts":1},{"p":"They work at warm temperatures, about 40°C.","pts":1},{"p":"At very high temperatures the enzymes would be denatured.","pts":1}],"e":"Enzymes in biological washing powders break down stains at warm temperatures; very hot water would denature them."}],"review_saq":[{"id":"ch21rs0","tp":"Fermenters","q":"Describe how a fermenter can be used to produce a useful product on a large scale. Name one useful product and state the conditions that need to be controlled.","mm":4,"ms":[{"p":"Name a useful product, e.g. insulin, penicillin or mycoprotein.","pts":1},{"p":"Microorganisms (bacteria or fungi) are grown in the fermenter.","pts":1},{"p":"Temperature is controlled at the optimum for the microorganisms and their enzymes.","pts":1},{"p":"pH, oxygen, nutrient supply and waste products are also controlled.","pts":1}],"e":"A fermenter grows microorganisms under controlled conditions to produce products such as insulin, penicillin or mycoprotein."},{"id":"ch21rs1","tp":"Genetic modification","q":"Describe how a human gene is inserted into a bacterial plasmid to form a recombinant plasmid.","mm":3,"ms":[{"p":"The human gene is isolated using restriction enzymes, forming sticky ends.","pts":1},{"p":"The plasmid is cut with the same restriction enzyme, forming complementary sticky ends.","pts":1},{"p":"DNA ligase joins the human gene and the plasmid together to form a recombinant plasmid.","pts":1}],"e":"Restriction enzymes cut the gene and the plasmid with complementary sticky ends, and DNA ligase joins them together."}],"adv_saq":[{"id":"ch21as0","tp":"Bacteria in biotechnology","q":"Explain why bacteria are useful in genetic modification, including why there are few ethical concerns about their manipulation.","mm":4,"ms":[{"p":"Bacteria reproduce rapidly / quickly.","pts":1},{"p":"They can make complex molecules, such as human proteins.","pts":1},{"p":"They contain plasmids, which can be used as vectors to carry new genes.","pts":1},{"p":"There are few ethical concerns because bacteria are simple organisms, not considered to have the same welfare concerns as animals.","pts":1}],"e":"Bacteria are useful because they reproduce rapidly, make complex molecules, have plasmids, and raise few ethical concerns."},{"id":"ch21as1","tp":"Fermenters","q":"Describe and explain how temperature and oxygen are controlled in a fermenter, and why this is important for making a named product.","mm":4,"ms":[{"p":"Name a product, e.g. insulin, penicillin, mycoprotein or ethanol.","pts":1},{"p":"Temperature is kept at the optimum so enzymes work at their fastest rate; too high a temperature would denature the enzymes.","pts":1},{"p":"Oxygen is supplied for aerobic respiration of the microorganisms, OR oxygen is limited so that anaerobic respiration can take place.","pts":1},{"p":"This keeps the microorganisms growing and reproducing so they produce the maximum amount of product.","pts":1}],"e":"Controlling temperature and oxygen keeps enzymes working well and ensures the correct type of respiration, maximising product yield."}]}};;

      h+='<div class=sc><div style=display:flex;align-items:center;gap:8px;margin-bottom:8px><span class=qn>'+(i+1)+'</span><span style="font-weight:700;color:var(--accent2);font-size:0.8rem;">['+q.mm+' marks]</span></div><div class=qs>'+q.q+'</div><textarea placeholder="Type your answer here..." id="t_'+q.id+'"></textarea><div class=ms id="ms_'+q.id+'"><div class=mt>📋 Mark Scheme</div>'+mh+'<div class=ml>Total: '+q.mm+' marks</div><div style=margin-top:6px;font-size:0.78rem;color:var(--muted)>'+q.e+'</div></div></div>';
    });
  }
  h+='<div class=br><button class="btn bp" onclick=subSet()>✅ Submit Answers</button><button class="btn bs" onclick=rstSet()>🔄 Reset</button></div>';
  document.getElementById("setContent").innerHTML=h;stTimer();
}

function subSet(){
  if(!crCh||!inChapter)return;
  var d=AD[crCh];if(!d)return;
  var mq=d[crSub]||[],sk=crSub+"_saq",sq=d[sk]||[],mc=MC[crSub]||20,cr=0;
  mq.forEach(function(q){
    var s=document.querySelector('input[name="'+q.id+'"]:checked'),c=document.getElementById("c_"+q.id),fb=document.getElementById("fb_"+q.id);
    if(!c)return;
    c.classList.remove("cr","wr");
    for(var oi=0;oi<q.o.length;oi++){var lb=document.getElementById("l_"+q.id+"_"+oi);if(lb)lb.classList.remove("ca","wa");}
    if(fb)fb.classList.add("sh");
    document.getElementById("l_"+q.id+"_"+q.a)?.classList.add("ca");
    if(s){var v=parseInt(s.value);if(v===q.a){cr++;c.classList.add("cr");}else{c.classList.add("wr");document.getElementById("l_"+q.id+"_"+v)?.classList.add("wa");}}
    else{c.classList.add("wr");}
  });
  sq.forEach(function(q){var ms=document.getElementById("ms_"+q.id);if(ms)ms.classList.add("sh");});spTimer();
  var pct=Math.round(cr/mc*100),sn=document.getElementById("sn"),sd=document.getElementById("sd"),pf=document.getElementById("pf"),pt=document.getElementById("pt"),pp=document.getElementById("pp");
  if(sn)sn.textContent=cr+"/"+mc;if(sd)sd.textContent="Accuracy "+pct+"%"+(pct>=90?" 🏆":pct>=80?" 🎉":pct>=60?" 👍":" 📚");
  if(pf)pf.style.width=pct+"%";if(pt)pt.textContent=cr+"/"+mc;if(pp)pp.textContent=pct+"%";
  svH(crCh,crSub,cr,mc,pct);upHomeStats();upChTabs();updateSummary();
  bioCollectWrong(mq);bioPushNow();
}

function rstSet(){
  if(!confirm("Reset your answers?"))return;
  if(!crCh||!inChapter)return;
  var d=AD[crCh];if(!d)return;
  var mq=d[crSub]||[],sk=crSub+"_saq",sq=d[sk]||[];
  mq.forEach(function(q){
    var c=document.getElementById("c_"+q.id);if(c)c.classList.remove("cr","wr");
    var fb=document.getElementById("fb_"+q.id);if(fb)fb.classList.remove("sh");
    for(var oi=0;oi<q.o.length;oi++){var lb=document.getElementById("l_"+q.id+"_"+oi);if(lb)lb.classList.remove("ca","wa","sl");}
    var r=document.querySelector('input[name="'+q.id+'"]');if(r)r.checked=false;
  });
  sq.forEach(function(q){var ta=document.getElementById("t_"+q.id);if(ta)ta.value="";var ms=document.getElementById("ms_"+q.id);if(ms)ms.classList.remove("sh");});
  var sn=document.getElementById("sn"),sd=document.getElementById("sd"),pf=document.getElementById("pf"),pt=document.getElementById("pt"),pp=document.getElementById("pp");
  if(sn)sn.textContent="—";if(sd)sd.textContent="Not yet answered";if(pf)pf.style.width="0%";if(pt)pt.textContent="0/"+MC[crSub];if(pp)pp.textContent="0%";
}

function gH(){try{return JSON.parse(localStorage.getItem("V0610H3"))||[]}catch(e){return[]}}
function svH(ch,sub,cr,tc,pct){
  var h=gH(),sN={pre:"Preview",basic:"Basic",review:"Review",adv:"Advanced"};
  h.push({d:new Date().toLocaleString("en-GB"),ch,cn:CN.find(function(c){return c[0]==ch;})[1],sub,sn:sN[sub]||sub,cr,tc,pct,df:sub==="pre"||sub==="basic"?0:sub==="review"?1:2});
  localStorage.setItem("V0610H3",JSON.stringify(h));
}
function clH(){
  if(!confirm("Clear all answer records?"))return;
  localStorage.removeItem("V0610H3");upHomeStats();upChTabs();updateSummary();
  if(crSub==="analysis")rdAnSet();
}

function rdAnSet(){
  var h=gH(),sc=document.getElementById("setContent");
  var hh='<div class=an><h3>📊 Chapter Analysis</h3><p style="color:var(--muted);margin-bottom:14px;font-size:0.82rem;">Based on all answer records, identify revision priorities</p>';
  if(!h.length){hh+='<div style="color:var(--muted);text-align:center;padding:20px;font-size:0.9rem;">No records yet.</div></div>';sc.innerHTML=hh;return;}
  var cs={};CN.forEach(function(c){cs[c[0]]={n:0,tp:0};});
  var lt={};h.forEach(function(e){var k=e.ch+"_"+e.sub;if(!lt[k]||new Date(e.d)>new Date(lt[k].d))lt[k]=e;});
  for(var k in lt){var e=lt[k];if(cs[e.ch]){cs[e.ch].n++;cs[e.ch].tp+=e.pct;}}
  hh+='<div class=ag>';
  CN.forEach(function(c,i){var s=cs[c[0]],pct=s.n?Math.round(s.tp/s.n):0;hh+='<div class=ai><div class=at>'+CH_ICONS[i]+' '+c[1].split(" ")[1]+'</div><div class=as style=color:'+(s.n?"var(--accent2)":"var(--muted)")+'>'+(s.n?pct+"%":"—")+'</div><div class=ab><div class=af style="width:'+pct+'%;'+(!s.n?"opacity:.2":"")+'"></div></div></div>';});
  hh+='</div>';
  hh+='<div style=margin-top:18px><h4 style=color:var(--text);margin-bottom:8px;font-size:0.88rem;font-weight:700>📋 Answer History</h4><div style=overflow-x:auto><table class=ht2><thead><tr><th>Date</th><th>Chapter</th><th>Set</th><th>Score</th><th>Accuracy</th></tr></thead><tbody>';
  [].concat(h).reverse().forEach(function(e){var df=e.df===0?"d0":e.df===1?"d1":"d2";hh+='<tr><td>'+e.d+'</td><td>'+e.cn+'</td><td><span class="dd '+df+'">'+e.sn+'</span></td><td>'+e.cr+'/'+e.tc+'</td><td>'+e.pct+'%</td></tr>';});
  hh+='</tbody></table></div></div>';
  var wk=[];CN.forEach(function(c,i){var s=cs[c[0]];if(s.n&&s.tp/s.n<60)wk.push(c[1].split(" ")[1]);});
  var avg=Math.round(h.reduce(function(s,e){return s+e.pct;},0)/h.length);
  var a="";
  if(!wk.length&&avg>=80)a="🏆 Great performance! Try Advanced questions for deeper understanding.";
  else if(!wk.length)a="👍 Well balanced. Strengthen structured question practice.";
  else a="📌 <strong>Review First:</strong> "+wk.join(", ")+". Accuracy below 60%, revisit textbook material.";
  a+='<br><br><strong>Total attempts:</strong> '+h.length+' &nbsp;|&nbsp; <strong>Average accuracy:</strong> '+avg+'%';
  hh+='<div style=margin-top:14px;color:var(--muted);font-size:0.85rem>'+a+'</div>';
  hh+='<div class=br><button class="btn bd" onclick=clH()>🗑️ Clear All Records</button></div></div>';
  sc.innerHTML=hh;
}

/* ================= BIO Power Up: 姓名 / 错题本 / 云同步 ================= */
function bioHex(s){var r="",i=0;for(;i<s.length;i+=2)r+=String.fromCharCode(parseInt(s.substr(i,2),16));return r;}
var BIO_CFG={owner:"viviancwx",repo:"biology-records",folder:"records0610",token:bioHex("6769746875625f7061745f3131414e55444f4149306462713650623657447a67755f3068784b48723665796d456b596f7a5358586d6f64566e794f37555463385477444d426976556837534f6f4f524b3736455a37497a5979524a434e")};
var BIO_STUDENT="";var bioSyncBusy=false;var BIO_ALLOW=["Vivian","Peter","Skylar","Suri","Vicky","Richard","Stanley","William","Simon","Amy","Channy","Diana","Alfie","Zoe","Rico","Sam","Evelyn","Curry","youze Wang"];

renderHome();
bioAskName();
bioPushNow();/* 打开页面自动补推未同步记录（断网重开也能续传） */
setTimeout(function(){if(gPending())bioPushNow();},4000);/* 首次失败 4 秒后自动重试 */
setTimeout(function(){if(gPending())bioPushNow();},12000);/* 再失败 12 秒后再试一次 */

function bioLoadName(){try{BIO_STUDENT=localStorage.getItem("V0610Name")||"";}catch(e){}}
function bioAskName(){
  bioLoadName();
  if(BIO_STUDENT){
    var inAllow=false;
    for(var i=0;i<BIO_ALLOW.length;i++){if(BIO_ALLOW[i].toLowerCase()===BIO_STUDENT.toLowerCase()){inAllow=true;break;}}

    BIO_STUDENT="";
    try{localStorage.removeItem("V0610Name");}catch(e){}

    g=document.createElement("div");g.id="bioNameGate";
    g.innerHTML='<div class=bx><h2>🧬 Biology Power Up</h2><p>请输入你的名字（仅限指定同学）<br><span style="font-size:0.72rem">答错的题会自动进错题本，记录同步到云端</span></p><input id="bioNameInp" maxlength="20" placeholder="请输入你的名字" autocomplete="off"><div id="bioNameErr" style="display:none;color:var(--wrong);font-size:0.8rem;margin-top:10px;text-align:center;font-weight:600"></div><button class="btn bp bio-btn" onclick="bioSetName()">🚀 开始</button></div>';
    document.body.appendChild(g);

    if(inp){inp.focus();inp.addEventListener("keydown",function(e){if(e.key==="Enter")bioSetName();});}
  }

function bioSetName(){
  var v=(document.getElementById("bioNameInp").value||"").trim();
  if(!v)return;
  var canon=null;
  for(var i=0;i<BIO_ALLOW.length;i++){if(BIO_ALLOW[i].toLowerCase()===v.toLowerCase()){canon=BIO_ALLOW[i];break;}}
  if(!canon){
    var err=document.getElementById("bioNameErr");
    if(err){err.style.display="block";err.textContent="⚠️ 仅限指定同学使用";}
    return;
  }
  BIO_STUDENT=canon;
  try{localStorage.setItem("V0610Name",canon);}catch(e){}
  var g=document.getElementById("bioNameGate");if(g)g.style.display="none";
  bioPushNow();
}

/* ---- 错题本 ---- */
function gW(){try{return JSON.parse(localStorage.getItem("V0610Wrong"))||[];}catch(e){return[];}}
function sW(w){try{localStorage.setItem("V0610Wrong",JSON.stringify(w));}catch(e){}}
function bioWrongKey(ch,sub,id){return ch+"|"+sub+"|"+id;}
function bioCollectWrong(mq){
  var w=gW(),changed=false;
  mq.forEach(function(q){
    var s=document.querySelector('input[name="'+q.id+'"]:checked');
    var ok=s&&parseInt(s.value)===q.a;
    if(ok)return;
    var k=bioWrongKey(crCh,crSub,q.id);
    if(!w.some(function(x){return bioWrongKey(x.ch,x.sub,x.id)===k;})){w.push({ch:crCh,sub:crSub,id:q.id});changed=true;}
  });
  if(changed)sW(w);
}
var BIO_QMAP=null;
function bioBuildQMap(){
  if(BIO_QMAP)return BIO_QMAP;
  var map={};
  Object.keys(AD||{}).forEach(function(ch){
    var cn=CN.find(function(c){return c[0]===ch;});
    Object.keys(AD[ch]||{}).forEach(function(sub){
      (AD[ch][sub]||[]).forEach(function(q){
        if(q&&q.o&&q.a!==undefined)map[q.id]={ch:ch,sub:sub,cn:cn?cn[1]:ch,q:q};
      });
    });
  });
  BIO_QMAP=map;return map;
}
function rdWrongSet(){
  var sc=document.getElementById("setContent");if(!sc)return;
  var w=gW();
  var h='<div class="sb"><div><span class="sl">❌ 我的错题本</span><br><span class="sn" style="font-size:1.1rem" id="wn">'+w.length+' 题</span></div><div class="sd">答错自动加入 · 练对自动移出 · 记录同步云端</div></div>';
  if(!w.length){
    h+='<div class="an" style="text-align:center"><h3>🎉 错题本已清空</h3><p style="color:var(--muted);font-size:0.85rem;margin:10px 0 4px">答错的题目会自动加入这里，练对后自动移出。</p><div class="br" style="justify-content:center"><button class="btn bs" onclick="goHome()">← 返回</button></div></div>';
    sc.innerHTML=h;return;
  }
  var map=bioBuildQMap();
  w.forEach(function(entry,i){
    var m=map[entry.id];if(!m)return;
    var q=m.q;
    var oh=q.o.map(function(o,oi){return '<label onclick="sel(\''+q.id+'\','+oi+')" id="l_'+q.id+'_'+oi+'"><input type=radio name="'+q.id+'" value='+oi+'><span>'+String.fromCharCode(65+oi)+'. '+o+'</span></label>';}).join("");
    h+='<div class="qc" id="c_'+q.id+'"><div><span class="qn">'+(i+1)+'</span><span class="qt">'+m.cn.split(" ")[0]+' · '+q.tp+'</span></div><div class="qs">'+q.q+'</div><div class="qo">'+oh+'</div><div class="fb" id="fb_'+q.id+'"><strong>Explanation:</strong>'+q.e+'<br><span style="color:var(--correct);font-weight:600">✅ Correct Answer: '+String.fromCharCode(65+q.a)+'</span></div></div>';
  });
  h+='<div class="br"><button class="btn bp" onclick="subWrongSet()">✅ 提交练习</button><button class="btn bs" onclick="goHome()">← 返回</button></div>';
  sc.innerHTML=h;
}
function subWrongSet(){
  var w=gW(),map=bioBuildQMap(),cr=0,still=[];
  w.forEach(function(entry){
    var m=map[entry.id];var q=m&&m.q;if(!q)return;
    var c=document.getElementById("c_"+q.id),fb=document.getElementById("fb_"+q.id);
    var s=document.querySelector('input[name="'+q.id+'"]:checked');
    var ok=s&&parseInt(s.value)===q.a;
    if(fb)fb.classList.add("sh");
    if(ok){cr++;if(c)c.classList.add("cr");}
    else{still.push(entry);if(c)c.classList.add("wr");if(s){var lb=document.getElementById("l_"+q.id+"_"+parseInt(s.value));if(lb)lb.classList.add("wa");}}
  });
  sW(still);
  var sc=document.getElementById("setContent");
  var banner='<div class="an"><h3>'+(cr===w.length&&w.length>0?'🎉 全部掌握！':('📊 本次练习：'+cr+'/'+w.length+' 正确'))+'</h3><p style="color:var(--muted);font-size:0.85rem">'+(cr>0?('✅ 已掌握 '+cr+' 题，自动移出错题本。'):'')+(still.length?('📌 剩 '+still.length+' 题，可继续练习。'):'')+'</p></div>';
  rdWrongSet();
  sc.innerHTML=banner+sc.innerHTML;
  bioPushNow();
}

/* ---- 云同步 ---- */
function bioSetSync(mode,label){
  var el=document.getElementById("bioSyncB");if(!el)return;
  el.className="bio-sync"+(mode==="off"?" off":"");
  el.textContent="☁️ "+label;
}
function gPending(){try{return localStorage.getItem("V0610Pending")==="1";}catch(e){return false;}}
function bioQueuePending(){try{localStorage.setItem("V0610Pending","1");}catch(e){}}
function bioClearPending(){try{localStorage.removeItem("V0610Pending");}catch(e){}}
function bioPushNow(){
  if(bioSyncBusy)return;
  if(!BIO_STUDENT)return;
  if(BIO_CFG.token==="__BIO_TOKEN__"){bioSetSync("off","未设置");return;}
  bioSyncBusy=true;
  var slug=encodeURIComponent(BIO_STUDENT);
  var path=(BIO_CFG.folder||"records")+"/"+slug+".json";
  var url="https://api.github.com/repos/"+BIO_CFG.owner+"/"+BIO_CFG.repo+"/contents/"+path;
  var wrong=gW().map(function(entry){var m=bioBuildQMap()[entry.id];return m?{ch:entry.ch,sub:entry.sub,id:entry.id,cn:m.cn.split(" ")[0],tp:m.q.tp,q:m.q.q,o:m.q.o,a:m.q.a,e:m.q.e}:entry;});
  var body={name:BIO_STUDENT,updated:new Date().toISOString(),records:gH(),wrong:wrong};
  var payload={message:"sync "+BIO_STUDENT,content:btoa(unescape(encodeURIComponent(JSON.stringify(body))))};
  fetch(url,{headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"}})
    .then(function(r){return r.json().then(function(j){return{status:r.status,j:j};});})
    .then(function(res){
      if(res.status===200&&res.j.sha)payload.sha=res.j.sha;
      return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+BIO_CFG.token,"Accept":"application/vnd.github+json"},body:JSON.stringify(payload)});
    })
    .then(function(r){
      bioSyncBusy=false;
      if(r.ok){bioSetSync("on","已同步");bioClearPending();}
      else{bioSetSync("off","同步失败");bioQueuePending();}
    })
    .catch(function(){bioSyncBusy=false;bioSetSync("off","未连接");bioQueuePending();});
}
