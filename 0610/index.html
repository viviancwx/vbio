 inside the cells pushes outwards on the cell walls, keeping the plant upright","The vacuoles have disappeared from the cells"],"a":2,"e":"Water pressing outwards on the cell walls (turgor pressure) makes cells firm, supporting the plant."},{"id":"ch3a11","tp":"Diffusion","q":"Why does increasing the temperature increase the rate of both diffusion and osmosis?","o":["The membranes become fully permeable at higher temperatures","The concentration gradient becomes steeper","Protein carriers work faster","The particles gain kinetic energy and move more rapidly"],"a":3,"e":"Higher temperature increases the kinetic energy of particles, so they move faster and both diffusion and osmosis occur more quickly."}],"basic_saq":[{"id":"ch3bs0","q":"Define diffusion.","mm":2,"ms":[{"p":"the net movement of particles from a region of higher concentration to a region of lower concentration","pts":1},{"p":"down a concentration gradient, as a result of the random movement of particles","pts":1}],"e":"Definition of diffusion as the net movement of particles down a concentration gradient due to random movement."},{"id":"ch3bs1","q":"State three factors that influence the rate of diffusion.","mm":3,"ms":[{"p":"surface area","pts":1},{"p":"temperature","pts":1},{"p":"concentration gradient / distance","pts":1}],"e":"Any three of the four factors: surface area, temperature, concentration gradient and distance."}],"review_saq":[{"id":"ch3rs0","q":"Describe what happens to a plant cell when it is placed in a concentrated sucrose solution. Use the terms osmosis, plasmolysis and turgor pressure in your answer.","mm":3,"ms":[{"p":"water leaves the cell by osmosis (from the cell to the surrounding solution)","pts":1},{"p":"the cell loses turgor pressure and becomes flaccid","pts":1},{"p":"the cytoplasm pulls away from the cell wall – plasmolysis","pts":1}],"e":"A concentrated solution has a lower water potential, so water leaves the cell by osmosis, turgor pressure falls and the cell becomes plasmolysed."},{"id":"ch3rs1","q":"Explain the difference between diffusion and active transport.","mm":4,"ms":[{"p":"diffusion moves particles from a region of higher concentration to a region of lower concentration (down the gradient)","pts":1},{"p":"active transport moves particles from a region of lower concentration to a region of higher concentration (against the gradient)","pts":1},{"p":"diffusion does not require energy / is passive, while active transport uses energy from respiration","pts":1},{"p":"active transport involves protein carriers (diffusion does not)","pts":1}],"e":"Diffusion is passive movement down the gradient; active transport moves particles against the gradient using energy from respiration and protein carriers."}],"adv_saq":[{"id":"ch3as0","q":"Explain how root hair cells can absorb mineral ions from the soil even when the concentration of ions in the soil is lower than inside the cells.","mm":3,"ms":[{"p":"the ions are absorbed by active transport","pts":1},{"p":"this moves the ions against the concentration gradient (from low to high concentration)","pts":1},{"p":"energy from respiration is used, and protein carriers move the ions across the membrane","pts":1}],"e":"Root hair cells use active transport, powered by respiration, to move mineral ions against the concentration gradient."},{"id":"ch3as1","q":"A student places potato cylinders in a concentrated sucrose solution. Explain the changes that would occur in the potato cells, using the terms water potential, osmosis and turgor pressure.","mm":4,"ms":[{"p":"the sucrose solution has a lower water potential than the potato cells","pts":1},{"p":"water leaves the cells by osmosis (from higher to lower water potential)","pts":1},{"p":"the cells lose turgor pressure and become flaccid","pts":1},{"p":"if left long enough, plasmolysis may occur (cytoplasm pulls away from the cell wall) / the cylinders lose mass","pts":1}],"e":"In a concentrated solution, water leaves the cells by osmosis, turgor pressure falls and the cells become flaccid or plasmolysed."}]},"ch4":{"pre":[{"id":"ch4p0","tp":"Chemical elements","q":"Which three elements are found in all carbohydrates?","o":["carbon, hydrogen and oxygen","carbon, hydrogen and nitrogen","carbon, oxygen and nitrogen","hydrogen, oxygen and nitrogen"],"a":0,"e":"Carbohydrates are made from carbon, hydrogen and oxygen only. Nitrogen is found in proteins, not in carbohydrates."},{"id":"ch4p1","tp":"Chemical elements","q":"Which set of elements is found in proteins?","o":["carbon, hydrogen and oxygen","carbon, hydrogen, oxygen and nitrogen","carbon, hydrogen and nitrogen","hydrogen, oxygen and nitrogen"],"a":1,"e":"Proteins contain carbon, hydrogen, oxygen and nitrogen. Carbohydrates and fats contain only carbon, hydrogen and oxygen."},{"id":"ch4p2","tp":"Chemical elements","q":"Which elements make up fats?","o":["carbon, hydrogen and nitrogen","carbon, hydrogen, oxygen and nitrogen","carbon, hydrogen and oxygen","hydrogen, oxygen and nitrogen"],"a":2,"e":"Fats are made from carbon, hydrogen and oxygen only, like carbohydrates. Nitrogen is not found in fats."},{"id":"ch4p3","tp":"Large molecules","q":"Starch, glycogen and cellulose are all large molecules made from many small molecules of which substance?","o":["amino acids","fatty acids","glycerol","glucose"],"a":3,"e":"Starch, glycogen and cellulose are all made from glucose. Amino acids form proteins, and fatty acids with glycerol form fats and oils."},{"id":"ch4p4","tp":"Large molecules","q":"Proteins are large molecules formed by joining together many small molecules called...?","o":["amino acids","glucose molecules","fatty acids","glycerol"],"a":0,"e":"Proteins are made from amino acids. Glucose forms starch, glycogen and cellulose, while fatty acids and glycerol form fats and oils."},{"id":"ch4p5","tp":"Large molecules","q":"Fats and oils are large molecules formed from which two smaller molecules?","o":["amino acids and glucose","fatty acids and glycerol","glucose and amino acids","glycerol and glucose"],"a":1,"e":"Fats and oils are formed from fatty acids and glycerol. Amino acids form proteins and glucose forms carbohydrates."},{"id":"ch4p6","tp":"Starch test","q":"Iodine solution is used to test for the presence of which substance?","o":["proteins","reducing sugars","starch","fats"],"a":2,"e":"Iodine solution tests for starch and turns blue-black when starch is present. Other tests are used for proteins, reducing sugars and fats."},{"id":"ch4p7","tp":"Benedict's test","q":"Benedict's solution is used to test for which type of substance?","o":["starch","proteins","vitamin C","reducing sugars"],"a":3,"e":"Benedict's solution tests for reducing sugars and changes from blue to brick-red on heating. Iodine tests starch, biuret tests proteins and DCPIP tests vitamin C."},{"id":"ch4p8","tp":"Protein test","q":"Which test is used to detect the presence of proteins?","o":["biuret test","iodine solution test","Benedict's solution test","ethanol emulsion test"],"a":0,"e":"The biuret test turns purple in the presence of protein. Iodine tests for starch, Benedict's for reducing sugars and the ethanol emulsion test for fats."},{"id":"ch4p9","tp":"Fat test","q":"The ethanol emulsion test is used to detect which substance?","o":["starch","fats and oils","proteins","reducing sugars"],"a":1,"e":"The ethanol emulsion test gives a white emulsion in the presence of fats and oils. The other substances are detected by iodine, biuret and Benedict's tests."},{"id":"ch4p10","tp":"Vitamin C test","q":"DCPIP solution is used to test for the presence of which substance?","o":["proteins","starch","vitamin C","fats"],"a":2,"e":"DCPIP solution is decolourised by vitamin C. Iodine, biuret and ethanol emulsion tests detect starch, proteins and fats respectively."},{"id":"ch4p11","tp":"Starch test","q":"What colour change shows that iodine solution has detected starch?","o":["brick-red","purple","white","blue-black"],"a":3,"e":"Iodine solution turns from orange/brown to blue-black in the presence of starch. Brick-red shows a reducing sugar, purple shows protein and white shows fat."},{"id":"ch4p12","tp":"DNA structure","q":"Which molecule has two strands coiled together to form a double helix?","o":["starch","a protein","DNA","a fat"],"a":2,"e":"DNA is made of two strands coiled together to form a double helix. Starch, proteins and fats do not have this structure."},{"id":"ch4p13","tp":"DNA structure","q":"In DNA, the bases always pair up in which way?","o":["A with T and C with G","A with G and C with T","A with C and G with T","A with A and T with T"],"a":0,"e":"In DNA the bases always pair in the same way: A with T and C with G. The full names of the bases are not required at this level."}],"basic":[{"id":"ch4b0","tp":"Benedict's test","q":"A food sample turns brick-red when heated with Benedict's solution. Which substance is present?","o":["a reducing sugar","starch","a protein","vitamin C"],"a":0,"e":"Benedict's solution turns brick-red on heating in the presence of a reducing sugar. Iodine, biuret and DCPIP tests detect starch, proteins and vitamin C."},{"id":"ch4b1","tp":"Protein test","q":"A food sample turns purple in the biuret test. Which substance is present?","o":["starch","a protein","a reducing sugar","a fat"],"a":1,"e":"The biuret test gives a purple colour when protein is present. Starch, reducing sugars and fats give no purple colour with this test."},{"id":"ch4b2","tp":"Fat test","q":"A crushed food sample is shaken with ethanol and then with water. A white emulsion forms. Which substance is present?","o":["a protein","a reducing sugar","a fat or oil","starch"],"a":2,"e":"A white emulsion in the ethanol emulsion test shows that fat or oil is present. Proteins, reducing sugars and starch give different results with their own tests."},{"id":"ch4b3","tp":"Vitamin C test","q":"DCPIP solution is decolourised by which substance?","o":["starch","protein","glucose","vitamin C"],"a":3,"e":"DCPIP solution is decolourised by vitamin C. Starch, proteins and glucose do not decolourise DCPIP."},{"id":"ch4b4","tp":"Large molecules","q":"Which of these is a large molecule made from many glucose molecules?","o":["glycogen","an amino acid","a fatty acid","a protein"],"a":0,"e":"Glycogen is a large molecule made from many glucose molecules. Amino acids and fatty acids are small molecules, and proteins are made from amino acids."},{"id":"ch4b5","tp":"Chemical elements","q":"Which elements are found in carbohydrates, fats and proteins?","o":["carbon and nitrogen","carbon, hydrogen and oxygen","hydrogen, oxygen and nitrogen","carbon, hydrogen and nitrogen"],"a":1,"e":"Carbohydrates, fats and proteins all contain carbon, hydrogen and oxygen. Only proteins also contain nitrogen."},{"id":"ch4b6","tp":"DNA structure","q":"Which shows the correct pairing of bases in DNA?","o":["A with G and C with T","A with A and T with T","A with T and C with G","A with C and G with T"],"a":2,"e":"In DNA the bases always pair in the same way: A with T and C with G."},{"id":"ch4b7","tp":"DNA structure","q":"What holds the two strands of a DNA molecule together?","o":["bonds between glucose molecules","bonds between amino acids","bonds between fatty acids","bonds between pairs of bases"],"a":3,"e":"Bonds between pairs of bases hold the two strands of DNA together. Glucose, amino acids and fatty acids are not joined in this way in DNA."},{"id":"ch4b8","tp":"DNA structure","q":"Which substance is described as having two strands coiled together to form a double helix?","o":["DNA","starch","glycogen","cellulose"],"a":0,"e":"DNA consists of two strands coiled together to form a double helix. Starch, glycogen and cellulose are carbohydrates, not double helices."},{"id":"ch4b9","tp":"Large molecules","q":"Which statement about large molecules is correct?","o":["Starch is made from amino acids","Proteins are made from amino acids","Fats are made from glucose","Cellulose is made from fatty acids"],"a":1,"e":"Proteins are made from amino acids. Starch and cellulose are made from glucose, and fats are made from fatty acids and glycerol."},{"id":"ch4b10","tp":"Large molecules","q":"Which of the following is made from glucose molecules?","o":["a protein","DNA","cellulose","a fat"],"a":2,"e":"Cellulose is a large molecule made from glucose molecules. Proteins are made from amino acids, DNA from bases, and fats from fatty acids and glycerol."},{"id":"ch4b11","tp":"Food tests","q":"Which food test is matched correctly with the substance it detects?","o":["iodine solution – protein","Benedict's solution – starch","biuret test – reducing sugars","ethanol emulsion test – fats and oils"],"a":3,"e":"The ethanol emulsion test detects fats and oils. Iodine detects starch, Benedict's detects reducing sugars, and the biuret test detects proteins."}],"review":[{"id":"ch4r0","tp":"Food tests","q":"A food sample turns blue-black with iodine solution and gives a white emulsion in the ethanol emulsion test. Which substances are present?","o":["starch and fat","starch and protein","reducing sugar and fat","protein and reducing sugar"],"a":0,"e":"Iodine solution turning blue-black shows starch, and a white emulsion in the ethanol emulsion test shows fat or oil. Protein and reducing sugar tests were not positive."},{"id":"ch4r1","tp":"Benedict's test","q":"Which result shows that a reducing sugar is present in a food sample?","o":["iodine solution turns blue-black","Benedict's solution turns brick-red on heating","biuret reagent turns purple","ethanol emulsion test gives a white emulsion"],"a":1,"e":"Benedict's solution changes from blue to brick-red on heating in the presence of a reducing sugar. The other results show starch, protein and fat."},{"id":"ch4r2","tp":"Vitamin C test","q":"Which reagent should be used to test a fruit drink for vitamin C?","o":["iodine solution","Benedict's solution","DCPIP solution","biuret reagent"],"a":2,"e":"DCPIP solution is decolourised by vitamin C, so it is used to test for vitamin C. The other reagents test for starch, reducing sugars and protein."},{"id":"ch4r3","tp":"Large molecules","q":"Which large molecule is correctly matched with the small molecules from which it is made?","o":["glycogen – amino acids","cellulose – fatty acids","protein – glucose","starch – glucose"],"a":3,"e":"Starch is made from glucose molecules. Glycogen and cellulose are also made from glucose, while proteins are made from amino acids."},{"id":"ch4r4","tp":"Chemical elements","q":"A pure food contains only the elements carbon, hydrogen and oxygen. Which substance could it be?","o":["a protein","DNA","an amino acid","a fat"],"a":3,"e":"Fats contain only carbon, hydrogen and oxygen. Proteins, amino acids and DNA also contain nitrogen, and DNA also contains phosphorus."},{"id":"ch4r5","tp":"Benedict's test","q":"In the Benedict's test for reducing sugars, why is the mixture heated in a water bath?","o":["to dissolve the sugar","so that the colour change takes place","to kill any bacteria","to stop the solution evaporating"],"a":1,"e":"The Benedict's test requires heating for the blue reagent to change colour (to green, yellow or brick-red) when a reducing sugar is present."},{"id":"ch4r6","tp":"Fat test","q":"A food sample produces a white emulsion when shaken with ethanol and then water. What does this show?","o":["a reducing sugar is present","starch is present","a fat or oil is present","a protein is present"],"a":2,"e":"A white emulsion in the ethanol emulsion test shows that a fat or oil is present. Reducing sugars, starch and proteins are detected by other tests."},{"id":"ch4r7","tp":"DNA structure","q":"Which statement about the bases in DNA is correct?","o":["A pairs with G and C pairs with T","A pairs with C and G pairs with T","A pairs with T and C pairs with G","A pairs with A and C pairs with C"],"a":2,"e":"In DNA the bases always pair in the same way: A with T and C with G. This is the base pairing rule for the double helix."},{"id":"ch4r8","tp":"Vitamin C test","q":"A fruit drink decolourises DCPIP solution but gives no colour change with iodine solution. What can be concluded?","o":["it contains vitamin C but not starch","it contains starch but not vitamin C","it contains both vitamin C and starch","it contains a reducing sugar"],"a":0,"e":"DCPIP is decolourised by vitamin C, so vitamin C is present. Iodine solution stays unchanged only when starch is absent."},{"id":"ch4r9","tp":"Large molecules","q":"Which of the following large molecules is NOT made from glucose?","o":["starch","glycogen","cellulose","protein"],"a":3,"e":"Starch, glycogen and cellulose are all made from glucose molecules. Proteins are made from amino acids, not glucose."},{"id":"ch4r10","tp":"Protein test","q":"What colour change shows a positive result in the biuret test for protein?","o":["blue to brick-red","blue to purple","orange/brown to blue-black","colourless to white"],"a":1,"e":"The biuret reagent is blue and turns purple when protein is present. Brick-red shows a reducing sugar, blue-black shows starch and white shows fat."},{"id":"ch4r11","tp":"Chemical elements","q":"Which element is present in proteins but not in carbohydrates or fats?","o":["carbon","hydrogen","oxygen","nitrogen"],"a":3,"e":"Proteins contain nitrogen as well as carbon, hydrogen and oxygen. Carbohydrates and fats contain only carbon, hydrogen and oxygen."}],"adv":[{"id":"ch4a0","tp":"Food tests","q":"Four solutions were tested with Benedict's solution and the biuret test. The results are: W – Benedict's brick-red, biuret blue; X – Benedict's blue, biuret purple; Y – Benedict's brick-red, biuret purple; Z – Benedict's blue, biuret blue. Which solution contains both a reducing sugar and a protein?","o":["W","X","Y","Z"],"a":2,"e":"Solution Y gives a brick-red colour with Benedict's solution, so it contains a reducing sugar, and a purple colour with the biuret test, so it also contains protein."},{"id":"ch4a1","tp":"DNA structure","q":"Which statement about the structure of DNA is correct?","o":["the two strands are held together by bonds between glucose molecules","the bases pair as A with C and G with T","each strand contains bases and the two strands form a double helix","DNA is made from amino acids folded into a helix"],"a":2,"e":"DNA has two strands coiled to form a double helix; each strand contains bases, and bonds between pairs of bases hold the strands together."},{"id":"ch4a2","tp":"DNA structure","q":"One strand of a DNA molecule has the bases A–T–C–G. What is the sequence of bases on the other strand?","o":["T–A–G–C","A–T–C–G","C–G–A–T","G–C–T–A"],"a":0,"e":"Bases always pair A with T and C with G, so the complementary strand to A–T–C–G is T–A–G–C."},{"id":"ch4a3","tp":"Chemical elements","q":"A molecule contains the elements carbon, hydrogen, oxygen and nitrogen. Which molecule could it be?","o":["starch","a fat","a protein","cellulose"],"a":2,"e":"Proteins contain nitrogen in addition to carbon, hydrogen and oxygen. Starch, fats and cellulose contain only carbon, hydrogen and oxygen."},{"id":"ch4a4","tp":"Vitamin C test","q":"Equal volumes of DCPIP solution were placed in four test tubes. The volumes of four juices needed to decolourise the DCPIP were: juice P, 8 cm³; juice Q, 2 cm³; juice R, 5 cm³; juice S, 10 cm³. Which juice contains the most vitamin C?","o":["P","R","S","Q"],"a":3,"e":"DCPIP is decolourised by vitamin C, so the juice that needs the smallest volume to decolourise the DCPIP contains the most vitamin C – juice Q."},{"id":"ch4a5","tp":"Large molecules","q":"Which two small molecules join together to form fats and oils?","o":["glycerol and amino acids","glycerol and fatty acids","glucose and fatty acids","glycerol and glucose"],"a":1,"e":"Fats and oils are formed from fatty acids and glycerol. Amino acids form proteins and glucose forms carbohydrates."},{"id":"ch4a6","tp":"Food tests","q":"A food contains starch and protein. Which two food tests would both give positive results?","o":["iodine solution test and biuret test","Benedict's solution test and biuret test","iodine solution test and ethanol emulsion test","Benedict's solution test and ethanol emulsion test"],"a":0,"e":"Starch is detected by iodine solution (blue-black) and protein by the biuret test (purple), so both tests would be positive."},{"id":"ch4a7","tp":"Benedict's test","q":"A student added Benedict's solution to a glucose solution but did not heat the mixture. What would be observed?","o":["the solution would turn brick-red","the solution would turn purple","a white emulsion would form","the solution would stay blue"],"a":3,"e":"The Benedict's test needs heating for the blue reagent to change to brick-red in the presence of a reducing sugar. Without heat it stays blue."},{"id":"ch4a8","tp":"Food tests","q":"Four food tests on one sample gave: iodine solution, blue-black; Benedict's solution after heating, blue; biuret test, purple; ethanol emulsion test, no white emulsion. Which substances are present?","o":["starch and protein","starch and reducing sugar","protein and fat","reducing sugar and protein"],"a":0,"e":"Iodine blue-black shows starch and biuret purple shows protein. Benedict's staying blue means no reducing sugar, and no white emulsion means no fat."},{"id":"ch4a9","tp":"Large molecules","q":"Which statement about biological molecules is NOT correct?","o":["Starch is made from glucose molecules","Proteins are made from amino acids","Fats and oils are made from fatty acids and glycerol","Cellulose is made from amino acids"],"a":3,"e":"Cellulose is made from glucose molecules, not amino acids. The other statements are all correct."},{"id":"ch4a10","tp":"DNA structure","q":"Which list shows the four bases found in DNA?","o":["glucose, starch, cellulose and glycogen","A, T, C and G","amino acids, glycerol, fatty acids and glucose","carbon, hydrogen, oxygen and nitrogen"],"a":1,"e":"The bases in DNA are A, T, C and G. Full names of the bases are not required at this level."},{"id":"ch4a11","tp":"Food tests","q":"A student has two solutions, one containing glucose and one containing starch. Which single test would give a colour change with the starch solution but not with the glucose solution?","o":["biuret test","iodine solution","DCPIP test","ethanol emulsion test"],"a":1,"e":"Iodine solution turns blue-black with starch but stays unchanged with glucose, so it distinguishes the two solutions. The biuret, DCPIP and ethanol tests are not affected by either."}],"basic_saq":[{"id":"ch4bs0","q":"State the small molecules that join together to form: (a) starch, (b) proteins, (c) fats and oils.","mm":3,"ms":[{"p":"starch is made from glucose (molecules)","pts":1},{"p":"proteins are made from amino acids","pts":1},{"p":"fats and oils are made from fatty acids and glycerol","pts":1}],"e":"Large molecules are built from smaller molecules: glucose forms starch, amino acids form proteins, and fatty acids with glycerol form fats and oils."},{"id":"ch4bs1","q":"State the colour change that shows a positive result in: (a) the iodine test for starch, (b) the biuret test for protein.","mm":2,"ms":[{"p":"from orange/brown to blue-black","pts":1},{"p":"from blue to purple","pts":1}],"e":"Iodine solution turns blue-black with starch, and the biuret reagent turns purple with protein."}],"review_saq":[{"id":"ch4rs0","q":"Describe how you would test a liquid food sample for reducing sugars using Benedict's solution, and state the colour change that shows a positive result.","mm":3,"ms":[{"p":"add Benedict's solution to the food sample","pts":1},{"p":"heat the mixture in a water bath","pts":1},{"p":"a positive result is a colour change from blue to brick-red (green or yellow for small amounts of reducing sugar)","pts":1}],"e":"Benedict's test detects reducing sugars; the mixture must be heated and turns brick-red when a reducing sugar is present."},{"id":"ch4rs1","q":"Describe how you would test a solid food sample for fat using the ethanol emulsion test, and state the positive result.","mm":4,"ms":[{"p":"crush or cut up the food sample","pts":1},{"p":"add ethanol (alcohol) and shake","pts":1},{"p":"pour the mixture into water / add water","pts":1},{"p":"a white emulsion forms if fat is present","pts":1}],"e":"The ethanol emulsion test: mix the food with ethanol, add water, and a white emulsion shows that fat is present."}],"adv_saq":[{"id":"ch4as0","q":"Describe the structure of a DNA molecule. Include the shape, the chemicals found in each strand, and how the two strands are held together.","mm":4,"ms":[{"p":"two strands coiled together","pts":1},{"p":"to form a double helix","pts":1},{"p":"each strand contains chemicals called bases","pts":1},{"p":"bonds between pairs of bases hold the strands together","pts":1}],"e":"DNA is a double helix: two strands coiled together, each containing bases, held together by bonds between pairs of bases."},{"id":"ch4as1","q":"One strand of a DNA molecule has the base sequence A–T–G–C–C. (a) Write down the base sequence of the other strand. (b) State the rule that determines this sequence.","mm":3,"ms":[{"p":"T–A–C–G–G","pts":2},{"p":"the bases always pair in the same way: A with T and C with G","pts":1}],"e":"Bases pair A with T and C with G, so the complementary sequence to A–T–G–C–C is T–A–C–G–G."}]},"ch5":{"pre":[{"id":"ch5p0","tp":"Catalyst","q":"Which statement correctly describes a catalyst?","o":["It increases the rate of a chemical reaction and is not changed by the reaction","It increases the rate of a chemical reaction and is used up in the reaction","It decreases the rate of a chemical reaction and is not changed by the reaction","It decreases the rate of a chemical reaction and is used up in the reaction"],"a":0,"e":"A catalyst speeds up a chemical reaction and remains unchanged, so it can be used again."},{"id":"ch5p1","tp":"Enzymes as proteins","q":"Enzymes are made of which type of molecule?","o":["Carbohydrates","Lipids","Proteins","Nucleic acids"],"a":2,"e":"Enzymes are proteins that act as biological catalysts in metabolic reactions."},{"id":"ch5p2","tp":"Biological catalysts","q":"What name is given to enzymes because they speed up reactions inside living organisms?","o":["Biological solvents","Biological catalysts","Biological coolants","Biological pigments"],"a":1,"e":"Enzymes are biological catalysts because they increase the rate of metabolic reactions in living organisms."},{"id":"ch5p3","tp":"Active site","q":"On which part of an enzyme does the substrate bind?","o":["Active site","Enzyme-substrate complex","Product","Cell membrane"],"a":0,"e":"The substrate binds to the active site, whose shape is complementary to the substrate."},{"id":"ch5p4","tp":"Active site","q":"The shape of the active site of an enzyme is complementary to the shape of its ______.","o":["Product","Substrate","Enzyme","Cofactor"],"a":1,"e":"The active site has a shape complementary to the substrate, allowing the substrate to fit into it."},{"id":"ch5p5","tp":"Optimum temperature","q":"What is the temperature at which an enzyme catalyses a reaction at its fastest rate called?","o":["Denaturation temperature","Activation temperature","Boiling temperature","Optimum temperature"],"a":3,"e":"The optimum temperature is the temperature at which the enzyme works fastest; above it the enzyme is denatured."},{"id":"ch5p6","tp":"Importance of enzymes","q":"Why are enzymes important in all living organisms?","o":["They slow down reactions so that food is stored for longer","They make reactions happen at a rate that sustains life","They provide energy for all chemical reactions","They replace the need for chemical reactions"],"a":1,"e":"Enzymes speed up metabolic reactions to rates fast enough to sustain life."},{"id":"ch5p7","tp":"Denaturation","q":"Which factor can cause an enzyme to be denatured?","o":["Very low substrate concentration","Adding more enzyme","Very high temperature","Removing the product"],"a":2,"e":"High temperature (and extreme pH) denatures enzymes by changing the shape of the active site."},{"id":"ch5p8","tp":"Denaturation","q":"When an enzyme is denatured, what change happens to its structure?","o":["Its active site becomes larger and works faster","It changes into its substrate","It forms more enzyme-substrate complexes","The shape of its active site changes permanently"],"a":3,"e":"Denaturation permanently changes the shape of the active site, so the substrate no longer fits."},{"id":"ch5p9","tp":"Temperature effect","q":"What happens to the activity of an enzyme at a low temperature?","o":["The enzyme is denatured","The rate of reaction is very low","The rate of reaction is at its maximum","The active site is permanently destroyed"],"a":1,"e":"At low temperature molecules have little kinetic energy, so the rate is low, but the enzyme is not denatured."},{"id":"ch5p10","tp":"Substrate and product","q":"What is the name of the substance that an enzyme acts on?","o":["Product","Complex","Substrate","Catalyst"],"a":2,"e":"The substrate is the substance on which the enzyme acts; the product is what is formed."},{"id":"ch5p11","tp":"Optimum pH","q":"At its optimum pH, the rate of an enzyme-controlled reaction is ______.","o":["at its maximum","zero","at its minimum","half the maximum"],"a":0,"e":"Each enzyme has an optimum pH at which its activity (reaction rate) is highest."},{"id":"ch5p12","tp":"Enzyme reuse","q":"After an enzyme has catalysed a reaction, what happens to the enzyme?","o":["It is used up and broken into products","It becomes a substrate for the next reaction","It is converted into heat energy","It is unchanged and can be used again"],"a":3,"e":"Enzymes are not changed by the reaction, so they can catalyse the same reaction again."},{"id":"ch5p13","tp":"Metabolic reactions","q":"In which processes do enzymes act as biological catalysts?","o":["All metabolic reactions","Only photosynthesis","Only respiration","Only digestion"],"a":0,"e":"Enzymes are involved in all metabolic reactions in living organisms."}],"basic":[{"id":"ch5b0","tp":"Enzyme-substrate complex","q":"What is the temporary structure formed when a substrate binds to an enzyme called?","o":["Product","Enzyme-substrate complex","Substrate complex","Catalyst"],"a":1,"e":"The enzyme-substrate complex forms when the substrate fits into the active site."},{"id":"ch5b1","tp":"Specificity","q":"Why can an enzyme usually catalyse only one type of reaction?","o":["Because it is a protein","Because it works at a high temperature","Because it is found only in one organ","Because its active site is complementary in shape to only its specific substrate"],"a":3,"e":"The active site is specific in shape, so only the matching substrate can fit and react."},{"id":"ch5b2","tp":"Denaturation","q":"Which treatment permanently stops an enzyme from working?","o":["Cooling it to 5°C","Heating it to 80°C","Adding more substrate","Adding more enzyme"],"a":1,"e":"Heating to 80°C denatures the enzyme permanently, while cooling only slows the reaction rate."},{"id":"ch5b3","tp":"Temperature effect","q":"As the temperature rises towards the optimum, the rate of an enzyme-controlled reaction increases mainly because ______.","o":["the enzyme is denatured","molecules gain kinetic energy and collide more often","the active site changes shape permanently","the substrate is used up"],"a":1,"e":"Higher temperature gives molecules more kinetic energy, increasing the frequency of effective collisions."},{"id":"ch5b4","tp":"pH effect","q":"If the pH of a solution containing an enzyme is very far from the optimum, the rate of reaction falls because ______.","o":["the substrate runs out","the enzyme is digested by other enzymes","the shape of the active site is altered and the enzyme may be denatured","the product increases the pH further"],"a":2,"e":"Extreme pH changes the shape of the active site (shape and fit) and can denature the enzyme."},{"id":"ch5b5","tp":"Investigating enzyme activity","q":"Which reagent is commonly used to test for the presence of starch in an experiment on enzyme activity?","o":["Benedict's solution","Limewater","DCPIP","Iodine solution"],"a":3,"e":"Iodine solution turns blue-black in the presence of starch; its disappearance shows starch has been digested."},{"id":"ch5b6","tp":"Investigating enzyme activity","q":"In an experiment to investigate the effect of temperature on amylase, a student uses iodine solution to test for starch. Why does the blue-black colour stop appearing where amylase works?","o":["The starch is denatured by the enzyme","Amylase breaks the starch down so it no longer gives the blue-black colour","The iodine is used up by the enzyme","The starch is converted into iodine"],"a":1,"e":"Amylase digests starch into products that do not react with iodine, so the blue-black colour is lost."},{"id":"ch5b7","tp":"Catalyst","q":"Which row correctly describes a catalyst and an enzyme?","o":["A catalyst is used up; an enzyme is a protein","A catalyst is not changed by the reaction; an enzyme is a carbohydrate","A catalyst is not changed by the reaction; an enzyme is a protein","A catalyst is used up; an enzyme is a lipid"],"a":2,"e":"Catalysts are not changed by the reaction, and enzymes are proteins."},{"id":"ch5b8","tp":"Active site","q":"The shape of the active site is complementary to the substrate. This means that ______.","o":["the substrate fits into the active site like a key into a lock","the substrate is digested by the active site","the substrate is the same shape as the active site","the substrate changes the active site into a product"],"a":0,"e":"Complementary shape and fit allow the substrate to bind specifically to the active site."},{"id":"ch5b9","tp":"Product formation","q":"After the reaction, the products are released from the ______.","o":["active site","substrate","cell membrane","nucleus"],"a":0,"e":"Products are released from the active site, leaving the enzyme ready to be used again."},{"id":"ch5b10","tp":"Data interpretation","q":"A student investigates the effect of pH on an enzyme and finds that the rate is highest at pH 6, lower at pH 5 and pH 7, and zero at pH 2. What is the optimum pH of this enzyme?","o":["2","5","6","7"],"a":2,"e":"The highest rate is at pH 6, so that is the optimum pH of the enzyme."},{"id":"ch5b11","tp":"Temperature effect","q":"On a graph of reaction rate against temperature, the rate rises to a peak and then falls sharply. The sharp fall is mainly because ______.","o":["the substrate has been used up","the product inhibits the enzyme","the enzyme is digested by other enzymes","the enzyme is denatured at high temperature"],"a":3,"e":"Above the optimum temperature the enzyme is denatured, so the rate falls sharply."}],"review":[{"id":"ch5r0","tp":"Temperature graph","q":"A graph of enzyme activity against temperature shows a curve rising to a peak at 37°C and then falling steeply. What is the temperature at the peak called?","o":["Denaturation temperature","Activation temperature","Optimum temperature","Boiling temperature"],"a":2,"e":"The peak is at the optimum temperature, where the enzyme works fastest."},{"id":"ch5r1","tp":"Temperature effect","q":"A student investigates the effect of temperature on enzyme activity and finds that the rate is zero at 70°C. What is the most likely explanation?","o":["The enzyme is working slowly","The substrate is frozen","The pH has become acidic","The enzyme has been denatured"],"a":3,"e":"70°C is high enough to denature the enzyme, so no reaction occurs."},{"id":"ch5r2","tp":"pH graph","q":"Which graph shape best shows how the rate of an enzyme-controlled reaction changes with pH?","o":["Rate increases steadily as pH increases","Rate is highest at a particular pH and lower on both sides of it","Rate is lowest at a particular pH and higher on both sides of it","Rate stays constant at all pH values"],"a":1,"e":"Enzyme activity is highest at the optimum pH and falls on either side."},{"id":"ch5r3","tp":"Terminology","q":"Which row correctly matches a term with its description?","o":["Substrate - the substance produced by the reaction","Product - the substance on which the enzyme acts","Active site - the region of the enzyme that binds the substrate","Enzyme-substrate complex - the enzyme after denaturation"],"a":2,"e":"The active site is the region of the enzyme whose shape is complementary to the substrate."},{"id":"ch5r4","tp":"Denaturation","q":"An enzyme is heated to 80°C and then cooled back to 37°C. It no longer works. Which statement explains this?","o":["The shape of the active site changed permanently when heated","The substrate was used up while hot","Cooling permanently denatures enzymes","The enzyme was dissolved by the water"],"a":0,"e":"High temperature denatures the enzyme, permanently changing the active site shape."},{"id":"ch5r5","tp":"Investigating enzyme activity","q":"In an experiment using the enzyme catalase and hydrogen peroxide, how is the rate of reaction most easily measured?","o":["Colour change of iodine solution","Mass of starch remaining","pH change of the solution","Rate of bubble (gas) production"],"a":3,"e":"Catalase breaks down hydrogen peroxide to release oxygen gas, so the rate of gas production measures the rate."},{"id":"ch5r6","tp":"Investigating enzyme activity","q":"A student adds amylase to starch suspensions at different pH values and tests with iodine every minute. At the optimum pH, what result is expected?","o":["The blue-black colour appears fastest","The blue-black colour disappears fastest","The blue-black colour never changes","The solution turns cloudy"],"a":1,"e":"At the optimum pH amylase digests starch fastest, so the blue-black colour disappears most quickly."},{"id":"ch5r7","tp":"Specificity","q":"The enzyme urease catalyses the breakdown of urea but not of starch. This is because ______.","o":["the active site of urease has a shape complementary only to urea","urease is denatured by urea","starch inhibits urease","urease works only at high temperature"],"a":0,"e":"Enzymes are specific: the active site of urease only fits urea, not starch."},{"id":"ch5r8","tp":"Temperature effect","q":"Which statement about the effect of temperature on enzyme activity is correct?","o":["Increasing temperature always increases the rate","Decreasing temperature always denatures the enzyme","Increasing temperature increases the rate until the optimum, after which the enzyme is denatured","Temperature has no effect on enzyme activity"],"a":2,"e":"Rate rises to a maximum at the optimum temperature, then falls as the enzyme denatures."},{"id":"ch5r9","tp":"Catalyst","q":"A catalyst increases the rate of a reaction but is ______.","o":["not changed by the reaction","converted into the product","changed into an enzyme","denatured by the substrate"],"a":0,"e":"A catalyst is unchanged by the reaction, so it can be used repeatedly."},{"id":"ch5r10","tp":"Enzymes as proteins","q":"If the protein structure of an enzyme is unfolded, which property of the enzyme is most directly damaged?","o":["The mass of the substrate","The shape of the active site","The temperature of the reaction","The colour of the product"],"a":1,"e":"Unfolding the protein changes the shape of the active site, so the substrate can no longer fit."},{"id":"ch5r11","tp":"Reaction rate","q":"Two reactions produce the same product. Reaction X uses an enzyme and reaction Y does not. At the same temperature, the enzyme-controlled reaction usually has ______.","o":["a lower rate","the same rate","a lower optimum temperature","a higher rate"],"a":3,"e":"Enzymes are catalysts, so they increase the rate of reaction compared with the same reaction without an enzyme."}],"adv":[{"id":"ch5a0","tp":"Enzyme-substrate complex","q":"During enzyme action, the substrate binds to the active site to form a temporary structure. What is this structure called?","o":["Enzyme-substrate complex","Product complex","Substrate site","Denatured complex"],"a":0,"e":"The enzyme-substrate complex forms when the substrate is held in the active site before products are released."},{"id":"ch5a1","tp":"pH effect","q":"Some enzymes in the small intestine work best in slightly alkaline conditions, while an enzyme in the stomach works best in acidic conditions. Which conclusion about enzymes is supported by this information?","o":["All enzymes have the same optimum pH","Enzymes work only in the stomach","Enzymes are denatured by alkaline conditions","Different enzymes can have different optimum pH values"],"a":3,"e":"The information shows that different enzymes can have different optimum pH values, depending on where they work."},{"id":"ch5a2","tp":"Data interpretation","q":"A student investigates an enzyme at its optimum temperature but at two different pH values, pH 5 and pH 8. The rate at pH 5 is much higher than the rate at pH 8. What can be concluded?","o":["The enzyme is denatured at pH 5","The optimum pH of the enzyme is closer to pH 5 than to pH 8","The optimum temperature changes with pH","The enzyme works only at pH 5"],"a":1,"e":"The much higher rate at pH 5 suggests the enzyme's optimum pH is nearer pH 5 than pH 8."},{"id":"ch5a3","tp":"Data interpretation","q":"A student records the time taken for starch to be digested by amylase at different temperatures. At 60°C it takes 2 minutes; at 80°C starch still gives a blue-black colour with iodine after 10 minutes. What does this suggest?","o":["Amylase works faster at 80°C than at 60°C","Amylase has been denatured at 80°C","Starch is digested faster at high temperature","The optimum temperature of amylase is above 80°C"],"a":1,"e":"No digestion at 80°C indicates the amylase has been denatured by the high temperature."},{"id":"ch5a4","tp":"pH effect","q":"Which statement correctly explains why changing pH far from the optimum reduces enzyme activity?","o":["The substrate is digested by the acid","The pH changes the kinetic energy of the molecules","The pH changes the colour of the product","The shape of the active site is altered and the enzyme may be denatured"],"a":3,"e":"Extreme pH alters the shape and fit of the active site, and can denature the enzyme."},{"id":"ch5a5","tp":"Enzyme reuse","q":"After the products have been released from an enzyme, the active site is available to bind ______.","o":["more molecules of the same substrate","only the product just formed","any type of substrate","a molecule of the enzyme itself"],"a":0,"e":"The enzyme is unchanged after the reaction, so it can bind more of the same substrate."},{"id":"ch5a6","tp":"Specificity","q":"Enzymes A and B are present in the same solution with substrates X and Y. Enzyme A breaks down X only, and enzyme B breaks down Y only. What explains this?","o":["Enzyme A is denatured by substrate Y","Enzyme B works faster than enzyme A","The active site of each enzyme is complementary only to its own substrate","Substrate X is converted into enzyme A"],"a":2,"e":"Each enzyme has an active site complementary only to its specific substrate, so A acts on X and B acts on Y."},{"id":"ch5a7","tp":"Data interpretation","q":"A curve of reaction rate against temperature shows the rate rising to 45°C and then dropping to near zero at 60°C. What is the best conclusion?","o":["The optimum temperature is 60°C","The substrate is used up at 60°C","The enzyme is denatured between 45°C and 60°C","The enzyme works best at 60°C"],"a":2,"e":"The rate falls sharply after 45°C because the enzyme is denatured at high temperature."},{"id":"ch5a8","tp":"Investigating enzyme activity","q":"To investigate the effect of pH on an enzyme that digests protein, a student measures the time taken for a piece of protein to be digested at different pH values. Which result shows the fastest rate?","o":["The longest time for the protein to disappear","The protein never disappears at any pH","The protein disappears at the same time at all pH values","The shortest time for the protein to disappear"],"a":3,"e":"A shorter digestion time means a faster rate of reaction."},{"id":"ch5a9","tp":"Denaturation","q":"Why does freezing an enzyme slow the reaction but not permanently destroy it, whereas boiling destroys it?","o":["Freezing changes the shape of the active site permanently","Freezing only slows molecular movement, while boiling denatures the enzyme by changing the active site shape","Boiling changes the substrate into an enzyme","Freezing digests the enzyme"],"a":1,"e":"Freezing lowers kinetic energy (slowing the rate) without changing the active site, while boiling denatures the enzyme."},{"id":"ch5a10","tp":"Data interpretation","q":"A student measures the rate of an enzyme reaction at 10°C, 20°C, 30°C, 40°C and 50°C and obtains rates of 1, 3, 6, 8 and 2 arbitrary units. What is the most likely optimum temperature of the enzyme?","o":["40°C","20°C","30°C","50°C"],"a":0,"e":"The highest measured rate is at 40°C, so the optimum is closest to 40°C among the tested temperatures."},{"id":"ch5a11","tp":"Application","q":"A human enzyme works best at 37°C. If a person has a fever of 40°C, what is the most likely effect on enzyme-controlled reactions?","o":["All enzyme reactions stop completely","All enzymes are immediately denatured","Enzymes work much faster with no limit","Reactions continue but at a slightly different rate from the optimum"],"a":3,"e":"40°C is only slightly above the optimum, so reactions continue but not at the optimum rate; denaturation needs much higher temperatures."}],"basic_saq":[{"id":"ch5bs0","tp":"Catalyst and enzymes as proteins","q":"State what is meant by a catalyst. State what enzymes are made of.","mm":2,"ms":[{"p":"A catalyst is a substance that increases the rate of a chemical reaction and is not changed by the reaction","pts":1},{"p":"Enzymes are proteins","pts":1}],"e":"Two core facts: the definition of a catalyst and the chemical nature of enzymes."},{"id":"ch5bs1","tp":"Temperature effect","q":"Describe what happens to the rate of an enzyme-controlled reaction as the temperature is increased from very low to very high temperature.","mm":3,"ms":[{"p":"The rate is low at low temperature and increases as the temperature rises towards the optimum","pts":1},{"p":"The rate is fastest at the optimum temperature","pts":1},{"p":"Above the optimum, the enzyme is denatured, so the rate falls (towards zero)","pts":1}],"e":"Describes the rise to the optimum, the peak rate, and the fall caused by denaturation."}],"review_saq":[{"id":"ch5rs0","tp":"pH effect","q":"Describe the effect of changing pH on the activity of an enzyme. Refer to the optimum pH and denaturation in your answer.","mm":3,"ms":[{"p":"Each enzyme has an optimum pH at which its activity (rate) is highest","pts":1},{"p":"On either side of the optimum pH, enzyme activity decreases","pts":1},{"p":"Very high or very low pH can denature the enzyme / change the shape of the active site","pts":1}],"e":"Describes the peak at optimum pH, the decrease either side, and denaturation at extremes."},{"id":"ch5rs1","tp":"Specificity","q":"Explain why an enzyme is specific and catalyses only one type of reaction.","mm":3,"ms":[{"p":"The active site of the enzyme has a particular shape","pts":1},{"p":"The shape is complementary only to the shape of its specific substrate","pts":1},{"p":"If the substrate does not fit the active site, an enzyme-substrate complex cannot form and the reaction is not catalysed","pts":1}],"e":"Specificity results from the complementary shape and fit of the active site with the substrate."}],"adv_saq":[{"id":"ch5as0","tp":"Temperature effect","q":"Explain, in terms of kinetic energy and shape and fit, how increasing temperature affects the rate of an enzyme-catalysed reaction up to and beyond the optimum temperature.","mm":4,"ms":[{"p":"Increasing temperature increases the kinetic energy of the molecules","pts":1},{"p":"Molecules move faster, so effective collisions between enzyme and substrate are more frequent","pts":1},{"p":"Up to the optimum temperature the rate increases to its maximum","pts":1},{"p":"Above the optimum, high temperature changes the shape of the active site (denatures the enzyme), so the substrate no longer fits and the rate falls","pts":1}],"e":"Covers kinetic energy and collision frequency up to the optimum, and denaturation beyond it."},{"id":"ch5as1","tp":"Investigating enzyme activity","q":"In an experiment, a protein-digesting enzyme worked fastest at pH 2 and did not work at all at pH 9. (a) State the optimum pH of this enzyme. (b) Explain why the enzyme did not work at pH 9. (c) Suggest how the rate of digestion of the protein could be measured.","mm":4,"ms":[{"p":"The optimum pH is about 2","pts":1},{"p":"At pH 9 the enzyme is denatured","pts":1},{"p":"The shape of the active site is changed, so the substrate no longer fits","pts":1},{"p":"Measure the time taken for the protein to be digested / disappear (a shorter time means a faster rate)","pts":1}],"e":"Tests data interpretation, denaturation by extreme pH, and experimental measurement of rate."}]},"ch6":{"pre":[{"id":"ch6p0","tp":"Photosynthesis definition","q":"What is photosynthesis?","o":["The process by which plants synthesise carbohydrates from raw materials using energy from light","The process by which plants absorb water through their roots","The breakdown of glucose to release energy","The movement of water vapour out of leaves"],"a":0,"e":"Photosynthesis is the process by which plants synthesise carbohydrates from raw materials using energy from light."},{"id":"ch6p1","tp":"Photosynthesis equation","q":"Which word equation correctly represents photosynthesis?","o":["oxygen + glucose → carbon dioxide + water","carbon dioxide + water → glucose + oxygen","glucose + oxygen → carbon dioxide + water","carbon dioxide + glucose → water + oxygen"],"a":1,"e":"The word equation for photosynthesis is carbon dioxide + water → glucose + oxygen, in the presence of light and chlorophyll."},{"id":"ch6p2","tp":"Chlorophyll","q":"Chlorophyll is a green pigment found in which part of a plant cell?","o":["cell wall","vacuole","chloroplast","nucleus"],"a":2,"e":"Chlorophyll is a green pigment that is found in chloroplasts."},{"id":"ch6p3","tp":"Chlorophyll","q":"What is the role of chlorophyll in photosynthesis?","o":["It transfers energy from light into energy in chemicals","It absorbs water from the soil","It stores starch in the leaf","It transports sucrose in the phloem"],"a":0,"e":"Chlorophyll transfers energy from light into energy in chemicals, for the synthesis of carbohydrates."},{"id":"ch6p4","tp":"Uses of carbohydrates","q":"Carbohydrates made in photosynthesis can be stored as starch. What is the main role of starch in a plant?","o":["To attract insects for pollination","To act as an energy store","To build cell walls","To transport glucose around the plant"],"a":1,"e":"Starch is used as an energy store in plants."},{"id":"ch6p5","tp":"Uses of carbohydrates","q":"Carbohydrates made in photosynthesis are used to make cellulose. What is the function of cellulose in a plant?","o":["To store energy in seeds","To transport substances in the phloem","To build cell walls","To absorb light energy"],"a":2,"e":"Cellulose is used to build cell walls."},{"id":"ch6p6","tp":"Uses of carbohydrates","q":"Some carbohydrates made in photosynthesis are converted to sucrose. What is the main function of sucrose in a plant?","o":["To provide energy through respiration","To be transported in the phloem","To make cell walls","To attract insects for pollination"],"a":1,"e":"Sucrose is used for transport in the phloem."},{"id":"ch6p7","tp":"Uses of carbohydrates","q":"Plants make nectar using carbohydrates from photosynthesis. Why is nectar important to a plant?","o":["It stores energy for the plant","It helps the plant absorb light","It strengthens the cell walls","It attracts insects for pollination"],"a":3,"e":"Nectar attracts insects for pollination."},{"id":"ch6p8","tp":"Photosynthesis equation","q":"Which gas does a plant take in from the air for photosynthesis?","o":["oxygen","nitrogen","carbon dioxide","hydrogen"],"a":2,"e":"Carbon dioxide is a raw material of photosynthesis and is taken in from the air."},{"id":"ch6p9","tp":"Photosynthesis equation","q":"Which gas is released by a plant as a product of photosynthesis?","o":["carbon dioxide","oxygen","nitrogen","water vapour"],"a":1,"e":"Oxygen is a product of photosynthesis and is released into the air."},{"id":"ch6p10","tp":"Leaf structure","q":"Most leaves have a large surface area. How does this adapt them for photosynthesis?","o":["It reduces the distance gases must diffuse","It prevents water loss from the leaf","It strengthens the leaf against wind","It allows more light to be absorbed"],"a":3,"e":"A large surface area allows a leaf to absorb more light for photosynthesis."},{"id":"ch6p11","tp":"Leaf structure","q":"Most leaves are thin. Why is this an adaptation for photosynthesis?","o":["So that gases have only a short distance to diffuse","So that the leaf can store more starch","So that insects can reach the flowers","So that the leaf can float on water"],"a":0,"e":"Thin leaves give gases only a short distance to diffuse to reach the photosynthesising cells."},{"id":"ch6p12","tp":"Leaf structure","q":"In which layer of a dicotyledonous leaf do most chloroplasts, and therefore most photosynthesis, occur?","o":["upper epidermis","spongy mesophyll","lower epidermis","palisade mesophyll"],"a":3,"e":"The palisade mesophyll contains most of the chloroplasts, so most photosynthesis occurs there."},{"id":"ch6p13","tp":"Leaf structure","q":"What is the main function of stomata in a leaf?","o":["To allow gas exchange with the air","To transport water to the leaf cells","To absorb light energy","To make chlorophyll"],"a":0,"e":"Stomata allow gas exchange between the leaf and the air, letting carbon dioxide in and oxygen out."}],"basic":[{"id":"ch6b0","tp":"Photosynthesis equation","q":"Which two substances are the raw materials of photosynthesis?","o":["glucose and oxygen","carbon dioxide and oxygen","water and glucose","carbon dioxide and water"],"a":3,"e":"The raw materials of photosynthesis are carbon dioxide and water."},{"id":"ch6b1","tp":"Photosynthesis equation","q":"The word equation for photosynthesis is carbon dioxide + water → glucose + oxygen. In the presence of which two things does this reaction take place?","o":["nitrates and magnesium","light and chlorophyll","oxygen and chlorophyll","water and light"],"a":1,"e":"Photosynthesis takes place in the presence of light and chlorophyll."},{"id":"ch6b2","tp":"Uses of carbohydrates","q":"Some of the glucose produced in photosynthesis is used in respiration. What does this glucose provide the plant with?","o":["cell walls","energy","nectar","chlorophyll"],"a":1,"e":"Glucose is used in respiration to provide energy."},{"id":"ch6b3","tp":"Mineral ions","q":"A plant lacking nitrate ions in the soil would be unable to make which substances?","o":["chlorophyll","starch","cellulose","amino acids"],"a":3,"e":"Nitrate ions are needed for making amino acids."},{"id":"ch6b4","tp":"Mineral ions","q":"A plant grown in soil lacking magnesium ions develops yellow leaves. Why?","o":["It cannot make amino acids","It cannot absorb water","It cannot make chlorophyll","It cannot transport sucrose"],"a":2,"e":"Magnesium ions are needed for making chlorophyll; without magnesium the leaves turn yellow."},{"id":"ch6b5","tp":"Leaf structure","q":"The upper epidermis of a leaf is transparent. How does this help photosynthesis?","o":["It prevents carbon dioxide from escaping","It allows light to reach the mesophyll cells below","It stores glucose made in photosynthesis","It attracts insects to the leaf"],"a":1,"e":"A transparent upper epidermis lets light pass through to the chloroplasts in the mesophyll cells below."},{"id":"ch6b6","tp":"Leaf structure","q":"What surrounds each stoma and controls whether it is open or closed?","o":["palisade cells","epidermal cells","guard cells","phloem cells"],"a":2,"e":"Guard cells surround each stoma and control whether it is open or closed."},{"id":"ch6b7","tp":"Leaf structure","q":"The spongy mesophyll contains many air spaces. What is the role of these air spaces in photosynthesis?","o":["to store water for the leaf","to absorb light energy","to transport sucrose away from the leaf","to allow carbon dioxide to diffuse to the cells"],"a":3,"e":"The air spaces in the spongy mesophyll allow gases such as carbon dioxide to diffuse to the photosynthesising cells."},{"id":"ch6b8","tp":"Leaf structure","q":"What is the function of the xylem in a leaf?","o":["to transport water to the leaf cells","to transport sucrose away from the leaf","to allow gas exchange","to make chlorophyll"],"a":0,"e":"The xylem transports water to the leaf cells; water is a raw material of photosynthesis."},{"id":"ch6b9","tp":"Leaf structure","q":"The phloem in a leaf transports substances made in photosynthesis. Which substance is transported in the phloem?","o":["starch","cellulose","sucrose","chlorophyll"],"a":2,"e":"Sucrose is transported in the phloem."},{"id":"ch6b10","tp":"Starch test","q":"A variegated leaf has green and white areas. After the plant is exposed to light, only the green areas of the leaf test positive for starch. What does this show?","o":["chlorophyll is needed for photosynthesis","carbon dioxide is needed for photosynthesis","light is needed for photosynthesis","water is needed for photosynthesis"],"a":0,"e":"The green areas contain chlorophyll and made starch; the white areas lack chlorophyll, showing chlorophyll is needed for photosynthesis."},{"id":"ch6b11","tp":"Starch test","q":"A leaf is tested for starch using iodine solution. What colour shows that starch is present?","o":["yellow","green","brick-red","blue-black"],"a":3,"e":"Iodine solution turns blue-black in the presence of starch."}],"review":[{"id":"ch6r0","tp":"Limiting factors","q":"The rate of photosynthesis in a plant is limited by carbon dioxide concentration. Which change would most increase the rate of photosynthesis?","o":["increasing the carbon dioxide concentration","increasing the distance between the plant and the light source","decreasing the temperature","decreasing the light intensity"],"a":0,"e":"If carbon dioxide concentration is the limiting factor, increasing it increases the rate of photosynthesis."},{"id":"ch6r1","tp":"Limiting factors","q":"A plant is kept at a constant temperature with plenty of water. As light intensity increases, the rate of photosynthesis rises and then levels off. Why does the rate level off?","o":["The plant has used up all its chlorophyll","Light is no longer the factor limiting the rate","The stomata all close at high light intensity","The temperature becomes too high for the enzymes"],"a":1,"e":"At high light intensity, light is no longer limiting; another factor such as carbon dioxide concentration becomes limiting, so the rate levels off."},{"id":"ch6r2","tp":"Gas exchange","q":"An aquatic plant is placed in a tube of hydrogencarbonate indicator solution and exposed to bright light. Photosynthesis removes carbon dioxide from the solution. What colour does the indicator become?","o":["yellow","blue-green","colourless","purple"],"a":3,"e":"Removing carbon dioxide makes the solution more alkaline, so hydrogencarbonate indicator turns purple."},{"id":"ch6r3","tp":"Starch test","q":"To show that carbon dioxide is needed for photosynthesis, a student encloses one leaf in a flask containing soda lime (which absorbs carbon dioxide) and leaves another leaf in normal air. Both are then tested for starch. What is the purpose of the leaf in normal air?","o":["to act as a control","to test for the presence of chlorophyll","to provide a source of light","to destarch the plant"],"a":0,"e":"The leaf in normal air acts as a control, so the effect of removing carbon dioxide can be compared."},{"id":"ch6r4","tp":"Starch test","q":"Before testing a leaf for starch, a plant is kept in darkness for 48 hours. What is the purpose of this step?","o":["to allow photosynthesis to produce starch","to remove all chlorophyll from the leaves","to kill the plant before the test","to make sure no starch is already present"],"a":3,"e":"Keeping the plant in darkness makes sure any starch already present is used up in respiration, so the test result is reliable."},{"id":"ch6r5","tp":"Limiting factors","q":"Increasing the temperature from 10°C to 30°C increases the rate of photosynthesis. What is the reason for this increase?","o":["The plant absorbs more carbon dioxide from the air","The enzymes involved in photosynthesis work faster","Chlorophyll absorbs more light energy","The stomata open wider to allow more gas exchange"],"a":1,"e":"Higher temperatures make the enzymes controlling photosynthesis work faster, so the rate increases up to the optimum."},{"id":"ch6r6","tp":"Leaf structure","q":"Palisade mesophyll cells contain many chloroplasts and are found near the upper surface of the leaf. How does this adapt the leaf for photosynthesis?","o":["It allows carbon dioxide to diffuse quickly into the leaf","It reduces water loss from the leaf","It allows maximum absorption of light","It transports sucrose to the rest of the plant"],"a":2,"e":"Palisade cells packed with chloroplasts near the upper surface absorb as much light as possible for photosynthesis."},{"id":"ch6r7","tp":"Leaf structure","q":"Carbon dioxide enters a leaf through the stomata. Through which structure does it pass to reach the photosynthesising cells?","o":["the xylem","the cuticle","the phloem","the air spaces"],"a":3,"e":"Carbon dioxide diffuses through the air spaces in the spongy mesophyll to reach the photosynthesising cells."},{"id":"ch6r8","tp":"Leaf structure","q":"Which statement correctly explains how the thinness of a leaf helps photosynthesis?","o":["It keeps the leaf cool so enzymes work faster","It increases the surface area for light absorption","It gives gases a short distance to diffuse to the cells","It lets water evaporate quickly from the leaf"],"a":2,"e":"A thin leaf means gases have only a short distance to diffuse to reach the cells where photosynthesis occurs."},{"id":"ch6r9","tp":"Starch test","q":"In a starch test on a leaf, the leaf is boiled in ethanol. What is the purpose of this step?","o":["to kill the leaf and stop respiration","to soften the leaf so it can be spread flat","to remove chlorophyll so colour changes can be seen","to destroy any starch present in the leaf"],"a":2,"e":"Boiling in ethanol removes the green chlorophyll, so the blue-black colour of iodine with starch can be clearly seen."},{"id":"ch6r10","tp":"Leaf structure","q":"Guard cells control the opening and closing of stomata. How does this help photosynthesis?","o":["They produce chlorophyll for the leaf","They allow carbon dioxide to enter the leaf when open","They transport water to the palisade cells","They store glucose made during photosynthesis"],"a":1,"e":"When the stomata are open, carbon dioxide can diffuse into the leaf for photosynthesis."},{"id":"ch6r11","tp":"Uses of carbohydrates","q":"During the day, a plant makes more glucose than it needs for respiration. What happens to much of this extra glucose?","o":["It is converted to starch for storage","It is released as oxygen through the stomata","It is used to make chlorophyll","It is stored as mineral ions in the xylem"],"a":0,"e":"Extra glucose is converted into starch, which is stored as an energy store in the plant."}],"adv":[{"id":"ch6a0","tp":"Photosynthesis equation","q":"Which balanced chemical equation correctly represents photosynthesis?","o":["CO2 + H2O → C6H12O6 + O2","6CO2 + 12H2O → 2C6H12O6 + 6O2","C6H12O6 + 6O2 → 6CO2 + 6H2O","6CO2 + 6H2O → C6H12O6 + 6O2"],"a":3,"e":"The balanced chemical equation for photosynthesis is 6CO2 + 6H2O → C6H12O6 + 6O2."},{"id":"ch6a1","tp":"Limiting factors","q":"On a dull, cloudy day in summer, a farmer notices that photosynthesis in his crop is slow. Which factor is most likely limiting the rate of photosynthesis?","o":["light intensity","carbon dioxide concentration","temperature","chlorophyll concentration"],"a":0,"e":"On a cloudy day the light intensity is low, so light is the factor most likely limiting photosynthesis."},{"id":"ch6a2","tp":"Rate experiments","q":"The table shows the effect of light intensity on the rate of photosynthesis of an aquatic plant, measured as bubbles of oxygen per minute. Light intensity (arbitrary units): 0, 20, 40, 60, 80. Rate (bubbles per minute): 0, 16, 24, 28, 28. Which factor is no longer the limiting factor at light intensities above 60 units?","o":["light intensity","carbon dioxide concentration","temperature","oxygen concentration"],"a":0,"e":"Between 60 and 80 units the rate stays the same while light intensity increases, so light is no longer the limiting factor."},{"id":"ch6a3","tp":"Limiting factors","q":"A tomato grower adds extra carbon dioxide to the air inside a greenhouse during the day. What is the purpose of this practice?","o":["to reduce the rate of respiration in the plants","to increase the rate of photosynthesis, allowing more glucose to be made","to make the leaves warmer so enzymes work faster","to increase the amount of oxygen available to the plants"],"a":1,"e":"Carbon dioxide is a raw material of photosynthesis, so increasing its concentration can increase the rate of photosynthesis and glucose production."},{"id":"ch6a4","tp":"Limiting factors","q":"The rate of photosynthesis increases as temperature rises to about 35°C, but decreases sharply at higher temperatures. Why does it decrease?","o":["The stomata close completely at high temperatures","Chlorophyll is destroyed by the high temperature","The enzymes controlling photosynthesis are denatured","Carbon dioxide becomes less available at high temperatures"],"a":2,"e":"Above the optimum temperature the enzymes that control photosynthesis are denatured, so the rate falls sharply."},{"id":"ch6a5","tp":"Rate experiments","q":"A student measures the rate of photosynthesis by counting bubbles of gas released from the cut stem of an aquatic plant. Which statement explains why this method may not give accurate results?","o":["The plant uses oxygen for photosynthesis","Bubbles are produced only in darkness","Some oxygen dissolves in the water and is not collected as bubbles","Carbon dioxide is released by the plant during photosynthesis"],"a":2,"e":"Some of the oxygen produced dissolves in the water rather than forming bubbles, so bubble counts may under-estimate the rate."},{"id":"ch6a6","tp":"Limiting factors","q":"At low light intensities, doubling the light intensity roughly doubles the rate of photosynthesis. Why?","o":["More chlorophyll is produced in response to more light","The plant opens more stomata to absorb more carbon dioxide","Light is the limiting factor, so more light energy is available","The temperature of the leaf increases, speeding up enzymes"],"a":2,"e":"At low light intensity, light is the limiting factor, so increasing it provides more energy and proportionally increases the rate."},{"id":"ch6a7","tp":"Gas exchange","q":"A sealed, transparent container holds a green plant. It is placed in darkness for several hours. Which gas will increase in concentration inside the container?","o":["oxygen","nitrogen","water vapour","carbon dioxide"],"a":3,"e":"In darkness no photosynthesis occurs, but respiration continues, releasing carbon dioxide into the container."},{"id":"ch6a8","tp":"Leaf structure","q":"Which leaf structure is most directly involved in reducing water loss rather than in photosynthesis itself?","o":["the palisade mesophyll","the spongy mesophyll air spaces","the chloroplasts","the waxy cuticle"],"a":3,"e":"The waxy cuticle reduces water loss from the leaf, whereas the other structures are more directly involved in photosynthesis."},{"id":"ch6a9","tp":"Starch test","q":"A plant is kept in complete darkness for 48 hours and then a leaf is tested for starch. The test is negative. Why?","o":["Photosynthesis could not occur, and starch already present was used up in respiration","The chlorophyll was destroyed in the darkness","The stomata closed permanently in the darkness","Carbon dioxide was not available in the darkness"],"a":0,"e":"In darkness photosynthesis stops, so no new starch is made, and existing starch is used up in respiration over the 48 hours."},{"id":"ch6a10","tp":"Chlorophyll","q":"Which statement best describes the role of chlorophyll in photosynthesis?","o":["It splits water into hydrogen and oxygen","It transfers energy from light into chemical energy used to synthesise carbohydrates","It combines carbon dioxide with glucose","It releases oxygen into the atmosphere"],"a":1,"e":"Chlorophyll transfers energy from light into chemical energy, which is used to synthesise carbohydrates."},{"id":"ch6a11","tp":"Limiting factors","q":"The rate of photosynthesis of a seaweed decreases as the depth of water above it increases. What is the most likely explanation?","o":["The water temperature decreases with depth","Less light reaches the seaweed at greater depths","The carbon dioxide concentration decreases with depth","The water pressure stops gas exchange"],"a":1,"e":"Less light penetrates to greater depths, so light becomes the limiting factor and the rate of photosynthesis falls."}],"basic_saq":[{"id":"ch6bs0","q":"State the word equation for photosynthesis.","mm":3,"ms":[{"p":"carbon dioxide + water → glucose + oxygen","pts":2},{"p":"in the presence of light and chlorophyll","pts":1}],"e":"The word equation is carbon dioxide + water → glucose + oxygen, in the presence of light and chlorophyll."},{"id":"ch6bs1","q":"State three uses of the carbohydrates made in photosynthesis.","mm":3,"ms":[{"p":"starch as an energy store","pts":1},{"p":"cellulose to build cell walls","pts":1},{"p":"glucose used in respiration to provide energy","pts":1}],"e":"Other acceptable uses are sucrose for transport in the phloem and nectar to attract insects for pollination."}],"review_saq":[{"id":"ch6rs0","q":"Describe how you would investigate whether light is needed for photosynthesis, using a starch test. Include the control in your answer.","mm":4,"ms":[{"p":"destarch the plant by keeping it in darkness for 24–48 hours","pts":1},{"p":"cover part of a leaf with light-tight material (e.g. black paper)","pts":1},{"p":"expose the plant to light for several hours, then remove the covering","pts":1},{"p":"test the leaf for starch: only the exposed (uncovered) part turns blue-black with iodine, showing light is needed","pts":1}],"e":"The uncovered part of the leaf acts as the control, and only the parts exposed to light produce starch."},{"id":"ch6rs1","q":"Explain how two named structures of a dicotyledonous leaf are adapted for photosynthesis.","mm":4,"ms":[{"p":"palisade mesophyll cells are packed with chloroplasts near the upper surface of the leaf to absorb maximum light","pts":2},{"p":"air spaces in the spongy mesophyll allow carbon dioxide to diffuse rapidly to the photosynthesising cells","pts":2}],"e":"Palisade cells absorb light and air spaces allow gas diffusion, both adaptations for photosynthesis."}],"adv_saq":[{"id":"ch6as0","q":"The rate of photosynthesis of a plant was measured at increasing light intensities. The temperature was kept constant at 20°C and carbon dioxide was supplied in plenty. The rate increased at first and then became constant. Explain this result.","mm":4,"ms":[{"p":"at low light intensities, light is the limiting factor, so increasing light intensity increases the rate","pts":2},{"p":"at high light intensities, light is no longer the limiting factor","pts":1},{"p":"another factor (e.g. temperature) becomes the limiting factor, so the rate stays constant","pts":1}],"e":"The rate rises while light is limiting and levels off when another factor becomes limiting."},{"id":"ch6as1","q":"A farmer grows tomatoes in a greenhouse in winter. Suggest two environmental factors the farmer could change to increase the rate of photosynthesis, and explain how each works.","mm":4,"ms":[{"p":"increase light intensity / provide artificial light, because light provides the energy for photosynthesis","pts":2},{"p":"increase the carbon dioxide concentration / add carbon dioxide, because carbon dioxide is a raw material of photosynthesis","pts":2}],"e":"More light and more carbon dioxide both increase the rate of photosynthesis until another factor becomes limiting."}]},"ch7":{"pre":[{"id":"ch7p0","tp":"Balanced diet","q":"What is meant by a balanced diet?","o":["A diet that contains only proteins and carbohydrates","A diet that contains only vitamins and mineral ions","A diet that contains all the necessary nutrients in the correct proportions","A diet that contains more fat than any other nutrient"],"a":2,"e":"A balanced diet supplies all the necessary nutrients (carbohydrates, fats, proteins, vitamins, mineral ions, fibre and water) in the correct proportions to maintain health."},{"id":"ch7p1","tp":"Carbohydrates","q":"Which food is a principal source of carbohydrates?","o":["Butter","Rice","Steak","Cheese"],"a":1,"e":"Carbohydrates are obtained mainly from plant foods such as rice, bread, pasta and potatoes. Butter and cheese are sources of fat, and steak is a source of protein."},{"id":"ch7p2","tp":"Proteins","q":"What is the main importance of proteins in the diet?","o":["Providing a quick source of energy","Insulating the body against heat loss","Helping blood to clot","Growth and repair of body cells"],"a":3,"e":"Proteins are needed for growth and repair of body cells. Carbohydrates and fats are the main energy sources, and insulating the body is a role of fats."},{"id":"ch7p3","tp":"Vitamin C","q":"Which food is a good source of vitamin C?","o":["Citrus fruits","Butter","White bread","Red meat"],"a":0,"e":"Vitamin C is found mainly in fresh fruits and vegetables, especially citrus fruits such as oranges and lemons."},{"id":"ch7p4","tp":"Scurvy","q":"A lack of which nutrient causes scurvy?","o":["Vitamin D","Vitamin C","Iron","Calcium"],"a":1,"e":"Scurvy is caused by a deficiency of vitamin C, producing symptoms such as bleeding gums and slow wound healing."},{"id":"ch7p5","tp":"Rickets","q":"A lack of which vitamin causes rickets?","o":["Vitamin C","Iron","Vitamin D","Calcium"],"a":2,"e":"Rickets is caused by a deficiency of vitamin D. Vitamin D helps the body absorb calcium, so without it bones become weak and deformed."},{"id":"ch7p6","tp":"Iron","q":"Why is iron needed in the diet?","o":["For making strong bones and teeth","For building cell membranes","For producing digestive enzymes","For making haemoglobin in red blood cells"],"a":3,"e":"Iron is a mineral ion needed to make haemoglobin, the oxygen-carrying pigment found in red blood cells."},{"id":"ch7p7","tp":"Calcium","q":"Why is calcium needed in the diet?","o":["For making bones and teeth strong","For making haemoglobin","For providing energy","For preventing scurvy"],"a":0,"e":"Calcium is a mineral ion needed for making bones and teeth strong."},{"id":"ch7p8","tp":"Fibre","q":"What is the importance of fibre (roughage) in the diet?","o":["It is a source of stored energy","It is needed for growth and repair","It adds bulk to food and helps prevent constipation","It carries oxygen around the body"],"a":2,"e":"Fibre cannot be digested, but it adds bulk to the food in the gut, helping the muscles push food along and preventing constipation."},{"id":"ch7p9","tp":"Gall bladder","q":"Where is bile stored?","o":["In the liver","In the gall bladder","In the stomach","In the pancreas"],"a":1,"e":"Bile is produced by the liver and stored in the gall bladder before being released into the small intestine."},{"id":"ch7p10","tp":"Small intestine","q":"Which two regions make up the small intestine?","o":["The colon and the rectum","The oesophagus and the stomach","The rectum and the anus","The duodenum and the ileum"],"a":3,"e":"The small intestine is made up of the duodenum and the ileum. The colon and rectum are parts of the large intestine."},{"id":"ch7p11","tp":"Amylase","q":"Which enzyme breaks down starch?","o":["Amylase","Lipase","Protease","Maltase"],"a":0,"e":"Amylase breaks down starch into simple reducing sugars such as maltose. Lipase breaks down fats and proteases break down proteins."},{"id":"ch7p12","tp":"Lipase","q":"What are the products when lipase breaks down fats and oils?","o":["Amino acids","Fatty acids and glycerol","Simple sugars","Starch"],"a":1,"e":"Lipase breaks down fats and oils into fatty acids and glycerol."},{"id":"ch7p13","tp":"Absorption","q":"In which region of the digestive system are most nutrients absorbed?","o":["The stomach","The colon","The oesophagus","The small intestine"],"a":3,"e":"The small intestine is the region where most nutrients are absorbed into the blood."}],"basic":[{"id":"ch7b0","tp":"Water","q":"Which statement correctly describes the importance of water in the diet?","o":["It is the main store of energy","It acts as a solvent and helps transport substances around the body","It makes bones and teeth strong","It helps to digest proteins"],"a":1,"e":"Water is important as a solvent and for transporting substances around the body. Carbohydrates and fats are the main energy stores, and calcium is needed for bones and teeth."},{"id":"ch7b1","tp":"Fats and oils","q":"Which food is a principal source of fats and oils?","o":["Rice","Orange juice","Baked beans","Butter"],"a":3,"e":"Butter is rich in fats and oils. Rice is a source of carbohydrate, orange juice contains vitamin C, and baked beans contain protein and fibre."},{"id":"ch7b2","tp":"Liver","q":"Which organ produces bile?","o":["The liver","The stomach","The pancreas","The gall bladder"],"a":0,"e":"Bile is produced by the liver. The gall bladder only stores bile, and the pancreas produces digestive enzymes rather than bile."},{"id":"ch7b3","tp":"Physical digestion","q":"Which statement describes physical digestion?","o":["Large insoluble molecules are broken down into small soluble molecules","Enzymes break down starch into sugars","Food is broken into smaller pieces without chemical change to the food molecules","Nutrients move from the intestines into the blood"],"a":2,"e":"Physical digestion breaks food into smaller pieces without chemical change. Breaking large insoluble molecules into small soluble ones is chemical digestion."},{"id":"ch7b4","tp":"Physical digestion","q":"Why is it important that physical digestion breaks food into smaller pieces?","o":["It releases more energy from the food","It kills harmful microorganisms in the food","It makes the food taste better","It increases the surface area of the food for the action of enzymes"],"a":3,"e":"Smaller pieces of food have a larger surface area, so enzymes can act on the food more quickly during chemical digestion."},{"id":"ch7b5","tp":"Teeth","q":"What is the function of the incisors?","o":["Tearing food","Cutting and biting food","Grinding and crushing food","Holding food in the mouth"],"a":1,"e":"Incisors are the flat, chisel-shaped front teeth used for cutting and biting food. Canines tear food, and premolars and molars grind food."},{"id":"ch7b6","tp":"Teeth","q":"Which teeth are used for grinding and crushing food?","o":["Premolars and molars","Incisors","Canines","Incisors and canines"],"a":0,"e":"Premolars and molars have broad ridged surfaces adapted for grinding and crushing food. Incisors cut food and canines tear food."},{"id":"ch7b7","tp":"Tooth structure","q":"Which substance covers the crown of a tooth and is the hardest substance in the body?","o":["Dentine","Cement","Enamel","Pulp"],"a":2,"e":"Enamel covers the crown of the tooth and is the hardest substance in the body. Dentine lies below the enamel, cement anchors the root, and pulp contains nerves and blood vessels."},{"id":"ch7b8","tp":"
