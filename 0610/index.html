 glucose","q":"Which statement about insulin is correct?","o":["Insulin is secreted by the adrenal glands","Insulin is secreted by the pancreas and decreases the blood glucose concentration","Insulin increases the blood glucose concentration","Insulin is secreted by the liver and stored in muscles"],"a":1,"e":"Insulin is secreted by the pancreas and decreases the blood glucose concentration."},{"id":"ch14p9","tp":"Adrenaline","q":"Which of these is an effect of adrenaline in a 'fight or flight' situation?","o":["decreased heart rate","decreased breathing rate","increased heart rate","decreased pupil diameter"],"a":2,"e":"Adrenaline increases heart rate, breathing rate and pupil diameter in 'fight or flight' situations."},{"id":"ch14p10","tp":"Homeostasis","q":"Homeostasis is the maintenance of...","o":["a constant internal environment","an increasing body temperature","a constant external environment","a high blood glucose concentration"],"a":0,"e":"Homeostasis is the maintenance of a constant internal environment."},{"id":"ch14p11","tp":"Hormones","q":"Glucagon is a hormone secreted by the...","o":["adrenal glands","pancreas","ovaries","testes"],"a":1,"e":"Glucagon is secreted by the pancreas."},{"id":"ch14p12","tp":"Gravitropism","q":"Gravitropism is a plant response in which parts of a plant...","o":["grow towards or away from the direction of light","flower in response to day length","grow towards or away from gravity","respond to touch"],"a":2,"e":"Gravitropism is a response in which parts of a plant grow towards or away from gravity."},{"id":"ch14p13","tp":"Nervous system","q":"Information is carried through the nervous system as...","o":["electrical impulses along neurones","chemicals in the blood","hormones secreted by glands","heat energy from muscles"],"a":0,"e":"Electrical impulses travel along neurones to carry information through the nervous system."}],"basic":[{"id":"ch14b0","tp":"Neurones","q":"What is the function of a motor neurone?","o":["carries impulses from the CNS to an effector","carries impulses from receptors to the CNS","carries impulses between neurones in the CNS","carries impulses from the eye to the brain"],"a":0,"e":"A motor neurone carries impulses from the CNS to an effector, such as a muscle or a gland."},{"id":"ch14b1","tp":"Nervous system","q":"The peripheral nervous system (PNS)...","o":["consists of the brain and spinal cord","consists of nerves outside the brain and spinal cord","consists only of the sense organs","consists of the muscles and glands"],"a":1,"e":"The PNS consists of the nerves outside of the brain and spinal cord."},{"id":"ch14b2","tp":"Reflex action","q":"Which statement describes a reflex action?","o":["slow and conscious","always involves the brain","voluntary and deliberate","automatic and rapid"],"a":3,"e":"A reflex action automatically and rapidly integrates and coordinates stimuli with the responses of effectors."},{"id":"ch14b3","tp":"Reflex arc","q":"Which of the following can act as an effector in a reflex arc?","o":["a muscle or a gland","a receptor or a neurone","a gland or a nerve","a neurone or a receptor"],"a":0,"e":"Effectors are muscles and glands, which carry out the response."},{"id":"ch14b4","tp":"Eye structure","q":"What is the function of the cornea?","o":["contains light receptors","refracts light","controls light entering the pupil","carries impulses to the brain"],"a":1,"e":"The cornea refracts light as it enters the eye."},{"id":"ch14b5","tp":"Eye structure","q":"What is the function of the optic nerve?","o":["carries impulses from the brain to the eye muscles","refracts light onto the retina","carries impulses to the brain","controls the diameter of the pupil"],"a":2,"e":"The optic nerve carries impulses from the retina to the brain."},{"id":"ch14b6","tp":"Hormones","q":"Testosterone is a hormone secreted by the...","o":["ovaries","adrenal glands","pancreas","testes"],"a":3,"e":"Testosterone is secreted by the testes."},{"id":"ch14b7","tp":"Hormones","q":"Oestrogen is a hormone secreted by the...","o":["ovaries","testes","pancreas","adrenal glands"],"a":0,"e":"Oestrogen is secreted by the ovaries."},{"id":"ch14b8","tp":"Nervous vs hormonal","q":"Which statement correctly compares nervous and hormonal control?","o":["hormonal control is faster than nervous control","they act at the same speed","nervous control has a longer-lasting effect","nervous control is faster than hormonal control"],"a":3,"e":"Nervous control is faster than hormonal control, but its effect lasts for a shorter time."},{"id":"ch14b9","tp":"Phototropism","q":"Phototropism is a plant response in which parts of a plant...","o":["grow towards or away from gravity","grow in response to touch","grow towards or away from the direction of light","grow in response to water"],"a":2,"e":"Phototropism is a response in which parts of a plant grow towards or away from the direction of the light source."},{"id":"ch14b10","tp":"Eye structure","q":"What is the function of the lens of the eye?","o":["it contains light receptors","it focuses light onto the retina","it controls the amount of light entering the eye","it carries impulses to the brain"],"a":1,"e":"The lens focuses light onto the retina."},{"id":"ch14b11","tp":"Adrenaline","q":"Which change is caused by adrenaline in a 'fight or flight' situation?","o":["decreased breathing rate","decreased heart rate","increased breathing rate","decreased pupil diameter"],"a":2,"e":"Adrenaline increases breathing rate, heart rate and pupil diameter in 'fight or flight' situations."}],"review":[{"id":"ch14r0","tp":"Neurones","q":"What is the function of a relay neurone?","o":["carries impulses from a receptor to the CNS","carries impulses from the CNS to a gland","carries impulses from the retina to the brain","carries impulses between neurones within the CNS"],"a":3,"e":"A relay neurone carries impulses between neurones within the CNS, connecting sensory and motor neurones."},{"id":"ch14r1","tp":"Pupil reflex","q":"In dim light, the pupil becomes wider. Which muscle changes cause this?","o":["circular muscles contract and radial muscles relax","both circular and radial muscles contract","radial muscles contract and circular muscles relax","both circular and radial muscles relax"],"a":2,"e":"In dim light the radial muscles contract and the circular muscles relax, which widens the pupil to let in more light."},{"id":"ch14r2","tp":"Accommodation","q":"When the eye focuses on a near object, which change occurs?","o":["ciliary muscles contract and the lens becomes more convex (fatter)","ciliary muscles relax and the lens becomes thinner","suspensory ligaments tighten and the lens becomes thinner","ciliary muscles contract and the suspensory ligaments tighten"],"a":0,"e":"For a near object the ciliary muscles contract, the suspensory ligaments slacken and the lens becomes more convex, refracting light more strongly."},{"id":"ch14r3","tp":"Rods and cones","q":"Rod cells in the retina are adapted for...","o":["night vision because of their greater sensitivity","colour vision in bright light","detecting three different colours","focusing light on the fovea"],"a":0,"e":"Rods have greater sensitivity, enabling vision in dim light (night vision)."},{"id":"ch14r4","tp":"Rods and cones","q":"Why are cone cells responsible for colour vision?","o":["they are all equally sensitive to all colours","they are found only at the blind spot","they are more sensitive in dim light than rods","there are three different kinds absorbing light of different colours"],"a":3,"e":"Three different kinds of cones absorb light of different colours, giving colour vision."},{"id":"ch14r5","tp":"Eye structure","q":"Which statement about the fovea is correct?","o":["it is the point where the optic nerve leaves the eye","it is the part of the retina with the greatest concentration of cones","it is the transparent front of the eye","it is the coloured part of the eye"],"a":1,"e":"The fovea is the part of the retina with the greatest concentration of cones, giving sharp (detailed) vision."},{"id":"ch14r6","tp":"Negative feedback","q":"What is meant by homeostatic control by negative feedback?","o":["a change in a condition is always made larger","the body responds only to external changes","a change in a condition is detected and reversed to return to the set point","the set point changes constantly"],"a":2,"e":"In negative feedback a deviation from the set point is detected and reversed, maintaining a constant internal environment."},{"id":"ch14r7","tp":"Blood glucose","q":"When the blood glucose concentration falls too low, glucagon...","o":["causes the liver to release glucose into the blood, raising blood glucose","causes the liver to take up glucose, lowering blood glucose","stimulates the pancreas to secrete insulin","increases glucose uptake by muscles"],"a":0,"e":"Glucagon causes the liver to release glucose into the blood, increasing the blood glucose concentration."},{"id":"ch14r8","tp":"Diabetes","q":"How is Type 1 diabetes mainly treated?","o":["eating a diet containing no carbohydrate","regular injections of insulin","taking glucagon tablets","drinking more water"],"a":1,"e":"Type 1 diabetes is mainly treated by regular injections of insulin, together with a controlled diet."},{"id":"ch14r9","tp":"Temperature regulation","q":"Which responses occur when the body becomes too cold?","o":["vasodilation, sweating and hairs lying flat","vasoconstriction, shivering and hairs standing up","vasodilation, shivering and reduced sweating","vasoconstriction, sweating and hairs standing up"],"a":1,"e":"When cold, vasoconstriction reduces heat loss, shivering generates heat and hairs standing up trap insulating air."},{"id":"ch14r10","tp":"Gravitropism","q":"A shoot grows upwards and a root grows downwards when a seedling is placed on its side. This shows...","o":["positive gravitropism in the shoot and negative gravitropism in the root","phototropism in both shoot and root","negative gravitropism in the shoot and positive gravitropism in the root","negative phototropism in the shoot"],"a":2,"e":"Shoots show negative gravitropism (grow away from gravity) while roots show positive gravitropism (grow towards gravity)."},{"id":"ch14r11","tp":"Auxin","q":"A shoot grows towards light because auxin...","o":["accumulates on the illuminated side and inhibits cell elongation","is destroyed by light on the shaded side","moves equally to both sides","accumulates on the shaded side and stimulates cell elongation"],"a":3,"e":"Auxin becomes unequally distributed, accumulating on the shaded side where it stimulates cell elongation, so the shoot bends towards the light."}],"adv":[{"id":"ch14a0","tp":"Synapse","q":"Which sequence correctly describes the events at a synapse?","o":["neurotransmitter binds to receptors → impulse stimulated in the next neurone → vesicles release neurotransmitter","neurotransmitter diffuses across the gap → receptor proteins bind → vesicles release neurotransmitter","vesicles release neurotransmitter → receptor proteins bind → neurotransmitter diffuses across the gap","impulse stimulates the release of neurotransmitter from vesicles → neurotransmitter diffuses across the gap → neurotransmitter binds with receptor proteins → impulse stimulated in the next neurone"],"a":3,"e":"The impulse first stimulates the release of neurotransmitter from vesicles; it diffuses across the gap and binds with receptor proteins, which stimulates an impulse in the next neurone."},{"id":"ch14a1","tp":"Synapse","q":"Synapses ensure that impulses travel in one direction only because...","o":["neurotransmitter is released only from the first neurone and receptor proteins are found only on the next neurone","neurotransmitter can diffuse in any direction","both neurones release neurotransmitter simultaneously","the synaptic gap is too wide for diffusion"],"a":0,"e":"Neurotransmitter is released only from the first neurone and receptor proteins are found only on the next neurone, so the impulse cannot pass backwards."},{"id":"ch14a2","tp":"Adrenaline","q":"Adrenaline raises the blood glucose concentration. How does this help the body in a 'fight or flight' situation?","o":["it reduces the amount of glucose available to muscles","it stores glucose in the liver","it provides more glucose for increased respiration in muscles","it decreases the breathing rate"],"a":2,"e":"Adrenaline increases blood glucose concentration, providing more glucose for increased respiration in muscles to supply energy."},{"id":"ch14a3","tp":"Accommodation","q":"When the eye focuses on a distant object, the...","o":["ciliary muscles contract and the lens becomes fatter","ciliary muscles relax, suspensory ligaments tighten and the lens becomes thinner","suspensory ligaments slacken and the lens becomes rounder","ciliary muscles contract and suspensory ligaments slacken"],"a":1,"e":"For a distant object the ciliary muscles relax, the suspensory ligaments tighten and the lens is pulled thinner, so it refracts light less."},{"id":"ch14a4","tp":"Eye structure","q":"The blind spot of the eye is the place where...","o":["the lens is thickest","the fovea is located","the iris meets the cornea","the optic nerve leaves the retina and there are no light receptors"],"a":3,"e":"The blind spot is where the optic nerve leaves the retina; it has no light receptors, so no image is detected there."},{"id":"ch14a5","tp":"Blood glucose","q":"Insulin and glucagon have opposite effects on blood glucose. Which statement is correct?","o":["insulin lowers and glucagon raises blood glucose concentration","both increase blood glucose concentration","both decrease blood glucose concentration","insulin raises and glucagon lowers blood glucose concentration"],"a":0,"e":"Insulin decreases blood glucose while glucagon increases it; together they keep the concentration near the set point."},{"id":"ch14a6","tp":"Blood glucose","q":"After a meal rich in carbohydrate, which sequence maintains blood glucose at the set point?","o":["blood glucose rises → glucagon secreted → liver releases glucose → blood glucose rises further","blood glucose falls → insulin secreted → liver releases glucose → blood glucose rises","blood glucose rises → insulin secreted → liver stores glucose as glycogen → blood glucose falls to set point","blood glucose rises → adrenaline secreted → liver stores glycogen"],"a":2,"e":"After a meal blood glucose rises; insulin is secreted and the liver stores glucose as glycogen, lowering blood glucose back to the set point."},{"id":"ch14a7","tp":"Temperature regulation","q":"Which combination of responses occurs when the body is too hot?","o":["vasoconstriction, shivering and hairs standing up","vasodilation, sweating and hairs lying flat","vasodilation, shivering and reduced sweating","vasoconstriction, reduced sweating and hairs lying flat"],"a":1,"e":"When hot, vasodilation increases heat loss from the skin, sweating cools the body as sweat evaporates and hair erector muscles relax so hairs lie flat."},{"id":"ch14a8","tp":"Phototropism","q":"In an experiment, cress seedlings are grown in a box with light entering from one side through a small slit. Which result would be expected?","o":["shoots grow towards the light and roots grow away from the light","shoots grow away from the light and roots grow towards the light","both shoots and roots grow towards the light","both shoots and roots grow away from the light"],"a":0,"e":"Shoots are positively phototropic (grow towards light) while roots grow away from light (negative phototropism)."},{"id":"ch14a9","tp":"Blood glucose","q":"A student measures blood glucose concentration (mmol/dm³) at 0, 30, 60, 90 and 120 minutes after eating. The values are 4.5, 7.0, 5.5, 4.8 and 4.6. Which conclusion is best supported by the data?","o":["blood glucose stayed constant","blood glucose fell steadily and then rose","insulin was not secreted","blood glucose rose then returned towards the starting value, showing homeostatic control"],"a":3,"e":"The values rise after the meal and then fall back towards the starting level, which is consistent with negative feedback returning blood glucose to the set point."},{"id":"ch14a10","tp":"Nervous vs hormonal","q":"Which row correctly compares nervous and hormonal control?","o":["nervous: fast, long-lasting; hormonal: slow, short-lasting","nervous: fast, short-lasting; hormonal: slow, long-lasting","nervous: slow, short-lasting; hormonal: fast, long-lasting","nervous: fast, long-lasting; hormonal: fast, short-lasting"],"a":1,"e":"Nervous control is fast and short-lasting; hormonal control is slower and longer-lasting."},{"id":"ch14a11","tp":"Reflex action","q":"Why is a reflex action much faster than a voluntary action?","o":["reflex actions involve longer pathways through the brain","reflex actions use hormones instead of nerve impulses","reflex actions do not involve conscious thought and the pathway is shorter (via the spinal cord)","voluntary actions are automatic and need no coordination"],"a":2,"e":"Reflex actions are faster because the impulse travels a short pathway through the spinal cord without conscious decision-making in the brain."}],"basic_saq":[{"id":"ch14bs0","tp":"Reflex action","q":"Reflex actions happen automatically when a stimulus is detected. Explain two advantages of reflex actions.","mm":3,"ms":[{"p":"they protect the body from harm / prevent injury","pts":1},{"p":"they are very fast / rapid","pts":1},{"p":"they are automatic and do not require conscious thought","pts":1}],"e":"Reflex actions are automatic, rapid responses that protect the body from harm without conscious thought."},{"id":"ch14bs1","tp":"Sense organs","q":"Sense organs contain receptor cells that respond to specific stimuli. For each stimulus, name the sense organ that responds to it: (a) light, (b) sound, (c) chemicals, (d) temperature or touch.","mm":4,"ms":[{"p":"light – eye","pts":1},{"p":"sound – ear","pts":1},{"p":"chemicals – nose or tongue","pts":1},{"p":"temperature or touch – skin","pts":1}],"e":"Receptor cells in sense organs respond to specific stimuli: light (eye), sound (ear), chemicals (nose/tongue) and temperature/touch (skin)."}],"review_saq":[{"id":"ch14rs0","tp":"Rods and cones","q":"Describe the distribution of rods and cones in the retina of a human, and state their functions.","mm":4,"ms":[{"p":"rods are more numerous than cones","pts":1},{"p":"rods are found mainly towards the edge (periphery) of the retina, while cones are concentrated at the fovea","pts":1},{"p":"rods have greater sensitivity, enabling vision in dim light (night vision)","pts":1},{"p":"three different kinds of cones absorb light of different colours, enabling colour vision","pts":1}],"e":"Rods are more numerous and found mostly at the periphery for night vision; cones are concentrated at the fovea and give colour vision."},{"id":"ch14rs1","tp":"Temperature regulation","q":"Describe the role of the brain in maintaining a constant internal body temperature.","mm":3,"ms":[{"p":"the brain (thermoregulatory centre) detects changes in the temperature of the blood","pts":1},{"p":"it coordinates responses that increase heat loss when the body is too hot, such as sweating and vasodilation","pts":1},{"p":"it coordinates responses that reduce heat loss or generate heat when the body is too cold, such as vasoconstriction and shivering","pts":1}],"e":"The brain detects blood temperature changes and coordinates heat-loss and heat-gain responses to keep body temperature constant."}],"adv_saq":[{"id":"ch14as0","tp":"Synapse","q":"Describe the events that occur at a synapse when an impulse arrives, and explain why impulses can travel in only one direction.","mm":4,"ms":[{"p":"the impulse stimulates vesicles to release neurotransmitter molecules into the synaptic gap","pts":1},{"p":"the neurotransmitter molecules diffuse across the synaptic gap","pts":1},{"p":"the neurotransmitter binds with receptor proteins on the next neurone, stimulating an impulse in it","pts":1},{"p":"neurotransmitter is released only from the first neurone and receptor proteins are only on the next neurone, so impulses travel in one direction only","pts":1}],"e":"The sequence of release, diffusion and binding transmits the impulse; the one-way arrangement of release sites and receptors ensures one-directional travel."},{"id":"ch14as1","tp":"Auxin","q":"A shoot is placed horizontally and later grows upwards. Explain, in terms of auxin, why this happens.","mm":4,"ms":[{"p":"auxin is produced at the shoot tip and diffuses through the plant","pts":1},{"p":"gravity causes auxin to become unequally distributed, with more auxin on the lower side","pts":1},{"p":"auxin stimulates cell elongation","pts":1},{"p":"the lower side grows faster, so the shoot bends (grows) upwards","pts":1}],"e":"Auxin, produced at the shoot tip, accumulates on the lower side of a horizontal shoot and stimulates elongation there, bending the shoot upward."}]},"ch15":{"pre":[{"id":"ch15p0","tp":"Drug definition","q":"What is a drug?","o":["A substance taken into the body that modifies or affects chemical reactions","A type of food that supplies energy","A mineral needed for healthy bones","A gas present in the air"],"a":0,"e":"A drug is any substance taken into the body that modifies or affects chemical reactions in the body. Food, minerals and gases are not drugs in this sense."},{"id":"ch15p1","tp":"Drug definition","q":"Which of these is an example of a drug?","o":["Water","Glucose","An antibiotic","A vitamin"],"a":2,"e":"An antibiotic is a drug because it is taken into the body and affects chemical reactions by killing bacteria. Water, glucose and vitamins are normal nutrients obtained from the diet, not drugs in this sense."},{"id":"ch15p2","tp":"Antibiotic use","q":"Antibiotics are used to treat which type of infection?","o":["Viral infections","Bacterial infections","Allergic reactions","Broken bones"],"a":1,"e":"Antibiotics are used to treat bacterial infections. They do not affect viruses and are not treatments for allergies or injuries."},{"id":"ch15p3","tp":"Antibiotics vs viruses","q":"Antibiotics kill bacteria but do not affect which of the following?","o":["Bacteria","Viruses","White blood cells","Red blood cells"],"a":1,"e":"Antibiotics kill bacteria but do not affect viruses, so they cannot be used to cure viral diseases."},{"id":"ch15p4","tp":"Bacterial resistance","q":"Some bacteria are resistant to an antibiotic. What does 'resistant' mean here?","o":["The antibiotic kills the bacteria more quickly","The bacteria change into viruses","The bacteria need more oxygen","The antibiotic does not kill the bacteria"],"a":3,"e":"Resistant bacteria are not killed by the antibiotic, so the antibiotic becomes less effective at treating the infection."},{"id":"ch15p5","tp":"Bacterial resistance","q":"MRSA is a type of bacterium that is best described as...","o":["Resistant to antibiotics","A useful source of antibiotics","A type of virus","Harmless to humans"],"a":0,"e":"MRSA is a bacterium that is resistant to antibiotics, so infections caused by it are difficult to treat."},{"id":"ch15p6","tp":"Antibiotic use","q":"What do antibiotics do to bacteria?","o":["Kill them","Make them grow faster","Turn them into viruses","Help them reproduce"],"a":0,"e":"Antibiotics kill bacteria, which is how they treat bacterial infections."},{"id":"ch15p7","tp":"Antibiotics vs viruses","q":"A doctor does not give antibiotics to a patient with influenza (flu). Why not?","o":["Flu is caused by bacteria, so antibiotics cannot help","Flu is caused by a virus, which antibiotics do not affect","Antibiotics only work on viruses","Antibiotics increase the number of flu viruses"],"a":1,"e":"Flu is caused by a virus. Antibiotics kill bacteria but do not affect viruses, so they would not cure flu."},{"id":"ch15p8","tp":"Drug definition","q":"According to the definition, a drug affects which of the following in the body?","o":["Chemical reactions","The shape of the skeleton","Fingerprints","Hair colour"],"a":0,"e":"A drug is any substance taken into the body that modifies or affects chemical reactions in the body."},{"id":"ch15p9","tp":"Antibiotic use","q":"In which situation should antibiotics be given to a patient?","o":["When the patient has a viral infection","When the patient has a bacterial infection","Whenever the patient has a headache","After any physical injury"],"a":2,"e":"Antibiotics are used to treat bacterial infections. They do not work on viral infections, headaches or injuries."},{"id":"ch15p10","tp":"Bacterial resistance","q":"What is the effect of antibiotic-resistant bacteria on the treatment of infections?","o":["Treatment becomes easier","Treatment becomes less effective","Treatment becomes unnecessary","Treatment works faster"],"a":1,"e":"When bacteria are resistant to an antibiotic, the antibiotic is less effective, so the infection is harder to treat."},{"id":"ch15p11","tp":"Resistance control","q":"Why should antibiotics not be used to treat infections when they are not needed?","o":["Because antibiotics are only used in hospitals","Because antibiotics never work","Because antibiotics are not drugs","Because unnecessary use can help resistant bacteria to develop"],"a":3,"e":"Using antibiotics when they are not needed allows resistant bacteria to survive and spread, reducing the effectiveness of antibiotics."},{"id":"ch15p12","tp":"Antibiotic use","q":"When a doctor prescribes a course of antibiotics, the patient should...","o":["Stop as soon as they feel better","Share them with family","Take the full course as instructed","Save some for later"],"a":2,"e":"Taking the full course as instructed helps kill all the bacteria and reduces the chance that resistant bacteria survive."},{"id":"ch15p13","tp":"Drug definition","q":"Which of the following is NOT considered a drug?","o":["Aspirin","Alcohol","An antibiotic","Water"],"a":3,"e":"A drug is a substance taken into the body that modifies or affects chemical reactions. Water is a normal body substance needed for life, whereas aspirin, alcohol and antibiotics are drugs."}],"basic":[{"id":"ch15b0","tp":"Drug definition","q":"Which statement about drugs is correct?","o":["All drugs are harmful to the body","A drug is any substance taken into the body that modifies or affects chemical reactions","Drugs are only found in medicines","A drug is a nutrient needed for growth"],"a":1,"e":"A drug is any substance taken into the body that modifies or affects chemical reactions in the body. Not all drugs are harmful, and drugs are not limited to medicines."},{"id":"ch15b1","tp":"Antibiotic use","q":"A patient has a bacterial infection. What will a course of antibiotics do?","o":["Kill the bacteria causing the infection","Kill the viruses in the body","Make the bacteria resistant","Prevent every future infection"],"a":0,"e":"Antibiotics kill bacteria, which is how they treat the bacterial infection. They do not affect viruses."},{"id":"ch15b2","tp":"Antibiotics vs viruses","q":"Antibiotics do not cure the common cold because...","o":["The cold is caused by resistant bacteria","Antibiotics only work in hospital","The cold is caused by a virus, which antibiotics do not affect","Antibiotics are not drugs"],"a":2,"e":"The common cold is caused by a virus. Antibiotics kill bacteria but do not affect viruses, so they cannot cure a cold."},{"id":"ch15b3","tp":"Bacterial resistance","q":"A type of bacterium is resistant to a particular antibiotic. What does this mean for that antibiotic?","o":["It becomes more effective against the bacteria","It cannot kill the resistant bacteria","It starts to kill viruses instead","It is changed into a vaccine"],"a":1,"e":"Resistant bacteria are not killed by the antibiotic, so the antibiotic is ineffective against them."},{"id":"ch15b4","tp":"Antibiotic use","q":"Which statement about antibiotics is false?","o":["They are used to treat bacterial infections","They kill bacteria","They do not affect viruses","They are used to treat viral infections"],"a":3,"e":"Antibiotics are used to treat bacterial infections and do not affect viruses, so saying they are used to treat viral infections is false."},{"id":"ch15b5","tp":"Resistance control","q":"Which of these is an example of incorrect use of antibiotics?","o":["Taking the full course prescribed by a doctor","Using antibiotics only when needed","Using antibiotics for a viral infection","Using antibiotics for a bacterial infection"],"a":2,"e":"Antibiotics do not affect viruses, so using them for a viral infection is incorrect and can encourage resistant bacteria."},{"id":"ch15b6","tp":"Drug definition","q":"A medicine that lowers a high body temperature is a drug because it...","o":["affects chemical reactions in the body","is taken out of the body","is made by white blood cells","is found in all foods"],"a":0,"e":"A drug is any substance taken into the body that modifies or affects chemical reactions. The medicine affects chemical reactions, so it is a drug."},{"id":"ch15b7","tp":"Antibiotics vs viruses","q":"Which of these illnesses would NOT be treated with antibiotics?","o":["A bacterial wound infection","A common cold","A bacterial pneumonia","A bacterial throat infection"],"a":1,"e":"The common cold is caused by a virus, and antibiotics do not affect viruses. The other options are bacterial infections that antibiotics can treat."},{"id":"ch15b8","tp":"Bacterial resistance","q":"A patient with a bacterial infection finishes a course of antibiotics but does not get better. Which is a possible explanation?","o":["The bacteria are resistant to the antibiotic","The antibiotic has turned into a vaccine","The infection was caused by the antibiotic","The bacteria changed into viruses"],"a":0,"e":"Some bacteria may be resistant to the antibiotic, so it does not kill them and the infection continues."},{"id":"ch15b9","tp":"Bacterial resistance","q":"When a person takes antibiotics, what happens to any bacteria that are resistant to the antibiotic?","o":["They are killed together with the other bacteria","They are changed into viruses","They are removed by antibiotics","They survive and can reproduce"],"a":3,"e":"Resistant bacteria survive when the antibiotic kills the non-resistant bacteria, and they can reproduce, increasing the resistant population."},{"id":"ch15b10","tp":"Resistance control","q":"Why should antibiotics be used only when they are essential?","o":["To make infections last longer","To increase the number of bacteria","To limit the development of resistant bacteria","To help viruses spread"],"a":2,"e":"Using antibiotics only when essential limits the development of resistant bacteria such as MRSA, keeping antibiotics effective."},{"id":"ch15b11","tp":"Resistance control","q":"A person takes leftover antibiotics without seeing a doctor for an illness that is caused by a virus. Why is this a problem?","o":["The antibiotics will cure the viral illness","The antibiotics may kill useful bacteria only","The antibiotics will make the virus grow faster","The antibiotics will not affect the virus and may promote resistant bacteria"],"a":3,"e":"Antibiotics do not affect viruses, so they will not cure a viral illness, and unnecessary use can promote the development of resistant bacteria."}],"review":[{"id":"ch15r0","tp":"Antibiotics vs viruses","q":"A patient with a cold asks for antibiotics, but the doctor does not prescribe them. What is the best reason?","o":["Antibiotics do not affect viruses, so they would not help a cold","Antibiotics would make the cold last longer","Antibiotics only work on fungal infections","Antibiotics cannot be taken by adults"],"a":0,"e":"The common cold is caused by a virus, and antibiotics kill bacteria but do not affect viruses, so they would not help."},{"id":"ch15r1","tp":"Bacterial resistance","q":"Why can the repeated use of antibiotics lead to the development of resistant bacteria?","o":["Antibiotics turn bacteria into viruses","Antibiotics kill all bacteria completely, leaving none","Antibiotics kill non-resistant bacteria, leaving resistant bacteria to survive and reproduce","Antibiotics make bacteria larger and stronger"],"a":2,"e":"When antibiotics kill the non-resistant bacteria, any resistant bacteria survive and reproduce, so the resistant population increases."},{"id":"ch15r2","tp":"Resistance control","q":"A patient stops taking antibiotics as soon as the symptoms disappear. What is the most likely consequence?","o":["The infection is cured completely with no risk","All bacteria are killed instantly","The bacteria are changed into viruses","Some bacteria, including resistant ones, may survive and the infection may return"],"a":3,"e":"Stopping early means not all bacteria are killed; any resistant survivors can reproduce, so the infection may return and be harder to treat."},{"id":"ch15r3","tp":"Bacterial resistance","q":"In a population of bacteria, a few bacteria are naturally resistant to an antibiotic. When that antibiotic is used repeatedly, what happens to the resistant bacteria?","o":["They are removed by the antibiotic","They survive and increase in number compared with non-resistant bacteria","They quickly lose their resistance","They turn into white blood cells"],"a":1,"e":"The antibiotic kills non-resistant bacteria, so the resistant ones survive and reproduce, becoming more common."},{"id":"ch15r4","tp":"Resistance control","q":"Which statement best explains why using antibiotics only when essential limits the development of resistant bacteria such as MRSA?","o":["Antibiotics are more effective when they are used rarely","Resistant bacteria need antibiotics in order to survive","Using antibiotics rarely makes bacteria stronger","Fewer antibiotics used means fewer opportunities for resistant bacteria to survive and spread"],"a":3,"e":"Every time antibiotics are used, resistant bacteria get a chance to survive and spread. Using them only when essential reduces these opportunities."},{"id":"ch15r5","tp":"Antibiotics vs viruses","q":"A patient with influenza insists on having antibiotics. Why should the doctor refuse?","o":["Flu is caused by bacteria that antibiotics cannot reach","Antibiotics do not affect viruses such as the flu virus","Antibiotics would change the flu virus into a bacterium","Antibiotics only treat infections of the skin"],"a":1,"e":"Influenza is caused by a virus. Antibiotics kill bacteria but do not affect viruses, so they would not cure the flu."},{"id":"ch15r6","tp":"Bacterial resistance","q":"Why is an MRSA infection more dangerous than an infection by bacteria that are not resistant?","o":["Resistant bacteria are easier to kill","MRSA is a virus that cannot be treated","The usual antibiotics do not kill MRSA, so it is difficult to treat","MRSA produces antibiotics that harm the patient"],"a":2,"e":"MRSA is resistant to antibiotics, so the usual antibiotics do not kill it, making the infection difficult to treat."},{"id":"ch15r7","tp":"Bacterial resistance","q":"Two patients have the same bacterial infection and both are treated with the same antibiotic. One recovers, the other does not. Which statement explains this difference?","o":["The bacteria in the second patient are resistant to the antibiotic","The second patient's infection is caused by the antibiotic","The antibiotic only works on viruses","The second patient has no infection"],"a":0,"e":"Some bacteria are resistant to the antibiotic, so they are not killed and the infection continues in the second patient."},{"id":"ch15r8","tp":"Antibiotics vs viruses","q":"Measles is caused by a virus. Why are antibiotics not an effective treatment for measles?","o":["Antibiotics kill bacteria but do not affect viruses","Measles is caused by bacteria that are resistant to antibiotics","Antibiotics only work on fungal infections","Antibiotics make viruses reproduce faster"],"a":2,"e":"Measles is a viral disease, and antibiotics kill bacteria but do not affect viruses, so antibiotics cannot cure it."},{"id":"ch15r9","tp":"Bacterial resistance","q":"A scientist tests an antibiotic against a species of bacterium and finds that only 30% of the bacteria are killed. Which statement is correct?","o":["Most of these bacteria are resistant to the antibiotic","The antibiotic has turned the bacteria into viruses","The bacteria have become white blood cells","The antibiotic is working perfectly"],"a":0,"e":"If only 30% are killed, 70% survive, meaning most of the bacteria are resistant to the antibiotic."},{"id":"ch15r10","tp":"Resistance control","q":"Why should antibiotics be taken only when prescribed by a doctor?","o":["To ensure they are used only for bacterial infections when needed, which limits resistance","Because antibiotics are poisonous in any dose","Because only doctors may purchase medicines","Because antibiotics must be stored in a refrigerator"],"a":1,"e":"A doctor prescribes antibiotics only for bacterial infections when essential, which helps limit the development of resistant bacteria."},{"id":"ch15r11","tp":"Bacterial resistance","q":"In a hospital, a strain of bacteria is found to be resistant to the most commonly used antibiotic. What is the consequence for patients infected with this strain?","o":["They no longer need any treatment","The infection is certain to cause death","They are infected by a virus","A different antibiotic that still kills the bacteria is needed"],"a":3,"e":"Because the common antibiotic cannot kill the resistant bacteria, doctors must use a different antibiotic that is still effective."}],"adv":[{"id":"ch15a0","tp":"Bacterial resistance","q":"Which sequence correctly shows how a resistant strain of bacteria becomes common after an antibiotic is used?","o":["Antibiotic kills non-resistant bacteria → resistant bacteria survive → resistant bacteria reproduce and increase in number","Antibiotic kills resistant bacteria → non-resistant bacteria survive → all bacteria turn into viruses","Antibiotic makes bacteria resistant → resistant bacteria die → the infection clears","Resistant bacteria are killed → viruses replace them → new bacteria form"],"a":0,"e":"The antibiotic removes the non-resistant bacteria, so the resistant bacteria are left to survive and reproduce, making the resistant strain more common."},{"id":"ch15a1","tp":"Bacterial resistance","q":"Over 20 years of heavy antibiotic use, the percentage of bacteria resistant to the antibiotic rose from 5% to 60%. What does this suggest?","o":["The antibiotic became more effective with time","The resistant bacteria had an advantage when the antibiotic was used, so their numbers increased","The bacteria changed from bacteria into viruses","Antibiotic resistance has no effect on treatment"],"a":2,"e":"When the antibiotic was used, non-resistant bacteria were killed while resistant bacteria survived and reproduced, so the resistant percentage increased."},{"id":"ch15a2","tp":"Resistance control","q":"A patient with a bacterial infection feels better after three days but has a seven-day course of antibiotics. Why should the patient finish the whole course?","o":["To make sure all the bacteria are killed, reducing the chance that resistant bacteria survive","Because antibiotics only work on the last day","Because stopping early turns the bacteria into viruses","Because the antibiotic becomes poisonous if stopped"],"a":1,"e":"Finishing the course kills as many bacteria as possible, so any resistant bacteria are less likely to survive and reproduce."},{"id":"ch15a3","tp":"Bacterial resistance","q":"Which statement about the development of antibiotic resistance is correct?","o":["The antibiotic creates resistance in all the bacteria it touches","Resistance only develops in viruses","The antibiotic turns non-resistant bacteria into resistant ones by changing their DNA","Resistant bacteria are already present; the antibiotic gives them an advantage by killing non-resistant bacteria"],"a":3,"e":"Some bacteria are naturally resistant before the antibiotic is used. The antibiotic kills the non-resistant bacteria, allowing the resistant ones to survive and increase."},{"id":"ch15a4","tp":"Resistance control","q":"How does the unnecessary use of antibiotics (for example for viral infections) encourage the development of resistant bacteria?","o":["It kills non-resistant bacteria while resistant bacteria survive and reproduce","It makes viruses produce antibiotics","It stops resistant bacteria from reproducing","It converts white blood cells into resistant bacteria"],"a":0,"e":"Unnecessary antibiotic use kills non-resistant bacteria, allowing any resistant bacteria to survive and reproduce, so resistance spreads."},{"id":"ch15a5","tp":"Resistance control","q":"A hospital changes its policy so that antibiotics are prescribed only after a bacterial infection is confirmed. How does this policy help control MRSA?","o":["It stops antibiotics being used for viral infections, so resistant bacteria are selected less often","It makes MRSA grow faster","It turns MRSA into a virus","It makes all antibiotics stronger"],"a":2,"e":"Confirming a bacterial infection avoids unnecessary antibiotics; this reduces the selection of resistant bacteria such as MRSA."},{"id":"ch15a6","tp":"Bacterial resistance","q":"A patient does not complete a course of antibiotics for a bacterial infection. Some bacteria survive. What is most likely true about these surviving bacteria?","o":["They are all viruses","They have all become white blood cells","They are killed instantly once the antibiotic is stopped","They are more likely to include bacteria that are resistant to the antibiotic"],"a":3,"e":"The bacteria that survive are those the antibiotic did not kill, so they are more likely to be resistant; they can reproduce and cause a harder-to-treat infection."},{"id":"ch15a7","tp":"Bacterial resistance","q":"Before an antibiotic is ever used against a certain bacterium, a few bacteria may already be resistant to it. Which statement is correct?","o":["These resistant bacteria are created by the first dose of antibiotic","These resistant bacteria are present naturally and can survive when the antibiotic is used","These resistant bacteria only appear after the antibiotic is stopped","These resistant bacteria are viruses"],"a":1,"e":"Resistance can exist naturally in some bacteria before exposure; the antibiotic then allows these resistant bacteria to survive and multiply."},{"id":"ch15a8","tp":"Bacterial resistance","q":"Antibiotic X has been used very widely for many years, while antibiotic Y has been used only rarely. Which prediction is most reasonable?","o":["Resistance to antibiotic Y is more common than resistance to X","Both antibiotics are equally affected by resistance","Resistance to antibiotic X is more common than resistance to Y","Neither antibiotic can ever become ineffective"],"a":2,"e":"Because antibiotic X has been used much more, resistant bacteria have had more opportunities to survive and spread, so resistance to X is more common."},{"id":"ch15a9","tp":"Resistance control","q":"Why should a person never share leftover antibiotics with a friend who has a cough?","o":["The friend's cough may be caused by a virus, and unnecessary antibiotics encourage resistant bacteria","Antibiotics are only effective when shared","Leftover antibiotics always cure coughs","The friend's cough is always caused by bacteria"],"a":0,"e":"A cough may be viral, and antibiotics do not affect viruses. Using antibiotics unnecessarily promotes the development of resistant bacteria."},{"id":"ch15a10","tp":"Bacterial resistance","q":"A patient with a bacterial infection is given antibiotic Z, but the infection does not clear. A sample shows the bacteria are resistant to Z. What is the most likely effect of giving more of the same antibiotic Z?","o":["It will kill the resistant bacteria","It will still not kill the resistant bacteria, so the infection continues","It will turn the bacteria into viruses","It will make the infection viral"],"a":1,"e":"Resistant bacteria are not killed by antibiotic Z, so giving more of the same antibiotic will not cure the infection."},{"id":"ch15a11","tp":"Bacterial resistance","q":"A hospital reports that 40% of a bacterial species is now resistant to the standard antibiotic. What is the most direct effect of this resistance?","o":["The bacteria stop causing infections","The standard antibiotic starts to affect viruses","Patients become resistant to the antibiotic","Standard antibiotic treatment becomes less effective for infections caused by these bacteria"],"a":3,"e":"When many bacteria are resistant, the standard antibiotic kills fewer of them, so treatment of these infections becomes less effective."}],"basic_saq":[{"id":"ch15bs0","q":"State what is meant by the term 'drug' and give one example of a drug.","mm":2,"ms":[{"p":"a substance taken into the body that modifies or affects chemical reactions in the body","pts":1},{"p":"a valid example of a drug, e.g. an antibiotic, a painkiller, alcohol","pts":1}],"e":"The definition comes from Core point 1; any medicine or substance that affects chemical reactions in the body is a drug."},{"id":"ch15bs1","q":"State what antibiotics are used to treat, and name the type of pathogen that antibiotics do not affect.","mm":2,"ms":[{"p":"bacterial infections","pts":1},{"p":"viruses / antibiotics do not affect viruses","pts":1}],"e":"Antibiotics kill bacteria but do not affect viruses (Core points 2 and 4)."}],"review_saq":[{"id":"ch15rs0","q":"A patient with a viral infection asks for antibiotics. Explain why the doctor does not prescribe them.","mm":2,"ms":[{"p":"antibiotics kill bacteria but do not affect viruses","pts":1},{"p":"so the antibiotics would not cure/help the viral infection","pts":1}],"e":"Antibiotics target bacteria only; they would not help a viral infection."},{"id":"ch15rs1","q":"A patient stops taking antibiotics for a bacterial infection as soon as symptoms improve. Explain why this can lead to the development of antibiotic-resistant bacteria.","mm":3,"ms":[{"p":"not all the bacteria are killed","pts":1},{"p":"any bacteria that survive are more likely to be resistant","pts":1},{"p":"the surviving resistant bacteria reproduce, so a resistant population develops / the infection may return and be harder to treat","pts":1}],"e":"Incomplete treatment leaves resistant survivors, which reproduce and increase the resistant population."}],"adv_saq":[{"id":"ch15as0","q":"Explain how using antibiotics only when essential can limit the development of resistant bacteria such as MRSA.","mm":4,"ms":[{"p":"some bacteria are naturally resistant to antibiotics","pts":1},{"p":"when antibiotics are used, they kill non-resistant bacteria but resistant bacteria survive","pts":1},{"p":"the surviving resistant bacteria reproduce, increasing the resistant population","pts":1},{"p":"using antibiotics only when essential reduces the opportunities for resistant bacteria to be selected and spread","pts":1}],"e":"This is Supplement point 5; using fewer antibiotics gives resistant bacteria fewer chances to survive and spread."},{"id":"ch15as1","q":"In a hospital, some patients with viral infections demand antibiotics. Explain why giving them antibiotics would be harmful to the whole community.","mm":3,"ms":[{"p":"antibiotics do not affect viruses, so the patient's viral infection would not be treated","pts":1},{"p":"antibiotics kill non-resistant bacteria in the patient, leaving any resistant bacteria to survive","pts":1},{"p":"the resistant bacteria can reproduce and spread to other people, reducing the effectiveness of antibiotics in the community","pts":1}],"e":"Unnecessary antibiotic use for viral infections promotes resistant bacteria that can then spread in the community."}]},"ch16":{"pre":[{"id":"ch16p0","tp":"Asexual reproduction","q":"Which statement correctly describes asexual reproduction?","o":["Production of genetically identical offspring from one parent","Production of genetically different offspring from two parents","The fusion of the nuclei of two gametes to form a zygote","The transfer of pollen grains from an anther to a stigma"],"a":0,"e":"Asexual reproduction produces genetically identical offspring from a single parent. The other options describe sexual reproduction, fertilisation and pollination."},{"id":"ch16p1","tp":"Pollination","q":"What is pollination?","o":["The fusion of a pollen nucleus with a nucleus in an ovule","The transfer of pollen grains from an anther to a stigma","The growth of a pollen tube down the style","The release of an egg from an ovary"],"a":1,"e":"Pollination is the transfer of pollen grains from an anther to a stigma. The fusion of gamete nuclei is fertilisation."},{"id":"ch16p2","tp":"Fertilisation","q":"In humans, where does fertilisation normally take place?","o":["In the uterus","In the vagina","In an oviduct","In the ovary"],"a":2,"e":"Fertilisation occurs in an oviduct, where the sperm meets the egg. The uterus is where the embryo implants and develops."},{"id":"ch16p3","tp":"Gametes","q":"Which cell is the female gamete in humans?","o":["Sperm cell","Zygote","Embryo","Egg cell"],"a":3,"e":"The egg cell (ovum) is the female gamete. The sperm cell is the male gamete, while the zygote and embryo are formed after fertilisation."},{"id":"ch16p4","tp":"Male reproductive system","q":"In which organ are sperm cells produced in males?","o":["Testes","Prostate gland","Urethra","Scrotum"],"a":0,"e":"Sperm are produced in the testes. The prostate gland adds fluid to the sperm, the urethra carries sperm out of the body, and the scrotum holds the testes."},{"id":"ch16p5","tp":"Haploid/diploid","q":"Which word describes the nucleus of a gamete?","o":["Diploid","Haploid","Asexual","Identical to the nucleus of a zygote"],"a":1,"e":"Gamete nuclei are haploid, containing half the chromosome number. The zygote nucleus is diploid, formed by the fusion of two haploid gamete nuclei."},{"id":"ch16p6","tp":"Pregnancy","q":"What is the function of the amniotic fluid?","o":["To supply nutrients to the fetus","To remove waste products from the fetus","To protect the fetus from damage","To produce hormones during pregnancy"],"a":2,"e":"Amniotic fluid in the amniotic sac protects the fetus from physical damage. The exchange of nutrients and waste occurs through the placenta."},{"id":"ch16p7","tp":"Sex hormones","q":"Which hormone is responsible for the development of male secondary sexual characteristics during puberty?","o":["Oestrogen","Progesterone","FSH","Testosterone"],"a":3,"e":"Testosterone, produced by the testes, controls the development of male secondary sexual characteristics. Oestrogen controls female secondary sexual characteristics."},{"id":"ch16p8","tp":"STI","q":"What is a sexually transmitted infection (STI)?","o":["An infection that is transmitted through sexual contact","An infection transmitted through the air","An infection inherited from parents","An infection caused by contaminated food"],"a":0,"e":"An STI is an infection transmitted through sexual contact. HIV is a pathogen that causes one type of STI."},{"id":"ch16p9","tp":"Flower structure","q":"What is the function of the anther in a flower?","o":["To receive pollen grains","To produce pollen grains","To attract insects","To contain the ovules"],"a":1,"e":"The anther produces pollen grains, which contain the male gametes. The stigma receives pollen, and the ovary contains the ovules."},{"id":"ch16p10","tp":"Pollination","q":"Which features are typical of the anthers and stigmas of a wind-pollinated flower?","o":["Anthers and stigmas enclosed inside the flower","Small, sticky stigmas and large anthers","Brightly coloured anthers and scented stigmas","Anthers and stigmas hanging outside the flower, with large feathery stigmas"],"a":3,"e":"Wind-pollinated flowers have anthers and stigmas that hang outside the flower, and the stigmas are large and feathery to catch pollen carried by the wind."},{"id":"ch16p11","tp":"Flower structure","q":"Which part of a flower contains the ovules?","o":["Anther","Stigma","Ovary","Petal"],"a":2,"e":"The ovary contains the ovules, which hold the female gametes. The anther produces pollen and the stigma receives pollen."},{"id":"ch16p12","tp":"Male reproductive system","q":"Which structure carries sperm from the testes towards the penis?","o":["Sperm duct","Urethra","Prostate gland","Scrotum"],"a":0,"e":"The sperm ducts carry sperm from the testes to the urethra. The urethra then carries sperm out through the penis."},{"id":"ch16p13","tp":"HIV","q":"HIV infection may eventually lead to which condition?","o":["Diabetes","AIDS","Asthma","Infertility"],"a":1,"e":"HIV is a pathogen that causes an STI, and HIV infection may lead to AIDS."}],"basic":[{"id":"ch16b0","tp":"Asexual reproduction","q":"Which process is an example of asexual reproduction?","o":["A strawberry plant producing new plants from runners","A flower being pollinated by an insect","An egg cell being fertilised by a sperm","A seed germinating in the soil"],"a":0,"e":"New plants produced from runners come from one parent and are genetically identical, so this is asexual reproduction. The other options involve sexual reproduction or growth."},{"id":"ch16b1","tp":"Flower structure","q":"Which part of a flower receives pollen grains during pollination?","o":["Anther","Stigma","Filament","Sepal"],"a":1,"e":"Pollen is transferred from an anther to a stigma during pollination. The filament supports the anther, and sepals protect the flower in bud."},{"id":"ch16b2","tp":"Flower structure","q":"What is the function of the ovules in a flower?","o":["To produce pollen grains","To attract pollinators","To receive pollen grains","To contain the female gametes"],"a":3,"e":"The ovules are found in the ovary and contain the female gametes (egg cells). After fertilisation, ovules develop into seeds."},{"id":"ch16b3","tp":"Pollination","q":"Which features are typical of an insect-pollinated flower?","o":["Small petals and no nectar","Large feathery stigmas hanging outside the flower","Brightly coloured petals and nectar","Anthers hanging outside the flower"],"a":2,"e":"Insect-pollinated flowers have brightly coloured petals and produce nectar to attract insects. Feathery hanging stigmas and small petals are features of wind-pollinated flowers."},{"id":"ch16b4","tp":"Fertilisation","q":"Which event describes fertilisation in flowering plants?","o":["A pollen grain lands on a stigma","A pollen nucleus fuses with a nucleus in an ovule","An ovule grows into a fruit","The anther releases pollen grains"],"a":1,"e":"Fertilisation is the fusion of the pollen nucleus with a nucleus in an ovule. The transfer of pollen to a stigma is pollination."},{"id":"ch16b5","tp":"Female reproductive system","q":"Which structure is part of the female reproductive system?","o":["Testis","Sperm duct","Cervix","Prostate gland"],"a":2,"e":"The cervix is the neck of the uterus and is part of the female reproductive system. The testis, sperm duct and prostate gland are male structures."},{"id":"ch16b6","tp":"Pregnancy","q":"What is the function of the placenta?","o":["To produce eggs","To carry urine from the fetus","To store the fetus during development","To exchange dissolved nutrients, gases and excretory products between the blood of the mother and the blood of the fetus"],"a":3,"e":"The placenta is the organ of exchange between the blood of the mother and the blood of the fetus. Nutrients and oxygen pass to the fetus, while carbon dioxide and excretory products pass to the mother."},{"id":"ch16b7","tp":"Male reproductive system","q":"What is the function of the scrotum?","o":["To add fluid to the sperm","To hold the testes at a suitable temperature for sperm production","To produce sperm","To carry sperm out of the body"],"a":1,"e":"The scrotum holds the testes outside the body at a temperature slightly lower than body temperature, which is suitable for sperm production."},{"id":"ch16b8","tp":"Pollination","q":"In self-pollination, where are pollen grains transferred from the anther of a flower?","o":["The stigma of a flower on a different plant of the same species","The stigma of a flower of a different species","The stigma of the same flower or a different flower on the same plant","The anther of the same flower"],"a":2,"e":"Self-pollination transfers pollen to the stigma of the same flower or another flower on the same plant. Transfer to a flower on a different plant of the same species is cross-pollination."},{"id":"ch16b9","tp":"Seed germination","q":"Which set of environmental conditions is required for seeds to germinate?","o":["Water, oxygen and a suitable temperature","Light, carbon dioxide and soil","Water, sunlight and fertile soil","Oxygen, nitrogen and darkness"],"a":0,"e":"Germination requires water, oxygen and a suitable temperature. Light and soil are not essential for germination."},{"id":"ch16b10","tp":"Pregnancy","q":"What does the zygote develop into after fertilisation?","o":["A pollen tube","An ovule","A placenta","An embryo, which is a ball of cells that implants into the lining of the uterus"],"a":3,"e":"In early development, the zygote forms an embryo, a ball of cells that implants into the lining of the uterus. The placenta develops later."},{"id":"ch16b11","tp":"STI","q":"Which action helps to control the spread of sexually transmitted infections?","o":["Washing hands before eating","Taking antibiotics before sexual contact","Avoiding exposure to sunlight","Using condoms during sexual intercourse"],"a":3,"e":"Using condoms during sexual intercourse reduces the spread of STIs such as HIV. The other actions do not prevent transmission through sexual contact."}],"review":[{"id":"ch16r0","tp":"Pollination","q":"How do the pollen grains of a wind-pollinated flower differ from those of an insect-pollinated flower?","o":["They are larger, heavier and sticky","They are smaller, lighter and produced in larger numbers","They are brightly coloured and scented","They are produced in smaller numbers and coated in nectar"],"a":1,"e":"Wind-pollinated flowers produce many small, light pollen grains that are easily carried by the wind. Insect-pollinated flowers produce fewer, larger, sticky pollen grains that stick to insects."},{"id":"ch16r1","tp":"Sexual reproduction","q":"Which statement is an advantage of sexual reproduction to a species in the wild?","o":["It produces offspring more quickly than asexual reproduction","It produces offspring that are genetically identical to the parent","It produces genetic variation, so some offspring may survive environmental changes","It does not require gametes to be produced"],"a":2,"e":"Sexual reproduction produces genetic variation, increasing the chance that some individuals survive changes in the environment. Asexual reproduction is faster and produces identical offspring."},{"id":"ch16r2","tp":"Fertilisation","q":"Which statement correctly describes fertilisation in humans?","o":["The release of an egg from an ovary","The implantation of an embryo in the lining of the uterus","The transfer of sperm from the penis into the vagina","The fusion of the nuclei of a sperm and an egg cell"],"a":3,"e":"Fertilisation is the fusion of the nuclei of a male gamete (sperm) and a female gamete (egg cell). The other options describe ovulation, implantation and sexual intercourse."},{"id":"ch16r3","tp":"Gametes","q":"Which feature of a sperm cell is an adaptation for moving towards the egg?","o":["A flagellum (tail) that propels it","A large energy store","A jelly coat","A thick cell wall"],"a":0,"e":"The flagellum (tail) propels the sperm towards the egg. A large energy store and a jelly coat are features of an egg cell."},{"id":"ch16r4","tp":"Gametes","q":"The jelly coat of an egg cell changes at fertilisation. What is the importance of this change?","o":["It attracts more sperm to the egg","It prevents other sperm from entering the egg","It provides energy for the embryo","It allows the egg to swim more quickly"],"a":1,"e":"The change in the jelly coat at fertilisation prevents more than one sperm from entering the egg. The egg is non-motile, and its energy stores support early embryo development."},{"id":"ch16r5","tp":"Pregnancy","q":"What is the function of the umbilical cord?","o":["To produce hormones needed for pregnancy","To connect the fetus to the placenta and carry blood vessels between them","To protect the fetus from physical damage","To exchange gases directly with the air"],"a":1,"e":"The umbilical cord connects the fetus to the placenta, carrying blood vessels that transport dissolved nutrients, gases and excretory products between the fetus and the placenta."},{"id":"ch16r6","tp":"Menstrual cycle","q":"Around which time in a 28-day menstrual cycle does ovulation occur?","o":["At the start of the cycle, during menstruation","Only during pregnancy","Just before the next menstruation","Around the middle of the cycle"],"a":3,"e":"Ovulation, the release of an egg from the ovary, occurs around the middle of the menstrual cycle."},{"id":"ch16r7","tp":"Sex hormones","q":"Which is an example of a male secondary sexual characteristic brought about by testosterone during puberty?","o":["Deepening of the voice","Development of the breasts","The start of the menstrual cycle","Release of eggs from the ovaries"],"a":0,"e":"Testosterone brings about male secondary sexual characteristics such as deepening of the voice and growth of pubic hair. Breast development and menstruation are female characteristics controlled by oestrogen."},{"id":"ch16r8","tp":"Sex hormones","q":"What is a role of oestrogen in females during puberty?","o":["Production of sperm","Formation of the placenta","Development of secondary sexual characteristics such as breast development","Production of amniotic fluid"],"a":2,"e":"Oestrogen controls the development of female secondary sexual characteristics during puberty, such as breast development and the start of the menstrual cycle."},{"id":"ch16r9","tp":"HIV","q":"How can HIV be transmitted from one person to another?","o":["By shaking hands with an infected person","By sharing food with an infected person","By unprotected sexual intercourse with an infected person","By breathing the same air as an infected person"],"a":2,"e":"HIV is transmitted through sexual contact with an infected person, by contaminated needles or blood, or from an infected mother to her baby. It is not spread by casual contact such as shaking hands."},{"id":"ch16r10","tp":"Pollination","q":"What is a potential effect of self-pollination on a population?","o":["It increases genetic variation","It increases the capacity to respond to environmental change","It makes the population more reliant on insect pollinators","It produces offspring with less genetic variation than cross-pollination"],"a":3,"e":"Self-pollination produces less genetic variation than cross-pollination, so the population is less able to respond to changes in the environment. Cross-pollination relies on pollinators but increases variation."},{"id":"ch16r11","tp":"Pollen tube","q":"After a pollen grain lands on the stigma of a flower, what happens next?","o":["A pollen tube grows down the style towards an ovule","The pollen grain immediately fuses with the ovule","The anther releases more pollen grains","The ovule develops into a seed"],"a":0,"e":"After pollination, a pollen tube grows down the style into the ovule so the male nucleus can reach the female gamete for fertilisation. The ovule develops into a seed only after fertilisation."}],"adv":[{"id":"ch16a0","tp":"Haploid/diploid","q":"A human gamete nucleus contains 23 chromosomes. How many chromosomes will be in the nucleus of the zygote formed by fertilisation?","o":["23","46","69","92"],"a":1,"e":"The zygote nucleus is diploid, formed by the fusion of two haploid gamete nuclei. 23 + 23 = 46 chromosomes."},{"id":"ch16a1","tp":"Menstrual cycle","q":"What is the role of FSH (follicle-stimulating hormone) in the menstrual cycle?","o":["To cause ovulation","To maintain the lining of the uterus","To stimulate the development of a follicle in the ovary and the production of oestrogen","To cause the lining of the uterus to break down"],"a":2,"e":"FSH stimulates the maturation of a follicle and egg in the ovary and stimulates the production of oestrogen. LH triggers ovulation, and progesterone maintains the uterus lining."},{"id":"ch16a2","tp":"Menstrual cycle","q":"During pregnancy, progesterone is produced mainly by the placenta. What is the role of progesterone?","o":["To stimulate ovulation","To stimulate FSH production","To cause the lining of the uterus to break down","To maintain the lining of the uterus"],"a":3,"e":"Progesterone maintains the lining of the uterus during pregnancy and prevents it from breaking down. It also inhibits FSH and LH, so ovulation stops during pregnancy."},{"id":"ch16a3","tp":"Menstrual cycle","q":"What is the role of LH (luteinising hormone) in the menstrual cycle?","o":["To stimulate ovulation","To thicken the lining of the uterus","To stimulate the development of the follicle","To produce oestrogen"],"a":0,"e":"LH stimulates ovulation, the release of an egg from the ovary. FSH stimulates follicle development, while oestrogen and progesterone thicken or maintain the uterus lining."},{"id":"ch16a4","tp":"Menstrual cycle","q":"A rising level of oestrogen produced by the developing follicle in the ovary has which effect?","o":["It inhibits the release of LH","It stimulates the release of LH, which triggers ovulation","It stops the development of the follicle","It causes the corpus luteum to break down"],"a":1,"e":"Rising oestrogen levels stimulate a surge in LH, which triggers ovulation. In the earlier part of the cycle, oestrogen inhibits FSH release."},{"id":"ch16a5","tp":"Menstrual cycle","q":"Oestrogen and progesterone are used in contraceptive pills. How do they prevent pregnancy?","o":["They kill sperm in the vagina","They prevent the embryo from implanting by damaging the placenta","They inhibit FSH and LH, so no egg is released from the ovary","They thicken the amniotic fluid"],"a":2,"e":"The hormones in the pill inhibit FSH and LH release, preventing follicle development and ovulation. With no egg released, fertilisation cannot occur."},{"id":"ch16a6","tp":"Gametes","q":"Which statement correctly compares a human egg cell with a sperm cell?","o":["The egg is smaller and motile; the sperm is larger and non-motile","The sperm is larger and motile; the egg is smaller and non-motile","Both cells are motile and about the same size","The egg is larger and non-motile; the sperm is smaller and motile"],"a":3,"e":"The egg is large, non-motile and produced in small numbers, while the sperm is small, motile and produced in very large numbers."},{"id":"ch16a7","tp":"Asexual reproduction","q":"A farmer produces a crop by asexual reproduction so all the plants are genetically identical. What is a disadvantage of this for the farmer?","o":["A disease that affects one plant is likely to affect the whole crop","The crop will show great genetic variation","The crop will need insect pollinators","The crop plants will produce few gametes"],"a":0,"e":"Genetically identical crop plants all have the same susceptibility, so one disease or pest could destroy the entire crop. Genetic uniformity is a disadvantage of asexual reproduction in crop production."},{"id":"ch16a8","tp":"Pregnancy","q":"Which statement about the placenta is correct?","o":["It blocks all substances from passing between the mother and the fetus","Some pathogens and toxins can pass across it and affect the fetus","It is the site where fertilisation occurs","It produces all the gametes needed by the fetus"],"a":1,"e":"The placenta normally acts as a barrier, but some pathogens and toxins can cross it and harm the fetus. Fertilisation occurs in the oviduct, not the placenta."},{"id":"ch16a9","tp":"Pollination","q":"A population of insect-pollinated wild flowers depends on cross-pollination. If the insect population is suddenly reduced, what is the most likely effect?","o":["The flowers will reproduce asexually instead","The flowers will produce more pollen","Fewer seeds will be produced, so the next generation will be smaller","The flowers will switch to being wind-pollinated"],"a":2,"e":"Cross-pollination in these plants relies on insects. With fewer pollinators, less pollination and fertilisation occur, so fewer seeds are produced."},{"id":"ch16a10","tp":"Gametes","q":"An egg cell contains a large store of energy. Why is this important?","o":["It enables the egg to swim towards the sperm","It attracts sperm to the egg","It prevents more than one sperm from entering the egg","It provides energy for the early development of the embryo if the egg is fertilised"],"a":3,"e":"The egg's energy stores provide energy for cell division and growth in the early development of the embryo after fertilisation. The egg is non-motile, and the jelly coat prevents more than one sperm entering."},{"id":"ch16a11","tp":"Menstrual cycle","q":"After ovulation, the follicle in the ovary develops into the corpus luteum. What is its role?","o":["To secrete progesterone, which maintains the lining of the uterus","To secrete FSH, which stimulates the next follicle","To release a second egg into the oviduct","To form the placenta immediately"],"a":0,"e":"The corpus luteum secretes progesterone, which maintains the lining of the uterus. If pregnancy occurs, the placenta later takes over progesterone production."}],"basic_saq":[{"id":"ch16bs0","q":"A gardener grows many new strawberry plants from runners produced by one parent plant. (a) State the type of reproduction shown by the strawberry plants. (b) Explain why all the new plants are genetically identical to the parent plant. (c) State one advantage of this type of reproduction for the gardener.","mm":3,"ms":[{"p":"(a) asexual reproduction","pts":1},{"p":"(b) they are produced from one parent / there is no fusion of gametes, so no genetic variation","pts":1},{"p":"(c) all the plants have the same desirable characteristics as the parent / many plants can be produced quickly","pts":1}],"e":"Tests 16.1.1 and 16.1.3: asexual reproduction and its advantages in crop production."},{"id":"ch16bs1","q":"A student wants to find out whether seeds need a suitable temperature to germinate. Describe how the student could carry out this investigation.","mm":3,"ms":[{"p":"use two groups of seeds, e.g. on damp cotton wool, both with water and oxygen available","pts":1},{"p":"keep one group in a warm place and the other group in a cold place (e.g. a refrigerator)","pts":1},{"p":"keep all other conditions the same and observe/count how many seeds germinate in each group","pts":1}],"e":"Tests 16.3.8: environmental conditions affecting germination, limited to water, oxygen and a suitable temperature."}],"review_saq":[{"id":"ch16rs0","q":"Explain how a sperm cell is adapted for reaching and fertilising an egg cell.","mm":4,"ms":[{"p":"has a flagellum (tail) for swimming towards the egg","pts":1},{"p":"has many mitochondria to release energy for movement","pts":1},{"p":"has enzymes in the acrosome to digest the jelly coat/membrane of the egg","pts":1},{"p":"has a nucleus containing the male genetic material / is haploid","pts":1}],"e":"Covers 16.4.4: adaptive features of the sperm, limited to flagellum, mitochondria and enzymes in the acrosome."},{"id":"ch16rs1","q":"Describe the changes that occur in the ovary and in the lining of the uterus during one menstrual cycle.","mm":4,"ms":[{"p":"an egg (oocyte) matures in a follicle in the ovary","pts":1},{"p":"ovulation occurs - the egg is released from the ovary around the middle of the cycle","pts":1},{"p":"the lining of the uterus is shed during menstruation and then thickens again","pts":1},{"p":"if the egg is not fertilised, the lining breaks down and is shed again","pts":1}],"e":"Covers 16.5.2: the menstrual cycle in terms of changes in the ovaries and the lining of the uterus."}],"adv_saq":[{"id":"ch16as0","q":"Describe the roles of FSH, oestrogen, LH and progesterone in controlling the menstrual cycle.","mm":4,"ms":[{"p":"FSH stimulates the development of a follicle (and egg) in the ovary and stimulates the production of oestrogen","pts":1},{"p":"oestrogen stimulates the repair/thickening of the lining of the uterus and stimulates the release of LH","pts":1},{"p":"LH stimulates ovulation","pts":1},{"p":"progesterone maintains the lining of the uterus (and inhibits FSH and LH)","pts":1}],"e":"Covers 16.5.3/16.5.4: hormonal control of the menstrual cycle, limited to FSH, LH, progesterone and oestrogen."},{"id":"ch16as1","q":"Describe two ways in which HIV can be transmitted and explain two ways in which the spread of sexually transmitted infections can be controlled.","mm":4,"ms":[{"p":"transmission: unprotected sexual intercourse with an infected person","pts":1},{"p":"transmission: sharing contaminated needles / transfusion of infected blood / from an infected mother to her baby","pts":1},{"p":"control: using condoms during sexual intercourse","pts":1},{"p":"control: treating infected people / screening blood supplies / not sharing needles / health education about STIs","pts":1}],"e":"Covers 16.6.4 and 16.6.5: methods of transmission of HIV and control of the spread of STIs."}]},"ch17":{"pre":[{"id":"ch17p0","tp":"Chromosomes","q":"What are chromosomes in a cell made of?","o":["Protein","DNA","Lipid","Starch"],"a":1,"e":"Chromosomes are made of DNA, which contains genetic information in the form of genes."},{"id":"ch17p1","tp":"Gene","q":"What is a gene?","o":["A length of DNA that codes for a protein","A protein that carries oxygen in the blood","A carbohydrate found in the nucleus","A lipid in the cell membrane"],"a":0,"e":"A gene is defined as a length of DNA that codes for a protein."},{"id":"ch17p2","tp":"Alleles","q":"What is an allele?","o":["The observable features of an organism","A length of DNA that codes for a protein","A type of gamete","An alternative form of a gene"],"a":3,"e":"An allele is an alternative form of a gene; the other options describe phenotype, gene, and gametes."},{"id":"ch17p3","tp":"Sex determination","q":"Which pair of sex chromosomes is found in a human male?","o":["XX","YY","XY","XO"],"a":2,"e":"Human males have the sex chromosomes XY, while females have XX."},{"id":"ch17p4","tp":"Haploid","q":"Which term describes a nucleus containing a single set of chromosomes?","o":["Haploid","Diploid","Heterozygous","Homozygous"],"a":0,"e":"A haploid nucleus contains a single set of chromosomes, whereas a diploid nucleus contains two sets."},{"id":"ch17p5","tp":"Diploid","q":"A diploid nucleus contains which of the following?","o":["a single set of chromosomes","two sets of chromosomes","no chromosomes","only sex chromosomes"],"a":1,"e":"A diploid nucleus contains two sets of chromosomes, one inherited from each parent."},{"id":"ch17p6","tp":"Human chromosomes","q":"How many pairs of chromosomes are present in a human diploid cell?","o":["46 pairs","22 pairs","2 pairs","23 pairs"],"a":3,"e":"A human diploid cell contains 23 pairs of chromosomes, giving 46 chromosomes in total."},{"id":"ch17p7","tp":"Mitosis","q":"Which is a role of mitosis in the body?","o":["Producing genetically different gametes","Growth and repair of damaged tissues","Halving the chromosome number","Forming haploid cells"],"a":1,"e":"Mitosis produces genetically identical cells and is responsible for growth, repair of damaged tissues, replacement of cells and asexual reproduction."},{"id":"ch17p8","tp":"Meiosis","q":"Meiosis is involved in the production of which cells?","o":["Gametes","Stem cells","Skin cells","Muscle cells"],"a":0,"e":"Meiosis is involved in the production of gametes (sex cells)."},{"id":"ch17p9","tp":"Genotype","q":"What is meant by the genotype of an organism?","o":["its observable features","its genetic make-up in terms of the alleles present","the number of chromosomes in its cells","the type of proteins it produces"],"a":1,"e":"Genotype is the genetic make-up of an organism, described in terms of the alleles present."},{"id":"ch17p10","tp":"Phenotype","q":"What is meant by the phenotype of an organism?","o":["The genetic make-up of the organism","The alleles present in its cells","The observable features of the organism","The number of genes it has"],"a":2,"e":"Phenotype is the observable features of an organism, such as its appearance."},{"id":"ch17p11","tp":"Dominant allele","q":"A dominant allele is expressed when...","o":["it is present in the genotype","there is no other allele present","it is inherited from the mother","the organism is homozygous"],"a":0,"e":"A dominant allele is expressed if it is present in the genotype, even when paired with a recessive allele."},{"id":"ch17p12","tp":"Recessive allele","q":"A recessive allele is only expressed when...","o":["it is paired with a dominant allele","it is inherited from the father","there is no dominant allele of the gene present in the genotype","the organism is heterozygous"],"a":2,"e":"A recessive allele is only expressed when there is no dominant allele of the gene present in the genotype."},{"id":"ch17p13","tp":"Homozygous","q":"Two identical homozygous individuals that breed together will be...","o":["heterozygous for that gene","haploid","sterile","pure-breeding"],"a":3,"e":"Two identical homozygous individuals that breed together will be pure-breeding for that characteristic."}],"basic":[{"id":"ch17b0","tp":"Heterozygous","q":"Which describes a heterozygous individual?","o":["Having two identical alleles of a gene","Having only one allele of a gene","Having three alleles of a gene","Having two different alleles of a gene"],"a":3,"e":"A heterozygous individual has two different alleles of a particular gene."},{"id":"ch17b1","tp":"Heterozygous","q":"Why is a heterozygous individual not pure-breeding?","o":["Because it has two different alleles of the gene and can pass on either allele to its offspring","Because it only produces gametes with the dominant allele","Because its genotype is always homozygous","Because it cannot reproduce"],"a":0,"e":"A heterozygous individual has two different alleles, so it can pass on either allele, and its offspring will not always show the same trait."},{"id":"ch17b2","tp":"Inheritance","q":"What is meant by inheritance?","o":["The division of the nucleus to form two identical cells","The production of proteins by ribosomes","The movement of chromosomes to the cytoplasm","The transmission of genetic information from generation to generation"],"a":3,"e":"Inheritance is the transmission of genetic information from generation to generation."},{"id":"ch17b3","tp":"Mitosis","q":"What happens to chromosomes before mitosis begins?","o":["They are lost from the nucleus","They move to the cytoplasm","They are replicated exactly","They fuse to form one chromosome"],"a":2,"e":"Before mitosis, the chromosomes are replicated exactly so that each daughter cell receives a complete set."},{"id":"ch17b4","tp":"Mitosis","q":"During mitosis, the copies of chromosomes separate. What does this maintain?","o":["The chromosome number is halved","The number of alleles in the organism","The production of haploid cells","The chromosome number in each daughter cell"],"a":3,"e":"The separating copies of chromosomes maintain the chromosome number in each daughter cell, so they are genetically identical to the parent cell."},{"id":"ch17b5","tp":"Stem cells","q":"Stem cells are unspecialised cells that...","o":["divide by meiosis to form gametes","contain a single set of chromosomes","are only found in embryos","divide by mitosis to produce daughter cells that can become specialised"],"a":3,"e":"Stem cells are unspecialised cells that divide by mitosis to produ
